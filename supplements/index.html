<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>픽셀 영양제 선반</title>
<meta name="description" content="내 영양제를 픽셀 선반에 올려두고, 성분 겹침·상한·복용 시간을 근거와 함께 확인하는 웹앱. 데이터는 내 기기에만 저장됩니다.">
<meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="영양제선반">
<style>
@font-face{font-family:"Galmuri11";src:url(fonts/Galmuri11.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Galmuri11";src:url(fonts/Galmuri11-Bold.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Pretendard";src:url(../BAC100/fonts/Pretendard.woff2) format("woff2");font-weight:100 900;font-display:swap}

:root{
  --bg:#fafafa; --card:#ffffff; --ink:#18181b; --ink2:#71717a;
  --line:#e4e4e7; --line2:#d4d4d8; --accent:#2563eb; --accent-tint:#eff4ff;
  --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
  --shelf:#c98b55; --shelf-dark:#8a5a32; --wall:#fdf6ec;
  --px:#18181b;
  --pixel:"Galmuri11",ui-monospace,monospace;
  --font:"Pretendard",-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --card:#1c1c1e; --ink:#f4f4f5; --ink2:#a1a1aa;
    --line:#2c2c2e; --line2:#3a3a3c; --accent:#3b82f6; --accent-tint:#14203a;
    --wall:#2a2119; --shelf:#9a6a40; --shelf-dark:#5e3f22; --px:#000000;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1c1c1e; --ink:#f4f4f5; --ink2:#a1a1aa;
  --line:#2c2c2e; --line2:#3a3a3c; --accent:#3b82f6; --accent-tint:#14203a;
  --wall:#2a2119; --shelf:#9a6a40; --shelf-dark:#5e3f22; --px:#000000;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--font);font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
.num{font-family:var(--font);font-variant-numeric:tabular-nums}
.px{font-family:var(--pixel)}
svg.sprite{image-rendering:pixelated;shape-rendering:crispEdges;display:block}

.wrap{max-width:480px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:10px;height:56px}
header h1{font-family:var(--pixel);font-weight:700;font-size:16px;margin:0;flex:1;letter-spacing:.5px}
header h1 .tagline{display:block;font-weight:400;font-size:10px;color:var(--ink2);letter-spacing:0;margin-top:1px}
header .date{font-family:var(--pixel);font-size:11px;color:var(--ink2)}

/* pixel box: square corners + hard shadow */
.pbox{background:var(--card);border:2px solid var(--px);box-shadow:4px 4px 0 var(--px);margin:16px 0 20px}
.pbox>h2{font-family:var(--pixel);font-weight:700;font-size:13px;margin:0;padding:10px 12px;border-bottom:2px solid var(--px);display:flex;align-items:center;gap:8px}
.pbox>h2 .sub{margin-left:auto;font-weight:400;font-size:11px;color:var(--ink2)}
.pbody{padding:12px}

/* shelf */
.shelf{background:var(--wall);padding:14px 8px 0}
.row{display:grid;grid-template-columns:repeat(3,1fr);align-items:end;gap:4px;position:relative;padding:0 4px}
.row+.row{margin-top:18px}
.plank{height:10px;background:var(--shelf);border-top:2px solid var(--px);border-bottom:4px solid var(--shelf-dark);margin:0 -8px}
.item{display:flex;flex-direction:column;align-items:center;cursor:pointer;background:none;border:0;padding:0 0 0;position:relative}
.item:focus-visible{outline:2px dashed var(--accent);outline-offset:2px}
.item .bob{animation:bob 1.6s steps(2) infinite}
.item:nth-child(2) .bob{animation-delay:.4s}.item:nth-child(3) .bob{animation-delay:.8s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
.item:nth-child(2) .eye{animation-delay:1.3s}.item:nth-child(3) .eye{animation-delay:2.6s}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.15)}}
.tag{font-family:var(--pixel);font-size:11px;margin-top:4px;color:#3f2a18;background:#fff8e7;border:2px solid var(--px);padding:1px 5px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.below{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:6px 4px 10px;background:var(--shelf-dark)}
.below .meta{display:flex;flex-direction:column;align-items:center;gap:3px}
.stock{display:flex;gap:1px}
.stock i{width:6px;height:6px;background:#3b2a1a;display:block}
.stock i.on{background:#7ee081}
.stock.low i.on{background:#ffb02e}
.stock.empty i.on{background:#ff5b5b}
.days{font-family:var(--pixel);font-size:11px;color:#ffeccc}
.mood-pop{animation:pop .35s steps(3)}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.18) translateY(-4px)}100%{transform:scale(1)}}

/* today */
.progress{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.pbar{flex:1;height:14px;border:2px solid var(--px);background:var(--line);display:flex;padding:1px;gap:1px}
.pbar i{flex:1;background:transparent}
.pbar i.on{background:var(--accent)}
.slot{border-top:2px dashed var(--line2);padding:10px 0}
.slot:first-of-type{border-top:0;padding-top:0}
.slot h3{font-family:var(--pixel);font-size:12px;margin:0 0 8px;display:flex;align-items:center;gap:6px}
.slot h3 .t{color:var(--ink2);font-weight:400;font-size:11px}
.dose{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line2);padding:6px 10px 6px 6px;margin-bottom:6px;cursor:pointer}
.dose.done{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,var(--card))}
.dose .nm{font-weight:600}
.dose .how{font-size:12px;color:var(--ink2)}
.dose .chk{margin-left:auto;width:22px;height:22px;border:2px solid var(--px);display:grid;place-items:center;font-family:var(--pixel);font-size:12px;flex:none;background:var(--card)}
.dose.done .chk{background:var(--ok);color:#fff}
.dose .opt{font-family:var(--pixel);font-size:10px;color:var(--warn);border:1px solid var(--warn);padding:0 4px;margin-left:4px}

/* check */
.meter{margin:6px 0 14px}
.meter .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.meter .name{font-weight:600}
.meter .val{font-size:12px;color:var(--ink2)}
.mbar{height:12px;border:2px solid var(--px);margin-top:4px;position:relative;background:var(--line)}
.mbar b{display:block;height:100%;background:var(--ok)}
.mbar b.warn{background:var(--warn)}.mbar b.bad{background:var(--bad)}
.mbar .ul{position:absolute;right:-2px;top:-6px;bottom:-6px;width:2px;background:var(--bad)}
.note{font-size:12px;color:var(--ink2);margin-top:4px}
.card{border:2px solid var(--line2);padding:10px;margin-bottom:8px;background:var(--card)}
.card.hit{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 6%,var(--card))}
.card .hd{display:flex;align-items:center;gap:6px;font-weight:600;margin-bottom:2px;flex-wrap:wrap}
.grade{font-family:var(--pixel);font-size:10px;border:2px solid currentColor;padding:0 4px;line-height:14px}
.gA{color:#2563eb}.gB{color:#0f766e}.gC{color:#a16207}.gD{color:#71717a}
.src{font-size:11px;margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 8px}
.src a{text-decoration:none;border-bottom:1px dotted currentColor}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{font-size:12px;border:1px solid var(--line2);padding:0 6px;background:var(--bg)}
.flag{font-family:var(--pixel);font-size:10px;color:#fff;background:var(--bad);padding:0 4px}
.legend{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;font-size:12px;align-items:center}
.disclaimer{font-size:12px;color:var(--ink2);border-top:1px solid var(--line);padding-top:10px;margin-top:6px}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:2px solid var(--px);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr);height:62px;padding:0 8px}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--pixel);font-size:11px;color:var(--ink2);cursor:pointer}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs button[aria-current="page"] svg{filter:none}
nav.tabs svg{width:24px;height:24px}

/* buttons, forms */
.btn{font-family:var(--pixel);font-size:12px;border:2px solid var(--px);background:var(--card);padding:7px 12px;box-shadow:2px 2px 0 var(--px);cursor:pointer}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
label.f{display:block;font-size:12px;color:var(--ink2);margin:10px 0 4px}
.in{width:100%;border:2px solid var(--line2);background:var(--card);padding:7px 8px;border-radius:0}
.in:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:6px;align-items:center}
.swatches{display:flex;gap:4px;flex-wrap:wrap}
.swatches button{width:24px;height:24px;border:2px solid var(--px);cursor:pointer;padding:0}
.swatches button[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
.shapes{display:flex;gap:8px}
.shapes button{border:2px solid var(--line2);background:var(--card);padding:4px 8px;cursor:pointer;font-size:12px;display:flex;flex-direction:column;align-items:center}
.shapes button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-tint)}
.slotrow{display:grid;grid-template-columns:72px 1fr 64px;gap:6px;align-items:center;margin-bottom:6px}
.slotrow .lb{font-size:13px}
.toggle{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:none}
.sheet-bg.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:88vh;overflow:auto;background:var(--card);border-top:2px solid var(--px);transform:translateY(105%);transition:transform .18s steps(4)}
.sheet.open{transform:none}
.sheet .wrap{padding-top:14px;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.sheet h2{font-family:var(--pixel);font-size:15px;margin:0 0 6px;display:flex;align-items:center;gap:8px}
.sheet .close{margin-left:auto}
.detail-top{display:flex;gap:14px;align-items:center}
.kv{display:grid;grid-template-columns:84px 1fr;gap:4px 8px;font-size:13px;margin-top:10px}
.kv dt{color:var(--ink2)}.kv dd{margin:0}
.banner{font-size:12px;background:var(--accent-tint);border:2px solid var(--accent);padding:8px 10px;margin-top:12px;display:flex;gap:8px;align-items:flex-start}
.verdict{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.verdict button{font-family:var(--pixel);font-size:12px;border:2px solid var(--line2);background:var(--card);padding:8px 4px;cursor:pointer}
.verdict button[aria-pressed="true"]{border-color:var(--px);background:var(--accent);color:#fff;box-shadow:2px 2px 0 var(--px)}
.item.paused .bob{opacity:.45;filter:grayscale(.8);animation:none}
.zzz{position:absolute;top:-4px;right:8px;font-family:var(--pixel);font-size:11px;color:#6b5a48}
.story{font-size:13px;line-height:1.7}
.story b{font-family:var(--pixel);font-weight:700}
.tally{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.empty{font-size:13px;color:var(--ink2);text-align:center;padding:16px 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){.bob,.eye,.mood-pop{animation:none!important}.sheet{transition:none}}
</style>
</head>
<body>
<header><div class="wrap"><h1>픽셀 영양제 선반<small class="tagline">영양제 부자 탈출</small></h1><span class="date" id="today"></span></div></header>

<main class="wrap" id="view"></main>

<nav class="tabs" aria-label="메뉴"><div class="wrap">
  <button data-tab="shelf" aria-current="page"><span id="ic-shelf"></span>선반</button>
  <button data-tab="today"><span id="ic-today"></span>오늘</button>
  <button data-tab="check"><span id="ic-check"></span>체크</button>
  <button data-tab="settings"><span id="ic-set"></span>설정</button>
</div></nav>

<div class="sheet-bg" id="sheetBg"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="wrap" id="sheetBody"></div></section>

<script>
"use strict";
/* ================= 설정 ================= */
const AFFILIATE_ENABLED = false;           // 겸업 규정 확인 전까지 꺼둠
const STORE_KEY = "pillshelf.v1";

/* ================= 근거 데이터 (myworkout/supplements/evidence 요약본) ================= */
const SOURCES = {
  label:{t:"제품 라벨",u:null},
  kdri2020:{t:"2020 한국인 영양소 섭취기준",u:"https://www.mohw.go.kr/board.es?mid=a10411010100&bid=0019&act=view&list_no=362385"},
  ods_magnesium:{t:"NIH ODS 마그네슘",u:"https://ods.od.nih.gov/factsheets/Magnesium-HealthProfessional/"},
  ods_zinc:{t:"NIH ODS 아연",u:"https://ods.od.nih.gov/factsheets/Zinc-HealthProfessional/"},
  ods_b6:{t:"NIH ODS 비타민B6",u:"https://ods.od.nih.gov/factsheets/VitaminB6-HealthProfessional/"},
  ods_vitd:{t:"NIH ODS 비타민D",u:"https://ods.od.nih.gov/factsheets/VitaminD-HealthProfessional/"},
  ods_calcium:{t:"NIH ODS 칼슘",u:"https://ods.od.nih.gov/factsheets/Calcium-HealthProfessional/"},
  ods_iron:{t:"NIH ODS 철",u:"https://ods.od.nih.gov/factsheets/Iron-HealthProfessional/"},
  ods_omega3:{t:"NIH ODS 오메가3",u:"https://ods.od.nih.gov/factsheets/Omega3FattyAcids-HealthProfessional/"},
  nccih_ashwagandha:{t:"NCCIH 아쉬아간다",u:"https://www.nccih.nih.gov/health/ashwagandha"},
  livertox_ashwa:{t:"LiverTox 아쉬아간다",u:"https://www.ncbi.nlm.nih.gov/books/NBK548536/"},
  nccih_ginger:{t:"NCCIH 생강",u:"https://www.nccih.nih.gov/health/ginger"},
  ema_artichoke:{t:"EMA 아티초크 모노그래프",u:"https://www.ema.europa.eu/en/medicines/herbal/cynarae-folium"},
  issn_creatine:{t:"ISSN 크레아틴 입장문(2017)",u:"https://doi.org/10.1186/s12970-017-0173-z"},
  yamadera:{t:"Yamadera 2007 글리신",u:"https://doi.org/10.1111/j.1479-8425.2007.00262.x"}
};
const GRADE_TXT = {A:"라벨·공식규격",B:"공공기관 자료",C:"연구 근거",D:"근거 약함"};

/* 성분 사전 */
const ING = {
  magnesium:{ko:"마그네슘",nutrient:"magnesium"},
  zinc:{ko:"아연",nutrient:"zinc"},
  vitamin_b6:{ko:"비타민B6",nutrient:"vitamin_b6"},
  vitamin_d:{ko:"비타민D",nutrient:"vitamin_d"},
  calcium:{ko:"칼슘",nutrient:"calcium"},
  iron:{ko:"철",nutrient:"iron"},
  vitamin_c:{ko:"비타민C",nutrient:"vitamin_c"},
  omega3:{ko:"오메가3(EPA+DHA)",cats:["bleed"]},
  ashwagandha:{ko:"아쉬아간다",cats:["sleep"]},
  l_theanine:{ko:"L-테아닌",cats:["sleep"]},
  lemon_balm:{ko:"레몬밤",cats:["sleep"]},
  glycine:{ko:"글리신",cats:["sleep"]},
  creatine:{ko:"크레아틴",cats:["muscle"]},
  digestive_enzymes:{ko:"소화효소",cats:["digest"]},
  ginger:{ko:"생강",cats:["digest","bleed"]},
  artichoke:{ko:"아티초크",cats:["digest"]},
  probiotics:{ko:"유산균",cats:["digest"]},
  other:{ko:"기타"}
};
const CATS = {sleep:"수면·긴장완화",digest:"소화·더부룩함",muscle:"근육·운동",bleed:"출혈 위험 성분"};

/* 상한 (성인, 보충제 합산 비교) */
const LIMITS = {
  magnesium:{ko:"마그네슘",unit:"mg",ul:350,scope:"음식 제외, 보충제 마그네슘만 합산",grade:"B",src:["kdri2020","ods_magnesium"]},
  zinc:{ko:"아연",unit:"mg",ul:35,scope:"총 섭취 기준",grade:"B",src:["kdri2020","ods_zinc"]},
  vitamin_b6:{ko:"비타민B6",unit:"mg",ul:100,scope:"2020 기준(2025 개정판은 하향 보고 — 확인 중)",grade:"B",src:["kdri2020","ods_b6"]},
  vitamin_d:{ko:"비타민D",unit:"μg",ul:100,scope:"1 μg = 40 IU",grade:"B",src:["kdri2020","ods_vitd"]},
  calcium:{ko:"칼슘",unit:"mg",ul:2500,scope:"총 섭취 기준",grade:"B",src:["kdri2020","ods_calcium"]},
  iron:{ko:"철",unit:"mg",ul:45,scope:"총 섭취 기준",grade:"B",src:["kdri2020","ods_iron"]},
  vitamin_c:{ko:"비타민C",unit:"mg",ul:2000,scope:"총 섭취 기준",grade:"B",src:["kdri2020"]}
};

/* 주의 규칙 (cond: 사용자 설정과 맞으면 '해당' 강조) */
const CONDS = {
  anticoag:"항응고제·항혈소판제 복용 (와파린, 아스피린 등)",
  thyroid:"갑상선 질환 또는 갑상선 약 복용",
  pregnant:"임신·수유 중",
  sedative:"수면제·신경안정제 복용",
  immuno:"면역억제제 복용·자가면역질환",
  gallbladder:"담석·담도·간 질환",
  kidney:"신장 질환"
};
const CAUTIONS = [
  {id:"C04",ing:"ashwagandha",grade:"B",cond:["pregnant","thyroid","sedative","immuno"],src:["nccih_ashwagandha","livertox_ashwa"],
   msg:"임신 중에는 피합니다. 갑상선 약·진정제·면역억제제 복용 시 의사·약사와 상의하세요. 드물게 간 손상이 보고되어, 황달·짙은 소변이 있으면 중단하세요."},
  {id:"C08",ing:"artichoke",grade:"B",cond:["gallbladder"],src:["ema_artichoke"],

const H = 18; // 공통 높이 (아래 정렬)
function shade(hex, k){ // k<0 어둡게
  const n=parseInt(hex.slice(1),16); let r=n>>16,g=n>>8&255,b=n&255;
  const f=v=>Math.max(0,Math.min(255,Math.round(k<0?v*(1+k):v+(255-v)*k)));
  return "#"+[f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,"0")).join("");
}
function lum(hex){const n=parseInt(hex.slice(1),16);return (0.299*(n>>16)+0.587*(n>>8&255)+0.114*(n&255))/255}
function sprite(p, mood="normal", px=5){
  const s=SHAPES[p.shape]||SHAPES.bottle, rows=s.rows, off=H-rows.length;
  const c=p.colors, col={o:"var(--px-out)",c:c.cap,C:shade(c.cap,-.25),b:c.body,B:shade(c.body,-.28),l:c.label,h:shade(c.body,.45)};
  let r="";
  rows.forEach((line,y)=>{[...line].forEach((ch,x)=>{ if(ch!=="."&&col[ch]) r+=`<rect x="${x}" y="${y+off}" width="1" height="1" fill="${col[ch]}"/>`;});});
  // face on label
  const fy=s.face.y+off, cx=s.face.cx, ink=lum(c.label)>.55?"#18181b":"#ffffff";
  const ex1=cx-2, ex2=cx+1;
  if(mood==="happy"){
    r+=`<g fill="${ink}"><rect x="${ex1}" y="${fy}" width="1" height="1"/><rect x="${ex1-1}" y="${fy+1}" width="1" height="1"/><rect x="${ex1+1}" y="${fy+1}" width="1" height="1"/>`+
       `<rect x="${ex2}" y="${fy}" width="1" height="1"/><rect x="${ex2-1}" y="${fy+1}" width="1" height="1"/><rect x="${ex2+1}" y="${fy+1}" width="1" height="1"/></g>`;
    r+=`<g fill="${ink}"><rect x="${cx-2}" y="${fy+3}" width="1" height="1"/><rect x="${cx-1}" y="${fy+4}" width="2" height="1"/><rect x="${cx+1}" y="${fy+3}" width="1" height="1"/></g>`;
  }else{
    if(mood==="sleep"){r+=`<g fill="${ink}"><rect x="${ex1-1}" y="${fy+1}" width="2" height="1"/><rect x="${ex2}" y="${fy+1}" width="2" height="1"/><rect x="${cx-1}" y="${fy+3}" width="2" height="1"/></g>`;}
    else{
    r+=`<g class="eye" fill="${ink}"><rect x="${ex1}" y="${fy}" width="1" height="2"/><rect x="${ex2}" y="${fy}" width="1" height="2"/></g>`;
    if(mood==="worry") r+=`<rect x="${cx-1}" y="${fy+3}" width="2" height="1" fill="${ink}"/><rect x="${cx+3}" y="${fy-2}" width="1" height="1" fill="#5ac8fa"/><rect x="${cx+3}" y="${fy-1}" width="1" height="2" fill="#5ac8fa"/>`;
    else r+=`<rect x="${cx-1}" y="${fy+3}" width="2" height="1" fill="${ink}"/>`;
    }
  }
  r+=`<rect x="${ex1-1}" y="${fy+2}" width="1" height="1" fill="#ff8fab" opacity=".85"/><rect x="${ex2+1}" y="${fy+2}" width="1" height="1" fill="#ff8fab" opacity=".85"/>`;
  return `<svg class="sprite" viewBox="0 0 14 ${H}" width="${14*px}" height="${H*px}" aria-hidden="true" style="--px-out:#18181b">${r}</svg>`;
}

function daysLeft(p){const q=dailyQty(p);return q?Math.floor(p.remaining/q):Infinity}
function moodOf(p){
  if(p.verdict==="pause") return "sleep";
  const L=todayLog(); const req=p.schedule.filter(s=>!isOpt(p,s));

}

    if(!items.length) h+=`<div class="note">없음</div>`;
    items.forEach(({p,sc})=>{const k=p.id+"|"+s.k,on=!!L[k];
      h+=`<button class="dose ${on?"done":""}" data-dose="${k}" aria-pressed="${on}">${sprite(p,on?"happy":"normal",2)}<span><span class="nm">${esc(p.short||p.name)}</span> <span class="num">${sc.qty}${esc(p.unit)}</span>${isOpt(p,sc)?'<span class="opt">필요할 때</span>':""}<br><span class="how">${esc(sc.how||"")}</span></span><span class="chk">${on?"✓":""}</span></button>`;});
    h+=`</div>`;
  });
  h+=`<p class="note">체크하면 남은 개수가 줄어요. '필요할 때'는 과식한 날만 먹는 제품이라 진행률에서 빠져요.</p></div></section>`;
  return h;
}

/* ================= 분석 ================= */
function analyze(){
  const P=active(), lim={}, catMap={}, ingSet={};
  P.forEach(p=>{
    (p.purpose||[]).forEach(c=>{(catMap[c]=catMap[c]||[]).push(p)});
    p.ingredients.forEach(i=>{
      (ingSet[i.key]=ingSet[i.key]||[]).push(p);
      const n=ING[i.key]?.nutrient; if(!n||!LIMITS[n]) return;
      const L=lim[n]=lim[n]||{...LIMITS[n],key:n,known:0,unknown:[],parts:[]};
      if(i.amount==null) L.unknown.push(p.short||p.name); else {L.known+=+i.amount;L.parts.push({p,amt:+i.amount})}
    });
  });
  Object.values(lim).forEach(l=>l.pct=l.known/l.ul*100);
  const overlaps=Object.entries(catMap).filter(([c,a])=>a.length>=2&&c!=="bleed").map(([cat,items])=>({cat,items}));
  const cautions=[];
  CAUTIONS.forEach(r=>{if(ingSet[r.ing]){const hit=r.cond.some(c=>S.conds[c]);cautions.push({...r,items:[...new Set(ingSet[r.ing])],hit,hitConds:r.cond.filter(c=>S.conds[c])})}});
  cautions.sort((a,b)=>b.hit-a.hit);
  return {limits:Object.values(lim).sort((a,b)=>b.pct-a.pct),overlaps,cautions};
}

  h+=`<section class="pbox"><h2>📚 근거 등급</h2><div class="pbody"><div class="legend">

  </div><p class="disclaimer">이 정보는 제품 라벨과 공공기관 자료를 정리한 것이며 의학적 조언이 아닙니다. 복용 중인 약이 있거나 질환이 있으면 의사·약사와 상의하세요.</p></div></section>`;
  return h;
}

document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-open]"); if(!t) return;

  if(act==="stockok"){S.stockChecked=true;save();render();return}

  if(act==="saveForm"){readForm();if(!draft.name){alert("제품명을 적어주세요");return}if(!draft.short)draft.short=draft.name.slice(0,6);
    const i=S.products.findIndex(x=>x.id===draft.id);if(i>=0)S.products[i]=draft;else S.products.push(draft);save();closeSheet();render();return}
  if(act==="del"){if(confirm("선반에서 뺄까요?")){S.products=S.products.filter(x=>x.id!==t.dataset.id);save();closeSheet();render()}return}
  if(act==="export"){const b=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="영양제선반-"+dkey()+".json";a.click();return}
  if(act==="reset"){if(confirm("모든 기록을 지우고 처음 상태로 돌릴까요?")){try{localStorage.removeItem(STORE_KEY)}catch(_){}S=load();render()}return}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.cond){S.conds[t.dataset.cond]=t.checked;save();return}
  if(t.dataset.reason){const p=S.products.find(x=>x.id===t.dataset.reason);p.reason=t.value.trim();save();render();return}
  if(t.dataset.remain){const p=S.products.find(x=>x.id===t.dataset.remain);p.remaining=Math.max(0,parseInt(t.value)||0);save();render();detail(p.id);return}
  if(t.dataset.fslot){const sb=$("#sheetBody");sb.querySelector(`[data-fhow="${t.dataset.fslot}"]`).disabled=!t.checked;sb.querySelector(`[data-fqty="${t.dataset.fslot}"]`).disabled=!t.checked}
});
$("#sheetBg").addEventListener("click",closeSheet);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});

$("#today").textContent=new Date().toLocaleDateString("ko-KR",{month:"long",day:"numeric",weekday:"short"});
$("#ic-shelf").innerHTML=icon("shelf",24);$("#ic-today").innerHTML=icon("today",24);$("#ic-check").innerHTML=icon("check",24);$("#ic-set").innerHTML=icon("set",24);
render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
