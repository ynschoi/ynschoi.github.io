<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>MOTI · Eat Poop Lift</title>
<meta name="description" content="Eat, poop, sleep, lift. Roll the dice and break your PR. 먹고 싸고 자고 역도만 하는 주사위 게임.">
<link rel="canonical" href="https://ynschoi.github.io/moti/">
<meta property="og:title" content="MOTI · Eat Poop Lift">
<meta property="og:description" content="Eat, poop, sleep, lift. Roll the dice and break your PR.">
<meta property="og:image" content="https://ynschoi.github.io/moti/og.png">
<meta property="og:url" content="https://ynschoi.github.io/moti/">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<style>
  /* 게임보이 3단: 정보창 / 방 / 주사위 패드 — 한 화면 고정 */
  :root{
    --night:#0b0820; --panel:#15102e; --edge:#4a3f8a; --gold:#ffd400; --red:#d92d20; --violet:#8d86c9; --cyan:#4cc3ff; --ink:#ddd8ff;
    --px:'Galmuri11','Galmuri9',ui-monospace,monospace; --font:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  html,body{height:100%;background:#1a1440;overflow:hidden;overscroll-behavior:none;touch-action:none}
  body{font-family:var(--px);color:#fff;-webkit-tap-highlight-color:transparent}
  button{all:unset;cursor:pointer;touch-action:manipulation}
  button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .app{max-width:440px;margin:0 auto;display:grid;grid-template-rows:auto 252px auto;grid-template-columns:minmax(0,1fr);width:100%;background:var(--night);transform-origin:50% 0}

  /* ═══ 위: 정보창 ═══ */
  .info{padding:10px 12px 8px;display:flex;flex-direction:column;gap:8px}
  .bar1{display:flex;align-items:center;gap:8px}
  .face{width:46px;height:46px;border:2px solid var(--gold);background:#2a2050 url(face.webp) center/cover;flex:none}
  .prs{flex:1;display:grid;gap:3px;min-width:0}
  .pr{display:flex;align-items:center;gap:6px;font-size:10px;height:13px}
  .pr .lb{width:52px;color:var(--gold);white-space:nowrap}
  .pr .tr{flex:1;height:7px;border:1.5px solid #fff;background:#3a1020;position:relative;overflow:hidden}
  .pr .fl{position:absolute;inset:0 auto 0 0;transition:width .6s}
  .pr .kg{width:44px;text-align:right;font-variant-numeric:tabular-nums}
  .pr.sn .fl{background:linear-gradient(#ff8a7a,#d92d20)}
  .pr.cj .fl{background:linear-gradient(#ffe066,#f5a623)}
  .pr.sq .fl{background:linear-gradient(#7ee0a0,#16a34a)}
  .pr.up .kg{color:var(--gold);animation:blink .3s steps(1) 6}
  .total{text-align:right;font-size:9px;color:var(--violet);line-height:1.3;flex:none}
  .total b{display:block;font-size:17px;color:var(--gold);font-weight:400;font-variant-numeric:tabular-nums}
  .win{height:108px;border:3px solid #fff;box-shadow:0 0 0 3px var(--night),0 0 0 5px var(--edge);background:linear-gradient(#1d1650,#120d33);padding:12px 14px;overflow:hidden;position:relative;display:flex;flex-direction:column;justify-content:center}
  .win .ttl{font-size:11px;color:var(--gold);margin-bottom:5px;display:flex;justify-content:space-between}
  .win .ttl span:last-child{color:var(--violet)}
  .win h2{font:700 17px var(--px);margin-bottom:3px}
  .win p{font:14px/1.5 var(--font);color:var(--ink);white-space:pre-line}
  .win.flash{animation:flash .5s}
  @keyframes flash{0%{box-shadow:0 0 0 3px var(--night),0 0 0 5px var(--gold),0 0 30px var(--gold)}}
  .caret{display:inline-block;width:7px;height:12px;background:#fff;margin-left:2px;vertical-align:-1px;animation:blink .8s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .bag{display:flex;gap:5px;align-items:center}
  .bag .lb{font-size:9px;color:var(--violet);margin-right:2px;width:24px;line-height:1.2}
  .pot{flex:1;height:42px;position:relative;border:2px solid #2d2560;background:#120d33;display:flex;align-items:center;gap:6px;padding:0 8px;font-size:10px;color:#5a5090}
  .pot{flex-direction:row;align-items:center;gap:7px;padding:0 7px;min-width:0;height:42px}
  .pot .tx{display:flex;flex-direction:column;gap:3px;min-width:0}
  .pot .t{display:flex;align-items:baseline;gap:5px;white-space:nowrap;font-size:11px}
  .pot canvas{width:19px;height:27px;image-rendering:pixelated;opacity:.55;flex:none;filter:grayscale(.6)}
  .pot.has canvas{opacity:1;filter:drop-shadow(0 0 5px var(--pc))}
  .pot .n{color:#8d86c9;font-size:15px}.pot .n::before{content:'×';font-size:11px;margin-right:1px}
  .pot.has .n{color:var(--gold)}
  .win.tall{height:126px}
  .pot{cursor:pointer;touch-action:manipulation}.pot.has:active{transform:translateY(2px)}
  .pot.drink{animation:drink .35s ease-out}
  @keyframes drink{40%{transform:scale(1.08);box-shadow:0 0 18px var(--pc)}}
  .pot.has{border-color:var(--pc);color:#fff;box-shadow:inset 0 0 12px color-mix(in srgb,var(--pc) 35%,transparent)}.pot.has .ic{opacity:1}
  .pot b{font-weight:400;display:block;font-size:9px;color:var(--violet)}
  .pot.got{animation:got .4s steps(2) 5}
  @keyframes got{50%{border-color:var(--gold);box-shadow:0 0 12px var(--gold)}}

  /* ═══ 가운데: 방 ═══ */
  .game{position:relative;overflow:hidden;background:#222;border-top:3px solid #fff;border-bottom:3px solid #fff}
  #room{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
  .night{position:absolute;inset:0;background:#05031a;opacity:0;transition:opacity 1s;pointer-events:none;z-index:8}
  .night.on{opacity:.7}
  /* 방 배경 그림 (낮/밤 크로스페이드) */
  .rbg{position:absolute;inset:0;background:center/cover no-repeat;transition:opacity 1.1s;pointer-events:none}
  .rbg.day{background-image:url(room_day.webp)}.rbg.nt{background-image:url(room_night.webp);opacity:0}
  .game.isnight .rbg.nt{opacity:1}
  .game.hasbg #room,.game.hasbg .tfront{visibility:hidden}.game.hasbg .night.on{opacity:.18}
  .hud{position:absolute;left:8px;top:8px;z-index:9;font-size:10px;background:#0b0820b0;padding:4px 7px}
  .hud b{color:var(--gold);font-weight:400}
  .tb{position:absolute;top:8px;z-index:9;font:700 10px var(--px);color:#fff;background:#0b0820cc;border:2px solid var(--gold);padding:3px 6px}
  #snd{right:8px}#hlp{right:56px}#lng{right:82px}#stats{right:118px}.tb[hidden]{display:none}
  .lsel{display:flex;gap:8px;margin:2px 0}
  .lsel button{font:700 12px var(--px);color:#fff;padding:6px 12px;border:2px solid var(--violet);background:#0b0820;box-shadow:0 3px 0 #000}
  .lsel button.on{border-color:var(--gold);color:#111;background:var(--gold)}
  .cover.warned .lsel{margin:0}.cover.warned .lsel button{padding:3px 9px;font-size:11px}
  .hero{position:absolute;bottom:7%;left:0;width:var(--hh,130px);height:var(--hh,130px);margin-left:calc(var(--hh,130px)/-2);z-index:6;pointer-events:none}
  .hero .flip{position:absolute;inset:0;transform-origin:50% 98%}
  .hero.left .flip{transform:scaleX(-1)}
  .hero .spr{position:absolute;inset:0;background:url(hero.webp) 0 0/800% 100% no-repeat;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
  .hero .sh{position:absolute;left:30%;right:30%;bottom:-3px;height:8px;border-radius:50%;background:rgba(0,0,0,.35);filter:blur(2px)}
  .hero.strain .spr{animation:strain .09s steps(2) infinite}
  @keyframes strain{50%{transform:translateX(1.5%)}}
  .hero.red .spr{filter:sepia(.4) saturate(1.8) hue-rotate(-20deg)}
  .hero.walk .flip{animation:hop .22s ease-in-out infinite}
  @keyframes hop{50%{translate:0 -3%}}
  .hero.chew .spr{animation:chew .28s ease-in-out infinite}
  @keyframes chew{50%{transform:scaleY(.97)}}
  .hero.lie{transition:transform .5s}
  .bubble{position:absolute;bottom:100%;left:50%;transform:translate(-50%,-4px) scale(.6);opacity:0;transition:.16s;z-index:9;font-size:12px;white-space:normal;width:max-content;max-width:220px;text-align:center;line-height:1.35;background:#fff;color:#111;padding:6px 9px;box-shadow:0 0 0 2px #111,3px 3px 0 2px #111}
  .bubble.on{opacity:1;transform:translate(-50%,-6px) scale(1)}
  .bb{position:absolute;height:2.4%;background:linear-gradient(#e9e9f2,#8a8aa0);box-shadow:0 0 0 1px #111;display:none;z-index:2;left:20%;right:24%;top:52.5%}
  .bb.on{display:block}
  .bb i{position:absolute;top:50%;width:5%;transform:translateY(-50%);border:1px solid #6b6b7a}
  .tfront{position:absolute;z-index:7;display:none;image-rendering:pixelated;pointer-events:none}
  .tfront.on{display:block}
  .pop{position:absolute;z-index:10;pointer-events:none;font-size:22px;font-weight:700;color:var(--gold);-webkit-text-stroke:2px #111;text-shadow:3px 3px 0 var(--red);animation:pop .9s ease-out forwards;white-space:nowrap}
  @keyframes pop{0%{transform:translate(-50%,0) scale(.3)}35%{transform:translate(-50%,0) scale(1.2)}100%{transform:translate(-50%,-36px);opacity:0}}
  .fly{position:absolute;z-index:9;pointer-events:none;font-size:20px;image-rendering:pixelated}
  .zz{position:absolute;z-index:9;pointer-events:none;font:700 16px var(--px);color:#bfe8ff;text-shadow:2px 2px 0 #111;animation:zz 2s ease-out forwards}
  @keyframes zz{0%{opacity:0;transform:none}20%{opacity:1}100%{opacity:0;transform:translate(26px,-50px) scale(1.3)}}
  .shake{animation:shk .25s}
  @keyframes shk{25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,1px)}}
  .banner{position:absolute;left:0;right:0;top:24%;z-index:15;text-align:center;font-size:32px;font-weight:700;color:var(--gold);-webkit-text-stroke:2px #111;text-shadow:4px 4px 0 var(--red);opacity:0;transform:scale(.5);transition:.2s;pointer-events:none}
  .banner.on{opacity:1;transform:scale(1)}

  /* 미니게임 화면 */
  .mg{position:absolute;inset:0;z-index:12;background:#0b0820;display:none;align-items:center;justify-content:center;touch-action:none}
  .mg.on{display:flex}
  .mg canvas{width:100%;max-height:100%;aspect-ratio:320/170;image-rendering:pixelated;display:block}
  .mgov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:#0b0820c8;text-align:center;padding:0 16px}
  .mgov[hidden]{display:none}
  .mgov .t{font-size:13px;color:var(--violet)}
  .mgov .g{font-size:28px;font-weight:700;color:var(--gold);-webkit-text-stroke:1.5px #111;text-shadow:3px 3px 0 var(--red)}
  .mgov .g.miss{color:#a0a0b8;text-shadow:3px 3px 0 #333}
  .mgov .s{font-size:12px;color:#fff;line-height:1.5}
  .mgov .row{display:flex;gap:8px;margin-top:4px}
  .mgov .row button{font:700 12px var(--px);padding:8px 12px;border:2px solid var(--gold);background:#0b0820;box-shadow:0 3px 0 #000}
  .mgov .row button.y{background:var(--gold);color:#111}
  .mgov .row button:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
  .mgov .row button[disabled]{opacity:.35;pointer-events:none}
  .mgov .eff{font:12px/1.5 var(--font);color:var(--ink)}
  .mgov .eff b{color:var(--gold);font-weight:700}
  .mgov .kg{font-size:18px;color:#fff}

  .cover{position:absolute;inset:0;z-index:20;background:#0b0820d8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;cursor:pointer}
  .cover .to{font-size:11px;color:var(--violet)}
  .cover .lg{font-size:40px;font-weight:700;color:var(--gold);text-shadow:4px 4px 0 var(--red);line-height:1;letter-spacing:4px}
  .cover .tag{font-size:16px;color:#fff;text-shadow:2px 2px 0 #000}
  .cover .note{font-size:9px;color:var(--violet)}
  .warn{margin:2px 16px;border:2px solid var(--gold);background:#0b0820;padding:8px 10px;font:12px/1.5 var(--font);color:#fff;max-width:330px;cursor:default}
  .warn b{color:var(--gold)}
  .warn .wh{font-weight:700;color:var(--gold)}.warn .wd{margin-top:2px;color:var(--ink);font-size:.95em}.warn .wd b{color:#fff}
  .cover.warned{gap:5px}.cover.warned .to,.cover.warned .sub,.cover.warned .note,.cover.warned .ins{display:none}.cover.warned .lg{font-size:26px}.cover.warned .tag{font-size:12px}.cover.warned .warn{padding:6px 9px;font-size:11px}
  .warn .row{display:flex;gap:6px;justify-content:center;margin-top:6px;flex-wrap:wrap}
  .warn .row button,.warn .row a{font:700 11px var(--px);padding:5px 9px;border:2px solid var(--gold);color:#fff;text-decoration:none;background:#15102e}
  .warn .row .y{background:var(--gold);color:#111}
  .cover .sub{font-size:10px;color:var(--ink);letter-spacing:1px}
  .cover .ins{font-size:14px;animation:blink 1s steps(1) infinite;margin-top:4px}
  .cover[hidden]{display:none}

  /* ═══ 아래: 주사위 패드 ═══ */
  .pad{background:linear-gradient(#2a2060,#1a1440);padding:14px 12px 16px;row-gap:12px;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:14px}
  .diebtn{width:118px;height:118px;display:grid;place-items:center;position:relative}
  .die{width:88px;height:88px;background:#fff;border-radius:14px;box-shadow:inset -6px -7px 0 #c9c4e8,0 0 0 3px #111,0 6px 0 3px #000;position:relative;transition:transform .15s}
  .die i{position:absolute;width:16px;height:16px;border-radius:50%;background:#111;transform:translate(-50%,-50%)}
  .die.red i{background:var(--red)}
  .diebtn.roll .die{animation:roll .12s linear infinite}
  @keyframes roll{25%{transform:rotate(14deg) translateY(-6px)}75%{transform:rotate(-14deg) translateY(-2px)}}
  .diebtn.land .die{animation:land .35s cubic-bezier(.2,1.8,.4,1)}
  @keyframes land{from{transform:scale(1.25) rotate(-10deg)}}
  .diebtn small{position:absolute;bottom:-4px;left:0;right:0;text-align:center;font-size:10px;color:var(--gold)}
  .diebtn.ready .die{animation:breathe 1.2s ease-in-out infinite}
  @keyframes breathe{50%{transform:translateY(-4px)}}
  .diebtn:active .die{transform:translateY(3px)}
  .legend{display:grid;grid-template-columns:1fr 1fr;gap:6px;min-width:0}
  .lg2{display:flex;align-items:center;gap:6px;border:2px solid #2d2560;background:#120d33;padding:5px 6px;font-size:10px;color:var(--ink);white-space:nowrap;overflow:hidden}
  .lg2 em{font-style:normal;width:16px;height:16px;display:grid;place-items:center;background:#fff;color:#111;border-radius:3px;font-size:10px;flex:none}
  .lg2.lift em{background:var(--gold)}
  .lg2.hit{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold);color:#fff}

  /* 필살기 */
  .hero .skl{position:absolute;left:-20%;top:-20%;width:140%;height:140%;background:0 0/800% 100% no-repeat;display:none;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
  .hero.skill .spr{visibility:hidden}.hero.skill .skl{display:block}
  /* 부드럽게: 두 장을 겹쳐 컷 사이를 크로스페이드, 전체는 숨 쉬듯 살짝 움직임 */
  .hero .sklw{position:absolute;inset:0;transform-origin:50% 95%;transition:transform .22s cubic-bezier(.3,1.6,.5,1)}
  .hero.skill .sklw{animation:breathe2 1.1s ease-in-out infinite}
  @keyframes breathe2{50%{translate:0 -1.2%}}
  .hero .skl{transition:opacity var(--xf,160ms) ease-in-out}
  .hero .skl.off{opacity:0}
  /* 동작 시트 (걷기·밥·똥·포션·주사위) */
  .hero .act{position:absolute;background-repeat:no-repeat;background-size:800% 100%;display:none;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
  .hero.acting .spr{visibility:hidden}.hero.acting .act{display:block}
  .hero.gone{opacity:0}
  .scn{position:absolute;z-index:6;background-repeat:no-repeat;background-size:800% 100%;display:none;pointer-events:none;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
  .scn.on{display:block}
  .choose{position:absolute;inset:0;z-index:13;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:#0b0820b0}
  .choose[hidden]{display:none}
  .choose .t{font-size:14px;color:#fff;text-shadow:2px 2px 0 #000}
  .choose .row{display:flex;gap:10px}
  .choose button{display:flex;flex-direction:column;align-items:center;gap:4px;width:138px;padding:10px 6px;border:3px solid var(--gold);background:#15102e;box-shadow:0 4px 0 #000;font:700 13px var(--px);color:#fff}
  .choose button small{font:11px var(--font);color:var(--ink);font-weight:400}
  .choose button img{height:38px;width:auto;image-rendering:pixelated}
  .choose button:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
  /* 지곡 잔상: 직전 포즈를 통째로 복사해 파랗게 물들인 층 (본체 뒤) */
  .hero .gh{position:absolute;left:-20%;top:-20%;width:140%;height:140%;background-repeat:no-repeat;opacity:0;pointer-events:none;
    transition:transform .18s cubic-bezier(.2,.8,.3,1),opacity .18s;filter:brightness(1.35) sepia(1) saturate(4) hue-rotate(170deg)}
  .wflash{position:absolute;inset:0;z-index:11;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
  .wflash.on{opacity:.8;transition:none}
  .skills{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
  .skills button{display:flex;align-items:center;justify-content:center;gap:3px;height:34px;border:2px solid var(--gold);background:linear-gradient(#3a2f7a,#241c55);font:700 11px var(--px);color:#fff;box-shadow:0 3px 0 #000;white-space:nowrap}
  .skills button:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
  .skills button i{font-style:normal;font-size:14px}
  .skills .lb{grid-column:1/-1;font-size:9px;color:var(--violet);margin-bottom:-2px}
  /* 성공 컷: 요쓰! */
  .cutin{position:absolute;left:0;right:0;top:14%;height:58%;z-index:14;pointer-events:none;display:none;
    clip-path:polygon(0 18%,100% 0,100% 82%,0 100%);background:#0b0820;overflow:hidden}
  .cutin.on{display:block;animation:cutin .9s cubic-bezier(.2,.9,.2,1) forwards}
  @keyframes cutin{0%{transform:translateX(-105%)}16%{transform:translateX(0)}84%{transform:translateX(0)}100%{transform:translateX(105%)}}
  .cutin::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(100deg,transparent 0 14px,#ffffff22 14px 16px,transparent 16px 34px);animation:cslide .25s linear infinite}
  @keyframes cslide{to{background-position:-60px 0}}
  .cutin::after{content:"";position:absolute;inset:0;box-shadow:inset 0 5px 0 var(--gold),inset 0 -5px 0 var(--gold)}
  .cutin .cf{position:absolute;left:4%;bottom:-6%;background-repeat:no-repeat;filter:drop-shadow(4px 4px 0 #000)}
  .cutin b{position:absolute;right:7%;top:50%;transform:translateY(-50%) rotate(-6deg);font:700 54px var(--px);color:#fff;-webkit-text-stroke:3px #111;text-shadow:5px 5px 0 var(--red);white-space:nowrap}
  .cutin.on b{animation:yos .9s steps(1) forwards}
  @keyframes yos{0%,15%{opacity:0}16%{opacity:1;transform:translateY(-50%) rotate(-6deg) scale(1.5)}24%{transform:translateY(-50%) rotate(-6deg) scale(1)}}
  .admin{position:fixed;inset:0;z-index:50;background:var(--night);overflow:auto;padding:16px;font:13px/1.5 var(--font);color:var(--ink)}
  .admin[hidden]{display:none}body.adm{overflow:auto}
  .admin .ah{position:sticky;top:-16px;background:var(--night);padding:6px 0 10px;z-index:1}
  .admin h3{font:700 16px var(--px);color:var(--gold)}.admin .live{color:#4ade80}
  .admin .pl{border:2px solid var(--edge);background:#15102e;padding:10px 12px;margin-bottom:10px}
  .admin .pl.on{border-color:#4ade80}
  .admin .ph{display:flex;align-items:center;gap:8px}.admin .ph span:last-child{margin-left:auto;color:var(--violet);font-size:12px}
  .admin .dot{width:9px;height:9px;border-radius:50%;background:#4a3f8a}.admin .pl.on .dot{background:#4ade80;box-shadow:0 0 8px #4ade80}
  .admin table{width:100%;border-collapse:collapse;margin:6px 0;font-variant-numeric:tabular-nums}
  .admin th{font:10px var(--px);color:var(--violet);text-align:left}.admin td{font:700 15px var(--px);color:#fff;vertical-align:top}

/* ═════════ 선물 설정: 이름은 여기서 바꿔요 ═════════ */
const TO='Moti', FROM='영수';
/* ═════════ 플레이 기록 (아티팩트 db): 각 플레이어는 자기 기록만 쓰고, 주인만 모두 봄 ═════════ */
const LOG={v:1,sessions:0,rolls:0,faces:{},lifts:{},food:{r:0,k:0},drinks:0,skills:{},recent:[]};
let logDoc=null,logTimer=null,logBusy=false,logDirty=false,IS_OWNER=false,USER=null,DB=null;
const SHEET_URL='https://script.google.com/macros/s/AKfycbzKhwW_6AYvPPC-tkyQKm8ieApQQ8FBzqIQz8XTEF4f229MXIFBwObfDl8nBG9K1H_o/exec';
const lsg=k=>{try{return localStorage.getItem(k);}catch(e){return null;}},lss=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(e){}};
if(location.hash==='#me')lss('moti_me','1');if(location.hash==='#notme')lss('moti_me',null);
const ME=lsg('moti_me')==='1';   // 내 기기는 시트에 안 보냄
const VID=(()=>{let v=lsg('moti_vid');if(!v){v='m'+Math.random().toString(36).slice(2,8);lss('moti_vid',v);}return v;})();
const DEV=(/iPhone|iPad/.test(navigator.userAgent)?'iOS':/Android/.test(navigator.userAgent)?'Android':'PC')+(/KAKAOTALK/i.test(navigator.userAgent)?'·카톡':/Instagram/i.test(navigator.userAgent)?'·인스타':'');
function sheet(e,k){if(ME||!/github\.io$/.test(location.hostname))return;
  try{fetch(`${SHEET_URL}?op=log&v=${VID}&ev=${encodeURIComponent('moti:'+e)}&k=${encodeURIComponent(k)}&l=${lang}&d=${encodeURIComponent(DEV)}`,{mode:'no-cors',keepalive:true}).catch(()=>{});}catch(err){}}
function sheetText(e,d){if(e==='lift')return `${d.k} ${d.grade} ${d.kg}kg${d.kg>=d.pr&&d.grade!=='MISS'?' PR':''} (Lv${d.lv})`;
  if(e==='start')return `PR ${S.sn}/${S.cj}/${S.sq} · day${S.day} · rolls${S.rolls}${RU?' · ru':''}`;return d==null?'':String(d);}
function log(e,d){sheet(e,sheetText(e,d));const now=Date.now();if(!LOG.first)LOG.first=now;LOG.last=now;
  if(e==='roll'){LOG.rolls++;LOG.faces[d]=(LOG.faces[d]||0)+1;}
  if(e==='lift'){const L=LOG.lifts[d.k]||(LOG.lifts[d.k]={n:0,miss:0,best:0});L.n++;if(d.grade==='MISS')L.miss++;L.best=Math.max(L.best,d.kg||0);}
  if(e==='eat')LOG.food[d]=(LOG.food[d]||0)+1;if(e==='drink')LOG.drinks++;if(e==='skill')LOG.skills[d]=(LOG.skills[d]||0)+1;if(e==='start')LOG.sessions++;
  LOG.recent.push({t:now,e,d:d??null});if(LOG.recent.length>40)LOG.recent.splice(0,LOG.recent.length-40);
  LOG.pr={sn:S.sn,cj:S.cj,sq:S.sq};LOG.lv={...S.lv};LOG.day=S.day;LOG.lang=lang;
  logDirty=true;clearTimeout(logTimer);logTimer=setTimeout(flushLog,1500);}
async function flushLog(){if(!logDoc||logBusy||!logDirty)return;logBusy=true;logDirty=false;
  try{await logDoc.set(JSON.parse(JSON.stringify(LOG)));}catch(e){if(e&&e.code==='invalid_argument')logDoc=null;}logBusy=false;if(logDirty)flushLog();}
(async()=>{try{if(!window.claude||!claude.use)return;const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
  if(!db||!user)return;DB=db;USER=user;const id=await user.id();IS_OWNER=await user.isOwner();
  if(IS_OWNER){addEventListener('hashchange',adminRoute);adminRoute();}
  if(!id)return;logDoc=db.doc('logs/'+id);
  try{const old=await logDoc.get();const v=old.exists&&old.data();if(v&&v.v===1){Object.assign(LOG,v,{recent:v.recent||[]});}}catch(e){}
  if(logDirty||LOG.recent.length)flushLog();}catch(e){}})();
/* 관리자 화면 (주인만): 링크 뒤에 #admin. 플레이어 기록을 실시간으로 보여줌 */
let adminUnsub=null,adminRows=[],adminNames={},adminOpen={};

  if(on&&!adminUnsub){$('admBody').textContent='Loading…';

function evText(x){const d=x.d;if(x.e==='lift')return `🏋️ ${({sn:'Snatch',cj:'C&J',sq:'Squat'})[d.k]} <b>${d.grade}</b> ${d.kg}kg${d.kg>=d.pr?' 🔥PR':''}`;

const S={sn:0,cj:0,sq:0,pot:{P:0,R:0,M:0},lv:{sn:0,cj:0,sq:0},day:1,rolls:0,letter:false};

/* 레벨 효과: 아주 조금씩 쉬워짐 */
const EASE={sn:L=>Math.max(.35,Math.pow(.97,L)),   // 추 속도 배율
            cj:L=>Math.min(1.6,1+.04*Math.max(0,L-5)),   // Lv5 이후 안쪽 칸 넓어지는 배율
            sq:L=>Math.min(3,1+.1*L)};             // 연타 제한 시간(초)
const easeText=(k,L)=>{const ko=lang==='ko';return k==='cj'?`${ko?'칸':'Zones:'} <b>${cjBands(L).map(b=>tr(b.n)).join('·')}</b>${L>5?` (${ko?'넓이':'width'} ×${EASE.cj(L).toFixed(2)})`:''}`:k==='sq'?`${ko?'제한 시간':'Time limit'} <b>${EASE.sq(L).toFixed(1)}${ko?'초':'s'}</b>`:`${ko?'추 속도':'Pendulum speed'} <b>${Math.round(EASE[k](L)*100)}%</b>`;};
const r05=v=>Math.round(v*2)/2;
/* 성장 곡선: 초보 → 세계신기록 ×1.2 까지. 남은 거리가 줄수록 오르는 양이 (남은비율)^1.5 로 줄어듦 */
const WR={sn:225,cj:267,sq:490};                 // 남자 세계신기록 (스내치·클린앤저크: 탈라카제, 백스쿼트: 레이 윌리엄스 노벨트)
const START={sn:40,cj:50,sq:60};                 // 초보 시작
const CAP={sn:WR.sn*1.2,cj:WR.cj*1.2,sq:WR.sq*1.2};   // 게임 최대치 = 세계신기록 ×1.2
const GAIN={sn:8,cj:8,sq:10};                  // 처음(초보)일 때 PERFECT 한 번에 오르는 kg
const room=k=>Math.max(0,(CAP[k]-Math.max(START[k],S[k]||0))/(CAP[k]-START[k]));
function grow(k,frac){const base=Math.max(START[k],S[k]||0);if(base>=CAP[k])return CAP[k];
  return Math.min(CAP[k],r05(base+Math.max(.5,GAIN[k]*frac*Math.pow(room(k),1.5))));}
function under(k,frac){const base=Math.max(START[k],S[k]||0);return Math.max(r05(START[k]*.8),r05(base*(1-.25*frac)));}   // PR 못 넘는 무게
/* 클린앤저크 칸: 바깥부터. w = 줄에서의 거리, add = PR에 더해지는 kg */
function cjBands(L){const k=EASE.cj(L),b=[{n:'초록',w:.07,c:'#16a34a',add:1,g:'GOOD'}];
  if(L>=1)b.push({n:'진초록',w:.045*k,c:'#0b5d2a',add:2,g:'GREAT'});
  if(L>=3)b.push({n:'노랑',w:.025*k,c:'#ffd400',add:3,g:'GREAT'});
  if(L>=5)b.push({n:'빨강',w:.011*k,c:'#e5281c',add:5,g:'PERFECT'});
  return b;}

const BAGS=new Map();
const pick=a=>{if(a.length<2)return a[0];const key=a.join('\u0001');let b=BAGS.get(key);
  if(!b||!b.length){b=a.map((_,i)=>i).sort(()=>Math.random()-.5);const last=BAGS.get(key+'#');if(b.length>1&&b[b.length-1]===last)b.unshift(b.pop());BAGS.set(key,b);}
  const i=b.pop();BAGS.set(key+'#',i);return a[i];};

let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d=.08,type='square',v=.06,slide=0,delay=0){if(!sound)return;const c=ac();if(!c)return;const t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.02);}
function noise(d=.2,v=.08,freq=800,delay=0){if(!sound)return;const c=ac();if(!c)return;const t=c.currentTime+delay,n=c.sampleRate*d,b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);
  for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=freq;g.gain.value=v;s.connect(f).connect(g).connect(c.destination);s.start(t);}
/* 효과음 재료 */
function sweep(f0,f1,d,type='sawtooth',v=.05,delay=0){if(!sound)return;const c=ac();if(!c)return;const t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.02);}
function bell(f=523,d=1.6,v=.05,delay=0){[1,2.76,5.4,8.93].forEach((m,i)=>tone(f*m,d/(i+1),'sine',v/(i+1),0,delay));}
function boom(v=.2,delay=0){sweep(120,32,.9,'sine',v,delay);noise(.6,v*.7,700,delay);noise(.12,v*.5,5000,delay);}
function crackle(n=6,v=.05,delay=0){for(let i=0;i<n;i++)noise(.03,v*(.5+Math.random()),3000+Math.random()*4000,delay+i*.035+Math.random()*.02);}
function boing(f=220,d=.5,v=.05,delay=0){if(!sound)return;const c=ac();if(!c)return;const t=c.currentTime+delay,o=c.createOscillator(),l=c.createOscillator(),lg=c.createGain(),g=c.createGain();
  o.type='triangle';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*1.8,t+d);l.frequency.value=14;lg.gain.value=f*.25;l.connect(lg).connect(o.frequency);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(c.destination);o.start(t);l.start(t);o.stop(t+d+.02);l.stop(t+d+.02);}
function whoosh(d=.35,v=.08,delay=0){if(!sound)return;const c=ac();if(!c)return;const t=c.currentTime+delay,n=c.sampleRate*d,b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);
  for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/n);const sr=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();sr.buffer=b;f.type='bandpass';f.Q.value=1.2;
  f.frequency.setValueAtTime(400,t);f.frequency.exponentialRampToValueAtTime(3500,t+d);g.gain.value=v;sr.connect(f).connect(g).connect(c.destination);sr.start(t);}

  s.end=(grade,kg=0,delay=0)=>{if(s.done)return;s.done=1;s.grade=grade;s.kg=kg;const pr=S[k];
    if(LIFTS['mv_'+k]){const q=LSEQ[k][grade==='MISS'?'no':'ok'];s.anim={seq:q,t0:performance.now()};delay=Math.max(delay,q.reduce((a,b)=>a+b[1],0)-200);}

    setTimeout(()=>{cur=null;res({grade,kg,raw:s.raw});},1300);},delay);};
  cur={g,s};let last=performance.now();
  (function loop(t){if(!cur||cur.s!==s)return;const dt=Math.min(.05,(t-last)/1000);last=t;g.update(s,dt);g.draw(mx,s);requestAnimationFrame(loop);})(last);
});}

async function useSkill(sk){ac();if(!started)start();if(busy)return;busy=true;log('skill',sk.k);$('dice').classList.remove('ready');
  await walkTo(120);face=1;place();
  const L=[$('skl'),$('skl2')],wrap=$('sklw');let top=0;
  const nf=sk.nf||8;L.forEach(el=>{el.style.backgroundImage=`url(${sk.img})`;el.style.backgroundSize=`${nf*100}% 100%`;el.style.backgroundPosition='0 0';});L[1].classList.add('off');L[0].classList.remove('off');
  hero.classList.add('skill');
  const G=[];if(sk.ghost){for(let i=0;i<4;i++){const g=document.createElement('div');g.className='gh';g.style.backgroundImage=`url(${sk.img})`;g.style.backgroundSize=`${nf*100}% 100%`;wrap.insertBefore(g,wrap.firstChild);G.push(g);}}
  for(const [f,ms] of sk.seq){
    if(G.length){const plan=sk.ghost[f+1]||[],pf=Math.max(0,f-1);
      G.forEach((g,i)=>{const c=plan[i];if(c){g.style.backgroundPosition=(pf/(nf-1)*100)+'% 0';g.style.transform=`translateX(${c[0]*sk.gpx}%)`;g.style.opacity=Math.min(.85,c[1]*2.1);}else g.style.opacity=0;});}
    // 다음 컷을 아래 장에 깔고 서서히 드러냄 (컷 길이에 맞춰 페이드 시간 조절)
    const nxt=L[1-top],xf=Math.min(220,Math.max(110,ms*.4));
    L.forEach(el=>el.style.setProperty('--xf',xf+'ms'));
    nxt.style.backgroundPosition=(f/(nf-1)*100)+'% 0';nxt.classList.remove('off');L[top].classList.add('off');top=1-top;
    SFXS[sk.k](f);
    if(sk.say[f])say(sk.say[f],Math.max(900,ms+300));
    if(f===sk.hit){banner(sk.word,1200);shake();const w=$('wflash');w.classList.add('on');setTimeout(()=>w.classList.remove('on'),60);
      wrap.style.transform='scale(1.06)';setTimeout(()=>wrap.style.transform='',180);}
    await sleep(ms);}
  await sleep(120);G.forEach(g=>g.remove());
  hero.classList.remove('skill');setF(F.stand);
  msg('SKILL',`${sk.ic} ${sk.n}`,{aura:'최초는 주먹, 잔! 켄! 바위!\n오라를 모은 주먹이 바벨을 향한다.',card:'카드 한 장에 분홍 오라.\n늘어나고 줄어드는 근육의 성질.',guardian:'감사의 합장.\n금빛 거인이 Moti 뒤에 섰다.',killua:'리듬 있게 걷는 발걸음.\n잔상이 여러 개로 갈라진다.'}[sk.k]);
  busy=false;$('dice').classList.add('ready');}
