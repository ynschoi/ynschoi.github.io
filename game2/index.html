<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Random Walk v2</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<style>
  :root{
    --night:#0b0820; --panel:#15102e; --edge:#4a3f8a; --gold:#ffd400; --red:#d92d20; --violet:#8d86c9; --cyan:#4cc3ff;
    --px:'Galmuri11','Galmuri9',ui-monospace,monospace; --font:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  html,body{height:100%;background:#07051a;overflow:hidden;overscroll-behavior:none}
  body{font-family:var(--px);color:#fff;-webkit-tap-highlight-color:transparent}
  button{all:unset;cursor:pointer;touch-action:none}
  .app{max-width:440px;height:100dvh;margin:0 auto;display:grid;grid-template-rows:minmax(0,1fr) 38dvh auto;grid-template-columns:minmax(0,1fr);width:100%;background:var(--night)}

  /* ═══ 위: 정보 창 ═══ */
  .info{padding:calc(env(safe-area-inset-top) + 10px) 12px 8px;display:flex;flex-direction:column;gap:8px;min-height:0}
  .bar1{display:flex;align-items:center;gap:8px}
  .face{width:40px;height:40px;border:2px solid var(--gold);background:#2a2050 url(../work/assets2/face.webp) center/cover;flex:none}
  .gs{flex:1;display:grid;gap:4px}
  .g{display:flex;gap:5px;align-items:center;font-size:9px;font-weight:700}
  .g .lb{width:26px;color:var(--gold)}
  .g .tr{flex:1;height:8px;border:1.5px solid #fff;background:#3a1020;position:relative;overflow:hidden}
  .g .fl{position:absolute;inset:0 auto 0 0;transition:width .5s}
  .g.hp .fl{background:linear-gradient(#ffe066,#f5a623)}
  .g.pw .fl{background:repeating-linear-gradient(90deg,var(--cyan) 0 6px,#2b7fff 6px 8px)}
  .score{text-align:right;font-size:9px;color:var(--violet);line-height:1.3;flex:none}
  .score b{display:block;font-size:15px;color:var(--gold);font-weight:400}
  .win{flex:1;min-height:0;border:3px solid #fff;box-shadow:0 0 0 3px var(--night),0 0 0 5px var(--edge);background:linear-gradient(#1d1650,#120d33);padding:10px 12px;overflow:auto;position:relative}
  .win .ttl{font-size:11px;color:var(--gold);margin-bottom:6px;display:flex;justify-content:space-between}
  .win .ttl span:last-child{color:var(--violet)}
  .win h2{font:700 19px var(--px);margin-bottom:4px;display:flex;align-items:center;gap:8px}
  .win h2 i{font-style:normal;width:30px;height:30px;display:grid;place-items:center;font-size:12px;border:2px solid #fff;flex:none}
  .win p{font:13px/1.55 var(--font);color:#ddd8ff;min-height:40px}
  .win .st{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .win .st span{font-size:10px;border:1.5px solid var(--edge);padding:4px 6px;color:var(--violet)}
  .win .st b{color:#fff;font-weight:400}
  .win svg{display:block;width:100%;height:44px;margin-top:8px}
  .win.flash{animation:flash .5s}
  @keyframes flash{0%{box-shadow:0 0 0 3px var(--night),0 0 0 5px var(--gold),0 0 30px var(--gold)}}
  .caret{display:inline-block;width:7px;height:12px;background:#fff;margin-left:2px;vertical-align:-1px;animation:blink .8s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .inv{display:flex;gap:5px;align-items:center}
  .inv .lb{font-size:9px;color:var(--violet);margin-right:2px}
  .slot{flex:1;height:46px;position:relative;border:2px solid #2d2560;background:#120d33;display:grid;place-items:center;font-size:9px;color:#3d3480;font-weight:700}
  .slot.got{border-color:#fff;color:#fff;cursor:pointer}
  .slot.sel{box-shadow:0 0 0 2px var(--gold)}

  /* ═══ 가운데: 게임 ═══ */
  .game{position:relative;overflow:hidden;background:#222;border-top:3px solid #fff;border-bottom:3px solid #fff}
  .world{position:absolute;left:0;top:0;height:100%;will-change:transform}
  .world>img{height:100%;width:auto;display:block;max-width:none;pointer-events:none}
  .hud2{position:absolute;left:8px;top:8px;z-index:9;font-size:10px;background:#0b0820b0;padding:4px 7px;color:#fff}
  .hud2 b{color:var(--gold);font-weight:400}
  .mini{position:absolute;left:8px;right:8px;bottom:6px;height:4px;background:#0006;z-index:9}
  .mini i{position:absolute;top:-2px;width:3px;height:8px;background:#fff;opacity:.5}
  .mini i.got{background:var(--gold);opacity:1}
  .mini u{position:absolute;top:-3px;width:6px;height:10px;background:var(--red);margin-left:-3px}

  .hero{position:absolute;bottom:9%;left:0;height:var(--heroH,120px);width:calc(var(--heroH,120px)*.62);z-index:6;pointer-events:none}
  .hero .flip{position:absolute;inset:0;transform-origin:50% 60%;transform:rotate(var(--rot,0deg))}
  .hero.right .flip{transform:scaleX(-1) rotate(var(--rot,0deg))}
  .hero .spr{position:absolute;bottom:0;left:50%;height:156.25%;aspect-ratio:1;transform:translateX(-50%);background:0 0/800% 100% no-repeat;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25))}
  .hero .sh{position:absolute;left:14%;right:14%;bottom:-4px;height:9px;border-radius:50%;background:rgba(0,0,0,.3);filter:blur(2px)}
  .bubble{position:absolute;bottom:118%;left:50%;transform:translate(-50%,-4px) scale(.6);opacity:0;transition:.16s;z-index:8;font-size:12px;white-space:nowrap;background:#fff;color:#111;padding:6px 9px;box-shadow:0 0 0 2px #111,3px 3px 0 2px #111}
  .bubble.on{opacity:1;transform:translate(-50%,-10px) scale(1)}

  .front{position:absolute;left:0;z-index:7;pointer-events:none;background-repeat:no-repeat}   /* 명판 칸막이: 캐릭터 앞에 한 겹 */
  .item.sky{bottom:52%}
  .hi{width:auto!important;min-width:30px;padding:0 4px;font-size:9px!important;overflow:hidden}
  .pxa{display:inline-block;vertical-align:top}
  .item.brief,.item.claude{width:48px;height:44px;margin-left:-24px;display:grid;place-items:center;filter:drop-shadow(0 0 6px #fff8) drop-shadow(2px 2px 0 #111)}
  .item .lbl{position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);background:#0b0820;color:#fff;padding:1px 5px;font-size:9px;white-space:nowrap;font-weight:400}
  .item.tool{bottom:11%}
  .item.tool.drop{z-index:7}
  .item.tool.drop{animation:ghostDrop .75s cubic-bezier(.3,0,.6,1),bob 1.2s ease-in-out .75s infinite}
  @keyframes ghostDrop{0%{transform:translateY(-120px) rotate(-25deg) scale(.4);opacity:0}15%{opacity:1}65%{transform:translateY(0) rotate(8deg) scale(1)}80%{transform:translateY(-16px) rotate(-3deg)}100%{transform:translateY(0) rotate(0)}}
  .item.sky{width:90px;height:90px;margin-left:-45px;animation:bob 1.4s ease-in-out infinite}
  .nx{position:absolute;inset:0;animation:nxPulse 1.1s ease-in-out infinite}
  .nx i{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
  .nx .h{width:90px;height:3px;background:linear-gradient(90deg,transparent,#fff 40%,#fff 60%,transparent);box-shadow:0 0 8px #fff,0 0 14px #ffe9a0}
  .nx .v{width:3px;height:90px;background:linear-gradient(transparent,#fff 40%,#fff 60%,transparent);box-shadow:0 0 8px #fff,0 0 14px #ffe9a0}
  .nx .d1,.nx .d2{width:44px;height:2px;background:linear-gradient(90deg,transparent,#fff,transparent);opacity:.7}
  .nx .d1{transform:translate(-50%,-50%) rotate(45deg)}.nx .d2{transform:translate(-50%,-50%) rotate(-45deg)}
  .nx u{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border-radius:50%;background:#fff;box-shadow:0 0 12px 6px #fff,0 0 30px 14px #ffd400aa}
  @keyframes nxPulse{0%,100%{transform:scale(.8) rotate(0)}50%{transform:scale(1.1) rotate(10deg)}}
  .item.sky .lbl{bottom:auto;top:calc(50% + 16px);color:#ffd400;border:1px solid #ffd400}
  .item.sky::before,.item.sky::after{display:none}
  .item.brief::after,.item.claude::after{bottom:-24px}
  .item.sky .box{border-radius:50%;border:3px solid #fff;background:radial-gradient(circle at 35% 30%,#fff,#ffe066 35%,#f5a623 75%);color:#3a2400;font-size:11px;
    box-shadow:0 0 0 2px #111,0 0 18px 6px #ffd400,0 0 40px 14px #ffd40066;animation:nextGlow 1s ease-in-out infinite}
  @keyframes nextGlow{50%{box-shadow:0 0 0 2px #111,0 0 26px 10px #fff3a0,0 0 60px 24px #ffd40088;transform:scale(1.08)}}
  .item.sky::before,.item.sky::after{content:"✦";position:absolute;color:#fff;font-size:16px;text-shadow:0 0 8px #ffd400;animation:twk 1.2s ease-in-out infinite;z-index:2}
  .item.sky::before{left:-14px;top:-6px}.item.sky::after{right:-14px;bottom:4px;animation-delay:.6s;bottom:auto;top:40px;filter:none;background:none;height:auto;border-radius:0}
  .win p{white-space:pre-line}
  .box.gift{background:linear-gradient(90deg,transparent 43%,#ffd400 43% 57%,transparent 57%),linear-gradient(transparent 38%,#ffd400 38% 52%,transparent 52%),var(--gc);font-size:9px}
  .box.gift b{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);background:#0b0820;color:#fff;padding:1px 4px;font-size:9px;white-space:nowrap;text-shadow:none}
  .box.gift::before{content:"";position:absolute;top:-10px;left:50%;width:18px;height:10px;margin-left:-9px;border:3px solid #ffd400;border-bottom:0;border-radius:10px 10px 0 0}
  .item.drop{animation:dropIn .6s cubic-bezier(.2,1.6,.4,1),bob 1.2s ease-in-out .6s infinite}
  @keyframes dropIn{from{transform:translateY(-60px) scale(.3);opacity:0}}
  .ghost{position:absolute;bottom:22%;width:58px;margin-left:-29px;z-index:5;animation:float 1.6s ease-in-out infinite;pointer-events:none;text-align:center}
  .ghost .gb{position:relative;height:66px;background:#e9e3ffd9;border-radius:29px 29px 6px 6px;box-shadow:0 0 18px #b9a8ffaa;
    -webkit-mask:radial-gradient(circle at 7px 66px,transparent 6px,#000 6.5px) -7px 0/14.5px 100%;mask:radial-gradient(circle at 7px 66px,transparent 6px,#000 6.5px) -7px 0/14.5px 100%}
  .ghost .gb i{position:absolute;top:22px;width:9px;height:13px;border-radius:50%;background:#1b1240}
  .ghost .gb i:first-child{left:15px}.ghost .gb i:last-child{right:15px}
  .ghost span{display:inline-block;margin-top:4px;font-size:10px;background:#3a1020;color:#ff9a9a;padding:2px 5px;white-space:nowrap;border:1px solid #ff9a9a}
  .ghost.in{animation:gIn .5s ease-out,float 1.6s ease-in-out .5s infinite}
  .ghost.die{animation:gDie .7s forwards}
  @keyframes float{50%{transform:translateY(-10px)}}
  @keyframes gIn{from{opacity:0;transform:scale(.3)}}
  @keyframes gDie{30%{filter:brightness(3);transform:scale(1.3)}100%{opacity:0;transform:scale(.2) translateY(-30px)}}
  .hero.powered .spr{filter:drop-shadow(0 0 6px #ffd2b8) drop-shadow(0 0 14px #d97757) brightness(1.08);animation:pglow 1.2s ease-in-out infinite}
  @keyframes pglow{50%{filter:drop-shadow(0 0 10px #ffd2b8) drop-shadow(0 0 22px #d97757) brightness(1.12)}}
  .item.gift .box{background:linear-gradient(90deg,transparent 42%,#ffd400 42% 58%,transparent 58%),linear-gradient(transparent 42%,#ffd400 42% 58%,transparent 58%),#d92d20;font-size:18px;box-shadow:0 0 0 2px #111,0 0 22px #ffd400}
  .item.gift{width:52px;height:52px;margin-left:-26px;animation:bob .9s ease-in-out infinite}
  .dpad .u.glow{color:#ffd400;filter:drop-shadow(0 0 6px #ffd400);animation:upPulse .9s ease-in-out infinite}
  @keyframes upPulse{50%{transform:translateY(-4px);filter:drop-shadow(0 0 12px #ffd400)}}
  .plate{position:absolute;z-index:8;cursor:pointer}
  .plate::after{content:"";position:absolute;inset:-4px;border:2px solid var(--gold);opacity:0;transition:.2s}
  .plate:hover::after{opacity:0}
  .thumb{position:absolute;right:-18%;top:30%;font-size:calc(var(--heroH,120px)*.28);filter:drop-shadow(2px 2px 0 #111);display:none;animation:thumb .8s ease-in-out infinite;z-index:9}
  .hero.thumbs .thumb{display:block}
  @keyframes thumb{0%,100%{transform:rotate(-8deg) scale(1)}50%{transform:rotate(6deg) scale(1.15)}}
  .plate .tri{position:absolute;left:50%;bottom:118%;width:0;height:0;border:9px solid transparent;border-top:12px solid #ffd400;border-bottom:0;margin-left:-9px;filter:drop-shadow(0 2px 0 #111);display:none;animation:triB .7s ease-in-out infinite}
  @keyframes triB{50%{transform:translateY(-6px)}}
  .plate .sweep{position:absolute;inset:0;overflow:hidden;display:none}
  .plate .sweep i{position:absolute;top:-30%;left:-40%;width:28%;height:160%;background:linear-gradient(90deg,transparent,#fffe,transparent);transform:skewX(-20deg);animation:sweep 2.2s ease-in-out infinite}
  @keyframes sweep{0%{left:-40%}45%,100%{left:120%}}
  .plate .stars{position:absolute;inset:-14px;display:none}
  .plate .stars b{position:absolute;color:#fff;font:12px var(--px);text-shadow:0 0 6px #fff,0 0 12px #ffd400;animation:twk 1.2s ease-in-out infinite}
  .plate.s1 .tri,.plate.s1 .sweep,.plate.s2 .tri,.plate.s2 .sweep,.plate.s2 .stars{display:block}
  .plate.s2{animation:lift 1s ease-in-out infinite}
  @keyframes lift{50%{transform:translateY(-4px);filter:brightness(1.15)}}
  .plate .arw{position:absolute;left:50%;top:115%;transform:translateX(-50%);background:#0b0820cc;padding:3px 6px;font-size:11px;color:var(--gold);white-space:nowrap;text-shadow:1px 1px 0 #000;display:none;animation:bob 1s ease-in-out infinite}
  .plate.hint .arw{display:block}
  .info.cvmode .inv,.info.cvmode .bar1{display:none}
  .info.cvmode{padding-top:8px;padding-bottom:8px}
  .info.cvmode .win.idw{overflow:hidden;padding:6px}
  .idc{display:flex;flex-direction:column}
  .idc .rows{flex:1;align-content:space-evenly}
  .win.idw{padding:8px;background:linear-gradient(#1d1650,#120d33)}
  .idc{background:#fff;color:#18181b;border-radius:12px;overflow:hidden;position:relative;min-height:100%;box-shadow:0 6px 18px #0008;animation:idIn .45s cubic-bezier(.2,.8,.2,1)}
  @keyframes idIn{from{transform:perspective(600px) rotateY(80deg);opacity:0}}
  .idc .hd{height:30px;background:linear-gradient(90deg,#1e3a8a,#2563eb);display:flex;align-items:center;gap:8px;padding:0 12px;color:#fff;font:600 11px var(--font)}
  .idc .hd i{width:14px;height:14px;background:#fff;transform:rotate(45deg);flex:none}
  .idc .hd span{margin-left:auto;font:9px var(--px);opacity:.8}
  .idc .ph{position:absolute;left:12px;top:38px;width:54px;height:64px;border:3px solid #fff;border-radius:8px;background:#2a2050 url(../work/assets2/face.webp) center/cover;box-shadow:0 2px 6px #0004}
  .idc .who{padding:6px 12px 0 78px;min-height:68px}
  .idc .who b{display:block;font:800 18px var(--font);line-height:1.2}
  .idc .who small{font:11px var(--font);color:#71717a}
  .idc .chip{display:inline-block;margin:4px 0 0;font:600 10px var(--font);background:#eff4ff;color:#2563eb;padding:3px 8px;border-radius:99px}
  .idc .rows{padding:4px 12px 20px;display:grid;gap:2px}
  .idc .rows div{display:flex;gap:8px;font:11px/1.35 var(--font);color:#3f3f46;border-top:1px solid #f0f0f3;padding-top:3px}
  .idc .rows span{width:52px;flex:none;font:9.5px var(--px);color:#a1a1aa;padding-top:2px}
  .idc .rows p{color:#3f3f46;font:11px/1.35 var(--font);margin:0;min-height:0}
  .idc .rows b{color:#18181b}
  .idc .rows p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
  .idc .rows div:last-child p{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .idc .rows p.todo1{color:#d92d20;font:10px var(--px)}
  .idc .rows div{padding-top:2px}
  .idc .rows em{font-style:normal;font:9.5px var(--px);color:#d92d20}
  .idc .no{position:absolute;right:12px;bottom:6px;font:9px var(--px);color:#a1a1aa}
  .idc .bar{position:absolute;left:12px;bottom:7px;width:90px;height:10px;background:repeating-linear-gradient(90deg,#18181b 0 2px,transparent 2px 3px,#18181b 3px 4px,transparent 4px 7px)}
  .idc .hd{height:22px!important;font-size:10px!important}
  .idc .ph{top:27px!important;left:10px!important;width:34px!important;height:40px!important;border-width:2px!important;border-radius:6px!important}
  .idc .who{padding:5px 10px 0 52px!important;min-height:44px!important;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:6px}
  .idc .who b{font-size:16px!important;display:inline!important}
  .idc .who br{display:none}
  .idc .who .chip{margin:2px 0 0!important;flex-basis:auto}
  .idc .rows{grid-template-columns:1fr;row-gap:0!important;padding:2px 10px 14px!important;flex:none!important}
  .idc .rows div{gap:6px!important;min-width:0;padding-top:1px!important;line-height:14px!important}
  .idc .rows span{width:56px!important;font-size:9px!important;white-space:nowrap}
  .idc .rows p{font-size:10.5px!important;line-height:14px!important}
  .idc .bar{bottom:3px!important;height:7px!important;width:70px!important}.idc .no{bottom:2px!important;font-size:8px!important}
  @media (max-height:700px){.idc .rows{padding-bottom:4px!important}.idc .bar,.idc .no{display:none}.idc .rows div,.idc .rows p{line-height:11px!important;font-size:9.5px!important}.idc .rows div{padding-top:0!important}.idc .hd{height:18px!important}.idc .ph{top:22px!important}.idc .rows span{font-size:8.5px!important}.idc .who{min-height:24px!important;padding-top:2px!important}.idc .who b{font-size:14px!important}.idc .ph{width:28px!important;height:32px!important}.idc .who{padding-left:44px!important}.idc .who .chip{display:none}}
  .cv{margin-top:8px;display:grid;gap:0}
  .cv div{display:flex;gap:10px;padding:6px 0;border-top:1px solid #2d2560;font:12.5px/1.45 var(--font);color:#ddd8ff}
  .cv div span{width:62px;flex:none;font:10px var(--px);color:var(--violet);padding-top:2px}
  .cv b{color:#fff;font-weight:700}
  .cv em{display:block;font-style:normal;font:10px var(--px);color:#ff8a8a}
  .spk{position:absolute;z-index:12;width:120px;height:120px;margin:-60px 0 0 -60px;cursor:pointer;display:none;animation:twk 1.4s ease-in-out infinite}
  .spk.on{display:block}
  .spk i{position:absolute;left:50%;top:50%;background:linear-gradient(90deg,transparent,#fff 45%,#fff 55%,transparent);transform:translate(-50%,-50%)}
  .spk i.h{width:120px;height:3px;box-shadow:0 0 8px #fff,0 0 16px #bfe8ff}
  .spk i.v{width:3px;height:120px;background:linear-gradient(transparent,#fff 45%,#fff 55%,transparent);box-shadow:0 0 8px #fff,0 0 16px #bfe8ff}
  .spk b{position:absolute;inset:34px;border-radius:50%;border:2px solid transparent;border-left-color:#fffd;border-right-color:#fffd;transform:rotate(-20deg)}
  .spk u{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px;border-radius:50%;background:#fff;box-shadow:0 0 14px 6px #fff,0 0 30px 10px #9fd8ff}
  @keyframes twk{0%,100%{transform:scale(.85) rotate(0)}50%{transform:scale(1.15) rotate(8deg)}}
  .wflash{position:absolute;inset:0;z-index:25;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s}
  .wflash.on{opacity:1}
  .item{position:absolute;bottom:34%;width:40px;height:40px;margin-left:-20px;z-index:5;animation:bob 1.2s ease-in-out infinite}
  .item .box{position:absolute;inset:0;border:3px solid #fff;box-shadow:0 0 0 2px #111,0 0 14px #fff8;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;text-shadow:1px 1px 0 #000}
  .item::after{content:"";position:absolute;left:8px;right:8px;bottom:-26px;height:6px;border-radius:50%;background:#0004;filter:blur(2px)}
  .item.got{animation:get .6s forwards}
  @keyframes bob{50%{transform:translateY(-8px)}}
  @keyframes get{30%{transform:translateY(-34px) scale(1.25)}100%{transform:translateY(-70px) scale(.2);opacity:0}}
  .pop{position:absolute;z-index:10;pointer-events:none;font-size:24px;font-weight:700;color:var(--gold);-webkit-text-stroke:2px #111;text-shadow:3px 3px 0 var(--red);animation:pop .8s ease-out forwards;white-space:nowrap}
  @keyframes pop{0%{transform:scale(.3)}35%{transform:scale(1.2)}100%{transform:translateY(-36px);opacity:0}}
  .shake{animation:shk .25s}

   <div class="rows">${c.rows.map(r=>`<div><span>${r[0]}</span><p class="${r[1].startsWith('※')?'todo1':''}">${r[1]}</p></div>`).join('')}</div>
   <div class="bar"></div><div class="no">ID · 2026-63</div></div>`;}
$('plate').addEventListener('pointerdown',e=>{e.stopPropagation();if(!started)return start();showCV();});

/* ═════════ 점프 ═════════
   점프 그림(jump.webp, 8칸)이 생기면 SH.jump 로 씁니다. 없으면 몸풀기(hop) 그림으로 대신해요. */
const JUMPSHEET=()=>SH.jump?'jump':'hop';
const raf=()=>new Promise(r=>requestAnimationFrame(r));
let heroY=0,heroS=1;
function heroUp(y,sc_=1,glow=0,rot=0){heroY=y;heroS=sc_;hero.style.transform=`translateY(${-y}px) scale(${sc_})`;hero.style.transformOrigin='50% 100%';hero.style.setProperty('--rot',rot+'deg');
  spr.style.filter=glow?`brightness(${1+glow*2.2}) drop-shadow(0 0 ${4+glow*22}px #fff) drop-shadow(0 0 ${glow*30}px #9fd8ff)`:'';}
async function jump(){
  if(busy||!started)return;
  if(atRiver()&&boost)return superJump();
  busy=true;const H=hero.offsetHeight,dx=H*.45*face,peak=H*.42,dur=520,x0=hx;
  if(SH.jump){await once('jump',[1],90);}
  let t0=performance.now();sheet(JUMPSHEET());clearInterval(ft);if(!SH.jump){let k=0;frame(0);ft=setInterval(()=>frame(Math.min(7,++k)),dur/8);}
  while(true){const t=Math.min(1,(performance.now()-t0)/dur);hx=x0+dx*t;place();heroUp(4*peak*t*(1-t));touchItems(true);
    if(SH.jump)frame(t<.5?3:6);
    if(t>=1)break;await raf();}
  heroUp(0);clearInterval(ft);if(SH.jump)await once('jump',[1],110);busy=false;if(atRiver()&&face>0)cold();
  if(keys.left||keys.right)startWalk();else idle();
}
async function superJump(){
  busy=true;flying=true;face=1;place();const s=sc(),G=game.clientHeight;
  say(T[lang].fly,1500);
  await once(JUMPSHEET(),[0,1,1,1,2],110);                     // 웅크렸다가 뛰어오름
  const x0=hx,x1=PANO.TOWER.x*s,up1=G*.91-PANO.TOWER.y48*s,dur=1900;let t0=performance.now();
  superFly=true;fols.forEach((o,k)=>{o.sx=o.x;o.dl=160+k*170;o.img=AGJUMP[o.key];o.fs.style.backgroundImage=`url(${A2(o.img)})`;o.el.classList.remove('l');});
  sheet(JUMPSHEET());frame(4);
  while(true){const t=Math.min(1,(performance.now()-t0)/dur),e=1-Math.pow(1-t,2);
    hx=x0+(x1-x0)*e;place();
    const arc=up1*e+G*.06*Math.sin(Math.PI*t);
    const spin=t<.08||t>.42?0:-720*((t-.08)/.34);              // 백덤블링 2바퀴
    heroUp(arc,1-.7*t,Math.max(0,(t-.45)/.55),spin);
    if(t<.08){sheet('jump');frame(2);}else if(t<=.42){sheet('flip');frame(Math.floor((t-.08)/.34*8)%8);}else{sheet('jump');frame(t<.6?3:4);}
    hero.style.opacity=t>.85?String(1-(t-.85)/.15):'1';
    if(Math.random()<.5&&t>.1)trail(hx,G-arc*.9-G*.1);
    flyFols(performance.now()-t0,dur,x1,up1,G);
    touchItems(true);if(t>=1)break;await raf();}
  hero.style.opacity='0';
  {const tE=performance.now();while(fols.some(o=>o.el.style.opacity!=='0')){flyFols(performance.now()-t0,dur,x1,up1,G);if(Math.random()<.4)trail(x1,G*.1);await raf();if(performance.now()-tE>1500)break;}}const sp=$('spk');sp.style.left=x1+'px';sp.style.top=(PANO.TOWER.y48*s)+'px';sp.classList.add('on');
  pop('✨',x1-14,PANO.TOWER.y48*s-50);
  $('win').innerHTML=`<div class="ttl"><span>${T[lang].arrive}</span><span>${got.size}/${NTOT}</span></div><h2>✨ 48F</h2><p id="wp"></p>`;typeText($('wp'),T[lang].arriveTxt);
  backTimer=setTimeout(goBack,1300);
}
let backTimer=0,posing=false,poseTok=0,camLock=null;
function endPose(){if(!flying)hero.style.zIndex='';if($('win').classList.contains('idw')&&!showingCV){showHome();}document.querySelector('.info')?.classList.remove('cvmode');hero.classList.remove('thumbs');camLock=null;if(!posing)return;posing=false;poseTok++;$('bubble').classList.remove('on');clearTimeout(say.t);$('plate').classList.remove('s1','s2');}
function trail(x,y){const d=document.createElement('div');d.className='pop';d.textContent=pick(['✦','✧','★','✨']);d.style.fontSize=(10+Math.random()*12)+'px';d.style.left=(x-10+Math.random()*30)+'px';d.style.top=y+'px';world.appendChild(d);setTimeout(()=>d.remove(),800);}
async function goBack(){
  clearTimeout(backTimer);const sp=$('spk');if(!sp.classList.contains('on'))return;sp.classList.remove('on');
  const fl=$('flash');fl.classList.add('on');await sleep(380);
  flying=false;heroUp(0);hero.style.opacity='1';hero.style.zIndex='';face=1;hx=PANO.HIDE*sc();superFly=false;folSnap();fols.forEach(o=>{o.el.style.opacity='1';o.el.style.transform='none';});
  camLock=Math.max(0,PANO.PLATE.x0*sc()-18);place();
  fl.classList.remove('on');await sleep(200);
  loopF('walk',110);const to=Math.max(PANO.OUT*sc()*.8,camLock+game.clientWidth/2);let t0=performance.now();
  await new Promise(r=>{const step=t=>{const dt=Math.min(50,t-t0);t0=t;hx+=hero.offsetHeight*.0011*dt;place();if(hx<to)requestAnimationFrame(step);else r();};requestAnimationFrame(step);});
  hero.style.zIndex=9;showHome();lineup=true;
  if(got.size===ITEMS.length&&!clearShown){clearShown=true;banner('ALL CLEAR!',700);await sleep(750);}
  say(T[lang].back,600000);await once('cross',[0,1,2,3,4,5],140);
  posing=true;sheet('cross');clearInterval(ft);let pk=0;frame(4);ft=setInterval(()=>frame([4,4,5,5][++pk%4]),260);busy=false;
  const pl=$('plate');pl.classList.add('s1');
  const my=++poseTok;
  await sleep(4500);if(!posing||my!==poseTok)return;
  pl.classList.remove('s1');pl.classList.add('s2');say(T[lang].ask,600000);
  clearInterval(ft);sheet('wave');frame(2);face=-1;place();      /* 명판 쪽으로 손짓 */
  await sleep(5500);if(!posing||my!==poseTok)return;
  endPose();face=1;place();idle();
}

/* ═════════ 시작 · 언어 ═════════ */
async function start(){if(started)return;started=true;$('cover').classList.add('hide');busy=true;
  /* 명판 칸막이 뒤에서 걸어 나와서 시작 */
  face=1;hx=PANO.HIDE*sc();place();loopF('walk',110);
  const to=PANO.OUT*sc();let t0=performance.now();
  await new Promise(r=>{const step=t=>{const dt=Math.min(50,t-t0);t0=t;hx+=hero.offsetHeight*.0011*dt;place();if(hx<to)requestAnimationFrame(step);else r();};requestAnimationFrame(step);});
  banner('FIGHT!',900);hero.classList.remove('right');await once('greet',ACT.greet.seq,ACT.greet.ms);place();busy=false;idle();}
function setLang(l){lang=l;document.documentElement.lang=l;const t=T[l];
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t[e.dataset.t]);
  $('helpBody').innerHTML=t.help.map(([k,v])=>`<b>${k}</b>${v}`).join('<br>');
  if(sel>=0)showItem(sel,false);else showHome();place();}

addEventListener('resize',layout);
$('pano').onload=layout;
setLang('ko');idle();layout();setPow(0);
</script>
