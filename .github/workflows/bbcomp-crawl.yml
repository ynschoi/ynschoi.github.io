name: bbcomp 대회일정 수집

on:
  schedule:
    - cron: "17 21 * * 0"   # 매주 월요일 06:17 KST
  workflow_dispatch: {}      # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: bbcomp-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Crawl
        run: python3 bbcomp/crawler/crawl.py
      - name: Commit if changed
        run: |
          git config user.name "bbcomp-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bbcomp/data.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "bbcomp: 대회일정 자동 수집 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git push
          fi
