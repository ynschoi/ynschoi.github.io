name: bbcomp 대회일정 수집

on:
  schedule:
    - cron: "17 21 * * 0"   # 매주 월요일 06:17 KST (기본 브랜치에서만 실행됨)
  workflow_dispatch: {}      # Actions 탭에서 수동 실행
  push:                      # 크롤러를 고치면 바로 한 번 실행
    paths:
      - "bbcomp/crawler/**"
      - ".github/workflows/bbcomp-crawl.yml"

permissions:
  contents: write

concurrency:
  group: bbcomp-crawl-${{ github.ref }}
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 사이트 접속 진단
        run: python3 bbcomp/crawler/check_sites.py || true
      - name: Crawl
        run: python3 bbcomp/crawler/crawl.py
      - name: 구독 캘린더(.ics) 생성
        run: python3 bbcomp/crawler/make_ics.py
      - name: 수집 결과 요약
        if: always()
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open("bbcomp/data.json"))
          print("총", len(d["events"]), "건")
          for k, s in d["sources"].items():
              print(("OK  " if s.get("ok") else "FAIL"), f"{s.get('count'):>4}", k, s.get("error", "") if not s.get("ok") else "")
          PY
      - name: 지난해 협회 대회 보충 (history에 KBBF가 없을 때 한 번)
        run: python3 bbcomp/crawler/history_kbbf.py || true
      - name: Commit if changed
        run: |
          git config user.name "bbcomp-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 수집 도중 브랜치에 다른 커밋이 올라왔으면 최신 브랜치 위에 이번 수집 결과를 덮어쓴다
          mkdir -p /tmp/out && cp -r bbcomp/data.json bbcomp/cal bbcomp/history /tmp/out/
          git fetch -q origin "${GITHUB_REF_NAME}"
          git reset -q --hard "origin/${GITHUB_REF_NAME}"
          rm -rf bbcomp/cal && cp -r /tmp/out/cal /tmp/out/history /tmp/out/data.json bbcomp/
          git add bbcomp/data.json bbcomp/cal bbcomp/history
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "bbcomp: 대회일정 자동 수집 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
