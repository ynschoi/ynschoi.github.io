<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>보디빌딩 대회일정 2026</title>
<meta name="description" content="2026 전국 보디빌딩 대회 일정 — 연맹·지역 필터, 관심 대회, D-day, 캘린더 추가">
<meta name="theme-color" content="#111311">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{
  --bg:#111311;--panel:#1a1d1a;--panel2:#222622;--line:#2e332e;
  --text:#f1f3ee;--muted:#9aa196;--accent:#d4f55a;--accent-ink:#141a05;
  --star:#ffcf4a;--danger:#ff6b6b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;
  font-size:15px;line-height:1.4;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}

header{padding:calc(18px + env(safe-area-inset-top)) 0 10px;border-bottom:2px solid var(--accent)}
.eyebrow{color:var(--accent);font-weight:800;font-size:13px;letter-spacing:.02em}
h1{margin:4px 0 2px;font-size:28px;line-height:1.15;font-weight:900;letter-spacing:-.02em}
h1 em{font-style:normal;color:var(--accent)}
.sub{color:var(--muted);font-size:13px}

.next{margin:14px 0 4px;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:12px 14px;
  display:flex;align-items:center;gap:12px;cursor:pointer;border:0;width:100%;text-align:left}
.next .dd{font-size:26px;font-weight:900;min-width:64px;text-align:center}
.next .t{font-weight:800}
.next .s{font-size:12px;opacity:.75}

.controls{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line)}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.search input::placeholder{color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.toggles{display:flex;gap:6px;flex-wrap:wrap;padding-top:6px}
.count{color:var(--muted);font-size:12px;padding-top:6px}

.month{margin-top:22px}
.month h2{font-size:20px;margin:0 0 8px;display:flex;align-items:baseline;gap:8px}
.month h2 small{color:var(--muted);font-size:12px;font-weight:500}
.day{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.day.past{opacity:.45}
.day.today .dnum{background:var(--accent);color:var(--accent-ink)}
.dcol{flex:none;width:52px;text-align:center}
.dnum{display:block;border-radius:10px;background:var(--panel2);padding:6px 0;font-weight:900;font-size:18px;line-height:1.1}
.dnum small{display:block;font-size:11px;font-weight:600;opacity:.8}
.dow-6{color:#7fb3ff}.dow-0{color:#ff8a8a}
.evs{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.ev{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 11px;cursor:pointer;display:flex;gap:8px;align-items:flex-start}
.ev.major{border-color:#5a5320;background:linear-gradient(90deg,#2a2812,var(--panel) 60%)}
.ev .main{flex:1;min-width:0}
.ev .title{font-weight:700;word-break:keep-all}
.ev .meta{font-size:12px;color:var(--muted);margin-top:2px;word-break:keep-all}
.ev .fee{color:var(--accent);font-weight:700}
.badge{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:2px 6px;margin-right:6px;vertical-align:1px;color:#111}
.fav{flex:none;background:none;border:0;font-size:20px;line-height:1;padding:0 2px;cursor:pointer;color:#555b55}
.fav.on{color:var(--star)}
.empty{color:var(--muted);text-align:center;padding:48px 0}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:18px 0 8px}
.cal-head h2{margin:0;font-size:20px}
.cal-head button{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:40px;height:36px;cursor:pointer;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.grid .wd{text-align:center;font-size:12px;color:var(--muted);padding:2px 0}
.cell{aspect-ratio:1/1.05;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.cell.blank{background:none;border:0;cursor:default}
.cell.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.cell.today .n{background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:0 4px}
.cell .n{font-size:13px;font-weight:700}
.dots{display:flex;flex-wrap:wrap;gap:2px;justify-content:center}
.dot{width:6px;height:6px;border-radius:50%}
.cell .c{font-size:10px;color:var(--muted)}
.daylist{margin-top:14px}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(17,19,17,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav.tabs button{flex:1;background:none;border:0;padding:10px 0 12px;cursor:pointer;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button .i{font-size:19px;line-height:1}
nav.tabs button.on{color:var(--accent);font-weight:700}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:none}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--panel);border-radius:18px 18px 0 0;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;transform:translateY(105%);transition:transform .22s ease;max-height:85vh;overflow:auto}
.sheet.open{transform:none}
.sheet h3{margin:6px 0 4px;font-size:21px;word-break:keep-all}
.sheet dl{display:grid;grid-template-columns:72px 1fr;gap:8px 10px;margin:14px 0;font-size:14px}
.sheet dt{color:var(--muted)}
.sheet dd{margin:0;word-break:keep-all}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1 1 140px;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:11px 12px;cursor:pointer;text-align:center;text-decoration:none;color:var(--text);font-weight:600}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.warn{color:var(--danger)}
.form label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.form input,.form select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.row2{display:flex;gap:8px}.row2>div{flex:1;min-width:0}

.info{margin-top:20px;font-size:13px;color:var(--muted)}
.info section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.info h3{color:var(--text);font-size:15px;margin:0 0 6px}
.info ul{margin:0;padding-left:18px}
.legend{display:flex;flex-wrap:wrap;gap:6px 10px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);
  padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
.toast.show{opacity:1}
</style>
</head>

</nav>

<div class="scrim" id="scrim"></div>

function parse(){
  const out=[];
  RAW.trim().split('\n').forEach((line,i)=>{
    let [head,extra]=line.split(' | ');
    const m=head.match(/^(\d\d)-(\d\d)(?:~(\d\d))?\s+(\*\s+)?(\S+)\s*(.*)$/);
    if(!m) return;
    const [,mm,dd,end,star,fed,rest]=m;
    const ev={id:'d'+i,date:`${YEAR}-${mm}-${dd}`,end:end?`${YEAR}-${mm}-${end}`:null,major:!!star,fed,name:rest};
    if(extra) extra.split('; ').forEach(kv=>{const k=kv.indexOf('=');ev[kv.slice(0,k)]=kv.slice(k+1)});
    if(ev['마감']) ev['마감']=`${YEAR}-${ev['마감']}`;
    out.push(ev);
  });
  return out;
}

/* ───────── 상태 ───────── */
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
          set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const state={
  tab:'list', q:'', feds:new Set(), upcoming:LS.get('bb.upcoming',true), major:false, favOnly:false,
  favs:new Set(LS.get('bb.favs',[])), custom:LS.get('bb.custom',[]),
  calMonth:null, calSel:null,
};
let BASE=parse();
const all=()=>BASE.concat(state.custom.map(c=>({...c,fed:'내일정'})));

const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const todayStr=(()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`})();
const toDate=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const WD='일월화수목금토';
const dow=s=>toDate(s).getDay();
const daysUntil=s=>Math.round((toDate(s)-toDate(todayStr))/864e5);
const endOf=e=>e.end||e.date;
const title=e=>e.fed==='기타'||e.fed==='내일정'?e.name:`${e.fed} ${e.name}`.trim();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtMD=s=>{const d=toDate(s);return `${d.getMonth()+1}.${pad(d.getDate())}(${WD[d.getDay()]})`};
const fmtRange=e=>e.end?`${fmtMD(e.date)}–${fmtMD(e.end)}`:fmtMD(e.date);
const ddLabel=n=>n===0?'D-DAY':n>0?`D-${n}`:`D+${-n}`;

function filtered(){
  const q=state.q.trim().toLowerCase();
  return all().filter(e=>{
    if(state.upcoming && endOf(e)<todayStr) return false;
    if(state.major && !e.major) return false;
    if(state.favOnly && !state.favs.has(e.id)) return false;
    if(state.feds.size){
      const f=e.fed==='WNGP·MUSA'?['WNGP','MUSA']:[e.fed];
      if(!f.some(x=>state.feds.has(x))) return false;
    }
    if(q){const hay=(title(e)+' '+(e['장소']||'')+' '+(e['비고']||'')).toLowerCase();
      if(!q.split(/\s+/).every(w=>hay.includes(w))) return false;}
    return true;
  }).sort((a,b)=>a.date.localeCompare(b.date)||(b.major-a.major)||a.fed.localeCompare(b.fed));
}

/* ───────── 렌더 ───────── */
function badge(e){const c=(FEDS[e.fed]||FEDS.기타).c;return `<span class="badge" style="background:${c}">${esc(e.fed==='내일정'?'MY':e.fed)}</span>`}
function evCard(e){
  const meta=[e.end&&esc(fmtRange(e)), e['장소']&&esc(e['장소']), e['참가비']&&`<span class="fee">${esc(e['참가비'])}</span>`,
    e['마감']&&esc(`접수 마감 ${fmtMD(e['마감'])}`), e['비고']&&esc(e['비고'])].filter(Boolean).join(' · ');
  return `<div class="ev${e.major?' major':''}" data-id="${e.id}">
    <div class="main"><div class="title">${badge(e)}${e.major?'<span style="color:var(--star)">★ </span>':''}${esc(title(e))}</div>
    ${meta?`<div class="meta">${meta}</div>`:''}</div>
    <button class="fav${state.favs.has(e.id)?' on':''}" data-fav="${e.id}" aria-label="관심 대회">${state.favs.has(e.id)?'♥':'♡'}</button></div>`;
}
function dayBlock(date,evs){
  const d=toDate(date),dw=d.getDay();
  const cls=['day',date<todayStr&&evs.every(e=>endOf(e)<todayStr)?'past':'',date===todayStr?'today':''].join(' ');
  return `<div class="${cls}" id="day-${date}"><div class="dcol"><span class="dnum dow-${dw}">${d.getDate()}<small>${WD[dw]}</small></span></div>
    <div class="evs">${evs.map(evCard).join('')}</div></div>`;
}
function groupByDate(list){const g=new Map();list.forEach(e=>{if(!g.has(e.date))g.set(e.date,[]);g.get(e.date).push(e)});return g}

function renderList(){
  const list=filtered();
  $('#count').textContent=`${list.length}개 대회`;
  if(!list.length){$('#view').innerHTML=`<div class="empty">조건에 맞는 대회가 없어요.<br>필터를 바꿔보세요.</div>`;return}
  const byMonth=new Map();
  list.forEach(e=>{const m=+e.date.slice(5,7);if(!byMonth.has(m))byMonth.set(m,[]);byMonth.get(m).push(e)});
  let h='';
  byMonth.forEach((evs,m)=>{
    h+=`<section class="month"><h2>${m}월 <small>${evs.length}개</small></h2>`;
    groupByDate(evs).forEach((es,d)=>h+=dayBlock(d,es));
    h+='</section>';
  });
  $('#view').innerHTML=h;
}

function renderCal(){
  const list=filtered();
  $('#count').textContent=`${list.length}개 대회`;
  if(!state.calMonth){const t=toDate(todayStr);state.calMonth=t.getFullYear()===YEAR?t.getMonth()+1:3}
  const m=state.calMonth, first=new Date(YEAR,m-1,1), days=new Date(YEAR,m,0).getDate();
  const byDay=new Map();
  list.forEach(e=>{ // 기간 대회는 각 날짜에 표시
    let d=toDate(e.date);const end=toDate(endOf(e));
    while(d<=end){const k=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;if(!byDay.has(k))byDay.set(k,[]);byDay.get(k).push(e);d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1)}
  });
  let g=[...WD].map((w,i)=>`<div class="wd dow-${i}">${w}</div>`).join('');
  for(let i=0;i<first.getDay();i++) g+='<div class="cell blank"></div>';
  for(let d=1;d<=days;d++){
    const k=`${YEAR}-${pad(m)}-${pad(d)}`, evs=byDay.get(k)||[];
    const dots=evs.slice(0,6).map(e=>`<span class="dot" style="background:${(FEDS[e.fed]||FEDS.기타).c}"></span>`).join('');
    g+=`<div class="cell${k===todayStr?' today':''}${k===state.calSel?' sel':''}" data-day="${k}"><span class="n dow-${(first.getDay()+d-1)%7}">${d}</span><div class="dots">${dots}</div>${evs.length>6?`<span class="c">+${evs.length-6}</span>`:''}</div>`;
  }
  const sel=state.calSel&&+state.calSel.slice(5,7)===m?state.calSel:null;
  const selEvs=sel?(byDay.get(sel)||[]):[];
  $('#view').innerHTML=`<div class="cal-head"><button id="pm" aria-label="이전 달">‹</button><h2>${YEAR}년 ${m}월</h2><button id="nm" aria-label="다음 달">›</button></div>
    <div class="grid">${g}</div>
    <div class="daylist">${sel?(selEvs.length?dayBlock(sel,selEvs):`<div class="empty">${fmtMD(sel)} 대회 없음</div>`):'<div class="empty" style="padding:20px 0">날짜를 누르면 대회가 보여요</div>'}</div>`;
  $('#pm').onclick=()=>{state.calMonth=Math.max(1,m-1);state.calSel=null;render()};
  $('#nm').onclick=()=>{state.calMonth=Math.min(12,m+1);state.calSel=null;render()};
}

function renderNext(){
  const up=all().filter(e=>endOf(e)>=todayStr).sort((a,b)=>a.date.localeCompare(b.date));
  const favUp=up.filter(e=>state.favs.has(e.id));
  const e=favUp[0]||up[0], btn=$('#next');
  if(!e){btn.hidden=true;return}
  const n=Math.max(0,daysUntil(e.date));
  const same=up.filter(x=>x.date===e.date).length;
  btn.hidden=false;
  btn.innerHTML=`<div class="dd">${ddLabel(n)}</div><div><div class="s">${favUp[0]?'다음 관심 대회':'다음 대회'} · ${fmtRange(e)}</div>
    <div class="t">${esc(title(e))}${!favUp[0]&&same>1?` 외 ${same-1}개`:''}</div>${e['장소']?`<div class="s">${esc(e['장소'])}</div>`:''}</div>`;
  btn.onclick=()=>{ if(favUp[0]) openSheet(e.id); else {setTab('list');requestAnimationFrame(()=>{const el=document.getElementById('day-'+e.date);el&&el.scrollIntoView({behavior:'smooth',block:'center'})})} };
}

function findEv(id){return all().find(e=>e.id===id)}
function openSheet(id){
  const e=findEv(id);if(!e)return;
  const reg=FEDS[e.fed]&&FEDS[e.fed].reg;
  const n=daysUntil(e.date);
  const rows=[['날짜',`${fmtRange(e)} · ${ddLabel(n)}`],['연맹',e.fed==='내일정'?'내 일정':e.fed],['장소',e['장소']],['참가비',e['참가비']],
    ['접수 마감',e['마감']?`${fmtMD(e['마감'])} · ${ddLabel(daysUntil(e['마감']))}`:null],['비고',e['비고']],
    ['접수처',reg?`<a href="${reg}" target="_blank" rel="noopener">${FEDS[e.fed].regName}</a>`:null]].filter(r=>r[1]);
  $('#sheet').innerHTML=`<div>${badge(e)}${e.major?'<span style="color:var(--star);font-weight:700">★ 메이저</span>':''}</div>
    <h3>${esc(title(e))}</h3>
    <dl>${rows.map(([k,v])=>`<dt>${k}</dt><dd>${k==='접수처'?v:esc(v)}</dd>`).join('')}</dl>
    <div class="btns">
      <button class="btn pri" id="sFav">${state.favs.has(e.id)?'♥ 관심 해제':'♡ 관심 대회'}</button>
      <button class="btn" id="sIcs">캘린더에 추가</button>

      <button class="btn" id="sClose">닫기</button>
    </div>`;
  $('#scrim').classList.add('open');$('#sheet').classList.add('open');
  $('#sFav').onclick=()=>{toggleFav(e.id);openSheet(e.id)};
  $('#sIcs').onclick=()=>downloadIcs(e);
  $('#sShare').onclick=()=>share(e);
  $('#sClose').onclick=closeSheet;
  const del=$('#sDel');if(del)del.onclick=()=>{if(confirm('이 일정을 삭제할까요?')){state.custom=state.custom.filter(c=>c.id!==e.id);LS.set('bb.custom',state.custom);state.favs.delete(e.id);saveFavs();closeSheet();render()}};
}
function closeSheet(){$('#scrim').classList.remove('open');$('#sheet').classList.remove('open')}

function saveFavs(){LS.set('bb.favs',[...state.favs])}
function toggleFav(id){state.favs.has(id)?state.favs.delete(id):state.favs.add(id);saveFavs();toast(state.favs.has(id)?'관심 대회에 추가':'관심 대회 해제');render()}

function icsDate(s,add=0){const d=toDate(s);d.setDate(d.getDate()+add);return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`}
function icsEsc(s){return String(s).replace(/[\\,;]/g,m=>'\\'+m).replace(/\n/g,'\\n')}
function downloadIcs(e){
  const desc=[e['참가비']&&`참가비 ${e['참가비']}`,e['마감']&&`접수 마감 ${e['마감']}`,e['비고'],'※ 출전 전 연맹 공지 확인'].filter(Boolean).join('\n');
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//bbcomp//KO','CALSCALE:GREGORIAN','BEGIN:VEVENT',
    `UID:${e.id}-${e.date}@ynschoi.github.io`,`DTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').slice(0,15)}Z`,
    `DTSTART;VALUE=DATE:${icsDate(e.date)}`,`DTEND;VALUE=DATE:${icsDate(endOf(e),1)}`,
    `SUMMARY:${icsEsc(title(e))}`, e['장소']?`LOCATION:${icsEsc(e['장소'])}`:null, `DESCRIPTION:${icsEsc(desc)}`,
    'BEGIN:VALARM','TRIGGER:-P7D','ACTION:DISPLAY','DESCRIPTION:대회 1주 전','END:VALARM',
    'END:VEVENT','END:VCALENDAR'].filter(Boolean).join('\r\n');
  const blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${e.date}_${title(e).replace(/[\/\\:*?"<>| ]+/g,'_')}.ics`;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
async function share(e){
  const text=`🏆 ${title(e)}\n📅 ${YEAR}.${fmtRange(e)}${e['장소']?`\n📍 ${e['장소']}`:''}${e['참가비']?`\n💰 ${e['참가비']}`:''}`;
  try{ if(navigator.share){await navigator.share({title:title(e),text,url:location.href});return}
       await navigator.clipboard.writeText(text+'\n'+location.href);toast('복사했어요'); }catch(err){}
}
let tt;function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1400)}

function setTab(t){state.tab=t;document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));render();window.scrollTo(0,0)}
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
$('#q').oninput=e=>{state.q=e.target.value;render()};
$('#fedChips').onclick=e=>{const b=e.target.closest('[data-fed]');if(!b)return;const f=b.dataset.fed;
  if(!f)state.feds.clear();else state.feds.has(f)?state.feds.delete(f):state.feds.add(f);render()};
$('#tUpcoming').onclick=()=>{state.upcoming=!state.upcoming;LS.set('bb.upcoming',state.upcoming);render()};
$('#tMajor').onclick=()=>{state.major=!state.major;render()};
$('#tFav').onclick=()=>{state.favOnly=!state.favOnly;render()};
$('#view').addEventListener('click',e=>{
  const fav=e.target.closest('[data-fav]');if(fav){e.stopPropagation();toggleFav(fav.dataset.fav);return}
  const cell=e.target.closest('[data-day]');if(cell){state.calSel=cell.dataset.day;render();return}
  const ev=e.target.closest('.ev');if(ev)openSheet(ev.dataset.id);
});
$('#scrim').onclick=closeSheet;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

render();
</script>
</body>
</html>
