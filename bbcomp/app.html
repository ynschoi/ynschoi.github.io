<title>보디빌딩 대회일정</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 한 열 모바일 우선. 주말(토·일) 단위 섹션 → 촘촘한 행. 상단 '마감 임박' 가로 띠, 하단 고정 탭.
   Palette: 무대 조명 아래 탄(tan) — 따뜻한 종이색 바탕, 잉크 남색 글자, 브론즈 강조, 마감 경고는 붉은 주황 */
:root{
  --bg:#f6f3ee; --surface:#fffdf9; --surface2:#efe9e0; --line:#e2dacd;
  --ink:#1b2233; --muted:#6b6f7a; --accent:#a55a1f; --accent-soft:#f3e3d3; --accent-ink:#fff8f0;
  --warn:#c2410c; --warn-soft:#fde4d6; --ok:#2f7d4f; --ok-soft:#dcefe3; --off:#9aa0a8;
  --f-body:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151d; --surface:#1a1e28; --surface2:#232836; --line:#2d3342;
  --ink:#ece8e1; --muted:#9aa0ad; --accent:#e09a5f; --accent-soft:#3a2c21; --accent-ink:#1a1209;
  --warn:#ff8a5c; --warn-soft:#3d2219; --ok:#6fcf97; --ok-soft:#1d3327; --off:#6b7180; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151d; --surface:#1a1e28; --surface2:#232836; --line:#2d3342;
  --ink:#ece8e1; --muted:#9aa0ad; --accent:#e09a5f; --accent-soft:#3a2c21; --accent-ink:#1a1209;
  --warn:#ff8a5c; --warn-soft:#3d2219; --ok:#6fcf97; --ok-soft:#1d3327; --off:#6b7180; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.wrap{max-width:720px;margin:0 auto}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* header */
header{padding-block:18px 6px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
header h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
header .upd{font-size:12px;color:var(--muted)}
.scope{display:inline-flex;background:var(--surface2);border-radius:999px;padding:3px;flex:none}
.scope button{border:0;background:none;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted);font-weight:600}
.scope button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* 마감 임박 띠 */
.dl{margin-top:12px}
.dl h2{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;margin:0 0 6px}
.dl-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-inline:-4px;padding-inline:4px}
.dl-row::-webkit-scrollbar{display:none}
.dl-card{flex:none;width:168px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:9px 11px;text-align:left}
.dl-card .d{font-family:var(--f-mono);font-weight:600;color:var(--warn);font-size:13px}
.dl-card .n{font-weight:600;font-size:14px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl-card .s{font-size:12px;color:var(--muted)}

/* 검색·필터 바 */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;margin-top:6px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar-row{display:flex;gap:8px}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 10px}
.search input{flex:1;min-width:0;border:0;background:none;padding:9px 0;outline:none}
.search svg{flex:none;color:var(--muted)}
.fbtn{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 12px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}
.fbtn .cnt{background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:11px;min-width:18px;height:18px;display:inline-grid;place-items:center;padding:0 5px}
.active{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.active:empty{display:none}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12.5px;display:inline-flex;align-items:center;gap:4px}
.pill.x::after{content:"×";color:var(--muted);font-size:14px;line-height:1}
.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.summary{font-size:12px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between;gap:8px}
.summary button{border:0;background:none;color:var(--accent);font-size:12px;padding:0}

/* 목록 */
.wk{margin-top:18px}
.wk-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.wk-h h3{margin:0;font-size:15px;font-weight:700}
.wk-h h3 small{font-weight:500;color:var(--muted);font-size:12.5px;margin-left:6px}
.wk-h .c{font-size:12px;color:var(--muted)}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:start;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.row:hover{background:var(--surface)}
.row.past{opacity:.5}
.date{text-align:center;line-height:1.1}
.date b{display:block;font-family:var(--f-mono);font-size:19px;font-weight:600}
.date span{font-size:11.5px;color:var(--muted)}
.date .sat{color:#3d6fd6}.date .sun{color:#d14b4b}
.mid{min-width:0}
.t{font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap;word-break:keep-all}
.fed{font-size:10.5px;font-weight:700;letter-spacing:.02em;border-radius:5px;padding:1px 6px;background:var(--surface2);color:var(--ink);white-space:nowrap}
.tg{font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 6px;white-space:nowrap}
.tg.pq{background:var(--accent-soft);color:var(--accent)}.tg.pro{background:var(--ink);color:var(--bg)}.tg.top{background:var(--warn);color:var(--bg)}.tg.nat{background:var(--ok-soft);color:var(--ok)}
.sub{font-size:12.5px;color:var(--muted);margin-top:2px;word-break:keep-all}
.divs{font-size:12px;color:var(--accent);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.st{font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap;font-family:var(--f-mono)}
.st.open{background:var(--ok-soft);color:var(--ok)}
.st.soon{background:var(--warn-soft);color:var(--warn)}
.st.closed{background:var(--surface2);color:var(--muted)}
.st.ended{background:none;color:var(--off)}
.heart{border:0;background:none;padding:2px;color:var(--off);line-height:0}
.heart[aria-pressed="true"]{color:var(--warn)}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.more{display:block;margin:18px auto 0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-size:13px}

/* 달력 */
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
.cal-h h3{margin:0;font-size:17px}
.cal-h button{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:38px;height:34px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-top:10px}
.wd{text-align:center;font-size:11.5px;color:var(--muted);padding-bottom:2px}
.cell{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-height:54px;padding:3px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.cell.blank{border:0;background:none}
.cell .n{font-family:var(--f-mono);font-size:12.5px}
.cell.today .n{background:var(--ink);color:var(--bg);border-radius:5px;padding:0 4px}
.cell.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cell .k{font-size:11px;font-weight:700;color:var(--accent)}
.cell .bars{display:flex;flex-direction:column;gap:2px;width:100%;padding:0 3px}
.cell .bar1{height:3px;border-radius:2px;background:var(--accent);opacity:.85}

/* 시트 */
.scrim{position:fixed;inset:0;background:rgba(10,12,18,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:18px 18px 0 0;max-height:88vh;overflow:auto;
  padding:16px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));
  max-width:720px;margin:0 auto;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h2{margin:4px 0 2px;font-size:21px;line-height:1.25;text-wrap:balance;word-break:keep-all}
.kv{display:grid;grid-template-columns:76px 1fr;gap:7px 10px;margin:14px 0;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;word-break:keep-all;min-width:0;overflow-wrap:anywhere}
.sec{margin-top:14px}
.sec h4{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:600}
.dgroup{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:13.5px;padding:6px 0;border-top:1px dashed var(--line)}
.dgroup:first-of-type{border-top:0}
.dgroup b{font-weight:600}
.dgroup span{color:var(--muted);word-break:keep-all}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:11px;padding:11px;text-align:center;text-decoration:none;color:var(--ink);font-weight:600;font-size:14px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.fgroup{margin-top:14px}
.fgroup h4{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.chip small{color:var(--muted);margin-left:3px}
.chip[aria-pressed="true"] small{color:inherit;opacity:.7}

/* 탭 */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);display:flex;
  padding:0 max(0px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(0px,env(safe-area-inset-left,0px))}
nav.tabs button{flex:1;border:0;background:none;padding:9px 0 11px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;z-index:30}
.src{font-size:12.5px;color:var(--muted)}
.src-row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.src-row span:last-child{white-space:nowrap}
.bad{color:var(--warn)}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>보디빌딩 대회일정</h1>
      <div class="upd" id="upd">불러오는 중</div>
    </div>
    <div class="scope" role="group" aria-label="지역">
      <button id="scKR" aria-pressed="true">국내</button>
      <button id="scWW" aria-pressed="false">해외</button>
    </div>
  </header>

  <section class="dl" id="dl" hidden>
    <h2>접수 마감 임박</h2>
    <div class="dl-row" id="dlRow"></div>
  </section>

  <div class="bar" id="bar">
    <div class="bar-row">
      <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="대회명·지역·장소" autocomplete="off"></label>
      <button class="fbtn" id="openF"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5h18M6 12h12M10 19h4"/></svg>필터<span class="cnt" id="fcnt" hidden></span></button>
    </div>
    <div class="active" id="active"></div>
    <div class="summary"><span id="count"></span><span style="display:flex;gap:12px"><button id="togWW" hidden></button><button id="togPast"></button></span></div>
  </div>

  <main id="view"></main>
</div>

<nav class="tabs" aria-label="보기">
  <button data-tab="list" aria-current="page"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>일정</button>
  <button data-tab="cal"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>달력</button>
  <button data-tab="fav"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>관심</button>
  <button data-tab="info"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>출처</button>
</nav>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ───────── 상수 ───────── */
const FED_LABEL={ 'IFBB PRO':'IFBB PRO', 'NPC WW':'NPC 해외' };
const FED_GROUPS=[ // 필터에 보일 연맹 묶음
  ['PCA·NPCA',['PCA','NPCA']], ['WNGP·MUSA',['WNGP','MUSA']], ['ANBC',['ANBC']], ['BOB',['BOB']],
  ['NPC',['NPC','AGP']], ['IFBB PRO',['IFBB PRO']], ['NPC 해외',['NPC WW']], ['NABBA',['NABBA']],
  ['AFEX',['AFEX']], ['아고나스',['AGONAS']], ['케이클래식',['케이클래식']], ['원클래식',['ONECLASSIC']],
  ['ICN',['ICN']], ['NAC',['NAC']], ['WNBF',['WNBF']], ['머슬마니아',['MUSCLEMANIA']],
  ['몬스터짐',['몬스터짐']], ['KBBF',['KBBF']], ['WNC',['WNC']], ['기타',['기타']],
];
// 종목 분류: 순서대로 첫 매칭
const DIV_CATS=[
  ['클래식보디빌딩',/클래식\s*보디|classic\s*body/i],
  ['클래식피지크',/클래식\s*피지크|classic\s*phys/i],
  ['우먼스피지크',/우먼스?\s*피지크|여자\s*피지크|women'?s\s*phys/i],
  ['보디빌딩',/보디\s*빌딩|bodybuild/i],
  ['맨즈피지크',/피지크|physique/i],
  ['비키니',/비키니|bikini/i],
  ['웰니스',/웰니스|wellness/i],
  ['피규어',/피규어|figure/i],
  ['스포츠모델',/스포츠\s*모델|sports?\s*model/i],
  ['머슬모델',/머슬\s*모델|muscle\s*model/i],
  ['피트니스모델',/피트니스\s*모델|핏\s*모델|fitness\s*model|fit\s*model/i],
  ['피트니스',/피트니스|fitness/i],
  ['미즈·모델',/미즈|모델|model/i],
];
const WD='일월화수목금토';
const DIV_SHORT={'클래식보디빌딩':'클보','클래식피지크':'클피','우먼스피지크':'우피','보디빌딩':'보디','맨즈피지크':'피지크','스포츠모델':'스모','피트니스모델':'핏모','미즈·모델':'모델'};

/* ───────── 저장소 (뷰어 브라우저에만) ───────── */
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
          set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ───────── 상태 ───────── */
const S={
  tab:'list', scope:LS.get('bb.scope','KR'), q:'',
  feds:new Set(LS.get('bb.feds',[])), divs:new Set(LS.get('bb.divs',[])), openOnly:LS.get('bb.openOnly',false),
  showPast:false, wwAll:false, kinds:new Set(), favs:new Set(LS.get('bb.favs',[])), cal:null, calSel:null, limit:60,
};
let DATA={events:[],sources:{},generated:null}, EV=[];

const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const TODAY=ymd(new Date());
const toD=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addD=(s,n)=>{const d=toD(s);d.setDate(d.getDate()+n);return ymd(d)};
const diff=s=>Math.round((toD(s)-toD(TODAY))/864e5);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const endOf=e=>e.end||e.date;
const md=s=>{const d=toD(s);return `${d.getMonth()+1}.${pad(d.getDate())}`};
const mdw=s=>{const d=toD(s);return `${md(s)}(${WD[d.getDay()]})`};
const range=e=>e.end?`${mdw(e.date)}–${mdw(e.end)}`:mdw(e.date);
const fedName=f=>FED_LABEL[f]||f;
const title=e=>{const n=e.name||'';const f=fedName(e.fed);return (e.fed==='기타'||n.toUpperCase().startsWith(String(e.fed).toUpperCase()))?n:`${f} ${n}`};

function catOf(d){for(const[c,re] of DIV_CATS) if(re.test(d)) return c; return '기타 종목'}
function prep(e){
  const cats={};
  (e.divisions||[]).forEach(d=>{const c=catOf(d);(cats[c]=cats[c]||[]).push(d)});
  e._cats=cats; e._catList=Object.keys(cats);
  e._ww=e.country&&e.country!=='KR';
  const nm=(e.name||'');
  e._lv = e.fed==='IFBB PRO' ? (/olympia|arnold classic/i.test(nm)&&!/amateur/i.test(nm)?'top':'pro')
        : (/퀄리파이어|qualifier|아마추어 올림피아|amateur olympia/i.test(nm)||e.proCards) ? 'pq' : null;
  e._nat = /natural|내추럴|네추럴/i.test(nm) || ['ANBC','WNBF'].includes(e.fed);
  e._hay=[title(e),e.place,e.city,e.country,e.host,(e.divisions||[]).join(' ')].join(' ').toLowerCase();
  return e;
}
function status(e){
  if(endOf(e)<TODAY) return {k:'ended',t:'종료'};
  if(e.closed) return {k:'closed',t:'접수마감'};
  if(e.deadline){const n=diff(e.deadline);
    if(n<0) return {k:'closed',t:'접수마감'};
    if(n<=7) return {k:'soon',t:n===0?'오늘 마감':`마감 D-${n}`};
    return {k:'open',t:`접수 ~${md(e.deadline)}`};}
  const n=diff(e.date); return {k:'open',t:n===0?'D-DAY':`D-${n}`};
}

/* ───────── 필터 ───────── */
function fedMatch(e){
  if(!S.feds.size) return true;
  for(const g of S.feds){const grp=FED_GROUPS.find(x=>x[0]===g);if(grp&&grp[1].includes(e.fed))return true;
    if(g==='기타'&&!FED_GROUPS.some(x=>x[1].includes(e.fed)))return true;}
  return false;
}
const LV={pq:'프로카드',pro:'프로쇼',top:'메이저'};
function tagsHtml(e){return (e._lv?`<span class="tg ${e._lv}">${LV[e._lv]}</span>`:'')+(e._nat?'<span class="tg nat">내추럴</span>':'')}
// 해외는 기본으로 프로 퀄리파이어·프로쇼·메이저만 (각국 지역 대회는 '전체 보기'로)
function base(){ return EV.filter(e=>(S.scope==='WW')===e._ww && (S.scope!=='WW'||S.wwAll||e._lv)) }
function filtered(opts={}){
  const q=S.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  return base().filter(e=>{
    if(!opts.keepPast && !S.showPast && endOf(e)<TODAY) return false;
    if(!fedMatch(e)) return false;
    if(S.kinds.size && !((e._lv&&S.kinds.has(e._lv==='top'?'pro':e._lv))||(e._nat&&S.kinds.has('nat')))) return false;
    if(S.divs.size && !e._catList.some(c=>S.divs.has(c))) return false;
    if(S.openOnly){const s=status(e).k;if(s!=='open'&&s!=='soon')return false;}
    if(q.length && !q.every(w=>e._hay.includes(w))) return false;
    return true;
  });
}

/* ───────── 렌더: 공통 ───────── */
const heartSvg=on=>`<svg width="18" height="18" viewBox="0 0 24 24" fill="${on?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>`;
function divSummary(e){
  let c=e._catList.filter(x=>x!=='기타 종목');
  if(!c.length) return '';
  if(S.divs.size) c=[...c.filter(x=>S.divs.has(x)),...c.filter(x=>!S.divs.has(x))]; // 내 종목 먼저
  const s=c.map(x=>DIV_SHORT[x]||x);
  return `종목 ${(e.divisions||[]).length} · `+s.slice(0,5).join(' ')+(s.length>5?` +${s.length-5}`:'');
}
function rowHtml(e){
  const d=toD(e.date),w=d.getDay(),st=status(e),fav=S.favs.has(e.id);
  const sub=[e.end?range(e):null,e._ww?[e.city,e.country].filter(Boolean).join(', '):null,e.place||(e._ww?null:'장소 추후 공지'),e.fee].filter(Boolean).map(esc).join(' · ');
  const dv=divSummary(e);
  return `<div class="row${st.k==='ended'?' past':''}" data-id="${esc(e.id)}" role="button" tabindex="0">
    <div class="date"><b>${d.getDate()}</b><span class="${w===6?'sat':w===0?'sun':''}">${WD[w]}</span></div>
    <div class="mid"><div class="t"><span class="fed">${esc(fedName(e.fed))}</span>${tagsHtml(e)}${esc(title(e).replace(new RegExp('^'+fedName(e.fed).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*'),'')||title(e))}</div>
      ${sub?`<div class="sub">${sub}</div>`:''}${dv?`<div class="divs">${esc(dv)}</div>`:''}</div>
    <div class="right"><span class="st ${st.k}">${esc(st.t)}</span>
      <button class="heart" data-fav="${esc(e.id)}" aria-pressed="${fav}" aria-label="관심 대회">${heartSvg(fav)}</button></div></div>`;
}
// 주말 묶음: 토요일 기준. 일요일은 전날 토요일 그룹, 평일은 그 주 토요일 그룹
function weekKey(s){const d=toD(s),w=d.getDay();const sat=new Date(d);sat.setDate(d.getDate()+(w===0?-1:6-w));return ymd(sat)}
function weekLabel(sat){
  const n=diff(sat);
  const rel=n>=-1&&n<=5?'이번 주말':n>5&&n<=12?'다음 주말':null;
  const d=toD(sat);const wom=Math.ceil(d.getDate()/7);
  return `${rel?rel:`${d.getMonth()+1}월 ${wom}주`}<small class="mono">${md(sat)}–${md(addD(sat,1))}</small>`;
}
function listHtml(list){
  if(!list.length) return `<div class="empty">조건에 맞는 대회가 없어요.<br>필터를 줄이거나 지난 대회를 포함해 보세요.</div>`;
  const shown=list.slice(0,S.limit);
  const g=new Map();shown.forEach(e=>{const k=weekKey(e.date);if(!g.has(k))g.set(k,[]);g.get(k).push(e)});
  let h='';let lastMonth=null;
  g.forEach((es,k)=>{
    h+=`<section class="wk"><div class="wk-h"><h3>${weekLabel(k)}</h3><span class="c">${es.length}개</span></div>${es.map(rowHtml).join('')}</section>`;
  });
  if(list.length>S.limit) h+=`<button class="more" id="more">${list.length-S.limit}개 더 보기</button>`;
  return h;
}

/* ───────── 렌더: 화면별 ───────── */
function renderDeadlines(){
  const soon=base().filter(e=>{if(!e.deadline||e.closed)return false;const n=diff(e.deadline);return n>=0&&n<=14}).sort((a,b)=>a.deadline.localeCompare(b.deadline));
  $('#dl').hidden=!soon.length||S.tab!=='list';
  $('#dlRow').innerHTML=soon.map(e=>{const n=diff(e.deadline);
    return `<button class="dl-card" data-id="${esc(e.id)}"><div class="d">${n===0?'오늘 마감':`마감 D-${n}`} · ${md(e.deadline)}</div>
      <div class="n">${esc(title(e))}</div><div class="s">대회 ${mdw(e.date)}${e.fee?` · ${esc(e.fee)}`:''}</div></button>`}).join('');
}
function renderBar(){
  const show=S.tab==='list'||S.tab==='cal';
  $('#bar').hidden=!show;
  const n=S.feds.size+S.divs.size+S.kinds.size+(S.openOnly?1:0);
  $('#fcnt').hidden=!n;$('#fcnt').textContent=n;

    [...S.kinds].map(k=>`<button class="pill x" data-rm-kind="${k}">${({pq:'프로카드',pro:'프로쇼·메이저',nat:'내추럴'})[k]}</button>`).join('')+
    (S.openOnly?`<button class="pill x" data-rm-open>접수 가능만</button>`:'');
  $('#togPast').textContent=S.showPast?'지난 대회 숨기기':'지난 대회 보기';
  $('#togWW').hidden=S.scope!=='WW';$('#togWW').textContent=S.wwAll?'중요 대회만':'지역 대회까지 전체';
  $('#scKR').setAttribute('aria-pressed',S.scope==='KR');$('#scWW').setAttribute('aria-pressed',S.scope==='WW');
}
function renderList(){
  const list=filtered();
  $('#count').textContent=`${list.length}개 대회`;
  $('#view').innerHTML=listHtml(list);
}
function renderCal(){
  const list=filtered({keepPast:true});
  $('#count').textContent=`${list.length}개 대회`;
  if(!S.cal){const t=toD(TODAY);S.cal=[t.getFullYear(),t.getMonth()+1]}
  const [y,m]=S.cal, first=new Date(y,m-1,1), days=new Date(y,m,0).getDate();
  const by=new Map();
  list.forEach(e=>{let d=toD(e.date);const z=toD(endOf(e));while(d<=z){const k=ymd(d);if(!by.has(k))by.set(k,[]);by.get(k).push(e);d.setDate(d.getDate()+1)}});
  let g=[...WD].map((w,i)=>`<div class="wd" style="${i===0?'color:#d14b4b':i===6?'color:#3d6fd6':''}">${w}</div>`).join('');
  for(let i=0;i<first.getDay();i++) g+='<div class="cell blank"></div>';
  for(let d=1;d<=days;d++){
    const k=`${y}-${pad(m)}-${pad(d)}`,es=by.get(k)||[];
    g+=`<button class="cell${k===TODAY?' today':''}${k===S.calSel?' sel':''}" data-day="${k}" aria-label="${m}월 ${d}일 ${es.length}개 대회">
      <span class="n">${d}</span>${es.length?`<span class="k">${es.length}</span><span class="bars">${es.slice(0,3).map(()=>'<i class="bar1"></i>').join('')}</span>`:''}</button>`;
  }
  const sel=S.calSel&&S.calSel.startsWith(`${y}-${pad(m)}`)?S.calSel:null;
  const selEs=sel?(by.get(sel)||[]):[];
  $('#view').innerHTML=`<div class="cal-h"><button id="pm" aria-label="이전 달">‹</button><h3>${y}년 ${m}월</h3><button id="nm" aria-label="다음 달">›</button></div>
    <div class="grid">${g}</div>
    <div style="margin-top:10px">${sel?(selEs.length?`<div class="wk-h"><h3>${mdw(sel)}</h3><span class="c">${selEs.length}개</span></div>${selEs.map(rowHtml).join('')}`:`<div class="empty">${mdw(sel)} 대회 없음</div>`):'<div class="empty" style="padding:18px 0">날짜를 누르면 그날 대회가 보여요</div>'}</div>`;
  $('#pm').onclick=()=>{S.cal=m===1?[y-1,12]:[y,m-1];S.calSel=null;render()};
  $('#nm').onclick=()=>{S.cal=m===12?[y+1,1]:[y,m+1];S.calSel=null;render()};
}
function renderFav(){
  const list=EV.filter(e=>S.favs.has(e.id)).sort((a,b)=>a.date.localeCompare(b.date));
  const up=list.filter(e=>endOf(e)>=TODAY),past=list.filter(e=>endOf(e)<TODAY);
  $('#view').innerHTML=`<section class="wk"><div class="wk-h"><h3>관심 대회</h3><span class="c">${up.length}개 예정</span></div>
    ${up.length?up.map(rowHtml).join(''):'<div class="empty">대회 목록에서 ♡를 눌러 관심 대회를 모아두세요.<br>이 브라우저에만 저장됩니다.</div>'}</section>
    ${past.length?`<section class="wk"><div class="wk-h"><h3>지난 관심 대회</h3><span class="c">${past.length}개</span></div>${past.map(rowHtml).join('')}</section>`:''}`;
}
function renderInfo(){
  const src=Object.entries(DATA.sources||{});
  const gen=DATA.generated?DATA.generated.replace('T',' ').slice(0,16):'-';
  $('#view').innerHTML=`<section class="wk"><div class="wk-h"><h3>데이터 출처</h3><span class="c">${EV.length}개 대회</span></div>
    <p class="src">각 연맹·협회의 공식 접수 페이지를 매주 월요일 자동으로 다시 읽어 옵니다. IFBB 프로쇼만 비공식 일정 모음(fitnessvolt.com)에서 가져옵니다. 마지막 수집 <span class="mono">${esc(gen)}</span>.</p>
    ${src.map(([k,s])=>`<div class="src-row"><span>${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a>`:esc(s.label)}</span>
      <span class="mono">${s.count}건 ${s.ok?'':'<span class="bad">· 최근 수집 실패</span>'}</span></div>`).join('')}
    <p class="src" style="margin-top:12px">일정·장소·참가비는 주최 측 사정으로 바뀔 수 있어요. 출전 전에는 대회 상세의 ‘원문’ 링크로 꼭 확인하세요.</p></section>`;
}
function render(){
  renderBar();renderDeadlines();
  ({list:renderList,cal:renderCal,fav:renderFav,info:renderInfo})[S.tab]();
  const mb=$('#more');if(mb)mb.onclick=()=>{S.limit+=80;render()};
}

/* ───────── 상세 시트 ───────── */
function gcalUrl(e){
  const f=s=>s.replace(/-/g,'');
  const p=new URLSearchParams({action:'TEMPLATE',text:title(e),dates:`${f(e.date)}/${f(addD(endOf(e),1))}`,
    details:[e.fee&&`참가비 ${e.fee}`,e.deadline&&`접수 마감 ${e.deadline}`,e.url&&`원문 ${e.url}`].filter(Boolean).join('\n'),
    location:[e.place,e.city].filter(Boolean).join(', ')});
  return 'https://calendar.google.com/calendar/render?'+p.toString();
}
function openSheet(id){
  const e=EV.find(x=>x.id===id);if(!e)return;
  const st=status(e),fav=S.favs.has(e.id),n=diff(e.date);
  const rows=[
    ['일정',`${range(e)} · ${n>0?`D-${n}`:n===0?'D-DAY':'종료'}`],
    ['장소',[e.place,e.city,e._ww?e.country:null].filter(Boolean).join(', ')||'추후 공지'],
    ['참가비',e.fee],
    ['접수 마감',e.deadline?`${mdw(e.deadline)} · ${st.t}`:null],
    ['주최',e.host],
    ['출처',e.unofficial?'fitnessvolt.com (비공식 일정 모음 · 주최 측 공지 확인 필요)':null],
  ].filter(r=>r[1]);
  const cats=Object.entries(e._cats||{});
  const reOf=c=>(DIV_CATS.find(x=>x[0]===c)||[])[1];
  const shorten=(c,items)=>items.map(d=>{const re=reOf(c);return (re?d.replace(re,''):d).replace(/^[\s\-·:]+/,'').trim()||d}).join(', ');
  $('#sheet').innerHTML=`<div class="grab"></div>
    <div style="display:flex;gap:6px;align-items:center"><span class="fed">${esc(fedName(e.fed))}</span><span class="st ${st.k}">${esc(st.t)}</span>${tagsHtml(e)}</div>
    <h2>${esc(title(e))}</h2>
    <dl class="kv">${rows.map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
    ${cats.length?`<div class="sec"><h4>종목 · ${(e.divisions||[]).length}개</h4>${cats.map(([c,items])=>`<div class="dgroup"><b>${esc(c)}</b><span>${esc(shorten(c,items))}</span></div>`).join('')}</div>`:''}
    ${e.qualification?`<div class="sec"><h4>참가 자격</h4><div style="font-size:14px">${esc(e.qualification)}</div></div>`:''}
    ${e.proCards?`<div class="sec"><h4>프로카드</h4><div style="font-size:14px">${esc(e.proCards)}</div></div>`:''}
    <div class="acts">
      ${e.regUrl&&st.k!=='ended'&&st.k!=='closed'?`<a class="btn pri" href="${esc(e.regUrl)}" target="_blank" rel="noopener">접수하러 가기</a>`:''}
      ${e.url?`<a class="btn" href="${esc(e.url)}" target="_blank" rel="noopener">원문 보기</a>`:''}
      <a class="btn" href="${esc(gcalUrl(e))}" target="_blank" rel="noopener">구글 캘린더</a>
      <button class="btn" id="sCopy">일정 복사</button>
      <button class="btn" id="sFav" aria-pressed="${fav}">${fav?'관심 해제':'관심 대회'}</button>
      <button class="btn" id="sClose">닫기</button>
    </div>`;
  $('#scrim').hidden=false;$('#sheet').hidden=false;$('#sheet').scrollTop=0;
  $('#sFav').onclick=()=>{toggleFav(e.id);openSheet(e.id)};
  $('#sClose').onclick=closeSheet;
  $('#sCopy').onclick=()=>{
    const t=`${title(e)}\n${range(e)}${e.place?`\n${e.place}`:''}${e.fee?`\n참가비 ${e.fee}`:''}${e.deadline?`\n접수 마감 ${mdw(e.deadline)}`:''}${e.url?`\n${e.url}`:''}`;
    navigator.clipboard.writeText(t).then(()=>toast('일정을 복사했어요'),()=>toast('복사하지 못했어요'));
  };
}
function closeSheet(){$('#scrim').hidden=true;$('#sheet').hidden=true}

function filterSheet(){
  const pool=base();
  const fedCount=g=>pool.filter(e=>{const grp=FED_GROUPS.find(x=>x[0]===g);return grp[1].includes(e.fed)||(g==='기타'&&!FED_GROUPS.some(x=>x[1].includes(e.fed)))}).length;
  const groups=FED_GROUPS.map(g=>[g[0],fedCount(g[0])]).filter(g=>g[1]);
  const catCount={};pool.forEach(e=>e._catList.forEach(c=>catCount[c]=(catCount[c]||0)+1));
  const cats=DIV_CATS.map(c=>c[0]).filter(c=>catCount[c]);
  $('#sheet').innerHTML=`<div class="grab"></div><h2>필터</h2>
    <div class="fgroup"><h4>접수</h4><div class="chips"><button class="chip" data-f-open aria-pressed="${S.openOnly}">접수 가능한 대회만</button></div></div>
    <div class="fgroup"><h4>대회 성격</h4><div class="chips">
      ${[['pq','프로카드 (퀄리파이어)'],['pro','프로쇼·메이저'],['nat','내추럴 (도핑검사)']].map(([k,l])=>`<button class="chip" data-f-kind="${k}" aria-pressed="${S.kinds.has(k)}">${l}</button>`).join('')}</div></div>
    <div class="fgroup"><h4>내 종목 <span>종목 정보가 있는 대회만 걸러져요</span></h4><div class="chips">
      ${cats.map(c=>`<button class="chip" data-f-div="${esc(c)}" aria-pressed="${S.divs.has(c)}">${esc(c)}<small>${catCount[c]}</small></button>`).join('')||'<span class="src">종목 정보가 아직 없어요</span>'}</div></div>
    <div class="fgroup"><h4>연맹·협회</h4><div class="chips">
      ${groups.map(([g,c])=>`<button class="chip" data-f-fed="${esc(g)}" aria-pressed="${S.feds.has(g)}">${esc(g)}<small>${c}</small></button>`).join('')}</div></div>
    <div class="acts"><button class="btn" id="fReset">초기화</button><button class="btn pri" id="fDone">${filtered().length}개 대회 보기</button></div>`;
  $('#scrim').hidden=false;$('#sheet').hidden=false;
  $('#fReset').onclick=()=>{S.feds.clear();S.divs.clear();S.kinds.clear();S.openOnly=false;save();render();filterSheet()};
  $('#fDone').onclick=closeSheet;
}
$('#sheet').addEventListener('click',ev=>{
  const t=ev.target.closest('[data-f-fed],[data-f-div],[data-f-open],[data-f-kind]');if(!t)return;
  if(t.dataset.fFed!==undefined){const g=t.dataset.fFed;S.feds.has(g)?S.feds.delete(g):S.feds.add(g)}
  else if(t.dataset.fDiv!==undefined){const g=t.dataset.fDiv;S.divs.has(g)?S.divs.delete(g):S.divs.add(g)}
  else if(t.dataset.fKind!==undefined){const g=t.dataset.fKind;S.kinds.has(g)?S.kinds.delete(g):S.kinds.add(g)}
  else S.openOnly=!S.openOnly;
  save();render();filterSheet();
});

/* ───────── 이벤트 ───────── */
function save(){LS.set('bb.feds',[...S.feds]);LS.set('bb.divs',[...S.divs]);LS.set('bb.openOnly',S.openOnly);LS.set('bb.scope',S.scope)}
function toggleFav(id){S.favs.has(id)?S.favs.delete(id):S.favs.add(id);LS.set('bb.favs',[...S.favs]);toast(S.favs.has(id)?'관심 대회에 담았어요':'관심 대회에서 뺐어요');render()}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,1500)}
function setTab(t){S.tab=t;document.querySelectorAll('nav.tabs button').forEach(b=>b.toggleAttribute('aria-current',b.dataset.tab===t)||b.dataset.tab===t&&b.setAttribute('aria-current','page'));render();window.scrollTo(0,0)}
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
$('#q').oninput=e=>{S.q=e.target.value;S.limit=60;render()};
$('#openF').onclick=filterSheet;
$('#togPast').onclick=()=>{S.showPast=!S.showPast;render()};
$('#togWW').onclick=()=>{S.wwAll=!S.wwAll;S.limit=60;render()};
$('#scKR').onclick=()=>{S.scope='KR';S.feds.clear();S.limit=60;save();render()};
$('#scWW').onclick=()=>{S.scope='WW';S.feds.clear();S.limit=60;save();render()};
$('#active').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;
  if(b.dataset.rmFed)S.feds.delete(b.dataset.rmFed);else if(b.dataset.rmDiv)S.divs.delete(b.dataset.rmDiv);else if(b.dataset.rmKind)S.kinds.delete(b.dataset.rmKind);else S.openOnly=false;save();render()};
document.addEventListener('click',ev=>{
  const h=ev.target.closest('[data-fav]');if(h){ev.stopPropagation();toggleFav(h.dataset.fav);return}
  const c=ev.target.closest('[data-day]');if(c){S.calSel=c.dataset.day;render();return}
  const r=ev.target.closest('.row,.dl-card');if(r&&!ev.target.closest('#sheet'))openSheet(r.dataset.id);
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeSheet();
  if((ev.key==='Enter'||ev.key===' ')&&ev.target.classList&&ev.target.classList.contains('row')){ev.preventDefault();openSheet(ev.target.dataset.id)}});
$('#scrim').onclick=closeSheet;

/* ───────── 데이터 ───────── */
$('#view').innerHTML='<div class="empty">대회 일정을 불러오는 중…</div>';
fetch('data.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(d=>{
  DATA=d;EV=(d.events||[]).map(prep).sort((a,b)=>a.date.localeCompare(b.date));
  if(d.generated){$('#upd').textContent=`${md(d.generated.slice(0,10))} 업데이트 · 공식 사이트 ${Object.values(d.sources||{}).filter(s=>s.ok).length}곳`}
  if(!EV.some(e=>e._ww))$('.scope').hidden=true;
  render();
}).catch(err=>{$('#upd').textContent='';$('#view').innerHTML=`<div class="empty">일정을 불러오지 못했어요 (${esc(err.message)}).<br>잠시 후 새로고침해 주세요.</div>`});
</script>
