<title>BoCal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preload" href="fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin>
<style>@font-face{font-family:"Pretendard Variable";font-weight:45 920;font-style:normal;font-display:swap;src:url("fonts/PretendardVariable.woff2") format("woff2-variations")}</style>
<style>
/* Layout: 한 열 모바일 우선. 주말(토·일) 단위 섹션 → 촘촘한 행. 상단 '마감 임박' 가로 띠, 하단 고정 탭.
   Palette: 무대 조명 아래 탄(tan) — 따뜻한 종이색 바탕, 잉크 남색 글자, 브론즈 강조, 마감 경고는 붉은 주황 */
:root{
  --bg:#f6f3ee; --surface:#fffdf9; --surface2:#efe9e0; --line:#e2dacd;
  --ink:#1b2233; --muted:#6b6f7a; --accent:#a55a1f; --accent-soft:#f3e3d3; --accent-ink:#fff8f0;
  --warn:#c2410c; --warn-soft:#fde4d6; --ok:#2f7d4f; --ok-soft:#dcefe3; --off:#9aa0a8;
  --f-body:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --f-mono:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;  /* 숫자도 Pretendard, tabular-nums로 정렬 */
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151d; --surface:#1a1e28; --surface2:#232836; --line:#2d3342;
  --ink:#ece8e1; --muted:#9aa0ad; --accent:#e09a5f; --accent-soft:#3a2c21; --accent-ink:#1a1209;
  --warn:#ff8a5c; --warn-soft:#3d2219; --ok:#6fcf97; --ok-soft:#1d3327; --off:#6b7180; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151d; --surface:#1a1e28; --surface2:#232836; --line:#2d3342;
  --ink:#ece8e1; --muted:#9aa0ad; --accent:#e09a5f; --accent-soft:#3a2c21; --accent-ink:#1a1209;
  --warn:#ff8a5c; --warn-soft:#3d2219; --ok:#6fcf97; --ok-soft:#1d3327; --off:#6b7180; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-variant-numeric:tabular-nums;letter-spacing:-.01em;font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.wrap{max-width:720px;margin:0 auto}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* header */
header{padding-block:18px 6px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
header h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.brand{font-size:28px!important;font-weight:800!important;letter-spacing:-.03em!important;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.brand span{font-size:14px;font-weight:600;color:var(--muted);letter-spacing:0}
header .upd{font-size:12px;color:var(--muted)}
.scope{display:inline-flex;background:var(--surface2);border-radius:999px;padding:3px;flex:none}
.scope button{border:0;background:none;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted);font-weight:600}
.scope button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* 마감 임박 띠 */
.dl{margin-top:12px}
.dl h2{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;margin:0 0 6px}
.dl-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-inline:-4px;padding-inline:4px}
.dl-row::-webkit-scrollbar{display:none}
.dl-card{flex:none;width:168px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:9px 11px;text-align:left}
.dl-card .d{font-family:var(--f-mono);font-weight:600;color:var(--warn);font-size:13px}
.dl-card .n{font-weight:600;font-size:14px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl-card .s{font-size:12px;color:var(--muted)}

/* 검색·필터 바 */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;margin-top:6px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar-row{display:flex;gap:8px}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 10px}
.search input{flex:1;min-width:0;border:0;background:none;padding:9px 0;outline:none}
.search svg{flex:none;color:var(--muted)}
.fbtn{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 12px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}
.fbtn .cnt{background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:11px;min-width:18px;height:18px;display:inline-grid;place-items:center;padding:0 5px}
.active{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.active:empty{display:none}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12.5px;display:inline-flex;align-items:center;gap:4px}
.pill.x::after{content:"×";color:var(--muted);font-size:14px;line-height:1}
.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.summary{font-size:12px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between;gap:8px}
.summary button{border:0;background:none;color:var(--accent);font-size:12px;padding:0}

/* 목록 */
.wk{margin-top:18px}
.wk-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.wk-h h3{margin:0;font-size:15px;font-weight:700}
.wk-h h3 small{font-weight:500;color:var(--muted);font-size:12.5px;margin-left:6px}
.wk-h .c{font-size:12px;color:var(--muted)}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:start;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.row:hover{background:var(--surface)}
.row.past{opacity:.5}
.date{text-align:center;line-height:1.1}
.date b{display:block;font-family:var(--f-mono);font-size:19px;font-weight:600}
.date span{font-size:11.5px;color:var(--muted)}
.date .sat{color:#3d6fd6}.date .sun{color:#d14b4b}
.mid{min-width:0}
.t{font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap;word-break:keep-all}
.fed{font-size:10.5px;font-weight:700;letter-spacing:.02em;border-radius:5px;padding:1px 6px;background:var(--surface2);color:var(--ink);white-space:nowrap}
.tg{font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 6px;white-space:nowrap}
.star{color:#e09a00;font-size:15px;line-height:1}
.row.is-star .t{font-weight:700}
.tg.pq{background:var(--accent-soft);color:var(--accent)}.tg.pro{background:var(--ink);color:var(--bg)}.tg.top{background:var(--warn);color:var(--bg)}.tg.nat{background:var(--ok-soft);color:var(--ok)}
.sub{font-size:12.5px;color:var(--muted);margin-top:2px;word-break:keep-all}
.divs{font-size:12px;color:var(--accent);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.st{font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap;font-family:var(--f-mono)}
.st.open{background:var(--ok-soft);color:var(--ok)}
.st.soon{background:var(--warn-soft);color:var(--warn)}
.st.closed{background:var(--surface2);color:var(--muted)}
.st.ended{background:none;color:var(--off)}
.heart{border:0;background:none;padding:2px;color:var(--off);line-height:0}
.heart[aria-pressed="true"]{color:var(--warn)}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.more{display:block;margin:18px auto 0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-size:13px}

/* 달력 */
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
.cal-h h3{margin:0;font-size:17px}
.cal-h button{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:38px;height:34px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-top:10px}
.wd{text-align:center;font-size:11.5px;color:var(--muted);padding-bottom:2px}
.cell{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-height:54px;padding:3px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.cell.blank{border:0;background:none}
.cell .n{font-family:var(--f-mono);font-size:12.5px}
.cell.today .n{background:var(--ink);color:var(--bg);border-radius:5px;padding:0 4px}
.cell.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cell .k{font-size:11px;font-weight:700;color:var(--accent)}
.cell .bars{display:flex;flex-direction:column;gap:2px;width:100%;padding:0 3px}
.cell .bar1{height:3px;border-radius:2px;background:var(--accent);opacity:.85}

/* 시트 */
.scrim{position:fixed;inset:0;background:rgba(10,12,18,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:18px 18px 0 0;max-height:88vh;overflow:auto;
  padding:16px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));
  max-width:720px;margin:0 auto;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h2{margin:4px 0 2px;font-size:21px;line-height:1.25;text-wrap:balance;word-break:keep-all}
.kv{display:grid;grid-template-columns:76px 1fr;gap:7px 10px;margin:14px 0;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;word-break:keep-all;min-width:0;overflow-wrap:anywhere}
.sec{margin-top:14px}
.sec h4{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:600}
.dgroup{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:13.5px;padding:6px 0;border-top:1px dashed var(--line)}
.dgroup:first-of-type{border-top:0}
.dgroup b{font-weight:600}
.dgroup span{color:var(--muted);word-break:keep-all}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:11px;padding:11px;text-align:center;text-decoration:none;color:var(--ink);font-weight:600;font-size:14px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.fgroup{margin-top:14px}
.fgroup h4{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.chip small{color:var(--muted);margin-left:3px}
.chip[aria-pressed="true"] small{color:inherit;opacity:.7}

/* 탭 */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);display:flex;
  padding:0 max(0px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(0px,env(safe-area-inset-left,0px))}
nav.tabs button{flex:1;border:0;background:none;padding:9px 0 11px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;z-index:30}
.src{font-size:12.5px;color:var(--muted)}
.tg.chg{background:var(--warn-soft);color:var(--warn)}.tg.new{background:var(--ok-soft);color:var(--ok)}
.ghost{opacity:.55}.ghost .date b{font-weight:500}
.ghost-h{display:flex;align-items:baseline;justify-content:space-between;margin-top:26px;padding-bottom:6px;border-bottom:1px dashed var(--line)}
.ghost-h h3{margin:0;font-size:15px}.ghost-h small{color:var(--muted);font-size:12px}
.fedgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.fedcard{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:11px 12px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.fedcard b{font-size:15px}.fedcard span{font-size:12px;color:var(--muted)}
.fedcard .nx{font-size:12px;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmp-wrap{overflow-x:auto;margin-top:10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.cmp{border-collapse:collapse;width:100%;min-width:520px;font-size:13px}
.cmp th,.cmp td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.cmp th{font-size:11.5px;color:var(--muted);font-weight:600;background:var(--surface2)}
.cmp td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.cmp tr:last-child td{border-bottom:0}
.bar-in{display:inline-block;height:6px;border-radius:3px;background:var(--accent);vertical-align:middle;margin-right:6px;opacity:.75}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.links a{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:5px 11px;text-decoration:none;color:var(--ink);background:var(--surface2)}
.judge{display:grid;grid-template-columns:96px 1fr;gap:6px 10px;font-size:13.5px;padding:7px 0;border-top:1px dashed var(--line)}
.judge b{font-weight:600}.judge span{color:var(--muted);word-break:keep-all}
.share-prev{width:100%;max-width:360px;display:block;margin:10px auto;border-radius:10px;border:1px solid var(--line)}
.seg{display:inline-flex;background:var(--surface2);border-radius:999px;padding:3px;margin-top:8px}
.seg button{border:0;background:none;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600}
.sub-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.sub-row .a{display:flex;gap:6px;flex:none}
.sub-row .a a,.sub-row .a button{font-size:12px;border:1px solid var(--line);border-radius:8px;padding:4px 9px;background:var(--surface2);color:var(--ink);text-decoration:none}
.chg-row{font-size:13px;padding:7px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:44px 1fr;gap:8px}
.chg-row .w{font-family:var(--f-mono);color:var(--muted);font-size:12px}
.src-row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.src-row span:last-child{white-space:nowrap}
.bad{color:var(--warn)}
</style>

<div class="wrap">
  <header>
    <div>
      <h1 class="brand">BoCal<span>보디빌딩 대회 캘린더</span></h1>
      <div class="upd" id="upd">불러오는 중</div>
    </div>
    <div class="scope" role="group" aria-label="지역">
      <button id="scKR" aria-pressed="true">국내</button>
      <button id="scWW" aria-pressed="false">해외</button>
    </div>
  </header>

  <section class="dl" id="dl" hidden>
    <h2>접수 마감 임박</h2>
    <div class="dl-row" id="dlRow"></div>
  </section>

  <div class="bar" id="bar">
    <div class="bar-row">
      <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="대회명·지역·장소" autocomplete="off"></label>
      <button class="fbtn" id="openF"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5h18M6 12h12M10 19h4"/></svg>필터<span class="cnt" id="fcnt" hidden></span></button>
    </div>
    <div class="active" id="active"></div>
    <div class="summary"><span id="count"></span><span style="display:flex;gap:12px"><button id="togStar"></button><button id="togWW" hidden></button><button id="togPast"></button></span></div>
  </div>

  <main id="view"></main>
</div>

<nav class="tabs" aria-label="보기">
  <button data-tab="list" aria-current="page"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>일정</button>
  <button data-tab="cal"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>달력</button>
  <button data-tab="feds"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V9l8-5 8 5v11"/><path d="M9 20v-6h6v6"/></svg>단체</button>
  <button data-tab="fav"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>내 대회</button>
  <button data-tab="info"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>정보</button>
</nav>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ───────── 상수 ───────── */
const FED_LABEL={ 'IFBB PRO':'IFBB PRO', 'NPC WW':'NPC 해외' };
const FED_GROUPS=[ // 필터에 보일 연맹 묶음
  ['PCA·NPCA',['PCA','NPCA']], ['WNGP·MUSA',['WNGP','MUSA']], ['ANBC',['ANBC']], ['BOB',['BOB']],
  ['NPC',['NPC','AGP']], ['IFBB PRO',['IFBB PRO']], ['NPC 해외',['NPC WW']], ['NABBA',['NABBA']],
  ['AFEX',['AFEX']], ['아고나스',['AGONAS']], ['케이클래식',['케이클래식']], ['원클래식',['ONECLASSIC']],
  ['ICN',['ICN']], ['NAC',['NAC']], ['WNBF',['WNBF']], ['머슬마니아',['MUSCLEMANIA']],
  ['몬스터짐',['몬스터짐']], ['KBBF',['KBBF']], ['WNC',['WNC']], ['기타',['기타']],
];
// 종목 분류: 순서대로 첫 매칭
const DIV_CATS=[
  ['클래식보디빌딩',/클래식\s*보디|classic\s*body/i],
  ['클래식피지크',/클래식\s*피지크|classic\s*phys/i],
  ['우먼스피지크',/우먼스?\s*피지크|여자\s*피지크|women'?s\s*phys/i],
  ['보디빌딩',/보디\s*빌딩|bodybuild/i],
  ['맨즈피지크',/피지크|physique/i],
  ['비키니',/비키니|bikini/i],

function sname(e){

     .replace(/선발대회|선발전/,'선발').replace(/\s+\d\.\s.*$|\s*기\s*간\s*:.*$/,'')

    n=n.split(/\s+&\s+(?=[가-힣]|전국체)|\s\/\s|\s*\(/)[0].replace(/보디빌딩\s*(&\s*)?(피트니스)?\s*(대회|경기)?|피트니스\s*(선수권\s*)?대회|선수권대회|대회$/g,'')

function combineNames(fed,names){
  const f=fedName(fed);const parts=[...new Set(names.map(n=>n.startsWith(f+' ')?n.slice(f.length+1):n))];
  if(parts.length===1) return `${fed==='기타'?'':f+' '}${parts[0]}`;
  const fin=parts.find(p=>/^파이널/.test(p)), city=parts.find(p=>!/파이널/.test(p));
  if(fin&&city&&parts.length===2) return `${f} ${city}X${fin}`;
  const sp=parts.map(p=>p.split(' ')),last=sp[0][sp[0].length-1];
  if(sp.every(w=>w.length===2&&w[1]===last)) return `${f} ${sp.map(w=>w[0]).join('/')} ${last}`;
  // '아시안 챔피언십 (오픈 리저널)' 꼴: 앞부분이 같으면 괄호 안만 모은다
  const base=parts.map(p=>p.replace(/\s*\(.*\)$/,''));
  if(base.every(b=>b===base[0])){
    // 괄호 안 종류를 표처럼: '내추럴/오픈 리저널/프로퀄/프로쇼'

      .sort((a,b)=>(/프로쇼/.test(a)?1:0)-(/프로쇼/.test(b)?1:0));
    const out=[reg.length?`${reg.join('/')} 리저널`:null,...other].filter(Boolean);
    return `${f} ${base[0]} ${out.join('/')}`}
  return `${f} ${parts.join(' / ')}`;
}

const normName=(n,f)=>String(n||'').toLowerCase().replace(new RegExp('^\\s*'+String(f||'').toLowerCase().replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*'),'').replace(/20\d\d|제\s*\d+\s*회|\d+(st|nd|rd|th)?|[\s\-_·()\[\]#.&,]/g,'');
function lastYearOf(e){
  if(!HIST.length) return null;
  const k=normName(e.name,e.fed);let best=null,bd=99;
  for(const h of HIST){
    if(h.fed!==e.fed) continue;
    const dd=Math.abs((toD(addYear(h.date,1))-toD(e.date))/864e5);
    const hn=normName(h.name,h.fed);const same=hn===k||(k.length>1&&(hn.includes(k)||k.includes(hn)));
    if(same&&dd<60&&dd<bd){best=h;bd=dd}
  }
  return best;
}

function won(s){ // '180,000원' '39만원 (트루 노비스 24만원)' '14/17/20만원' → 가장 낮은 금액(원)
  if(!s) return null;
  // 종목 추가·중복 출전·트루 노비스 할인 금액은 빼고 '기본' 금액만 본다
  s=String(s).replace(/\([^)]*\)/g,' ').split(/[\/·,]\s*(?=종목\s*추가|추가|중복)|종목\s*추가|\+\s*\d/)[0];
  const v=[];
  for(const m of s.matchAll(/(\d[\d,]*(?:\.\d+)?)\s*(만\s*원|만|원)/g)){const n=parseFloat(m[1].replace(/,/g,''));v.push(m[2].startsWith('만')?n*10000:n)}
  const m2=s.match(/((?:\d+\/)+\d+)\s*만/); if(m2) m2[1].split('/').forEach(x=>v.push(+x*10000));
  const ok=v.filter(x=>x>=30000&&x<3000000);
  return ok.length?Math.min(...ok):null;
}
const man=n=>n==null?'-':(n%10000===0?`${n/10000}만`:`${(n/10000).toFixed(1)}만`);
function fedStats(){
  const by={};
  EV.filter(e=>!e._ww&&e.country==='KR'&&e.date.slice(0,4)===TODAY.slice(0,4)).forEach(e=>{
    const f=by[e.fed]=by[e.fed]||{fed:e.fed,n:0,up:0,fees:[],next:null,nat:0};
    f.n++; if(e._nat) f.nat++;
    const w=won(e.fee); if(w) f.fees.push(w);
    if(endOf(e)>=TODAY){f.up++; if(!f.next||e.date<f.next.date) f.next=e}
  });
  Object.values(by).forEach(f=>{f.min=f.fees.length?Math.min(...f.fees):null;f.max=f.fees.length?Math.max(...f.fees):null});
  return Object.values(by).sort((a,b)=>b.n-a.n);
}

function icsText(list){
  const f=s=>s.replace(/-/g,''), e_=s=>String(s).replace(/([\\,;])/g,'\\$1').replace(/\n/g,'\\n');
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//BoCal//KO','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  list.forEach(e=>{L.push('BEGIN:VEVENT',`UID:${e.id}@bbcomp`,`DTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').slice(0,15)}Z`,
    `DTSTART;VALUE=DATE:${f(e.date)}`,`DTEND;VALUE=DATE:${f(addD(endOf(e),1))}`,`SUMMARY:${e_(title(e))}`,
    `DESCRIPTION:${e_([e.fee&&`참가비 ${e.fee}`,e.deadline&&`접수 마감 ${e.deadline}`,e.url&&`원문 ${e.url}`].filter(Boolean).join('\n'))}`);
    const loc=[e.place,e.city].filter(Boolean).join(', ');if(loc)L.push(`LOCATION:${e_(loc)}`);
    if(e.deadline&&e.deadline>=TODAY){L.push('BEGIN:VALARM','TRIGGER:-P3D','ACTION:DISPLAY','DESCRIPTION:접수 마감 확인','END:VALARM')}
    L.push('END:VEVENT')});
  L.push('END:VCALENDAR');return L.join('\r\n');
}
function downloadIcs(list,name){
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([icsText(list)],{type:'text/calendar;charset=utf-8'}));
    a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);

async function drawYear(){
  const yr=TODAY.slice(0,4);

  // 같은 날 같은 단체 대회는 한 줄로 (표 방식)
  const groups=[];const gk={};
  const gfed=e=>/\bAGP\b/.test(e.name||'')?'AGP':e.fed;
  const gname=e=>gfed(e)==='AGP'?'AGP '+sname(e).replace(/^(NPC|IFBB PRO)\s+/,'').replace(/^AGP\s*/,''):sname(e);
  list.forEach(e=>{const k=gfed(e)+'|'+e.date;
    if(gk[k]){gk[k].names.push(gname(e));gk[k].star=gk[k].star||e._star;if(e.end>(gk[k].e.end||''))gk[k].e={...gk[k].e,end:e.end};return}
    gk[k]={e,g:gfed(e),names:[gname(e)],star:e._star};groups.push(gk[k])});
  const lines=groups.map(x=>({e:x.g==='AGP'?{...x.e,fed:'AGP'}:x.e,star:x.star,text:combineNames(x.g,x.names)}));
  const byM={};lines.forEach(l=>{const m=+l.e.date.slice(5,7);(byM[m]=byM[m]||[]).push(l)});
  const months=Object.keys(byM).map(Number).sort((a,b)=>a-b);
  const W=1080,H=SHARE.fmt==='story'?1920:1350;
  const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
  try{await Promise.all([document.fonts.load('700 60px "Pretendard Variable"'),document.fonts.load('500 20px "Pretendard Variable"')])}catch(e){}
  const F='"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif', M=F;
  const C={bg:'#fffdf9',ink:'#1b2233',mut:'#6b6f7a',acc:'#a55a1f',line:'#e2dacd',star:'#e09a00'};
  g.fillStyle=C.bg;g.fillRect(0,0,W,H);
  const pad=44;
  g.fillStyle=C.acc;g.fillRect(pad,70,W-pad*2,4);
  g.fillStyle=C.ink;g.font=`700 64px ${F}`;g.textAlign='center';g.fillText(`${yr} 대회일정`,W/2,140);
  g.fillStyle=C.mut;g.font=`500 22px ${F}`;g.fillText(`${S.starOnly?'★ 프로카드 획득 대회':'국내 대회'} ${list.length}개 · ${md(TODAY)} 기준`,W/2,178);g.textAlign='left';
  if(!months.length){g.fillStyle=C.mut;g.font=`500 30px ${F}`;g.fillText('조건에 맞는 대회가 없어요',pad,260);return c}
  const cols=months.length>6?4:months.length>2?3:months.length;
  const rows=Math.ceil(months.length/cols);
  const top=208, bottom=H-88, colW=(W-pad*2)/cols, rowH=(bottom-top)/rows;
  // 글자 크기: 줄바꿈 포함 가장 긴 달이 칸에 들어가는 최대 크기 (12~19px)
  const wrap=(s,fs,maxW)=>{g.font=`700 ${fs}px ${F}`;const out=[];let cur='';
    for(const w of s.split(' ')){const tr=cur?cur+' '+w:w;if(g.measureText(tr).width>maxW&&cur){out.push(cur);cur=w}else cur=tr}
    if(cur)out.push(cur);return out};
  let fs=19;
  const need=fs=>Math.max(...months.map(m=>byM[m].reduce((n,l)=>{g.font=`600 ${fs}px ${M}`;const dw=g.measureText('00–00 ').width;
    return n+wrap(l.text+(l.star?'\u00a0★':''),fs,colW-dw-10).length},0)))*fs*1.3;
  while(fs>12&&need(fs)>rowH-66)fs--;
  const lh=Math.round(fs*1.3);
  months.forEach((m,i)=>{
    const cx=pad+(i%cols)*colW, cy=top+Math.floor(i/cols)*rowH;
    g.fillStyle=C.ink;g.font=`700 42px ${F}`;g.fillText(`${m}월`,cx+2,cy+44);
    let yy=cy+44+14+lh;
    g.font=`600 ${fs}px ${M}`;const dw=g.measureText('00–00 ').width;
    let shown=0,full=false;
    byM[m].forEach(l=>{
      const e=l.e;const parts=wrap(l.text+(l.star?'\u00a0★':''),fs,colW-dw-10);
      if(full||yy+(parts.length-1)*lh>cy+rowH-lh-2){full=true;return}shown++;
      g.font=`600 ${fs}px ${M}`;g.fillStyle=C.mut;g.fillText(`${e.date.slice(8)}${e.end?'–'+e.end.slice(8):''}`,cx+2,yy);
      parts.forEach((ln,j)=>{
        g.font=`${l.star?700:500} ${fs}px ${F}`;g.fillStyle=FED_COLOR[e.fed]||C.ink;
        if(ln.endsWith('★')){const s=ln.slice(0,-1);g.fillText(s,cx+2+dw,yy);g.fillStyle=C.star;g.fillText('★',cx+2+dw+g.measureText(s).width,yy)}
        else g.fillText(ln,cx+2+dw,yy);
        yy+=lh;
      });
    });
    if(shown<byM[m].length){g.font=`600 ${fs}px ${F}`;g.fillStyle=C.acc;g.fillText(`+${byM[m].length-shown}개 더`,cx+2+dw,cy+rowH-4)}
  });
  g.fillStyle=C.line;g.fillRect(pad,H-74,W-pad*2,2);
  g.font=`600 20px ${F}`;g.fillStyle=C.star;g.fillText('★',pad,H-38);g.fillStyle=C.mut;g.font=`500 20px ${F}`;
  g.fillText('프로카드 획득 대회   일정은 주최 측 사정으로 바뀔 수 있어요',pad+26,H-38);
  g.textAlign='right';g.font=`600 20px ${M}`;g.fillStyle=C.acc;const u='ynschoi.github.io/bbcomp';g.fillText(u,W-pad,H-38);const uw=g.measureText(u+'  ').width;g.font=`800 22px ${F}`;g.fillStyle=C.ink;g.fillText('BoCal',W-pad-uw,H-38);g.textAlign='left';
  return c;
}

    details:[e.fee&&`참가비 ${e.fee}`,e.deadline&&`접수 마감 ${e.deadline}`,e.url&&`원문 ${e.url}`].filter(Boolean).join('\n'),

  return 'https://calendar.google.com/calendar/render?'+p.toString();
}

$('#scKR').onclick=()=>{S.scope='KR';S.feds.clear();S.limit=60;save();render()};
$('#scWW').onclick=()=>{S.scope='WW';S.feds.clear();S.limit=60;save();render()};
$('#active').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;
  if(b.dataset.rmFed)S.feds.delete(b.dataset.rmFed);else if(b.dataset.rmDiv)S.divs.delete(b.dataset.rmDiv);else if(b.dataset.rmKind)S.kinds.delete(b.dataset.rmKind);else S.openOnly=false;save();render()};
document.addEventListener('click',ev=>{
  const h=ev.target.closest('[data-fav]');if(h){ev.stopPropagation();toggleFav(h.dataset.fav);return}
  const c=ev.target.closest('[data-day]');if(c){S.calSel=c.dataset.day;render();return}
  const fo=ev.target.closest('[data-fed-open]');if(fo){openFed(fo.dataset.fedOpen);return}
  const sh=ev.target.closest('[data-share]');if(sh){openShare(sh.dataset.share);return}
  const sf=ev.target.closest('[data-sfmt]');if(sf){SHARE.fmt=sf.dataset.sfmt;openShare();return}
  const ic=ev.target.closest('[data-ics]');if(ic){downloadIcs(EV.filter(e=>S.favs.has(e.id)&&endOf(e)>=TODAY),'my-competitions.ics');return}
  const cp=ev.target.closest('[data-copy]');if(cp){navigator.clipboard.writeText(cp.dataset.copy).then(()=>toast('주소를 복사했어요'),()=>toast('복사하지 못했어요'));return}
  const cr=ev.target.closest('.chg-row[data-id]');if(cr){openSheet(cr.dataset.id);return}
  const r=ev.target.closest('.row:not(.ghost),.dl-card');if(r&&r.dataset.id&&(!ev.target.closest('#sheet')||ev.target.closest('.sec')))openSheet(r.dataset.id);
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeSheet();
  if((ev.key==='Enter'||ev.key===' ')&&ev.target.classList&&ev.target.classList.contains('row')){ev.preventDefault();openSheet(ev.target.dataset.id)}});
$('#scrim').onclick=closeSheet;

/* ───────── 데이터 ───────── */
$('#view').innerHTML='<div class="empty">대회 일정을 불러오는 중…</div>';
fetch('data.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(d=>{
  DATA=d;FIRST=(d.events||[]).reduce((m,e)=>e.firstSeen&&e.firstSeen<m?e.firstSeen:m,'9999');EV=(d.events||[]).map(prep).sort((a,b)=>a.date.localeCompare(b.date));
  if(d.generated){$('#upd').textContent=`${md(d.generated.slice(0,10))} 업데이트 · 출처 ${Object.values(d.sources||{}).filter(s=>s.ok).length}곳`}
  if(!EV.some(e=>e._ww))$('.scope').hidden=true;
  render();
  fetch('feds.json',{cache:'no-cache'}).then(r=>r.ok?r.json():{}).then(f=>{FEDS=f||{};if(S.tab==='feds')render()}).catch(()=>{});
  fetch(`history/${HIST_YEAR}.json`,{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(h=>{if(h&&h.events){HIST=h.events.map(x=>({...x,_catList:[]}));render()}}).catch(()=>{});
}).catch(err=>{$('#upd').textContent='';$('#view').innerHTML=`<div class="empty">일정을 불러오지 못했어요 (${esc(err.message)}).<br>잠시 후 새로고침해 주세요.</div>`});
</script>
