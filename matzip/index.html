<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>맛집 티어리스트</title>
<meta name="description" content="별점으로 줄 세우는 나만의 맛집 티어리스트 — 국내·해외, 네이버·카카오·구글 지도 연동">
<meta name="theme-color" content="#18181b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="맛집티어">
<meta property="og:type" content="website">
<meta property="og:title" content="맛집 티어리스트">
<meta property="og:description" content="별점으로 줄 세우는 나만의 맛집 티어리스트">
<meta property="og:url" content="https://ynschoi.github.io/matzip/">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#fafafa; --card:#fff; --card2:#f4f4f5; --ink:#18181b; --ink2:#71717a;
  --line:#e4e4e7; --line2:#d4d4d8; --accent:#2563eb; --accent-soft:#eff4ff;
  --danger:#dc2626; --star:#f5a524; --row:#fff;
  --t5:#ef8683; --t4:#f5bf8a; --t3:#f7dc8b; --t2:#fbf28f; --t1:#c9f294;
  --radius:12px; --shadow:0 2px 8px rgba(0,0,0,.08);
  --item:68px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#000; --card:#1c1c1e; --card2:#2c2c2e; --ink:#f4f4f5; --ink2:#a1a1aa;
    --line:#2c2c2e; --line2:#3f3f46; --accent:#3b82f6; --accent-soft:#172554;
    --row:#141416; --shadow:0 2px 12px rgba(0,0,0,.5); color-scheme:dark;
  }
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;
  font-size:15px;line-height:1.45}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* header */
header{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top);
  background:color-mix(in srgb,var(--bg) 80%,transparent);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:10px;height:56px}
.logo{width:32px;height:32px;border-radius:8px;flex:none;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow)}
.hbar h1{font-size:17px;font-weight:700;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:text}
.iconbtn{width:40px;height:40px;border-radius:10px;border:0;background:transparent;display:grid;place-items:center}
.iconbtn:active{background:var(--card2)}
.iconbtn svg{width:22px;height:22px}

/* controls */
.controls{display:flex;align-items:center;gap:8px;margin:16px 0 12px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--card2);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:8px;font-size:14px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.spacer{flex:1}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);user-select:none}
.chk input{width:18px;height:18px;accent-color:var(--accent);margin:0}
/* tags */
.tagbar{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px;scrollbar-width:none}
.tagbar::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:999px;
  padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap;line-height:1.2}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.add{border-style:dashed;color:var(--ink2);background:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.sugrow{align-items:center;margin-bottom:10px;padding:8px 10px;border-radius:10px;background:var(--accent-soft)}
.sugl{font-size:12px;font-weight:600;color:var(--ink2);margin-right:2px}
.chip.sug{border-style:dashed;border-color:var(--accent);color:var(--accent);background:transparent}
.newtag{display:flex;gap:6px;margin-top:8px}
.newtag input{flex:1;min-width:0;padding:9px 12px!important;font-size:15px!important}
.newtag button{flex:none;border:0;border-radius:10px;padding:0 14px;background:var(--card2);font-weight:600;font-size:14px}
.dtags{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 12px}
.dtags span{font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:3px 9px;border-radius:999px}
.tagrow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.tagrow .tn{flex:1;font-weight:600}
.tagrow .tc{font-size:12px;color:var(--ink2)}
.tagrow button{border:0;background:var(--card2);border-radius:8px;padding:6px 10px;font-size:13px}
.tagrow button.del{color:var(--danger)}
.search{width:100%;margin:0 0 12px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:15px}
.search:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}

/* board */
.board{border:1px solid var(--line2);border-radius:var(--radius);overflow:hidden;background:var(--row)}
.row{display:flex;min-height:calc(var(--item) + 20px);border-top:1px solid var(--line2)}
.row:first-child{border-top:0}
.label{flex:none;width:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#18181b}
.label .stars{font-size:12px;letter-spacing:-1px;line-height:1}
.label .stars i{font-style:normal;opacity:.22}
.label .num{font-size:22px;font-weight:800;line-height:1.1}
.label .cnt{font-size:11px;opacity:.6;font-weight:600}
.row[data-s="5"] .label{background:var(--t5)} .row[data-s="4"] .label{background:var(--t4)}
.row[data-s="3"] .label{background:var(--t3)} .row[data-s="2"] .label{background:var(--t2)}
.row[data-s="1"] .label{background:var(--t1)}
.items{flex:1;display:flex;flex-wrap:wrap;gap:6px;padding:10px;align-content:flex-start;min-width:0}
.row.over .items{background:var(--accent-soft)}

.item{width:var(--item);flex:none;border:0;padding:0;background:none;text-align:center;
  -webkit-touch-callout:none;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.thumb{width:var(--item);height:var(--item);border-radius:8px;overflow:hidden;position:relative;
  background:var(--card2);display:grid;place-items:center;font-size:24px;font-weight:700;color:var(--ink2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.thumb .flag{position:absolute;right:3px;top:3px;font-size:9px;font-weight:700;padding:1px 4px;border-radius:4px;
  background:rgba(0,0,0,.6);color:#fff;line-height:1.3}
.item .nm{display:none;font-size:11px;margin-top:3px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shownames .item .nm{display:block}
.item.dragging{opacity:.25}
.small{--item:48px}
.small .thumb{font-size:17px}
.ghost{position:fixed;z-index:100;pointer-events:none;transform:translate(-50%,-50%) scale(1.12);
  box-shadow:0 8px 24px rgba(0,0,0,.35);border-radius:8px}
.placeholder{width:4px;align-self:stretch;border-radius:2px;background:var(--accent);flex:none}

.empty{text-align:center;color:var(--ink2);font-size:14px;padding:28px 12px 4px}
.hint{text-align:center;color:var(--ink2);font-size:12px;margin:12px 0 0}

/* FAB */
.fab{position:fixed;right:max(20px,env(safe-area-inset-right));bottom:calc(24px + env(safe-area-inset-bottom));z-index:30;
  height:56px;padding:0 22px 0 18px;border-radius:28px;border:0;background:var(--accent);color:#fff;
  font-weight:700;font-size:16px;display:flex;align-items:center;gap:6px;box-shadow:0 6px 20px rgba(37,99,235,.45)}
.fab svg{width:22px;height:22px}

/* sheet */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;max-height:92vh;overflow-y:auto;overscroll-behavior:contain;
  background:var(--card);border-radius:20px 20px 0 0;padding:8px 20px calc(24px + env(safe-area-inset-bottom));
  transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-width:640px;margin:0 auto}
.sheet.open{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 10px}
.sheet h2{font-size:18px;margin:4px 0 16px;display:flex;align-items:center}
.sheet h2 .x{margin-left:auto}
.field{margin-bottom:16px}
.field>label,.flabel{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.field input[type=text],.field input[type=url],.field textarea{width:100%;padding:12px 14px;border-radius:10px;
  border:1px solid var(--line2);background:var(--bg);font-size:16px}
.field input:focus,.field textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.counter{float:right;font-weight:400}
.help{font-size:12px;color:var(--ink2);margin-top:6px}
.photo-pick{width:100%;aspect-ratio:16/10;border-radius:12px;border:1.5px dashed var(--line2);background:var(--bg);
  display:grid;place-items:center;overflow:hidden;position:relative;color:var(--ink2);font-size:14px}
.photo-pick img{width:100%;height:100%;object-fit:cover}
.photo-pick .rm{position:absolute;right:8px;top:8px;border:0;border-radius:14px;padding:4px 10px;background:rgba(0,0,0,.6);color:#fff;font-size:12px}
.starpick{display:flex;gap:4px}
.starpick button{border:0;background:none;padding:2px;font-size:36px;line-height:1;color:var(--line2)}
.starpick button.on{color:var(--star)}
.starpick .lbl{align-self:center;margin-left:8px;font-size:14px;color:var(--ink2);font-weight:600}
.mapbtns{display:flex;gap:8px;flex-wrap:wrap}
.mapbtn{flex:1;min-width:92px;display:flex;align-items:center;justify-content:center;gap:6px;height:44px;border-radius:10px;
  border:1px solid var(--line2);background:var(--card);font-weight:600;font-size:14px;text-decoration:none;color:var(--ink)}
.mapbtn .dot{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:800}
.dot.n{background:#03c75a}.dot.k{background:#fee500;color:#3c1e1e}.dot.g{background:#4285f4}.dot.l{background:var(--ink2)}
.btn{height:50px;border-radius:12px;border:0;font-weight:700;font-size:16px;padding:0 18px}
.btn.primary{background:var(--accent);color:#fff;width:100%}
.btn.primary:disabled{opacity:.4}
.btn.ghostb{background:var(--card2)}
.btn.danger{background:transparent;color:var(--danger)}
.actions{display:flex;gap:8px;margin-top:8px}
.actions .btn{flex:1}

/* detail */
.dphoto{width:calc(100% + 40px);margin:-8px -20px 16px;aspect-ratio:4/3;background:var(--card2);overflow:hidden;border-radius:20px 20px 0 0}
.dphoto img{width:100%;height:100%;object-fit:cover;display:block}
.dname{font-size:22px;font-weight:700;margin:0 0 4px}
.dmeta{font-size:13px;color:var(--ink2);margin-bottom:12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--card2)}
.dreview{font-size:16px;margin:14px 0 18px;padding:14px 16px;border-radius:12px;background:var(--bg);position:relative}
.dreview:before{content:'“';font-size:28px;color:var(--ink2);position:absolute;left:8px;top:-2px;opacity:.5}
.dreview span{padding-left:10px;display:block}

/* menu */
.menu a,.menu button{display:flex;width:100%;align-items:center;gap:12px;padding:14px 4px;border:0;border-bottom:1px solid var(--line);
  background:none;font-size:16px;text-align:left;text-decoration:none;color:var(--ink)}
.menu .danger{color:var(--danger)}

.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:200;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<header>
  <div class="wrap hbar">
    <div class="logo" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 20 20"><rect x="2" y="3" width="16" height="3" rx="1.5" fill="#ef8683"/><rect x="2" y="8.5" width="12" height="3" rx="1.5" fill="#f5bf8a"/><rect x="2" y="14" width="8" height="3" rx="1.5" fill="#c9f294"/></svg>
    </div>
    <h1 id="title" title="눌러서 제목 바꾸기">맛집 티어리스트</h1>
    <button class="iconbtn" id="menuBtn" aria-label="메뉴">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
    </button>
  </div>
</header>

<main class="wrap">
  <div class="controls">
    <div class="seg" id="regionSeg">
      <button data-r="all" class="on">전체</button><button data-r="domestic">국내</button><button data-r="overseas">해외</button>
    </div>
    <span class="spacer"></span>
    <label class="chk"><input type="checkbox" id="smallChk">작게</label>
    <label class="chk"><input type="checkbox" id="namesChk" checked>이름</label>
  </div>
  <div class="tagbar" id="tagBar"></div>
  <input class="search" id="search" type="search" placeholder="가게 이름·지역 검색" autocomplete="off">
  <div class="board shownames" id="board"></div>
  <div class="empty" id="empty" hidden>아직 맛집이 없어요.<br>아래 <b>＋ 맛집 추가</b>로 첫 맛집을 올려보세요.</div>
  <p class="hint" id="hint">탭하면 상세 · 길게 눌러 끌면 별점(티어) 변경</p>
</main>

<button class="fab" id="addBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>맛집 추가</button>

<div class="scrim" id="scrim"></div>

<!-- 추가/수정 시트 -->
<section class="sheet" id="editSheet" aria-modal="true" role="dialog">
  <div class="grab"></div>
  <h2><span id="editTitle">맛집 추가</span><button class="iconbtn x" data-close aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></h2>

  <div class="field">
    <label for="fShare">지도 공유 붙여넣기 <span style="font-weight:400">(선택)</span></label>
    <input type="text" id="fShare" placeholder="네이버·카카오·구글 지도에서 '공유 → 복사' 한 내용" autocomplete="off">
    <div class="help">붙여넣으면 가게 이름·주소·지도 링크를 자동으로 채워요.</div>
  </div>

  <div class="field">
    <label for="fName">가게 이름</label>
    <input type="text" id="fName" maxlength="40" placeholder="예: 을지면옥" autocomplete="off">
  </div>

  <div class="field">
    <span class="flabel">국내 / 해외</span>
    <div class="seg" id="fRegion"><button type="button" data-r="domestic" class="on">국내</button><button type="button" data-r="overseas">해외</button></div>
  </div>

  <div class="field">
    <label for="fPlace">위치</label>
    <input type="text" id="fPlace" maxlength="80" placeholder="예: 서울 중구 / 도쿄 시부야" autocomplete="off">
  </div>

  <div class="field">
    <span class="flabel">별점</span>
    <div class="starpick" id="fStars"></div>
  </div>

  <div class="field">
    <span class="flabel">태그 <span style="font-weight:400">(여러 개 가능)</span></span>
    <div class="chips sugrow" id="fTagSuggest" hidden></div>
    <div class="chips" id="fTags"></div>
    <div class="newtag"><input type="text" id="fNewTag" maxlength="12" placeholder="새 태그 (예: 한식, 데이트, 혼밥)" autocomplete="off" enterkeyhint="done"><button type="button" id="fNewTagBtn">추가</button></div>
  </div>

  <div class="field">
    <label for="fReview">한줄평 <span class="counter" id="revCnt">0/40</span></label>
    <input type="text" id="fReview" maxlength="40" placeholder="한 줄로 남겨주세요" autocomplete="off">
  </div>

  <div class="field">
    <span class="flabel">사진 (1장)</span>
    <label class="photo-pick" id="photoPick">
      <span id="photoEmpty">＋ 사진 선택</span>
      <input type="file" id="fPhoto" accept="image/*" hidden>
    </label>
  </div>

  <div class="field">
    <span class="flabel">지도에서 확인</span>
    <div class="mapbtns" id="fMapBtns"></div>
    <div class="help" id="fMapUrlHelp" hidden></div>
  </div>

  <button class="btn primary" id="saveBtn" disabled>저장</button>
</section>

<!-- 상세 시트 -->
<section class="sheet" id="detailSheet" aria-modal="true" role="dialog">
  <div id="detailBody"></div>
</section>

<!-- 메뉴 시트 -->
<section class="sheet menu" id="menuSheet" aria-modal="true" role="dialog">
  <div class="grab"></div>
  <button id="mRename">✏️ 제목 바꾸기</button>
  <button id="mTags">🏷 태그 관리</button>
  <button id="mExport">💾 백업 파일 저장</button>
  <button id="mImport">📂 백업 파일 불러오기</button>
  <button id="mReset" class="danger">🗑 전체 삭제</button>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
</section>

<!-- 태그 관리 시트 -->
<section class="sheet" id="tagSheet" aria-modal="true" role="dialog">
  <div class="grab"></div>
  <h2>태그 관리<button class="iconbtn x" data-close aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></h2>
  <div id="tagList"></div>
  <div class="field newtag" style="margin-top:14px"><input type="text" id="tNew" maxlength="12" placeholder="새 태그 이름" autocomplete="off" style="border:1px solid var(--line2);border-radius:10px;background:var(--bg)"><button type="button" id="tNewBtn">추가</button></div>
</section>

<div class="toast" id="toast"></div>

<script>
'use strict';
/* ---------- 저장소 (IndexedDB) ---------- */
const DB = (() => {
  let dbp;
  const open = () => dbp ||= new Promise((res, rej) => {
    const r = indexedDB.open('matzip-tier', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('places', { keyPath: 'id' });
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  const tx = async (mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction('places', mode), s = t.objectStore('places');
      const out = fn(s);
      t.oncomplete = () => res(out && 'result' in out ? out.result : undefined);
      t.onerror = () => rej(t.error);
    });
  };
  return {
    all: () => tx('readonly', s => s.getAll()),
    put: rec => tx('readwrite', s => s.put(rec)),
    putMany: recs => tx('readwrite', s => recs.forEach(r => s.put(r))),
    del: id => tx('readwrite', s => s.delete(id)),
    clear: () => tx('readwrite', s => s.clear()),
  };
})();
const LS = {
  get(k, d) { try { const v = localStorage.getItem('matzip.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('matzip.' + k, JSON.stringify(v)); } catch {} },
};

/* ---------- 상태 ---------- */
let places = [];
let region = LS.get('region', 'all');
let query = '';
let tagFilter = LS.get('tagFilter', '');
let tags = LS.get('tags', null) || ['한식', '일식', '중식', '양식', '카페·디저트'];
const saveTags = () => LS.set('tags', tags);
const cleanTag = t => String(t || '').replace(/^#/, '').replace(/\s+/g, ' ').trim().slice(0, 12);
function addTag(t) {
  t = cleanTag(t); if (!t) return '';
  if (!tags.includes(t)) { tags.push(t); saveTags(); }
  return t;
}
/* 장소에만 있고 목록에 없는 태그(백업 불러오기 등) 합치기 */
function mergeTagsFromPlaces() {
  let changed = false;
  places.forEach(p => (p.tags || []).forEach(t => { if (!tags.includes(t)) { tags.push(t); changed = true; } }));
  if (changed) saveTags();
}
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const STAR_TXT = { 5: '최고! 또 갈 집', 4: '아주 좋아요', 3: '괜찮아요', 2: '그저 그래요', 1: '별로예요' };

/* ---------- 지도 링크 ---------- */
const MAPS = {
  naver: { name: '네이버', cls: 'n', ch: 'N', url: q => 'https://map.naver.com/p/search/' + encodeURIComponent(q) },
  kakao: { name: '카카오', cls: 'k', ch: 'K', url: q => 'https://map.kakao.com/link/search/' + encodeURIComponent(q) },
  google: { name: '구글', cls: 'g', ch: 'G', url: q => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q) },
};
function mapOrder(r) { return r === 'overseas' ? ['google', 'naver', 'kakao'] : ['naver', 'kakao', 'google']; }
function mapKindOf(url) {
  if (/naver\.(me|com)/i.test(url)) return 'naver';
  if (/kko\.to|kakao\.com/i.test(url)) return 'kakao';
  if (/goo\.gl|google\.[a-z.]+\/maps|maps\.google/i.test(url)) return 'google';
  return null;
}
function mapButtons(p) {
  const q = [p.name, p.place].filter(Boolean).join(' ').trim();
  let html = '';
  if (p.mapUrl) {
    const k = mapKindOf(p.mapUrl), m = k && MAPS[k];
    html += `<a class="mapbtn" href="${esc(p.mapUrl)}" target="_blank" rel="noopener" style="flex-basis:100%"><span class="dot ${m ? m.cls : 'l'}">${m ? m.ch : '↗'}</span>저장한 ${m ? m.name + ' 지도' : '지도'} 링크 열기</a>`;
  }
  if (!q) return html;
  for (const k of mapOrder(p.region)) {
    const m = MAPS[k];
    html += `<a class="mapbtn" href="${esc(m.url(q))}" target="_blank" rel="noopener"><span class="dot ${m.cls}">${m.ch}</span>${m.name}</a>`;
  }
  return html;
}
/* 공유 텍스트 파싱: "[네이버지도]\n가게\n주소\nhttps://naver.me/..." 등 */
function parseShare(text) {
  const urlM = text.match(/https?:\/\/[^\s]+/);
  const url = urlM ? urlM[0] : '';
  const lines = text.replace(url, '').split(/\n|\r/).map(s => s.trim())
    .filter(s => s && !/^\[.*\]$/.test(s) && !/^(네이버|카카오맵|카카오|구글)\s*지도/.test(s));
  // 한 줄로 붙여넣은 경우: "[네이버지도] 가게 주소 URL"
  let name = lines[0] || '', addr = lines[1] || '';
  name = name.replace(/^\[[^\]]*\]\s*/, '');
  return { url, name: name.slice(0, 40), addr: addr.slice(0, 80) };
}
/* ---------- 지역 태그 추천 ---------- */
const SIDO = [
  [/^서울(특별시|시)?$/, '서울'], [/^부산(광역시|시)?$/, '부산'], [/^대구(광역시|시)?$/, '대구'], [/^인천(광역시|시)?$/, '인천'],
  [/^광주광역시$|^광주$/, '광주'], [/^대전(광역시|시)?$/, '대전'], [/^울산(광역시|시)?$/, '울산'], [/^세종(특별자치시|시)?$/, '세종'],
  [/^경기(도)?$/, '경기'], [/^강원(특별자치도|도)?$/, '강원'], [/^충청북도$|^충북$/, '충북'], [/^충청남도$|^충남$/, '충남'],
  [/^전라북도$|^전북(특별자치도)?$/, '전북'], [/^전라남도$|^전남$/, '전남'], [/^경상북도$|^경북$/, '경북'], [/^경상남도$|^경남$/, '경남'],
  [/^제주(특별자치도|도)?$/, '제주'],
];
// 국가: [별칭...], 도시: {한글: [영문...]}
const WORLD = {
  '일본': [['japan'], { '도쿄': ['tokyo'], '오사카': ['osaka'], '교토': ['kyoto'], '후쿠오카': ['fukuoka'], '삿포로': ['sapporo'], '오키나와': ['okinawa', 'naha'], '나고야': ['nagoya'], '고베': ['kobe'], '요코하마': ['yokohama'] }],
  '대만': [['taiwan'], { '타이베이': ['taipei'], '가오슝': ['kaohsiung'], '타이중': ['taichung'] }],
  '중국': [['china'], { '상하이': ['shanghai'], '베이징': ['beijing'], '칭다오': ['qingdao'] }],
  '홍콩': [['hong kong'], {}], '마카오': [['macau', 'macao'], {}], '싱가포르': [['singapore'], {}],
  '태국': [['thailand'], { '방콕': ['bangkok'], '치앙마이': ['chiang mai'], '푸켓': ['phuket'] }],
  '베트남': [['vietnam', 'viet nam'], { '다낭': ['da nang', 'danang'], '하노이': ['hanoi', 'ha noi'], '호치민': ['ho chi minh', 'saigon'], '나트랑': ['nha trang'], '푸꾸옥': ['phu quoc'] }],
  '필리핀': [['philippines'], { '세부': ['cebu'], '마닐라': ['manila'], '보라카이': ['boracay'] }],
  '인도네시아': [['indonesia'], { '발리': ['bali'] }],
  '미국': [['usa', 'united states', 'u.s.a'], { '뉴욕': ['new york', 'brooklyn', 'manhattan'], 'LA': ['los angeles'], '샌프란시스코': ['san francisco'], '하와이': ['hawaii', 'honolulu'], '시카고': ['chicago'], '라스베이거스': ['las vegas'], '시애틀': ['seattle'], '괌': ['guam'] }],
  '캐나다': [['canada'], { '밴쿠버': ['vancouver'], '토론토': ['toronto'] }],
  '영국': [['united kingdom', 'england'], { '런던': ['london'] }],
  '프랑스': [['france'], { '파리': ['paris'], '니스': ['nice'] }],
  '이탈리아': [['italy', 'italia'], { '로마': ['rome', 'roma'], '밀라노': ['milan', 'milano'], '피렌체': ['florence', 'firenze'], '베네치아': ['venice', 'venezia'] }],
  '스페인': [['spain', 'españa'], { '바르셀로나': ['barcelona'], '마드리드': ['madrid'] }],
  '독일': [['germany', 'deutschland'], { '베를린': ['berlin'], '뮌헨': ['munich', 'münchen'] }],
  '호주': [['australia'], { '시드니': ['sydney'], '멜버른': ['melbourne'] }],
};
const ROADISH = /(로|길|번길|번지|층|호|빌딩|타워|센터|역|점)$|\d/;
function regionInfo(text) {
  const out = []; let kind = null;
  const add = t => { t = cleanTag(t); if (t && !out.includes(t)) out.push(t); };
  const toks = String(text || '').split(/[\s,()]+/).filter(Boolean);
  // 국내 주소: 시도 → 시군구 → 동읍면
  const si = toks.findIndex(t => SIDO.some(([re]) => re.test(t)));
  if (si >= 0) {
    kind = 'domestic';
    add(SIDO.find(([re]) => re.test(toks[si]))[1]);
    for (const raw of toks.slice(si + 1, si + 5)) {
      let m; const t = raw.replace(/\d+가$/, '');
      if (t !== raw && /[가-힣]{2,}로$/.test(t)) { add(t); break; }   // 을지로3가 → 을지로
      if ((m = t.match(/^([가-힣]{2,})(시|군|구)$/))) add(m[1]);
      else if (/^[가-힣]구$/.test(t)) add(t);              // 중구·동구 등은 그대로
      else if ((m = t.match(/^([가-힣]{2,}?)\d*(동|가|읍|면)$/)) && !ROADISH.test(m[1])) { add(m[1]); break; }
      else if (ROADISH.test(t)) break;
    }
    return { kind, tags: out };
  }
  // 해외: 국가·도시 사전
  const low = ' ' + String(text || '').toLowerCase() + ' ';
  const has = a => /[가-힣]/.test(a) ? low.includes(a) : new RegExp('[^a-z]' + a.replace(/[.]/g, '\\.') + '[^a-z]').test(low);
  for (const [country, [alias, cities]] of Object.entries(WORLD)) {
    let hit = has(country) || alias.some(has);
    const cityHits = Object.entries(cities).filter(([ko, en]) => has(ko.toLowerCase()) || en.some(has)).map(([ko]) => ko);
    if (hit || cityHits.length) { kind = 'overseas'; add(country); cityHits.forEach(add); }
  }
  // 자유 입력(예: "도쿄 시부야", "을지로"): 짧은 한글 낱말도 후보로
  toks.filter(t => /^[가-힣]{2,6}$/.test(t) && !/(길|층|호|빌딩)$/.test(t)).forEach(add);
  return { kind, tags: out.slice(0, 4) };
}

/* ---------- 사진 압축 ---------- */
function compressImage(file, max = 900, q = 0.82) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('이미지를 읽을 수 없어요')); };
    img.src = url;
  });
}

/* ---------- 렌더 ---------- */
const board = $('#board');
function visible(p) {
  if (region !== 'all' && p.region !== region) return false;
  if (tagFilter && !(p.tags || []).includes(tagFilter)) return false;
  if (query) {
    const hay = (p.name + ' ' + (p.place || '') + ' ' + (p.review || '') + ' ' + (p.tags || []).join(' ')).toLowerCase();
    if (!hay.includes(query)) return false;
  }
  return true;
}
function renderTagBar() {
  if (tagFilter && !tags.includes(tagFilter)) { tagFilter = ''; LS.set('tagFilter', ''); }
  const cnt = t => places.filter(p => (region === 'all' || p.region === region) && (p.tags || []).includes(t)).length;
  $('#tagBar').innerHTML = `<button class="chip ${tagFilter ? '' : 'on'}" data-t="">전체 태그</button>`
    + tags.map(t => `<button class="chip ${t === tagFilter ? 'on' : ''}" data-t="${esc(t)}">#${esc(t)} <span style="opacity:.6">${cnt(t) || ''}</span></button>`).join('')
    + `<button class="chip add" data-manage>＋ 태그</button>`;
  const on = $('#tagBar .chip.on'); if (on && tagFilter) on.scrollIntoView({ inline: 'nearest', block: 'nearest' });
}
function render() {
  renderTagBar();
  let html = '';
  for (let s = 5; s >= 1; s--) {
    const list = places.filter(p => p.stars === s && visible(p)).sort((a, b) => a.order - b.order);
    html += `<div class="row" data-s="${s}"><div class="label">
      <div class="num">${s}</div>
      <div class="stars">${'★'.repeat(s)}<i>${'★'.repeat(5 - s)}</i></div>
      <div class="cnt">${list.length ? list.length + '곳' : ''}</div></div>
      <div class="items">${list.map(itemHTML).join('')}</div></div>`;
  }
  board.innerHTML = html;
  const none = places.length === 0;
  $('#empty').hidden = !none;
  if (!none && tagFilter && !places.some(visible)) {
    $('#empty').hidden = false;
    $('#empty').innerHTML = `<b>#${esc(tagFilter)}</b> 태그를 단 맛집이 아직 없어요.`;
  } else $('#empty').innerHTML = '아직 맛집이 없어요.<br>아래 <b>＋ 맛집 추가</b>로 첫 맛집을 올려보세요.';
  $('#hint').hidden = none;
}
function itemHTML(p) {
  const inner = p.photo ? `<img src="${p.photo}" alt="" draggable="false">` : esc([...p.name][0] || '?');
  return `<button class="item" data-id="${p.id}"><div class="thumb">${inner}${p.region === 'overseas' ? '<span class="flag">해외</span>' : ''}</div><div class="nm">${esc(p.name)}</div></button>`;
}

/* ---------- 시트 ---------- */
let openSheetEl = null;
function openSheet(el) {
  if (openSheetEl && openSheetEl !== el) openSheetEl.classList.remove('open');
  openSheetEl = el; el.classList.add('open'); $('#scrim').classList.add('open');
  el.scrollTop = 0;
}
function closeSheet() {
  if (!openSheetEl) return;
  openSheetEl.classList.remove('open'); $('#scrim').classList.remove('open'); openSheetEl = null;
}
$('#scrim').onclick = closeSheet;
document.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeSheet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

/* ---------- 추가/수정 ---------- */
let draft = null, regionTouched = false;
function openEdit(p) {
  draft = p ? { ...p, tags: [...(p.tags || [])] } : { id: null, name: '', region: region === 'overseas' ? 'overseas' : 'domestic', place: '', stars: 0, review: '', photo: '', mapUrl: '', tags: tagFilter ? [tagFilter] : [] };
  $('#fNewTag').value = '';
  regionTouched = !!p;
  $('#editTitle').textContent = p ? '맛집 수정' : '맛집 추가';
  $('#fShare').value = '';
  $('#fName').value = draft.name; $('#fPlace').value = draft.place; $('#fReview').value = draft.review;
  syncEdit();
  openSheet($('#editSheet'));
}
function syncEdit() {
  $('#fRegion').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.r === draft.region));
  $('#fStars').innerHTML = [1, 2, 3, 4, 5].map(n => `<button type="button" data-n="${n}" class="${n <= draft.stars ? 'on' : ''}" aria-label="별 ${n}개">★</button>`).join('')
    + `<span class="lbl">${draft.stars ? STAR_TXT[draft.stars] : '눌러서 선택'}</span>`;
  $('#revCnt').textContent = [...$('#fReview').value].length + '/40';
  const sug = regionInfo(draft.place).tags.filter(t => !draft.tags.includes(t));
  $('#fTagSuggest').hidden = !sug.length;
  $('#fTagSuggest').innerHTML = '<span class="sugl">📍 지역 추천</span>' + sug.map(t => `<button type="button" class="chip sug" data-t="${esc(t)}">＋${esc(t)}</button>`).join('');
  $('#fTags').innerHTML = tags.map(t => `<button type="button" class="chip ${draft.tags.includes(t) ? 'on' : ''}" data-t="${esc(t)}">#${esc(t)}</button>`).join('');
  const pick = $('#photoPick');
  pick.querySelectorAll('img,.rm').forEach(n => n.remove());
  $('#photoEmpty').hidden = !!draft.photo;
  if (draft.photo) pick.insertAdjacentHTML('afterbegin', `<img src="${draft.photo}" alt=""><button type="button" class="rm">삭제</button>`);
  $('#fMapBtns').innerHTML = mapButtons(draft) || '<span class="help" style="margin:0">가게 이름을 입력하면 지도 검색 버튼이 생겨요.</span>';
  $('#saveBtn').disabled = !(draft.name.trim() && draft.stars);
}
$('#fName').oninput = e => { draft.name = e.target.value; syncEdit(); };
$('#fPlace').oninput = e => {
  draft.place = e.target.value;
  const k = regionInfo(draft.place).kind;
  if (k && !regionTouched) draft.region = k;
  syncEdit();
};
$('#fReview').oninput = e => { draft.review = e.target.value; $('#revCnt').textContent = [...e.target.value].length + '/40'; };
$('#fRegion').onclick = e => { const b = e.target.closest('button'); if (b) { draft.region = b.dataset.r; regionTouched = true; syncEdit(); } };
$('#fTagSuggest').onclick = e => {
  const b = e.target.closest('button[data-t]'); if (!b) return;
  const t = addTag(b.dataset.t);
  if (t && !draft.tags.includes(t)) draft.tags.push(t);

};
$('#fTags').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  const t = b.dataset.t;
  draft.tags = draft.tags.includes(t) ? draft.tags.filter(x => x !== t) : draft.tags.concat(t);
  b.classList.toggle('on', draft.tags.includes(t));
};
const addNewTagFromForm = () => {
  const t = addTag($('#fNewTag').value); $('#fNewTag').value = '';
  if (!t) return;
  if (!draft.tags.includes(t)) draft.tags.push(t);
  syncEdit(); renderTagBar();
};
$('#fNewTagBtn').onclick = addNewTagFromForm;
$('#fNewTag').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); addNewTagFromForm(); } });
$('#fStars').onclick =e => { const b = e.target.closest('button'); if (b) { draft.stars = +b.dataset.n; syncEdit(); } };
$('#fShare').addEventListener('paste', e => {
  const t = (e.clipboardData || window.clipboardData).getData('text');
  if (t) { e.preventDefault(); applyShare(t); }
});
$('#fShare').addEventListener('change', e => { if (e.target.value) applyShare(e.target.value); });
function applyShare(text) {
  const r = parseShare(text);
  if (!r.url && !r.name) return toast('지도 공유 내용을 찾지 못했어요');
  if (r.url) draft.mapUrl = r.url;
  if (r.name && !draft.name) { draft.name = r.name; $('#fName').value = r.name; }
  if (r.addr && !draft.place) { draft.place = r.addr; $('#fPlace').value = r.addr; }
  const g = regionInfo(r.addr || text).kind;
  if (g && !regionTouched) draft.region = g;
  $('#fShare').value = r.url || '';
  syncEdit();
  toast('지도 정보를 채웠어요');
}
$('#photoPick').addEventListener('click', e => {
  if (e.target.closest('.rm')) { e.preventDefault(); draft.photo = ''; syncEdit(); }
});
$('#fPhoto').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try { draft.photo = await compressImage(f); syncEdit(); } catch (err) { toast(err.message); }
};
$('#saveBtn').onclick = async () => {
  if (cleanTag($('#fNewTag').value)) addNewTagFromForm(); // 입력만 하고 '추가'를 안 누른 경우
  const p = { ...draft, name: draft.name.trim(), place: draft.place.trim(), review: draft.review.trim(), tags: tags.filter(t => draft.tags.includes(t)) };
  const old = p.id && places.find(x => x.id === p.id);
  if (!old) { p.id = uid(); p.createdAt = Date.now(); }
  if (!old || old.stars !== p.stars) p.order = maxOrder(p.stars) + 1;
  p.updatedAt = Date.now();
  await DB.put(p);
  places = places.filter(x => x.id !== p.id).concat(p);
  render(); closeSheet();
  toast(old ? '수정했어요' : `${'★'.repeat(p.stars)} 에 올렸어요`);
};
const maxOrder = s => places.filter(p => p.stars === s).reduce((m, p) => Math.max(m, p.order || 0), 0);
$('#addBtn').onclick = () => openEdit(null);

    ${(p.tags || []).length ? `<div class="dtags">${p.tags.map(t => `<span>#${esc(t)}</span>`).join('')}</div>` : ''}
    <div class="starpick" id="dStars">${[1, 2, 3, 4, 5].map(n => `<button type="button" data-n="${n}" class="${n <= p.stars ? 'on' : ''}" aria-label="별 ${n}개">★</button>`).join('')}<span class="lbl">${STAR_TXT[p.stars]}</span></div>
    ${p.review ? `<div class="dreview"><span>${esc(p.review)}</span></div>` : '<div style="height:16px"></div>'}
    <div class="mapbtns">${mapButtons(p)}</div>
    <div class="actions" style="margin-top:16px">
      <button class="btn danger" id="dDel">삭제</button>
      <button class="btn ghostb" id="dEdit">수정</button>
    </div>`;
  $('#dStars').onclick = async e => {
    const b = e.target.closest('button'); if (!b || +b.dataset.n === p.stars) return;
    await moveTo(p, +b.dataset.n, null);
    openDetail(p.id);
  };
  $('#dEdit').onclick = () => openEdit(p);
  $('#dDel').onclick = async () => {
    if (!confirm(`'${p.name}'을(를) 삭제할까요?`)) return;
    await DB.del(p.id); places = places.filter(x => x.id !== p.id); render(); closeSheet(); toast('삭제했어요');
  };
  openSheet($('#detailSheet'));
}

/* 별점 변경 + 순서 재배치 (beforeId 앞에 삽입, null이면 맨 뒤) */
async function moveTo(p, stars, beforeId) {
  const list = places.filter(x => x.stars === stars && x.id !== p.id).sort((a, b) => a.order - b.order);
  let idx = beforeId ? list.findIndex(x => x.id === beforeId) : -1;
  if (idx < 0) idx = list.length;
  list.splice(idx, 0, p);
  p.stars = stars; p.updatedAt = Date.now();
  list.forEach((x, i) => x.order = i + 1);
  await DB.putMany(list);
  render();
}

/* ---------- 드래그 (마우스: 바로 / 터치: 길게 누르기) ---------- */
(() => {
  let st = null; // {p, el, ghost, x, y, timer, active, touch}
  const HOLD = 280, SLOP = 8;
  const start = (e, x, y, touch) => {
    const el = e.target.closest('.item'); if (!el) return;
    const p = places.find(q => q.id === el.dataset.id); if (!p) return;
    st = { p, el, x0: x, y0: y, x, y, active: false, touch };
    if (touch) st.timer = setTimeout(() => activate(), HOLD);
  };
  const activate = () => {
    if (!st) return;
    st.active = true;
    if (navigator.vibrate) navigator.vibrate(15);
    const r = st.el.querySelector('.thumb').getBoundingClientRect();
    const g = st.el.querySelector('.thumb').cloneNode(true);
    g.classList.add('ghost'); g.style.width = r.width + 'px'; g.style.height = r.height + 'px';
    document.body.appendChild(g); st.ghost = g;
    st.el.classList.add('dragging');
    place(st.x, st.y);
  };
  const ph = document.createElement('div'); ph.className = 'placeholder';
  const place = (x, y) => {
    st.ghost.style.left = x + 'px'; st.ghost.style.top = y + 'px';
    board.querySelectorAll('.row.over').forEach(r => r.classList.remove('over'));
    const hit = document.elementFromPoint(x, y);
    const row = hit && hit.closest('.row');
    st.row = row; st.before = null;
    if (!row) { ph.remove(); return; }
    row.classList.add('over');
    const items = [...row.querySelectorAll('.item:not(.dragging)')];
    for (const it of items) {
      const r = it.getBoundingClientRect();
      if (y < r.top || (y <= r.bottom && x < r.left + r.width / 2)) { st.before = it.dataset.id; break; }
    }
    const box = row.querySelector('.items');
    if (st.before) box.insertBefore(ph, box.querySelector(`[data-id="${st.before}"]`)); else box.appendChild(ph);
    // 화면 가장자리 자동 스크롤
    if (y < 80) scrollBy(0, -12); else if (y > innerHeight - 80) scrollBy(0, 12);
  };
  const move = (e, x, y) => {
    if (!st) return;
    st.x = x; st.y = y;
    if (!st.active) {
      if (Math.hypot(x - st.x0, y - st.y0) > SLOP) {
        if (st.touch) { clearTimeout(st.timer); st = null; return; } // 스크롤 의도
        activate();
      } else return;
    }
    e.preventDefault();
    place(x, y);
  };
  const end = async () => {
    if (!st) return;
    clearTimeout(st.timer);
    const s = st; st = null;
    if (!s.active) { openDetail(s.p.id); return; }
    s.ghost.remove(); ph.remove();
    board.querySelectorAll('.row.over').forEach(r => r.classList.remove('over'));
    s.el.classList.remove('dragging');
    if (s.row) {
      const ns = +s.row.dataset.s, changed = ns !== s.p.stars;
      await moveTo(s.p, ns, s.before);
      if (changed) toast(`${s.p.name} → ${'★'.repeat(ns)}`);
    }
  };
  const cancel = () => {
    if (!st) return;
    clearTimeout(st.timer);
    if (st.ghost) st.ghost.remove();
    ph.remove(); st.el.classList.remove('dragging');
    board.querySelectorAll('.row.over').forEach(r => r.classList.remove('over'));
    st = null;
  };
  board.addEventListener('click', e => { e.preventDefault(); });
  board.addEventListener('contextmenu', e => { if (e.target.closest('.item')) e.preventDefault(); });
  board.addEventListener('touchstart', e => { if (e.touches.length === 1) start(e, e.touches[0].clientX, e.touches[0].clientY, true); else cancel(); }, { passive: true });
  document.addEventListener('touchmove', e => { if (st) move(e, e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
  document.addEventListener('touchend', e => { if (st) { e.preventDefault(); end(); } }, { passive: false });
  document.addEventListener('touchcancel', cancel);
  board.addEventListener('mousedown', e => { if (e.button === 0) { e.preventDefault(); start(e, e.clientX, e.clientY, false); } });
  document.addEventListener('mousemove', e => { if (st && !st.touch) move(e, e.clientX, e.clientY); });
  document.addEventListener('mouseup', () => { if (st && !st.touch) end(); });
  board.addEventListener('keydown', e => { const it = e.target.closest('.item'); if (it && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openDetail(it.dataset.id); } });
})();

/* ---------- 필터 & 보기 ---------- */
function setRegion(r) {
  region = r; LS.set('region', r);
  $('#regionSeg').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.r === r));
  render();
}
$('#regionSeg').onclick = e => { const b = e.target.closest('button'); if (b) setRegion(b.dataset.r); };
$('#tagBar').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  if ('manage' in b.dataset) return openTagSheet();
  tagFilter = b.dataset.t === tagFilter ? '' : b.dataset.t; LS.set('tagFilter', tagFilter);
  render();
};

/* ---------- 태그 관리 ---------- */
function renderTagList() {
  const used = t => places.filter(p => (p.tags || []).includes(t)).length;
  $('#tagList').innerHTML = tags.length ? tags.map((t, i) => `<div class="tagrow" data-i="${i}">
      <span class="tn">#${esc(t)}</span><span class="tc">${used(t)}곳</span>
      <button data-a="up" aria-label="위로" ${i ? '' : 'disabled style="opacity:.3"'}>↑</button>
      <button data-a="ren">이름 변경</button><button data-a="del" class="del">삭제</button></div>`).join('')
    : '<p class="help">태그가 없어요. 아래에서 추가하세요.</p>';
}
function openTagSheet() { renderTagList(); openSheet($('#tagSheet')); }
async function retagPlaces(fn) {
  const changed = [];
  places.forEach(p => { const before = (p.tags || []).join('\u0001'); p.tags = fn(p.tags || []); if (p.tags.join('\u0001') !== before) changed.push(p); });
  if (changed.length) await DB.putMany(changed);
}
$('#tagList').onclick = async e => {
  const b = e.target.closest('button'); if (!b) return;
  const i = +b.closest('.tagrow').dataset.i, t = tags[i];
  if (b.dataset.a === 'up' && i > 0) { [tags[i - 1], tags[i]] = [tags[i], tags[i - 1]]; saveTags(); }
  else if (b.dataset.a === 'ren') {
    const n = cleanTag(prompt('태그 이름 변경', t));
    if (!n || n === t) return;
    if (tags.includes(n)) { // 이미 있는 태그로 바꾸면 합치기
      if (!confirm(`#${n} 태그가 이미 있어요. 합칠까요?`)) return;
      tags.splice(i, 1);
      await retagPlaces(ts => [...new Set(ts.map(x => x === t ? n : x))]);
    } else {
      tags[i] = n;
      await retagPlaces(ts => ts.map(x => x === t ? n : x));
    }
    if (tagFilter === t) { tagFilter = n; LS.set('tagFilter', n); }
    saveTags();
  } else if (b.dataset.a === 'del') {
    const u = places.filter(p => (p.tags || []).includes(t)).length;
    if (!confirm(`#${t} 태그를 삭제할까요?${u ? `\n(${u}곳에서 태그만 빠지고 맛집은 그대로예요)` : ''}`)) return;
    tags.splice(i, 1); saveTags();
    await retagPlaces(ts => ts.filter(x => x !== t));
  }
  renderTagList(); render();
};
const addTagFromSheet = () => { const t = addTag($('#tNew').value); $('#tNew').value = ''; if (t) { renderTagList(); render(); } };
$('#tNewBtn').onclick = addTagFromSheet;
$('#tNew').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); addTagFromSheet(); } });
$('#mTags').onclick = openTagSheet;

$('#search').oninput =e => { query = e.target.value.trim().toLowerCase(); render(); };
const smallChk = $('#smallChk'), namesChk = $('#namesChk');
smallChk.checked = LS.get('small', false); namesChk.checked = LS.get('names', true);
const applyView = () => { board.classList.toggle('small', smallChk.checked); board.classList.toggle('shownames', namesChk.checked); LS.set('small', smallChk.checked); LS.set('names', namesChk.checked); };
smallChk.onchange = namesChk.onchange = applyView;

/* ---------- 제목 / 메뉴 ---------- */
const titleEl = $('#title');
const setTitle = t => { titleEl.textContent = t; document.title = t; };
setTitle(LS.get('title', '맛집 티어리스트'));
const rename = () => {
  const t = prompt('티어리스트 제목', titleEl.textContent);
  if (t && t.trim()) { setTitle(t.trim().slice(0, 30)); LS.set('title', titleEl.textContent); }
};
titleEl.onclick = rename;
$('#menuBtn').onclick = () => openSheet($('#menuSheet'));
$('#mRename').onclick = () => { closeSheet(); rename(); };
$('#mExport').onclick = () => {
  const data = JSON.stringify({ app: 'matzip-tier', v: 1, title: titleEl.textContent, tags, exportedAt: new Date().toISOString(), places }, null, 0);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
  a.download = `맛집티어_${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  closeSheet(); toast(`${places.length}곳 백업했어요`);
};
$('#mImport').onclick = () => $('#importFile').click();
$('#importFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    if (!Array.isArray(j.places)) throw 0;
    const clean = j.places.filter(p => p && p.id && p.name && p.stars >= 1 && p.stars <= 5);
    if (!confirm(`${clean.length}곳을 불러올까요? (같은 항목은 덮어써요)`)) return;
    await DB.putMany(clean);
    places = await DB.all();
    if (Array.isArray(j.tags)) j.tags.forEach(addTag);
    mergeTagsFromPlaces();
    if (j.title) { setTitle(j.title); LS.set('title', j.title); }
    render(); closeSheet(); toast('불러왔어요');
  } catch { toast('백업 파일을 읽지 못했어요'); }
};
$('#mReset').onclick = async () => {
  if (!confirm('모든 맛집을 삭제할까요? 되돌릴 수 없어요.')) return;
  await DB.clear(); places = []; render(); closeSheet(); toast('전체 삭제했어요');
};

let toastT;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ---------- 시작 ---------- */
(async () => {
  applyView(); setRegion(region);
  try { places = await DB.all(); } catch { toast('저장소를 열 수 없어요 (비공개 모드?)'); }
  if (!LS.get('tags', null)) saveTags();
  mergeTagsFromPlaces();
  render();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
})();
</script>
