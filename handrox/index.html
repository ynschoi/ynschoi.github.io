<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>HANDROX · 손가락으로 뛰는 하이록스</title>
<meta name="description" content="The fitness race for fingers. 8 runs, 8 workouts, two fingers. 손가락 두 개로 완주하는 하이록스 게임.">
<link rel="canonical" href="https://ynschoi.github.io/handrox/">
<meta property="og:title" content="HANDROX · The fitness race for fingers">
<meta property="og:description" content="8 runs, 8 workouts, two fingers. 손가락으로 뛰는 하이록스.">
<meta property="og:image" content="https://ynschoi.github.io/handrox/og.png">
<meta property="og:url" content="https://ynschoi.github.io/handrox/">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0c0c10">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<style>
  /* 게임보이 3단 (Moti와 같은 틀): 정보창 / 경기장 / 손가락 패드 — 한 화면 고정 */
  :root{
    --night:#0c0c10; --panel:#17171e; --edge:#3a3a48; --gold:#ffd400; --red:#e5391f; --dim:#8d8da0; --ink:#e4e4ee; --green:#35c46a;
    --px:'Galmuri11','Galmuri9',ui-monospace,monospace; --font:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  html,body{height:100%;background:#000;overflow:hidden;overscroll-behavior:none;touch-action:none}
  body{font-family:var(--px);color:#fff;-webkit-tap-highlight-color:transparent}
  button{all:unset;cursor:pointer;touch-action:manipulation}
  button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .app{position:relative;max-width:440px;margin:0 auto;display:grid;grid-template-rows:auto 252px auto;grid-template-columns:minmax(0,1fr);width:100%;background:var(--night);transform-origin:50% 0}

  /* ═══ 위: 정보창 ═══ */
  .info{padding:10px 12px 8px;display:flex;flex-direction:column;gap:8px}
  .bar1{display:flex;align-items:center;gap:10px}
  .face{width:46px;height:46px;border:2px solid var(--gold);background:#22222c;flex:none}
  .clk{flex:1;min-width:0}
  .clk small{display:block;font-size:10px;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .clk b{display:block;font-size:26px;font-weight:400;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:1px}
  .total{text-align:right;font-size:9px;color:var(--dim);line-height:1.3;flex:none}
  .total b{display:block;font-size:15px;color:var(--gold);font-weight:400;font-variant-numeric:tabular-nums}
  .chips{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
  .chip{display:flex;flex-direction:column;gap:3px}
  .chip i{height:4px;background:#2a2a36}
  .chip em{font-style:normal;font-size:9px;text-align:center;padding:3px 0;border:1.5px solid #2a2a36;color:#5c5c70;white-space:nowrap;overflow:hidden}
  .chip.r i,.chip.done i{background:var(--gold)}
  .chip.rn i{background:var(--gold);animation:blink .5s steps(1) infinite}
  .chip.done em{background:var(--gold);border-color:var(--gold);color:#111}
  .chip.on em{border-color:#fff;color:#fff;animation:blink .5s steps(1) infinite}
  @keyframes blink{50%{opacity:.35}}
  .win{height:92px;border:3px solid #fff;box-shadow:0 0 0 3px var(--night),0 0 0 5px var(--edge);background:linear-gradient(#1c1c26,#121218);padding:9px 12px;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:5px}
  .win .ttl{font-size:14px;font-weight:700;color:var(--gold);display:flex;justify-content:space-between;gap:8px;white-space:nowrap}
  .win .ttl span:last-child{color:var(--dim);font-weight:400;font-size:11px}
  .win p{font:13px/1.3 var(--font);color:var(--ink);min-height:18px}
  .win .tr{height:10px;border:1.5px solid #fff;background:#2a1418;position:relative;overflow:hidden}
  .win .fl{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(#ffe866,#f5a623)}
  .win .tr b{position:absolute;inset:0;font-size:8px;font-weight:400;line-height:7px;text-align:center;color:#fff;mix-blend-mode:difference}

  /* ═══ 가운데: 경기장 ═══ */
  .game{position:relative;overflow:hidden;background:#111;border-top:3px solid #fff;border-bottom:3px solid #fff}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block}
  .tb{position:absolute;top:8px;z-index:9;font:700 10px var(--px);color:#fff;background:#0c0c10cc;border:2px solid var(--gold);padding:3px 6px}
  #snd{right:8px}#hlp{right:56px}#lng{right:82px}#rst{left:8px}.tb[hidden]{display:none}
  .banner{position:absolute;left:0;right:0;top:20%;z-index:15;text-align:center;font-size:30px;font-weight:700;color:var(--gold);-webkit-text-stroke:2px #111;text-shadow:4px 4px 0 var(--red);opacity:0;transform:scale(.5);transition:.15s;pointer-events:none}
  .banner.on{opacity:1;transform:scale(1)}
  .ov{position:absolute;inset:0;z-index:12;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:#0c0c10d0;text-align:center;padding:0 16px;pointer-events:none}
  .ov[hidden]{display:none}
  .ov .t{font-size:12px;color:var(--dim)}
  .ov .g{font-size:26px;font-weight:700;color:var(--gold);-webkit-text-stroke:1.5px #111;text-shadow:3px 3px 0 var(--red)}
  .ov .s{font:14px/1.5 var(--font);color:#fff}
  .ov .k{font-size:15px;color:var(--gold);border:2px solid var(--gold);padding:4px 10px;margin-top:2px}
  .cover{position:absolute;inset:0;z-index:20;background:#0c0c10d8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;cursor:pointer}
  .cover[hidden]{display:none}
  .cover .logo{width:66%;max-width:280px;height:auto;display:block}
  .cover .tag{font-size:15px;color:#fff;text-shadow:2px 2px 0 #000}
  .cover .city{font-size:26px;font-weight:700;letter-spacing:10px;margin:-6px -10px 0 0;color:#fff;line-height:1;transform:skewX(-9deg)}
  .cover{gap:5px}
  [hidden]{display:none!important}
  .cover .sub{font-size:10px;color:#111;background:var(--gold);padding:2px 8px;letter-spacing:1px}
  .cover .ins{font-size:14px;animation:blink 1s steps(1) infinite;margin-top:2px}
  .cover .note{display:none}
  .lsel{display:flex;gap:8px;margin:2px 0}
  .lsel button{font:700 12px var(--px);color:#fff;padding:6px 12px;border:2px solid var(--dim);background:#0c0c10;box-shadow:0 3px 0 #000}
  .lsel button.on{border-color:var(--gold);color:#111;background:var(--gold)}

  /* ═══ 아래: 손가락 패드 ═══ */
  .pad{background:linear-gradient(#22222c,#14141a);padding:10px 12px 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px;touch-action:none;cursor:pointer}
  .hint{grid-column:1/-1;height:30px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;color:var(--gold);letter-spacing:1px;white-space:nowrap;pointer-events:none}
  .hint small{font-size:10px;color:var(--dim);letter-spacing:0}
  .fp{height:140px;border:3px solid #111;border-radius:22px;background:radial-gradient(circle at 50% 42%,#3a3a48,#24242e 70%);box-shadow:inset 0 -8px 0 #1a1a22,0 6px 0 #000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;pointer-events:none;position:relative;transition:transform .05s}
  .fp b{font-size:34px;font-weight:700;color:#55556a;line-height:1}
  .fp small{font-size:10px;color:#55556a}
  .fp::before{content:"";position:absolute;width:74px;height:92px;border-radius:50%;border:2px dashed #44445a;opacity:.6}
  .fp.on{transform:translateY(4px);background:radial-gradient(circle at 50% 42%,#ffe866,#f5a623 75%);box-shadow:inset 0 -4px 0 #b97a10,0 2px 0 #000}
  .fp.on b,.fp.on small{color:#111}.fp.on::before{border-color:#111}
  /* 에르그 손잡이: 손가락을 따라 움직임 */
  .fp{overflow:hidden}
  .fp .hd{display:none;position:absolute;left:50%;top:22px;width:70px;height:18px;margin-left:-35px;border-radius:9px;background:#111;border:2px solid var(--gold);box-shadow:0 3px 0 #000;z-index:1}
  .fp .hd::before{content:"";position:absolute;background:#cfcfd8}
  .pad.ski .hd,.pad.row .hd{display:block}
  .pad.ski .hd::before{left:50%;bottom:100%;width:2px;height:200px;margin-left:-1px}
  .pad.row .hd{top:50%;left:68%;width:18px;height:70px;margin:-35px 0 0 -9px}
  .pad.row .hd::before{left:100%;top:50%;height:2px;width:300px;margin-top:-1px}
  .pad.ski .fp::before,.pad.row .fp::before{display:none}
  .pad.ski .fp b,.pad.row .fp b{font-size:20px;opacity:.5;margin-top:54px}.pad.row .fp b{margin-top:84px}
  .pad.ski .fp small,.pad.row .fp small{display:none}
  .fp.want{border-color:var(--gold)}.fp.want b{color:var(--gold)}

  /* 결과 · 도움말 */
  .help{position:absolute;inset:0;z-index:30;background:#0c0c10f2;display:flex;align-items:center;justify-content:center;padding:16px}
  .help[hidden]{display:none}
  .help>div{border:3px solid #fff;padding:14px 16px;background:var(--panel);max-width:360px;width:100%;font:13px/1.6 var(--font);color:var(--ink)}
  .help h3{font:700 15px var(--px);color:var(--gold);margin-bottom:6px}
  .help b{color:#fff}
  .help small{display:block;margin-top:10px;font:10px var(--px);color:var(--dim);text-align:center}
  .help .rs{display:inline-block;margin-top:8px;font:10px var(--px);color:#ff9a9a;border:1px solid #ff9a9a;padding:3px 7px}
  .res{text-align:center}
  #fePrev{display:block;width:192px;height:192px;margin:4px auto 8px;border:3px solid var(--gold);background:#000;image-rendering:pixelated;touch-action:none;cursor:grab}
  #feZoom{width:192px;margin-bottom:6px;accent-color:var(--gold);touch-action:pan-x}
  .cover #fsel button{padding:4px 10px;font-size:11px}
  .res .rk{font:700 13px var(--px);color:#111;background:var(--gold);display:inline-block;padding:3px 10px}
  .res .tm{font:700 40px var(--px);color:var(--gold);text-shadow:3px 3px 0 var(--red);line-height:1.2;font-variant-numeric:tabular-nums}
  .res .pbn{font:12px var(--px);color:var(--dim);margin-bottom:8px}.res .pbn.new{color:var(--green)}
  .res table{width:100%;border-collapse:collapse;font:12px var(--px);margin:4px 0 10px}
  .res td{padding:3px 4px;border-top:1px solid #2a2a36;text-align:left}
  .res td:nth-child(2),.res td:nth-child(3){text-align:right;font-variant-numeric:tabular-nums}
  .res td:nth-child(3){color:var(--dim);width:74px}.res td.up{color:var(--green)}
  .res .row{display:flex;gap:8px;justify-content:center}
  .res .row button{font:700 13px var(--px);padding:9px 14px;border:2px solid var(--gold);background:#0c0c10;color:#fff;box-shadow:0 3px 0 #000}
  .res .row button.y{background:var(--gold);color:#111}
  .res .row button:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
  @media (prefers-reduced-motion:reduce){.cover .ins,.chip.on em,.chip.rn i{animation:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <section class="info">
    <div class="bar1">
      <canvas class="face" id="face" width="92" height="92"></canvas>
      <div class="clk"><small id="segNo">HANDROX</small><b id="clock">0:00:00</b></div>
      <div class="total">BEST<b id="pb">-</b></div>
    </div>
    <div class="chips" id="chips"></div>
    <div class="win" id="win">
      <div class="ttl"><span id="wT"></span><span id="wN"></span></div>

      <div class="tr"><span class="fl" id="wF"></span><b id="wB"></b></div>
    </div>
  </section>

  <section class="game" id="game">
    <canvas id="cv" width="640" height="340"></canvas>
    <button class="tb" id="rst" type="button" hidden>↺</button>
    <button class="tb" id="lng" type="button">KO</button>
    <button class="tb" id="hlp" type="button">?</button>
    <button class="tb" id="snd" type="button">♪ ON</button>
    <div class="banner" id="banner"></div>
    <div class="ov" id="ov" hidden></div>
    <div class="cover" id="cover">
      <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 136" role="img" aria-label="HANDROX"><g transform="translate(34,18) skewX(-9)"><path transform="translate(7,7)" fill="#e5391f" fill-rule="evenodd" d="M0,0H26V37H64V0H90V100H64V63H26V100H0Z"/><path transform="translate(107,7)" fill="#e5391f" fill-rule="evenodd" d="M0,100L28,0H62L90,100H62L57,80H33L28,100ZM38,58H52L45,28Z"/><path transform="translate(207,7)" fill="#e5391f" fill-rule="evenodd" d="M0,0H30L62,52V0H90V100H60L28,48V100H0Z"/><path transform="translate(307,7)" fill="#e5391f" fill-rule="evenodd" d="M0,0H50Q90,0 90,50Q90,100 50,100H0ZM26,24H48Q64,24 64,50Q64,76 48,76H26Z"/><path transform="translate(407,7)" fill="#e5391f" fill-rule="evenodd" d="M0,0H56Q90,0 90,32Q90,54 70,61L92,100H62L44,66H26V100H0ZM26,22H52Q63,22 63,33Q63,44 52,44H26Z"/><path transform="translate(507,7)" fill="#e5391f" fill-rule="evenodd" d="M30,0H60Q90,0 90,30V70Q90,100 60,100H30Q0,100 0,70V30Q0,0 30,0ZM34,24H56Q64,24 64,32V68Q64,76 56,76H34Q26,76 26,68V32Q26,24 34,24Z"/><path transform="translate(0,0)" fill="#ffd400" fill-rule="evenodd" d="M0,0H26V37H64V0H90V100H64V63H26V100H0Z"/><path transform="translate(100,0)" fill="#ffd400" fill-rule="evenodd" d="M0,100L28,0H62L90,100H62L57,80H33L28,100ZM38,58H52L45,28Z"/><path transform="translate(200,0)" fill="#ffd400" fill-rule="evenodd" d="M0,0H30L62,52V0H90V100H60L28,48V100H0Z"/><path transform="translate(300,0)" fill="#ffd400" fill-rule="evenodd" d="M0,0H50Q90,0 90,50Q90,100 50,100H0ZM26,24H48Q64,24 64,50Q64,76 48,76H26Z"/><path transform="translate(400,0)" fill="#ffd400" fill-rule="evenodd" d="M0,0H56Q90,0 90,32Q90,54 70,61L92,100H62L44,66H26V100H0ZM26,22H52Q63,22 63,33Q63,44 52,44H26Z"/><path transform="translate(500,0)" fill="#ffd400" fill-rule="evenodd" d="M30,0H60Q90,0 90,30V70Q90,100 60,100H30Q0,100 0,70V30Q0,0 30,0ZM34,24H56Q64,24 64,32V68Q64,76 56,76H34Q26,76 26,68V32Q26,24 34,24Z"/><g transform="translate(606,0)"><line x1="10" y1="88" x2="84" y2="10" stroke="#14121a" stroke-width="40" stroke-linecap="round"/><line x1="10" y1="88" x2="84" y2="10" stroke="#d8a983" stroke-width="30" stroke-linecap="round"/><rect x="-9" y="-8" width="15" height="16" rx="5" fill="#fff" opacity=".75" transform="translate(84,10) rotate(-51.66665989090137)"/><line x1="84" y1="88" x2="10" y2="10" stroke="#14121a" stroke-width="40" stroke-linecap="round"/><line x1="84" y1="88" x2="10" y2="10" stroke="#f6ceaa" stroke-width="30" stroke-linecap="round"/><rect x="-9" y="-8" width="15" height="16" rx="5" fill="#fff" opacity=".75" transform="translate(10,10) rotate(-128.33334010909863)"/></g></g></svg>
      <div class="city" id="city">PHONE</div>
      <div class="tag" id="cTag"></div>
      <div class="sub">THE WORLD SERIES OF FINGER RACING</div>
      <div class="lsel" id="lsel"><button type="button" data-l="ko">한국어</button><button type="button" data-l="en">English</button></div>
      <div class="lsel" id="fsel"><button type="button" id="faceBtn"></button><button type="button" id="feDel" hidden>✕</button></div>

  </section>

  <section class="pad" id="pad">
    <div class="hint" id="hint"></div>
    <div class="fp" id="pL"><i class="hd"></i><b>L</b><small id="pLs"></small></div>

  <div class="help" id="help" hidden><div id="helpBody"></div></div>
  <input type="file" id="faceFile" accept="image/*" hidden>

    <input type="range" id="feZoom" min="1" max="6" step="0.05" value="1.6" aria-label="zoom"><div class="pbn" id="feN"></div>
    <div class="row"><button type="button" id="feNo"></button><button type="button" class="y" id="feOk"></button></div></div></div>
  <div class="help" id="result" hidden><div class="res" id="resBody"></div></div>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const SHARE_URL='https://ynschoi.github.io/handrox/';
/* 경기 시계: 구간마다 배속(rate)이 달라요. 무난하게 잘했을 때 실제 하이록스 스플릿이 나오도록 맞춘 값.
   (달리기 1km ≈ 5:00, 스키 4:30, 푸시 3:00, 풀 4:30, 버피 5:00, 로잉 4:45, 캐리 2:00, 런지 4:30, 월볼 6:00 → 합계 1시간 15분쯤) */

/* ═════════ 저장 ═════════ */
const KEY='handrox.v3';   // v2: 시계 60배속으로 바뀌어 예전 기록과 섞이지 않게
let SAVE={pb:0,splits:null,races:0};
try{Object.assign(SAVE,JSON.parse(localStorage.getItem(KEY)||'{}'));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(SAVE));}catch(e){}}

/* ═════════ 언어 ═════════ */
let lang='en';try{lang=localStorage.getItem('handrox.lang')||((navigator.language||'').startsWith('ko')?'ko':'en');}catch(e){}
const L=(ko,en)=>lang==='ko'?ko:en;

/* ═════════ 소리 ═════════ */
let sound=true,AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d=.08,type='square',v=.06,slide=0,delay=0){if(!sound)return;const c=ac();if(!c)return;const t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.02);}
function noise(d=.2,v=.08,freq=800,delay=0){if(!sound)return;const c=ac();if(!c)return;const t=c.currentTime+delay,n=Math.floor(c.sampleRate*d),b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);
  for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=freq;g.gain.value=v;s.connect(f).connect(g).connect(c.destination);s.start(t);}
const SFX={
  step:s=>{tone(s==='L'?196:247,.05,'square',.04,-60);noise(.03,.03,1500);},
  pull:()=>{noise(.14,.07,1400);tone(140,.1,'triangle',.05,90);},
  shove:()=>{noise(.16,.09,500);tone(90,.12,'square',.05,-30);},
  good:()=>tone(660,.08,'square',.05),
  perfect:()=>{tone(880,.07,'square',.05);tone(1320,.12,'square',.05,0,.06);},
  bad:()=>tone(120,.14,'sawtooth',.05,-50),
  tick:()=>tone(1000,.02,'square',.025),
  beep:()=>tone(440,.12,'square',.06),
  go:()=>tone(880,.3,'square',.06),
  done:()=>[523,659,784].forEach((f,i)=>tone(f,.09,'square',.05,0,i*.07)),
  drop:()=>{noise(.3,.12,300);tone(70,.25,'sine',.12,-30);},
  charge:p=>tone(200+p*500,.04,'triangle',.03),
  jump:()=>tone(300,.18,'square',.04,500),
  ball:()=>tone(520,.06,'triangle',.05,200),
  thud:()=>noise(.06,.07,900),
  finish:()=>[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,i===6?.5:.12,'square',.06,0,i*.11)),
};

const cv=$('cv'),mainCtx=cv.getContext('2d');mainCtx.scale(2,2);

const W=320,H=170,FL=142;
const SK='#f6ceaa',SK2='#d8a983',OL='#14121a';
function rr(x,y,w,h,r,fill,stroke=OL){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();
  c.fillStyle=fill;c.fill();if(stroke){c.strokeStyle=stroke;c.lineWidth=1.5;c.stroke();}}
function line(pts,w,col,ol=1){c.lineCap='round';c.lineJoin='round';c.beginPath();c.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)c.lineTo(pts[i],pts[i+1]);
  if(ol){c.strokeStyle=OL;c.lineWidth=w+2.5;c.stroke();}c.strokeStyle=col;c.lineWidth=w;c.stroke();}
function disc(x,y,r,fill,stroke=OL){c.beginPath();c.arc(x,y,r,0,7);c.fillStyle=fill;c.fill();if(stroke){c.strokeStyle=stroke;c.lineWidth=1.5;c.stroke();}}
function txt(t,x,y,size=12,col='#fff',al='center'){c.font=`bold ${size}px Galmuri11, monospace`;c.textAlign=al;c.lineWidth=3;c.lineJoin='round';c.strokeStyle='#111';c.strokeText(t,x,y);c.fillStyle=col;c.fillText(t,x,y);}
function gauge(x,y,w,h,p,col){c.fillStyle='#111';c.fillRect(x-2,y-2,w+4,h+4);c.fillStyle='#3a1418';c.fillRect(x,y,w,h);c.fillStyle=col;c.fillRect(x,y,w*clamp(p,0,1),h);}

/* ═════════ 내 얼굴: 사진 → 16×16 픽셀아트 → 손바닥에. 사진은 이 브라우저 밖으로 나가지 않음 ═════════ */
let FACE=null;const FKEY='handrox.face',FN=16;
function pixelate(img,cx,cy,size){let src=img,sx=cx-size/2,sy=cy-size/2,sw=size;
  for(let n=128;n>=FN;n/=2){const t=document.createElement('canvas');t.width=t.height=n;const x=t.getContext('2d');x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';x.drawImage(src,sx,sy,sw,sw,0,0,n,n);src=t;sx=sy=0;sw=n;}
  const x=src.getContext('2d'),d=x.getImageData(0,0,FN,FN),a=d.data;
  for(let i=0;i<a.length;i+=4){for(let k=0;k<3;k++)a[i+k]=Math.round(clamp((a[i+k]-128)*1.25+136,0,255)/42.5)*42.5;      // 대비 올리고 색 단계 줄이기
    const px=(i/4)%FN,py=Math.floor(i/4/FN);if(Math.min(px,FN-1-px)+Math.min(py,FN-1-py)<2)a[i+3]=0;}                       // 모서리 둥글게
  x.putImageData(d,0,0);return src;}

/* 경기장 배경: off = 지나온 거리(px) */
function scene(off=0){
  c.fillStyle='#101016';c.fillRect(0,0,W,FL);
  c.fillStyle='#1a1a22';for(let x=-(off*.15%40);x<W;x+=40){c.fillRect(x,0,2,60);}            // 트러스
  c.fillStyle='#22222c';c.fillRect(0,14,W,3);
  for(let i=0;i<4;i++){const x=40+i*80;c.fillStyle='#ffd40018';c.beginPath();c.moveTo(x,17);c.lineTo(x-26,FL);c.lineTo(x+26,FL);c.fill();c.fillStyle='#ffd400';c.fillRect(x-3,15,6,3);}
  const o3=off*.35,k=Math.floor(o3/14);                                                      // 관중
  for(let i=-1;i<25;i++){const n=i+k,x=i*14-(o3%14),h=((n*7)%5+5)%5;c.fillStyle=['#3b3850','#4b4766','#302d42','#5a5470'][((n%4)+4)%4];c.fillRect(x+2,84-h,10,24+h);c.fillRect(x+4,78-h,6,7);}
  const o6=off*.7;                                                                           // 광고판
  c.fillStyle='#0c0c10';c.fillRect(0,104,W,22);
  for(let x=-(o6%128)-128;x<W;x+=128){c.fillStyle='#ffd400';c.fillRect(x+4,107,88,16);c.font='bold 11px Galmuri11, monospace';c.textAlign='center';c.fillStyle='#111';c.fillText('HANDROX',x+48,119);c.fillStyle='#e5391f';c.fillRect(x+98,107,22,16);}
  c.fillStyle='#2b2b33';c.fillRect(0,FL-16,W,16);                                            // 바닥
  c.fillStyle='#34343e';c.fillRect(0,FL,W,H-FL);c.fillStyle='#ffd400';c.fillRect(0,FL+1,W,2);
  c.fillStyle='#4a4a58';for(let x=-(off%32);x<W;x+=32)c.fillRect(x,FL+8,14,3);
  c.fillStyle='#26262e';c.fillRect(0,FL+16,W,H-FL-16);
}

/* 주인공: 검지·중지로 달리는 손. (x, y)=발끝이 닿는 바닥. 엄지 끝 좌표를 돌려줌 */
function leg(hx,hy,fx,fy,col){const Ln=10;let dx=fx-hx,dy=fy-hy,d=Math.hypot(dx,dy)||.01;if(d>Ln*2-.2){const k=(Ln*2-.2)/d;dx*=k;dy*=k;d=Ln*2-.2;fx=hx+dx;fy=hy+dy;}
  const h=Math.sqrt(Ln*Ln-d*d/4),kx=hx+dx/2+dy/d*h,ky=hy+dy/2-dx/d*h;line([hx,hy,kx,ky,fx,fy],6,col);
  c.fillStyle='#fff8';c.fillRect(fx+1,fy-2,2,2);}                                             // 손톱
function hero(x,y,o={}){const ph=o.ph||0,cr=o.cr||0,lean=o.lean||0,arm=o.arm==null?.6:o.arm,up=o.up||0,st=o.st==null?9:o.st,back=o.back||0,sh=o.sh?(Math.random()-.5)*o.sh:0;
  x+=sh;const hy=y-17+cr*9-up;
  const foot=i=>{const p=ph+i*Math.PI;return [x-back+Math.sin(p)*st+(i?-2:2),y-up*(o.tuck?.5:1)-Math.max(0,Math.cos(p))*5*Math.min(1,st/9)];};
  const f0=foot(1),f1=foot(0);
  leg(x-3,hy,f0[0],f0[1],SK2);
  c.save();c.translate(x,hy);c.rotate(lean);
  rr(-6,-29,12,12,2,SK);                                           // 손목
  rr(-7.5,-27,15,5,1,'#ffd400');                                   // 손목밴드
  disc(-8,-2,4.5,SK2);disc(-4,0,4.5,SK2);                          // 접은 약지·새끼
  rr(-10,-20,20,21,6,SK);                                          // 손바닥(몸)
  if(FACE){c.imageSmoothingEnabled=false;c.drawImage(FACE,-8,-19,16,16);c.imageSmoothingEnabled=true;if(o.dead){c.fillStyle='#fff';c.fillRect(-5,-8,10,1.5);}}
  else{c.fillStyle=OL;if(o.dead){c.fillRect(2,-13,3,1.5);c.fillRect(6,-13,3,1.5);}else{c.fillRect(3,-14,2,3);c.fillRect(7,-14,2,3);}
  c.fillStyle='#e58a7a';c.fillRect(0,-9,2,1.5);}
  const tx=8+Math.cos(arm)*10,ty=-9+Math.sin(arm)*10;line([7,-9,tx,ty],5,SK); // 엄지
  c.restore();
  leg(x+3,hy,f1[0],f1[1],SK);
  const cs=Math.cos(lean),sn=Math.sin(lean);return {tx:x+tx*cs-ty*sn,ty:hy+tx*sn+ty*cs,hy};}
function kettle(x,y){line([x-3,y-1,x-3,y-6,x+3,y-6,x+3,y-1],2,'#bbb',1);disc(x,y+4,6,'#26262e');c.fillStyle='#ffd400';c.fillRect(x-3,y+3,6,2);}
function sled(x,w=0){rr(x,FL-7,44,7,2,'#ffd400');c.fillStyle='#555';c.fillRect(x+4,FL-36,4,30);c.fillRect(x+36,FL-36,4,30);
  for(let i=0;i<3+w;i++)rr(x+13,FL-13-i*6,18,6,1,i%2?'#3a3a46':'#1c1c24');}

/* 떠오르는 글자 */
const FX=[];
function fx(t,col='#ffd400',x=120,y=70,size=13){FX.push({t,col,x,y,size,a:0});}
function drawFX(dt){for(let i=FX.length-1;i>=0;i--){const f=FX[i];f.a+=dt;if(f.a>.7){FX.splice(i,1);continue;}c.globalAlpha=1-Math.max(0,f.a-.4)/.3;txt(f.t,f.x,f.y-f.a*30,f.size,f.col);c.globalAlpha=1;}}
const grade=(g,x,y)=>{if(g===2){fx('PERFECT','#ffd400',x,y);SFX.perfect();}else if(g===1){fx('GOOD','#35c46a',x,y);SFX.good();}else{fx(L('아쉽','WEAK'),'#aaa',x,y,11);SFX.thud();}};

/* ═════════ 입력 상태 ═════════ */
const held={L:0,R:0};
const both=()=>held.L>0&&held.R>0;
const other=s=>s==='L'?'R':'L';

/* ═════════ 종목 ═════════
   p=진행량, need=목표. down(side) · up(side) · swipe(side,dir) 로 손가락 입력을 받음 */
const add=(s,n)=>{s.p=Math.min(G.seg.need,s.p+n);};
const RUN={id:'run',rate:188,need:1000,unit:'m',pxu:.8,nm:['달리기','RUN'],hint:'L ▸ R ▸ L ▸ R',
  how:['L·R 번갈아 탭! 두 손가락으로 달려요','Alternate L·R taps. Run on two fingers!'],
  init(s){s.last=null;s.ph=0;s.tph=0;s.stum=0;},
  down(s,side){if(s.last===side){s.stum=.2;SFX.bad();fx(L('번갈아!','ALTERNATE!'),'#ff8a7a',120,66,11);return;}s.last=side;add(s,100);s.tph+=Math.PI;SFX.step(side);},
  update(s,dt){s.ph+=(s.tph-s.ph)*Math.min(1,dt*20);s.stum=Math.max(0,s.stum-dt);},

    hero(110,FL,{ph:s.ph,lean:.18,arm:.6+Math.sin(s.ph)*.7,sh:s.stum?3:0});}};
/* ═════════ 에르그(스키·로잉) 공통 ═════════
   손잡이를 잡은 채 당긴 길이만큼 전진. 끝까지 당기면 되돌아와야 다시 당길 수 있음 (그래서 원을 그리게 됨).
   손가락 하나 = 한 번에 최대 62m, 두 손잡이 다 잡고 길게 당기면 124m. 초당 2번쯤 돌리면 2:00/500m */
const ERG={LEN:62,PER:62,
  init(s){s.pos={L:0,R:0};s.arm={L:1,R:1};s.ls={L:-9,R:-9};s.acc=0;s.v=0;s.k=0;s.kf=0;s.sr=0;s.lst=-9;s.snd=-9;s.vd=0;s.pp=0;s.pt=0;},
  grab(s,side){s.pos[side]=0;s.arm[side]=1;},
  stroke(s,side){const d=s.t-s.ls[side];s.ls[side]=s.t;if(d>.12&&d<2)s.sr=1/d;s.lst=s.t;
    if(s.t-s.pt>.2){if(s.pt>0||s.p>0)s.vd=(s.p-s.pp)/(s.t-s.pt);s.pp=s.p;s.pt=s.t;} /* 모니터 페이스는 스트로크마다 갱신 */
    if(s.t-s.snd>.1){s.snd=s.t;SFX.pull();}},
  pull(s,side,d){const f=d/this.LEN,q=s.pos[side];
    if(f>0){const e=Math.min(f,1-q);if(e>0){add(s,e*this.PER);s.acc+=e*this.PER;}if(s.arm[side]&&q+f>.35){s.arm[side]=0;this.stroke(s,side);}}
    else if(q+f<.3)s.arm[side]=1;
    s.pos[side]=clamp(q+f,0,1);},
  key(s,m){add(s,m);s.acc+=m;s.kf=1;this.stroke(s,'L');},
  tick(s,dt){s.v+=(s.acc/dt-s.v)*Math.min(1,dt*2.2);s.acc=0;if(s.t-s.lst>1.3)s.sr=s.vd=0;
    const h=['L','R'].filter(x=>held[x]>0),t=h.length?h.reduce((a,x)=>a+s.pos[x],0)/h.length:0;s.k+=(t-s.k)*Math.min(1,dt*(h.length?30:6));
    if(s.kf>0){s.kf=Math.max(0,s.kf-dt*3.5);s.k=Math.max(s.k,s.kf);}}};
/* 에르그 모니터: 남은 거리 · /500m 페이스 · 분당 스트로크 · 와트 (경기 시계 기준) */
function monitor(x,y,s,need){const w=116,h=76,ink='#17210f',mmss=v=>`${Math.floor(v/60)}:${String(Math.floor(v%60)).padStart(2,'0')}`;
  rr(x-4,y-4,w+8,h+8,5,'#22222a');rr(x,y,w,h,2,'#b9c6a2',null);c.fillStyle='#22222a';c.fillRect(x+w/2-3,y+h+4,6,FL-y-h-4);
  const lt=(t,X,Y,sz,al='left')=>{c.font=`bold ${sz}px Galmuri11, monospace`;c.textAlign=al;c.fillStyle=ink;c.fillText(t,X,Y);};
  const R=G.seg.rate,pace=s.vd>25?clamp(500/s.vd*R,65,599):0,avg=s.p>20?500/(s.p/s.t)*R:0;
  lt(mmss(s.rt),x+5,y+13,11);lt(`${Math.min(60,Math.round(s.sr*21))} s/m`,x+w-5,y+13,10,'right');
  c.fillStyle=ink;c.fillRect(x+4,y+17,w-8,1);
  lt(String(Math.max(0,Math.ceil(need-s.p))),x+w-22,y+40,22,'right');lt('m',x+w-5,y+40,11,'right');
  lt(pace?mmss(pace):'-:--',x+w-38,y+57,15,'right');lt('/500m',x+w-5,y+57,9,'right');
  c.fillRect(x+4,y+61,w-8,1);
  lt(`${pace?Math.round(2.8/Math.pow(pace/500,3)):0} watt`,x+5,y+72,9);lt(`ave ${avg?mmss(Math.min(599,avg)):'-:--'}`,x+w-5,y+72,9,'right');}

  $('helpBody').innerHTML=helpHTML();document.querySelectorAll('#lsel button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));$('lng').textContent=l==='ko'?'EN':'KO';paintInfo();}
$('lsel').addEventListener('click',e=>{e.stopPropagation();const b=e.target.closest('button');if(b){SFX.tick();setLang(b.dataset.l);}});
$('lng').addEventListener('click',()=>{SFX.tick();setLang(lang==='ko'?'en':'ko');});
$('fsel').addEventListener('click',e=>e.stopPropagation());$('faceBtn').addEventListener('click',()=>$('faceFile').click());

function fitApp(){const app=$('app'),vh=(window.visualViewport&&visualViewport.height)||innerHeight;if(!vh)return;
  app.style.transform='';const avail=vh-4,s=Math.min(1,avail/app.scrollHeight);app.style.transform=s<1?`scale(${s})`:'';appScale=s;document.body.style.height=avail+'px';}
setTimeout(fitApp,300);if(window.visualViewport)visualViewport.addEventListener('resize',fitApp);addEventListener('resize',fitApp);

/* 얼굴 아이콘 */
const faceCtx=$('face').getContext('2d');faceCtx.scale(2.6,2.6);
function drawFaceIcon(){faceCtx.clearRect(0,0,92,92);c=faceCtx;hero(17,37,{ph:.9,arm:-.8,st:6});c=mainCtx;}
drawFaceIcon();
/* 얼굴 고르기: 드래그로 위치, 슬라이더로 확대 */
const FE={img:null,z:1.6,cx:0,cy:0,out:null};
function feSize(){return Math.min(FE.img.width,FE.img.height)/FE.z;}
function feDraw(){const z=feSize();FE.cx=clamp(FE.cx,z/2,FE.img.width-z/2);FE.cy=clamp(FE.cy,z/2,FE.img.height-z/2);FE.out=pixelate(FE.img,FE.cx,FE.cy,z);
  const x=$('fePrev').getContext('2d');x.imageSmoothingEnabled=false;x.clearRect(0,0,192,192);x.drawImage(FE.out,0,0,192,192);}
function faceBtnText(){$('faceBtn').textContent=FACE?L('📷 얼굴 바꾸기','📷 Change face'):L('📷 내 얼굴','📷 My face');$('feDel').hidden=!FACE;}
$('faceFile').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const im=new Image();
  im.onload=()=>{FE.img=im;FE.z=1.6;FE.cx=im.width/2;FE.cy=im.height*.42;$('feZoom').value=1.6;$('facePanel').hidden=false;feDraw();};
  im.onerror=()=>{$('faceBtn').textContent=L('사진을 못 읽었어요','Could not read photo');};im.src=URL.createObjectURL(f);});
$('feZoom').addEventListener('input',e=>{FE.z=+e.target.value;feDraw();});
{const pv=$('fePrev');let d=null;pv.addEventListener('pointerdown',e=>{d={x:e.clientX,y:e.clientY};try{pv.setPointerCapture(e.pointerId);}catch(_){}});
  pv.addEventListener('pointermove',e=>{if(!d||!FE.img)return;const k=feSize()/(pv.getBoundingClientRect().width||192);FE.cx-=(e.clientX-d.x)*k;FE.cy-=(e.clientY-d.y)*k;d={x:e.clientX,y:e.clientY};feDraw();});
  ['pointerup','pointercancel'].forEach(v=>pv.addEventListener(v,()=>{d=null;}));}
$('feOk').addEventListener('click',()=>{FACE=FE.out;try{localStorage.setItem(FKEY,FACE.toDataURL());}catch(e){}$('facePanel').hidden=true;drawFaceIcon();faceBtnText();});
$('feNo').addEventListener('click',()=>{$('facePanel').hidden=true;});
$('feDel').addEventListener('click',()=>{FACE=null;try{localStorage.removeItem(FKEY);}catch(e){}drawFaceIcon();faceBtnText();});
try{const u=localStorage.getItem(FKEY);if(u){const im=new Image();im.onload=()=>{const t=document.createElement('canvas');t.width=t.height=FN;t.getContext('2d').drawImage(im,0,0);FACE=t;drawFaceIcon();faceBtnText();};im.src=u;}}catch(e){}
/* 대회 이름: 폰이면 HANDROX PHONE, PC면 HANDROX HOME */
const VENUE=(navigator.maxTouchPoints>0||'ontouchstart' in window)?'PHONE':'HOME';$('city').textContent=VENUE;
setLang(lang);fitApp();requestAnimationFrame(loop);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitApp);
</script>
</body>
</html>
