<script>

const FIN={id:'fin',need:1,unit:'',nm:['결승','FINISH'],how:['완주! 축하해요','You finished!'],hint:'',P:[],init(s){s.t0=performance.now();s.p=1;s.dp=1;this.P=[];s.shown=0;},

    /* 결승 매트: 바닥에서 다가옴 */const m0=152,my=Y(m0),mk=K*m0/150;c.fillStyle='rgba(20,20,26,.92)';c.beginPath();c.moveTo(160-62*mk,my-10*K);c.lineTo(160+62*mk,my-10*K);c.lineTo(160+92*mk,my+12*K);c.lineTo(160-92*mk,my+12*K);c.closePath();c.fill();

    const e=Math.min(1,T/1.3),x=160,y=Y(132+25*e);H3.shadow(x,y-1,44*K*(.62+.38*e));if(run)H3.show('runf',x,y+Math.abs(Math.cos(T*14))*1.4,{ph:-T*14,z:K*(.62+.38*e)});else H3.show('fin',x,y,{k:0,z:K});

/* ═════════ 에르그(스키·로잉) 공통 ═════════
   손잡이를 잡은 채 당긴 길이만큼 전진. 끝까지 당기면 되돌아와야 다시 당길 수 있음 (그래서 원을 그리게 됨).
   손가락 하나 = 한 번에 최대 62m, 두 손잡이 다 잡고 길게 당기면 124m. 초당 2번쯤 돌리면 2:00/500m */
const ERG={LEN:62,PER:62,
  init(s){s.pos={L:0,R:0};s.arm={L:1,R:1};s.ls={L:-9,R:-9};s.acc=0;s.v=0;s.k=0;s.kf=0;s.sr=0;s.lst=-9;s.snd=-9;s.vd=0;s.pp=0;s.pt=0;},
  grab(s,side){this.judge(s);s.pos[side]=0;s.arm[side]=1;},
  /* 스트로크 판정(로잉만): 한 번 당길 때 끝까지(95%) 당기면 PERFECT, 75% 이상 GOOD. 손가락을 되돌리거나 새로 잡을 때 판정 */
  judge(s){if(!s.grading||!s.inStroke)return;s.inStroke=0;const g=s.peak>=.95?2:s.peak>=.75?1:0;grade(g,s.gx||110,s.gy||40);s.lg=g;s.streak=g===2?(s.streak||0)+1:0;
    if(s.streak>=3)fx(s.streak+' COMBO','#ffd400',s.gx||110,(s.gy||40)+14,9);},
  stroke(s,side){const d=s.t-s.ls[side];s.ls[side]=s.t;if(d>.12&&d<2)s.sr=1/d;if(s.t-s.lst>.25)(s.sts=s.sts||[]).push(s.t);s.lst=s.t;
    if(s.t-s.pt>.2){if(s.pt>0||s.p>0)s.vd=(s.p-s.pp)/(s.t-s.pt);s.pp=s.p;s.pt=s.t;} /* 모니터 페이스는 스트로크마다 갱신 */
    if(s.t-s.snd>.1){s.snd=s.t;SFX.pull();}},
  pull(s,side,d){const f=d/this.LEN,q=s.pos[side];
    if(f>0){const e=Math.min(f,1-q);if(e>0){add(s,e*this.PER);s.acc+=e*this.PER;}if(s.arm[side]&&q+f>.35){s.arm[side]=0;this.stroke(s,side);s.inStroke=1;s.peak=0;}}
    else if(q+f<.3){s.arm[side]=1;this.judge(s);}
    s.pos[side]=clamp(q+f,0,1);if(s.inStroke)s.peak=Math.max(s.peak,s.pos[side]);},
  key(s,m){add(s,m);s.acc+=m;s.kf=1;this.stroke(s,'L');if(s.grading){s.inStroke=1;s.peak=1;this.judge(s);}},
  tick(s,dt){s.v+=(s.acc/dt-s.v)*Math.min(1,dt*2.2);s.acc=0;if(s.t-s.lst>1.3)s.sr=s.vd=0;   /* 모니터용: 페이스는 속도의 느린 평균, s/m은 최근 6초 스트로크 수 (쉬면 천천히 떨어짐) */
    s.pv=(s.pv||0)+(s.v-(s.pv||0))*Math.min(1,dt*.8);s.sts=(s.sts||[]).filter(t=>s.t-t<6);s.spm=s.sts.length?Math.round(clamp(s.sts.length/Math.min(6,Math.max(1.5,s.t))*60,10,60)):0;
    const h=['L','R'].filter(x=>held[x]>0),t=h.length?h.reduce((a,x)=>a+s.pos[x],0)/h.length:0;s.k+=(t-s.k)*Math.min(1,dt*(h.length?30:6));
    if(s.kf>0){s.kf=Math.max(0,s.kf-dt*3.5);s.k=Math.max(s.k,s.kf);}}};
/* 에르그 모니터: 남은 거리 · /500m 페이스 · 분당 스트로크 · 와트 (경기 시계 기준) */

  const bx=X(a),by=m(.82,1)-2.6*u,bw=lw*.42,bh=5.2*u,pr=clamp(s.p/need,0,1);c.strokeStyle=ink;c.lineWidth=.8;c.strokeRect(bx,by,bw,bh);c.fillRect(bx,by,bw*pr,bh);
  lt(Math.floor(s.p)+'/'+need+'m',X(e),m(.82,1),7,'right');}

/* 메인 루프 */
let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;
  if(G&&G.seg){const s=G.s,seg=G.seg;
    if(G.state==='play'){G.clock+=dt*seg.rate;s.rt+=dt*seg.rate;s.t+=dt;seg.update(s,dt);$('clock').textContent=fmt(G.clock);}
    s.dp+=(s.p-s.dp)*Math.min(1,dt*12);if(s.p-s.dp<.01)s.dp=s.p;
    seg.draw(s);drawFX(dt);
    $('wF').style.width=(s.dp/seg.need*100)+'%';$('wB').textContent=`${Math.floor(s.p)} / ${seg.need}${unit(seg)}`;
    const w=G.state==='play'&&seg.want?seg.want(s):'';padCue(seg,s,w);
    if(seg.erg)for(const d of ['L','R'])$('p'+d).firstElementChild.style.transform=seg.id==='ski'?`translateY(${s.pos[d]*62}px)`:`translateX(${-s.pos[d]*62}px)`;
    if(G.state==='play'&&s.p>=seg.need)nextSeg();
  }else{idleT+=dt;scene(idleT*40);H3.show('run',150,FL,{ph:idleT*7});}
  drawCover(t);
  H3.frame(t);
  requestAnimationFrame(loop);}

/* ═════════ 손가락 입력 ═════════ */
const pad=$('pad'),ptr=new Map(),TH=24;
function press(side){held[side]++;$('p'+side).classList.add('on');if(G&&G.state==='play'&&G.seg.down)G.seg.down(G.s,side);}
function release(side){held[side]=Math.max(0,held[side]-1);if(!held[side])$('p'+side).classList.remove('on');if(G&&G.state==='play'&&G.seg.up)G.seg.up(G.s,side);}
function swipe(side,dir,key){if(G&&G.state==='play'&&G.seg.swipe)G.seg.swipe(G.s,side,dir,key);}
let appScale=1;
pad.addEventListener('pointerdown',e=>{if(e.target.closest('#phBar'))return;e.preventDefault();ac();if(!started)return start();try{pad.setPointerCapture(e.pointerId);}catch(_){}
  const r=pad.getBoundingClientRect(),side=e.clientX-r.left<r.width/2?'L':'R';ptr.set(e.pointerId,{side,x:e.clientX,y:e.clientY,lx:e.clientX,ly:e.clientY});press(side);});
pad.addEventListener('pointermove',e=>{const p=ptr.get(e.pointerId);if(!p)return;
  if(G&&G.state==='play'&&G.seg.move)G.seg.move(G.s,p.side,(e.clientX-p.lx)/appScale,(e.clientY-p.ly)/appScale);p.lx=e.clientX;p.ly=e.clientY;
  const dx=e.clientX-p.x,dy=e.clientY-p.y;
  if(Math.abs(dx)<TH&&Math.abs(dy)<TH)return;p.x=e.clientX;p.y=e.clientY;swipe(p.side,Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down'));});
['pointerup','pointercancel'].forEach(ev=>pad.addEventListener(ev,e=>{const p=ptr.get(e.pointerId);if(!p)return;ptr.delete(e.pointerId);release(p.side);}));
pad.addEventListener('contextmenu',e=>e.preventDefault());
/* 키보드: F/← = L, J/→ = R, ↓ = 아래로 쓸기 (좌우 자동 번갈아) */
const KEYS={f:'L',F:'L',ArrowLeft:'L',j:'R',J:'R',ArrowRight:'R'};let kdn={},kalt='L';
addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){if(!started){e.preventDefault();start();}return;}
  if(e.key==='ArrowUp'){e.preventDefault();if(!e.repeat)swipe('L','up',1);return;}
  if(e.key==='ArrowDown'){e.preventDefault();if(!e.repeat){swipe(kalt,'down',1);kalt=other(kalt);}return;}
  const s=KEYS[e.key];if(!s)return;e.preventDefault();if(e.repeat||kdn[s])return;kdn[s]=1;press(s);swipe(s,s==='L'?'left':'right',1);});
addEventListener('keyup',e=>{const s=KEYS[e.key];if(s&&kdn[s]){kdn[s]=0;release(s);}});
addEventListener('blur',()=>{['L','R'].forEach(s=>{while(held[s])release(s);});kdn={};ptr.clear();});

  `<h3>🖐 How to play</h3>The <b>L · R pads</b> below are where your two fingers go. Run 1km, then a workout, eight times over.<br><b>Run</b> ${RUN.how[1]}<br>${li}<br>
The race clock is tuned to read like real Hyrox splits (about 1 real minute = 1 hour).<br>Desktop: <b>F / J</b> or <b>← / →</b>, swipe down with <b>↓</b><br><button class="rs" id="rs" type="button">Erase records</button><small>tap anywhere to close</small>`);}
function setLang(l){lang=l;try{localStorage.setItem('handrox.lang',l);}catch(e){}document.documentElement.lang=l;
  $('cTag').textContent=L('손가락으로 뛰는 하이록스','The fitness race for fingers');$('cNote').textContent=L('기록은 이 브라우저에 저장돼요','Your best time is saved in this browser');

  [['tHome','홈','Home'],['cLb','순위','Ranks'],['charBtn','캐릭터','Character'],['tFr','친구','Friends']].forEach(([id,k,e])=>{$(id).querySelector('small').textContent=L(k,e);});coverBest();$('cuT').textContent=L('🧍 내 캐릭터','🧍 Your character');$('cuOk').textContent=L('완료','Done');if(!$('custPanel').hidden)renderCust();
  faceBtnText();drawBtnText();$('feT').textContent=L('📷 얼굴 맞추기','📷 Frame your face');$('feN').textContent=L('드래그로 위치, 슬라이더로 확대. 사진은 이 기기에만 저장돼요.','Drag to move, slide to zoom. The photo stays on this device.');$('feNo').textContent=L('취소','Cancel');$('feOk').textContent=L('이 얼굴로','Use this');
  $('helpBody').innerHTML=helpHTML();document.querySelectorAll('#lsel button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));$('lng').textContent=l==='ko'?'EN':'KO';paintInfo();}
$('lsel').addEventListener('click',e=>{e.stopPropagation();const b=e.target.closest('button');if(b){SFX.tick();setLang(b.dataset.l);}});
$('lng').addEventListener('click',()=>{SFX.tick();setLang(lang==='ko'?'en':'ko');});
$('ctab').addEventListener('click',e=>e.stopPropagation());$('custPanel').addEventListener('click',e=>e.stopPropagation());$('faceBtn').addEventListener('click',()=>$('faceFile').click());

function fitApp(){const app=$('app'),vh=(window.visualViewport&&visualViewport.height)||innerHeight;if(!vh)return;
  const cs=getComputedStyle(document.documentElement),pd=(parseFloat(cs.paddingTop)||0)+(parseFloat(cs.paddingBottom)||0);
  app.style.transform='';app.style.setProperty('--gh','252px');const avail=vh-pd-4,gw=$('game').clientWidth||320,extra=avail-app.scrollHeight;
  /* 남는 세로 공간만큼 경기장을 키움. 배경 그림 비율(320:213)까지 */
  const fin=app.classList.contains('fin'),gh=Math.round(Math.min(gw*(fin?1.3:213/320)+6,252+Math.max(0,extra)));app.style.setProperty('--gh',gh+'px');   /* 결승·기록 사진: 위 정보 칸을 숨기고 경기장을 크게 */
  HV=clamp(320*($('game').clientHeight||gh-6)/gw,150,fin?416:213.3);OFF=HV-170;window.HV=HV;
  const cvh=Math.round(2*HV);if(cv.height!==cvh)cv.height=cvh;
  const sc=Math.min(1,avail/app.scrollHeight);app.style.transform=sc<1?`scale(${sc})`:'';appScale=sc;document.body.style.height=avail+'px';}
/* 아이폰 확대 막기: 두 번 탭·두 손가락 확대가 페이지를 키우면 순위표 같은 창이 옆으로 밀려 보임 (user-scalable=no를 무시하는 경우가 있어서 코드로도 막음) */
for(const ev of ['gesturestart','gesturechange','gestureend'])document.addEventListener(ev,e=>e.preventDefault(),{passive:false});
{let lt=0;document.addEventListener('touchend',e=>{const t=Date.now();if(t-lt<320&&!e.target.closest('input,textarea'))e.preventDefault();lt=t;},{passive:false});}
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
setTimeout(fitApp,300);if(window.visualViewport)visualViewport.addEventListener('resize',fitApp);addEventListener('resize',fitApp);

/* 얼굴 아이콘 */
const faceCtx=$('face').getContext('2d');faceCtx.scale(4,4);
/* ── 머리통에 직접 그리기 ── 빈 머리통(앞모습) 위에 얼굴·앞머리를 그리면 그 그림이 모든 자세의 선수 머리에 입혀짐. 뒷머리는 고른 색으로.
   그림은 이 기기에만 저장(handrox.head). 그림이 없으면 기본 캐릭터 */
const HKEY='handrox.head3',DW={col:'#1c1616',size:6,er:0,undo:[],saved:null,tex:null,view:0,top:0,v:null};
const DCOL=['#1c1616','#5a3a22','#8a5a2c','#d9a441','#c0392b','#ff9aa8','#ffffff','#2f6fd0','#35c46a','#e8c9a8'];
/* 머리 둘레 전체 그림(512×256). 화면에는 3D 머리를 돌려 보며 그 위에 바로 그림. ◀▶ 돌리기, ⤒ 위에서 보기 */
const newTex=()=>{const t=document.createElement('canvas');t.width=512;t.height=256;return t;};
function dwFrame(){return DW.top?16+((Math.round(DW.view/2)%8)+8)%8:((DW.view%16)+16)%16;}
async function dwRender(){DW.v=await H3.headView($('dwCv').getContext('2d'),dwFrame(),DW.tex);}
function dwUI(){const mk=(box,items,fn)=>{box.textContent='';items.forEach(it=>box.append(fn(it)));};
  mk($('dwCols'),DCOL,cl=>{const b=el('button',!DW.er&&DW.col===cl?'on':'');b.type='button';b.style.background=cl;b.onclick=()=>{DW.col=cl;DW.er=0;dwUI();};return b;});
  mk($('dwTools'),[['s',4,'·'],['s',8,'•'],['s',16,'●'],['e',0,L('지우개','Erase')],['u',0,L('되돌리기','Undo')],['c',0,L('모두 지움','Clear')]],([k,v,t])=>{const b=el('button',(k==='s'&&DW.size===v)||(k==='e'&&DW.er)?'on':'',t);b.type='button';if(k!=='s')b.classList.add('w');
    b.onclick=()=>{const tx=DW.tex.getContext('2d');if(k==='s')DW.size=v;else if(k==='e')DW.er=!DW.er;else if(k==='u'){const u=DW.undo.pop();if(u)tx.putImageData(u,0,0);dwRender();}else{dwPush();tx.clearRect(0,0,512,256);dwRender();}dwUI();};return b;});
  mk($('dwRot'),[['l','◀'],['f',L('앞','Front')],['b',L('뒤','Back')],['t',DW.top?L('옆에서','Side'):L('위에서','Top')],['r','▶']],([k,t])=>{const b=el('button','w',t);b.type='button';
    b.onclick=()=>{if(k==='l')DW.view+=DW.top?2:1;else if(k==='r')DW.view-=DW.top?2:1;else if(k==='f')DW.view=0;else if(k==='b')DW.view=8;else{DW.top=DW.top?0:1;dwUI();}dwRender();};return b;});
  $('dwT').textContent=L('✏️ 머리통에 그리기','✏️ Draw on the head');$('dwN').textContent=L('◀ ▶ 로 돌려서 옆머리·뒷머리도 그려요','Turn with ◀ ▶ to draw the sides and back');$('dwNo').textContent=L('취소','Cancel');$('dwOk').textContent=L('저장','Save');}
function dwPush(){DW.undo.push(DW.tex.getContext('2d').getImageData(0,0,512,256));if(DW.undo.length>20)DW.undo.shift();}
/* 화면에서 그은 선을 그림 좌표로 옮겨 찍음. 둘레 끝(뒤통수)은 양쪽으로 이어짐 */
function dwDot(u,v){const x=DW.tex.getContext('2d'),r=DW.size*(DW.er?1.8:1)*.9,px=u*512,py=v*256,sx=1/Math.max(.25,Math.sin(Math.PI*Math.min(.98,Math.max(.02,v))));
  x.globalCompositeOperation=DW.er?'destination-out':'source-over';x.fillStyle=DW.col;for(const o of [0,-512,512]){x.beginPath();x.ellipse(px+o,py,r*sx,r*.5,0,0,7);x.fill();}x.globalCompositeOperation='source-over';}
{const cv=$('dwCv');let lp=null,busy=false;const pt=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height];};
  const seg=(a,b)=>{const n=Math.max(1,Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])*300/2));for(let k=0;k<=n;k++){const q=[a[0]+(b[0]-a[0])*k/n,a[1]+(b[1]-a[1])*k/n],uv=H3.headUV(DW.v,q[0],q[1]);if(uv)dwDot(uv[0],uv[1]);}
    if(!busy){busy=true;requestAnimationFrame(async()=>{await dwRender();busy=false;});}};
  cv.addEventListener('pointerdown',e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId);}catch(_){}dwPush();lp=pt(e);seg(lp,lp);});
  cv.addEventListener('pointermove',e=>{if(!lp)return;const p=pt(e);seg(lp,p);lp=p;});['pointerup','pointercancel'].forEach(v=>cv.addEventListener(v,()=>{lp=null;}));}
function drawBtnText(){$('drawBtn').textContent=DW.saved?L('✏️ 내 그림 고치기','✏️ Edit my drawing'):L('✏️ 머리통에 직접 그리기','✏️ Draw my own head');$('drawDel').hidden=!DW.saved;}
async function headApply(){if(!DW.saved)return H3.setHead(null);try{await H3.setHead(DW.saved);}catch(e){}}
$('drawBtn').addEventListener('click',async()=>{DW.tex=newTex();if(DW.saved)DW.tex.getContext('2d').drawImage(DW.saved,0,0);DW.undo=[];DW.view=0;DW.top=0;dwUI();$('drawPanel').hidden=false;$('dwN').textContent=L('머리 불러오는 중…','Loading head…');
  try{await dwRender();dwUI();}catch(e){$('dwN').textContent=L('머리를 불러오지 못했어요','Could not load the head');}});
$('drawPanel').addEventListener('click',e=>e.stopPropagation());
$('dwNo').addEventListener('click',()=>{$('drawPanel').hidden=true;});
$('dwOk').addEventListener('click',async()=>{const t=newTex();t.getContext('2d').drawImage(DW.tex,0,0);DW.saved=t;try{localStorage.setItem(HKEY,JSON.stringify({img:t.toDataURL('image/png')}));}catch(e){}
  $('dwOk').textContent=L('입히는 중…','Applying…');await headApply();$('drawPanel').hidden=true;drawBtnText();if(SAVE.nick)LB.syncBs();});
$('drawDel').addEventListener('click',()=>{DW.saved=null;try{localStorage.removeItem(HKEY);}catch(e){}headApply();drawBtnText();});
try{localStorage.removeItem('handrox.head');const v=JSON.parse(localStorage.getItem(HKEY)||'null');if(v&&v.img){const im=new Image();im.onload=()=>{const t=newTex();t.getContext('2d').drawImage(im,0,0,512,256);DW.saved=t;drawBtnText();headApply();};im.src=v.img;}}catch(e){}
function drawFaceIcon(){H3.icon&&H3.icon();}   /* 얼굴 아이콘 = 구운 3D 머리 그림 */
/* 캐릭터 만들기 */
const CROWS=[['skin','피부','Skin'],['hair','머리 색','Hair color'],['top','상의','Top'],['band','헤어밴드','Headband'],['shoes','신발','Shoes']];   /* 3D 선수에 실제로 적용되는 것만 (모양·모자·선글라스는 모델 자체가 달라야 해서 뺌) */
function renderCust(){$('cuRows').innerHTML=CROWS.map(([k,ko,en])=>`<div class="crow"><span>${L(ko,en)}</span>${OPT[k].map((v,i)=>Array.isArray(v)?`<button type="button" class="t${CHAR[k]===i?' on':''}" data-k="${k}" data-i="${i}">${L(...v)}</button>`:`<button type="button" class="${CHAR[k]===i?'on':''}${v?'':' no'}" data-k="${k}" data-i="${i}" style="background:${v||'transparent'}" aria-label="${L(ko,en)} ${i+1}"></button>`).join('')}</div>`).join('');}
/* 선수 고르기: 남(기본) / 여. 여자 선수는 그림을 처음 고를 때 받음. 여자 선수를 고르면 내가 그린 머리는 안 보임(남자 선수 머리용) */
const WKEY='handrox.who',GIRL_ON=false;let WHO='m';try{WHO=GIRL_ON&&localStorage.getItem(WKEY)==='g'?'g':'m';}catch(e){}   /* 여자 선수는 일단 끔 (그림 묶음 g_*는 남겨 둠, GIRL_ON=true면 다시 켜짐) */
function renderWho(){const b=$('cuWho');b.textContent='';b.hidden=!GIRL_ON;if(!GIRL_ON)return;b.append(el('span','',L('선수','Athlete')));[['m','남','Boy'],['g','여','Girl']].forEach(([v,k,e])=>{const x=el('button','t'+(WHO===v?' on':''),L(k,e));x.type='button';x.onclick=async()=>{WHO=v;try{localStorage.setItem(WKEY,v);}catch(_){}renderWho();x.textContent='…';try{await H3.setWho(v);}catch(_){}renderWho();drawFaceIcon();if(SAVE.nick)LB.syncBs();};b.append(x);});}
function setChar(){charColors();try{localStorage.setItem(CKEY,JSON.stringify(CHAR));}catch(e){}renderCust();drawFaceIcon();}
$('cuRows').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;CHAR[b.dataset.k]=+b.dataset.i;SFX.tick();setChar();});
$('cuRnd').addEventListener('click',()=>{for(const k in CHAR)CHAR[k]=Math.floor(Math.random()*OPT[k].length);SFX.tick();setChar();});
$('cuOk').addEventListener('click',()=>{$('custPanel').hidden=true;});
$('charBtn').addEventListener('click',()=>{renderCust();renderWho();drawFaceIcon();$('custPanel').hidden=false;});
drawFaceIcon();
/* 얼굴 고르기: 드래그로 위치, 슬라이더로 확대 */
const FE={img:null,z:1.6,cx:0,cy:0,out:null};
function feSize(){return Math.min(FE.img.width,FE.img.height)/FE.z;}
function feDraw(){const z=feSize();FE.cx=clamp(FE.cx,z/2,FE.img.width-z/2);FE.cy=clamp(FE.cy,z/2,FE.img.height-z/2);FE.out=pixelate(FE.img,FE.cx,FE.cy,z);
  const x=$('fePrev').getContext('2d');x.imageSmoothingEnabled=false;x.clearRect(0,0,192,192);x.drawImage(FE.out,0,0,192,192);}
function faceBtnText(){$('faceBtn').textContent=FACE?L('📷 얼굴 사진 바꾸기','📷 Change photo'):L('📷 얼굴에 내 사진 넣기','📷 Use my photo as face');$('feDel').hidden=!FACE;}
$('faceFile').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const im=new Image();
  im.onload=()=>{FE.img=im;FE.z=1.6;FE.cx=im.width/2;FE.cy=im.height*.42;$('feZoom').value=1.6;$('facePanel').hidden=false;feDraw();};
  im.onerror=()=>{$('faceBtn').textContent=L('사진을 못 읽었어요','Could not read photo');};im.src=URL.createObjectURL(f);});
$('feZoom').addEventListener('input',e=>{FE.z=+e.target.value;feDraw();});
{const pv=$('fePrev');let d=null;pv.addEventListener('pointerdown',e=>{d={x:e.clientX,y:e.clientY};try{pv.setPointerCapture(e.pointerId);}catch(_){}});
  pv.addEventListener('pointermove',e=>{if(!d||!FE.img)return;const k=feSize()/(pv.getBoundingClientRect().width||192);FE.cx-=(e.clientX-d.x)*k;FE.cy-=(e.clientY-d.y)*k;d={x:e.clientX,y:e.clientY};feDraw();});
  ['pointerup','pointercancel'].forEach(v=>pv.addEventListener(v,()=>{d=null;}));}
$('feOk').addEventListener('click',()=>{FACE=FE.out;SPRC={};try{localStorage.setItem(FKEY,FACE.toDataURL());}catch(e){}$('facePanel').hidden=true;drawFaceIcon();faceBtnText();});
$('feNo').addEventListener('click',()=>{$('facePanel').hidden=true;});
$('feDel').addEventListener('click',()=>{FACE=null;SPRC={};try{localStorage.removeItem(FKEY);}catch(e){}drawFaceIcon();faceBtnText();});
try{const u=localStorage.getItem(FKEY);if(u){const im=new Image();im.onload=()=>{const t=document.createElement('canvas');t.width=t.height=FN;t.getContext('2d').drawImage(im,0,0,FN,FN);FACE=t;SPRC={};drawFaceIcon();faceBtnText();};im.src=u;}}catch(e){}
/* 대회 이름: 폰이면 HANDROX PHONE, PC면 HANDROX HOME */
const VENUE=(navigator.maxTouchPoints>0||'ontouchstart' in window)?'PHONE':'HOME';$('city').textContent=VENUE;
setLang(lang);fitApp();requestAnimationFrame(loop);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitApp);
/* 3D 선수 로딩: 준비될 때까지 시작 버튼을 막고 진행률을 보여줌. 실패하면 2D로 넘어가지 않고 다시 시도 */
const insT=t=>{const el=$('cIns');if(el)el.textContent=t;};
window.onH3Progress=p=>H3.ok||insT(L(`선수 준비 중… ${Math.round(p*100)}%`,`Loading athlete… ${Math.round(p*100)}%`));
window.onH3Ready=()=>{insT('TAP TO START');drawFaceIcon();if(WHO==='g')H3.setWho('g').catch(()=>{});};
window.onH3Fail=why=>{const el=$('cIns');if(!el)return;el.innerHTML=`${L('선수를 불러오지 못했어요','Could not load the athlete')}<br><button type="button" id="h3retry" style="margin-top:6px;border:2px solid var(--gold);padding:4px 10px;font-size:12px">${L('다시 시도','Retry')}</button>`;
  el.style.animation='none';$('h3retry').onclick=e=>{e.stopPropagation();location.reload();};console.warn('3D:',why);};
/* 3D 선수 색 = 캐릭터 만들기에서 고른 색 (3D 모델은 모양을 못 바꾸고 색만 바뀜) */
/* 처음 값(모델 원래 색)을 고른 칸은 null → 원본 텍스처를 그대로 씀 (다시 칠하면 명암·결이 뭉개져서) */
window.handroxColors=()=>{const D={skin:0,hair:1,top:0,shorts:0,band:0,shoes:0},o=(k,v)=>CHAR[k]===D[k]?null:v;
  return {skin:o('skin',OPT.skin[CHAR.skin]),hair:o('hair',OPT.hair[CHAR.hair]),top:o('top',OPT.top[CHAR.top]),
