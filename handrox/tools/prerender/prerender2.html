<!doctype html><meta charset="utf-8"><body style="margin:0;background:#000">
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
<script type="module">
/* 새 선수(assets/hero_rig.glb, Tripo+Higgsfield 리깅 24관절)를 자세별로 찍음. render.cjs가 window.bake(job)를 부름.
   자세는 세계 기준 회전으로 넣음: S=몸 옆축(앞뒤로 굽히기), F=앞축(옆으로 벌리기). 얼굴은 +x */
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const g=await new GLTFLoader().loadAsync('assets/hero_rig.glb');const obj=g.scene;const B={};obj.traverse(o=>{if(o.isBone)B[o.name]=o;});
const rest={};for(const k in B)rest[k]=B[k].quaternion.clone();
obj.updateMatrixWorld(true);const restW={};for(const k in B){restW[k]=new THREE.Quaternion();B[k].getWorldQuaternion(restW[k]);}
/* 발을 기본 자세의 세계 방향으로 되돌림 → 무릎·엉덩이를 굽혀도 발바닥이 바닥에 평평 */
const flatFoot=n=>{const b=B[n];b.parent.updateWorldMatrix(true,false);const pq=new THREE.Quaternion();b.parent.getWorldQuaternion(pq);b.quaternion.copy(pq.invert().multiply(restW[n]));b.updateMatrixWorld(true);};
const F=new THREE.Vector3(1,0,0),S=new THREE.Vector3(0,0,1);
const W=(n,ax,a)=>{const b=B[n];b.parent.updateWorldMatrix(true,false);const pq=new THREE.Quaternion();b.parent.getWorldQuaternion(pq);const wq=new THREE.Quaternion();b.getWorldQuaternion(wq);
  b.quaternion.copy(pq.invert().multiply(new THREE.Quaternion().setFromAxisAngle(ax,a).multiply(wq)));b.updateMatrixWorld(true);};
const wp=n=>{const v=new THREE.Vector3();B[n].getWorldPosition(v);return v;};
/* 뼈가 자식 쪽을 향하는 방향을 세계 기준 dir로 돌림 */
const aim=(bone,child,dir)=>{const a=wp(bone),b=wp(child),cur=b.clone().sub(a).normalize(),q=new THREE.Quaternion().setFromUnitVectors(cur,dir.clone().normalize());
  const bn=B[bone];bn.parent.updateWorldMatrix(true,false);const pq=new THREE.Quaternion();bn.parent.getWorldQuaternion(pq);const wq=new THREE.Quaternion();bn.getWorldQuaternion(wq);
  bn.quaternion.copy(pq.invert().multiply(q.multiply(wq)));bn.updateMatrixWorld(true);};
const armDown=a=>{W('LeftArm',F,-a);W('RightArm',F,a);};
const POSE={
 idle(){armDown(.15);return {};},
 run({ph}){const s=Math.sin(ph),c=Math.cos(ph);W('Spine',S,-.12);
   W('LeftUpLeg',S,.8*s);W('LeftLeg',S,-(.3+1.0*Math.max(0,-c)));W('RightUpLeg',S,-.8*s);W('RightLeg',S,-(.3+1.0*Math.max(0,c)));
   armDown(.55);W('LeftArm',S,-.9*s);W('LeftForeArm',S,1.3);W('RightArm',S,.9*s);W('RightForeArm',S,1.3);return {bounce:Math.abs(c)*.03};},
 /* 정면 달리기 전용: 무릎을 카메라 쪽으로 높이 들고, 팔은 크게 앞뒤로, 몸은 카메라 쪽으로 기울이고, 착지 때 쿵 내려앉음.
    (옆 달리기 자세를 정면에서 보면 발이 위아래로만 움직여 뛰는 느낌이 안 남) */
 /* 슬레드 푸시: 몸을 앞으로 크게 숙이고(약 50도), 팔은 앞으로 쭉 뻗어 기둥을 잡고, 다리는 짧고 힘있게 밀어냄 */
 push({ph}){const s=Math.sin(ph),c=Math.cos(ph);W('Hips',S,-.6);W('Spine',S,-.45);W('Head',S,.75);
   W('LeftUpLeg',S,.5+.6*s);W('LeftLeg',S,-(.25+1.1*Math.max(0,s)));W('RightUpLeg',S,.5-.6*s);W('RightLeg',S,-(.25+1.1*Math.max(0,-s)));
   flatFoot('LeftFoot');flatFoot('RightFoot');
   for(const [sd,z] of [['Left',-.16],['Right',.16]]){const d=new THREE.Vector3(1,-.05,z);aim(sd+'Arm',sd+'ForeArm',d);aim(sd+'ForeArm',sd+'Hand',d);}
   return {feet:1};},
 /* 슬레드 풀: 썰매 쪽(앞)을 보고 다리를 앞뒤로 벌려 버티고, 몸을 뒤로 젖히며 줄을 가슴→엉덩이까지 끌어당김. k=0 팔 쭉 뻗음, k=1 끝까지 당김 */
 pull({k}){const e=k*k*(3-2*k),V=(x,y,z)=>new THREE.Vector3(x,y,z),lr=(a,b)=>a+(b-a)*e;
   W('Hips',S,lr(.05,.38));W('Spine',S,lr(-.12,.15));W('Head',S,lr(.0,-.15));
   W('LeftUpLeg',S,lr(.6,.75));W('LeftLeg',S,-.75);W('RightUpLeg',S,lr(-.2,-.05));W('RightLeg',S,-.55);flatFoot('LeftFoot');flatFoot('RightFoot');
   for(const [sd,z] of [['Left',-.12],['Right',.12]]){aim(sd+'Arm',sd+'ForeArm',V(lr(1,-.15),lr(-.12,-1),z));aim(sd+'ForeArm',sd+'Hand',V(lr(1,1),lr(-.12,.15),z*.5));}
   return {feet:1};},
 /* 버피: k 0→.4 쪼그려 손 짚기, .4→1 다리 뒤로 차서 엎드려 버팀(플랭크). 몸 전체가 앞으로 눕기 때문에 원점은 '바닥에 닿은 가장 낮은 곳' */
 bbj({k}){const sm=x=>x*x*(3-2*x),a=sm(Math.min(1,k/.4)),b=sm(Math.max(0,(k-.4)/.6)),V=(x,y,z)=>new THREE.Vector3(x,y,z);
   W('Hips',S,-1.38*b);W('Spine',S,-.55*a*(1-b));W('Head',S,.35*a+.55*b);
   for(const sd of ['Left','Right']){W(sd+'UpLeg',S,1.7*a*(1-b));W(sd+'Leg',S,-2.1*a*(1-b));}
   flatFoot('LeftFoot');flatFoot('RightFoot');if(b>0)for(const f of ['LeftFoot','RightFoot'])W(f,S,-1.1*b);
   for(const [sd,z] of [['Left',-.2],['Right',.2]]){const d=b>0?V(.12*(1-b),-1,z):V(.35*a,-1+.15*(1-a),z*(1-a)+z*.6*a);aim(sd+'Arm',sd+'ForeArm',d);aim(sd+'ForeArm',sd+'Hand',d);}
   return {ground:1};},
 /* 브로드 점프: k 0 쪼그림(팔 뒤로) → .5 공중(다리 접고 팔 앞으로) → 1 착지 쪼그림 */
 bbjj({k}){const t=Math.sin(Math.PI*k),c=1-t,V=(x,y,z)=>new THREE.Vector3(x,y,z);
   W('Spine',S,-.55*c-.25*t);W('Head',S,.35*c+.2*t);
   for(const sd of ['Left','Right']){W(sd+'UpLeg',S,1.25*c+.95*t);W(sd+'Leg',S,-(1.7*c+1.3*t));}
   flatFoot('LeftFoot');flatFoot('RightFoot');
   for(const [sd,z] of [['Left',-.2],['Right',.2]]){const d=V(-.55*c+1*t,-1*c+.55*t,z);aim(sd+'Arm',sd+'ForeArm',d);aim(sd+'ForeArm',sd+'Hand',d);}
   return {feet:1};},
 /* 파머스 캐리: 허리 곧게, 짧고 빠른 걸음, 팔은 몸 옆으로 쭉 내려 케틀벨을 듦(어깨 살짝 내려감) */
 carry({ph}){const s=Math.sin(ph),c=Math.cos(ph),V=(x,y,z)=>new THREE.Vector3(x,y,z);W('Spine',S,.04);
   W('LeftUpLeg',S,.42*s);W('LeftLeg',S,-(.15+.7*Math.max(0,-c)));W('RightUpLeg',S,-.42*s);W('RightLeg',S,-(.15+.7*Math.max(0,c)));
   for(const [sd,z] of [['Left',-.2],['Right',.2]]){const d=V(.03,-1,z);aim(sd+'Arm',sd+'ForeArm',d);aim(sd+'ForeArm',sd+'Hand',d);}
   return {bounce:Math.abs(c)*.015};},
 runf({ph}){const s=Math.sin(ph),c=Math.cos(ph),up=x=>Math.max(0,x);
   W('Spine',S,-.28);W('Head',S,.16);   /* S축 +는 상체가 뒤로 젖혀짐 → 앞으로 숙이려면 −. 머리는 다시 들어 카메라를 봄 */W('Hips',F,.06*s);W('Spine',F,-.08*s);
   W('LeftUpLeg',S,.15+1.25*up(s)-.35*up(-s));W('LeftLeg',S,-(.25+1.7*up(s)+.5*up(-s)));
   W('RightUpLeg',S,.15+1.25*up(-s)-.35*up(s));W('RightLeg',S,-(.25+1.7*up(-s)+.5*up(s)));
   armDown(.75);W('LeftArm',S,-1.1*s);W('LeftForeArm',S,1.6);W('RightArm',S,1.1*s);W('RightForeArm',S,1.6);
   return {bounce:.045*Math.abs(c)};},
 /* 스키에르그 (참고 사진 3컷): ① 곧게 서서 팔을 머리 위로 쭉 ② 팔은 편 채로 몸 앞으로 내리며 엉덩이를 빼고 숙임 ③ 손이 엉덩이 뒤까지, 깊게 숙이고 무릎 굽힘.
    팔·머리는 몸통 기준으로 움직여서 함께 따라감 (예전엔 팔을 세계 기준으로 따로 움직여 몸·머리·손이 따로 놀았음). 팔꿈치는 펴진 채 */
 skib({k}){const sm=x=>x*x*(3-2*x),e=sm(k),D=Math.PI/180,T=(6+42*e)*D,kb=(4+20*e)*D;   /* 머리가 커서 너무 깊이 숙이면 머리가 가슴에 묻힘 → 최대 48° */
   W('Hips',S,-T);W('LeftUpLeg',S,T+kb);W('RightUpLeg',S,T+kb);W('LeftLeg',S,-2*kb);W('RightLeg',S,-2*kb);flatFoot('LeftFoot');flatFoot('RightFoot');
   W('Head',S,.1+.25*e);                                              /* 머리는 등과 한 줄, 살짝만 들어 앞을 봄 */
   const phi=T+(2+154*e)*D;   /* 팔이 짧아 바로 위로 올리면 머리에 파묻혀서, 처음엔 앞쪽 위로 */                                     /* 팔 방향 = 몸통 기울기 + 몸통 기준 팔 각도(머리 위 → 엉덩이 뒤) */
   const wz=.42-.22*e;   /* 시작: 팔을 거의 수직으로 위로 (팔 길이가 짧아 손은 귀 높이까지) */   /* 처음엔 팔을 머리 옆으로 벌려 머리에 가려지지 않게, 내릴수록 몸에 붙임 */
   for(const [sd,z] of [['Left',-wz],['Right',wz]]){const d=new THREE.Vector3(Math.sin(phi),Math.cos(phi),z);aim(sd+'Arm',sd+'ForeArm',d);aim(sd+'ForeArm',sd+'Hand',d);}
   return {feet:1};},
 row({k}){const L=Math.min(1,k/.55),Bk=Math.max(0,Math.min(1,(k-.25)/.5)),A=Math.max(0,Math.min(1,(k-.55)/.45)),lr=(a,b,t)=>a+(b-a)*t;
   const th=lr(1.9,1.45,L),kn=lr(2.3,.15,L);W('LeftUpLeg',S,th);W('RightUpLeg',S,th);W('LeftLeg',S,-kn);W('RightLeg',S,-kn);
   W('Spine',S,lr(-.5,.45,Bk));armDown(.15);W('LeftArm',S,lr(1.5,.1,A));W('RightArm',S,lr(1.5,.1,A));W('LeftForeArm',S,lr(0,1.6,A));W('RightForeArm',S,lr(0,1.6,A));
   return {anchor:['LeftToeBase','Hips']};}};   /* 로잉 원점: x=발끝, y=엉덩이 (발은 발판에, 엉덩이는 의자 높이에) */
const sc=new THREE.Scene();const root=new THREE.Group();root.add(obj);sc.add(root);
const cv=document.createElement('canvas');const r=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true,preserveDrawingBuffer:true});r.outputColorSpace=THREE.SRGBColorSpace;r.toneMapping=THREE.ACESFilmicToneMapping;r.setClearColor(0,0);
sc.environment=new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(),.04).texture;const d=new THREE.DirectionalLight(0xffffff,1.1);d.position.set(1,2,3);sc.add(d);
const blank=document.createElement('canvas');
window.bake=job=>{const [x0,x1,y0,y1]=job.box,Wd=Math.round((x1-x0)*job.ppu),Ht=Math.round((y1-y0)*job.ppu);
  for(const k in B)B[k].quaternion.copy(rest[k]);root.position.set(0,0,0);root.rotation.set(0,0,0);root.updateMatrixWorld(true);
  const res=POSE[job.pose](job.o||{});root.rotation.set(0,job.yaw||0,0);root.updateMatrixWorld(true);
  if(res.ground){const P=n=>wp(n),f=[P('LeftFoot'),P('RightFoot')],c=[f[0].y-.074,f[1].y-.074,P('LeftHand').y-.035,P('RightHand').y-.035,P('Spine2').y-.13,P('Head').y-.16];
    root.position.set(-(f[0].x+f[1].x)/2,-Math.min(...c),0);}   /* 버피: 발 x=0, 가장 낮은 곳이 바닥 */
  else if(res.feet){const a=wp('LeftFoot'),b=wp('RightFoot');root.position.set(0,-Math.min(a.y,b.y)+.074,0);}   /* 발목 관절 높이(0.074)만큼 띄워 발바닥이 0에 */
  else if(res.anchor){const a=wp(res.anchor[0]),h=wp(res.anchor[1]);root.position.set(-a.x,-h.y,0);}else root.position.set(0,.49+(res.bounce||0),0);   /* 발바닥 = 0 */
  root.updateMatrixWorld(true);let cam;if(job.persp){const D=job.persp,cy=(y0+y1)/2;cam=new THREE.PerspectiveCamera(2*Math.atan((y1-y0)/2/D)*180/Math.PI,(x1-x0)/(y1-y0),.1,50);cam.position.set((x0+x1)/2,cy+.15,D);cam.lookAt((x0+x1)/2,cy,0);}else{cam=new THREE.OrthographicCamera(x0,x1,y1,y0,-10,10);cam.position.z=5;}r.setSize(Wd,Ht,false);r.render(sc,cam);
  blank.width=Wd;blank.height=Ht;const p=n=>{const v=wp(n);return [+v.x.toFixed(4),+v.y.toFixed(4)];};
  return {w:Wd,h:Ht,c:cv.toDataURL('image/png'),m:blank.toDataURL('image/png'),pts:{hand:p('LeftHand'),handR:p('RightHand'),hips:p('Hips'),head:p('Head')}};};
window.READY=true;
</script>
