<title>나의 도트 여행 지구</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Press+Start+2P&display=swap">
<style>
/* Layout: 차분한 도트 지구 한 개. 위엔 방식 A·B·C 탭과 설명 카드, 아래엔 액션 버튼 줄. 캐릭터는 버튼을 누를 때만 움직임 */
:root {
  --sky: #10163a;
  --ui-bg: #fdf6e3;
  --ui-fg: #1b1b2f;
  --ui-soft: #5b5b78;
  --ui-line: #1b1b2f;
  --accent: #ffcc33;
  --on-sky: #f4f1ff;
  --on-sky-soft: #a9acd6;
  --kr: "Do Hyeon", system-ui, sans-serif;
  --px: "Press Start 2P", ui-monospace, monospace;
  --body: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--sky); color: var(--on-sky); font-family: var(--body); overflow: hidden; -webkit-tap-highlight-color: transparent; }
#app { position: relative; height: 100%; overflow: hidden; background: linear-gradient(#0b1030 0 30%, #10163a 30% 60%, #172056 60% 85%, #1f2a6b 85%); }
#stage { position: absolute; inset: 0; touch-action: none; z-index: 1; }
/* sky tint per destination: two layers cross-fade slowly */
.sky { position: absolute; inset: 0; z-index: 0; opacity: 0; transition: opacity 2s ease; }
.sky.on { opacity: 1; }
/* hearts */
.hearts { position: absolute; inset: 0; z-index: 7; pointer-events: none; overflow: hidden; }
.heart { position: absolute; width: 18px; height: 16px; animation: heartUp 1.1s ease-out both; }
.heart::before { content: ""; position: absolute; left: 0; top: 0; width: 2px; height: 2px; color: #ff4d6d;
  box-shadow: 2px 0, 4px 0, 10px 0, 12px 0, 0 2px, 2px 2px, 4px 2px, 6px 2px, 8px 2px, 10px 2px, 12px 2px, 14px 2px,
    0 4px, 2px 4px, 4px 4px, 6px 4px, 8px 4px, 10px 4px, 12px 4px, 14px 4px, 2px 6px, 4px 6px, 6px 6px, 8px 6px, 10px 6px, 12px 6px,
    4px 8px, 6px 8px, 8px 8px, 10px 8px, 6px 10px, 8px 10px; transform: scale(1.1); }
@keyframes heartUp { 0% { opacity: 0; transform: translate(0, 0) scale(.5); } 15% { opacity: 1; transform: translate(0, -6px) scale(1.1); } 100% { opacity: 0; transform: translate(var(--dx), -70px) scale(.9); } }
.heartCount { position: absolute; font-family: var(--px); font-size: .6rem; color: #fff; background: #ff4d6d; border: 2px solid #1b1b2f; padding: 3px 5px; box-shadow: 2px 2px 0 #1b1b2f; animation: countPop 1.4s ease-out both; white-space: nowrap; }
@keyframes countPop { 0% { opacity: 0; transform: translate(-50%, 4px) scale(.6); } 15% { opacity: 1; transform: translate(-50%, 0) scale(1.1); } 80% { opacity: 1; transform: translate(-50%, -14px) scale(1); } 100% { opacity: 0; transform: translate(-50%, -20px); } }
.pin-label .hc { margin-left: 5px; font-family: var(--px); font-size: .5rem; color: #ff4d6d; }
#stage canvas { display: block; width: 100%; height: 100%; outline: none; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 3; }
button { font: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.px-box { background: var(--ui-bg); color: var(--ui-fg); border: 3px solid var(--ui-line); box-shadow: 4px 4px 0 var(--ui-line); }

.top { position: absolute; top: 0; left: 0; right: 0; z-index: 5; display: flex; flex-direction: column; gap: 10px; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 0; }
.top > * { pointer-events: auto; }
.brand { font-family: var(--kr); font-size: 1.5rem; line-height: 1; text-shadow: 3px 3px 0 rgba(0,0,0,.3); pointer-events: none; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { border: 3px solid var(--ui-line); background: var(--ui-bg); color: var(--ui-fg); padding: 7px 10px; font-family: var(--kr); font-size: .95rem; box-shadow: 3px 3px 0 var(--ui-line); display: inline-flex; gap: 6px; align-items: center; }
.tab b { font-family: var(--px); font-size: .6rem; font-weight: 400; }
.tab[aria-selected=true] { background: var(--accent); transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ui-line); }
.card { max-width: 440px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.card h2 { margin: 0; font-family: var(--kr); font-weight: 400; font-size: 1.2rem; }
.card p { margin: 0; font-size: .8rem; line-height: 1.55; color: var(--ui-soft); }
.card dl { margin: 2px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: .78rem; line-height: 1.5; }
.card dt { font-family: var(--kr); color: var(--ui-fg); }
.card dd { margin: 0; color: var(--ui-soft); min-width: 0; }
.card .toggle { align-self: flex-start; border: 0; background: none; padding: 0; color: var(--ui-soft); font-size: .75rem; text-decoration: underline; }

.actions { position: absolute; left: 0; right: 0; bottom: 0; z-index: 4;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 16px; }
.actions-inner { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.act { padding: 9px 12px; font-family: var(--kr); font-size: 1rem; display: inline-flex; flex-direction: column; align-items: center; gap: 2px; min-width: 64px; }
.act small { font-family: var(--px); font-size: .42rem; color: var(--ui-soft); }
.act:active, .act.on { background: var(--accent); transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ui-line); }
.hint { text-align: center; font-size: .75rem; color: var(--on-sky-soft); margin: 0 0 8px; }
/* ‹ ● › pad */
.pad { display: flex; align-items: center; justify-content: center; gap: 22px; }
.nav-btn { width: 64px; height: 56px; font-family: var(--px); font-size: 1.2rem; display: grid; place-items: center; padding: 0; }
.nav-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ui-line); background: var(--accent); }
.shutter { width: 76px; height: 76px; border-radius: 50%; border: 4px solid var(--ui-line); background: var(--ui-bg); box-shadow: 4px 4px 0 var(--ui-line); display: grid; place-items: center; padding: 0; cursor: pointer; }
.shutter i { width: 48px; height: 48px; border-radius: 50%; background: #ff6b5b; border: 3px solid var(--ui-line); display: block; }
.shutter:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ui-line); }
.shutter:active i { background: #e2503f; }
/* snap: flash, "찰칵!", instant photo that develops */
.snapLayer { position: absolute; inset: 0; z-index: 6; pointer-events: none; }
.flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
.flash.go { animation: flash .7s ease-out both; }
@keyframes flash { 0% { opacity: 0; } 10% { opacity: .95; } 100% { opacity: 0; } }
.snapTxt { position: absolute; left: 0; top: 0; font-family: var(--px); font-size: 14px; color: #fff; text-shadow: 3px 3px 0 #000; opacity: 0; }
.snapTxt.go { animation: snapTxt 1.2s steps(6) both; }
@keyframes snapTxt { 0% { opacity: 0; transform: scale(.6); } 20% { opacity: 1; transform: scale(1.1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-14px); } }
.instant { position: absolute; left: 0; top: 0; width: 132px; padding: 7px 7px 36px; background: #fff; border: 0; box-shadow: 0 10px 22px rgba(0,0,0,.5); pointer-events: auto; cursor: pointer; }
.instant img, .instant canvas { display: block; width: 100%; height: 150px; object-fit: cover; filter: grayscale(1) brightness(1.9) contrast(.4); transition: filter 3s ease; image-rendering: auto; }
.instant canvas { image-rendering: pixelated; }
.instant.dev img, .instant.dev canvas { filter: none; }
.instant span { position: absolute; left: 6px; right: 6px; bottom: 5px; text-align: center; font-family: var(--kr); font-size: 12px; line-height: 1.2; color: var(--ui-fg); word-break: keep-all; }
.instant.eject { animation: eject .6s cubic-bezier(.2,.9,.3,1.2) both; }
@keyframes eject { from { opacity: 0; scale: .4; } to { opacity: 1; scale: 1; } }
/* album */
.album { position: absolute; inset: 0; z-index: 10; background: rgba(6,8,22,.88); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
.album .big { width: min(320px, 82vw); aspect-ratio: 300 / 470; max-height: 70vh; background: #fff; padding: 8px 8px 44px; position: relative; box-shadow: 0 16px 40px rgba(0,0,0,.6); }
.album .big img { width: 100%; height: 100%; object-fit: cover; display: block; }
.album .big p { position: absolute; left: 10px; right: 10px; bottom: 10px; margin: 0; font-family: var(--kr); font-size: 1.05rem; color: var(--ui-fg); text-align: center; }
.album .anav { display: flex; gap: 14px; align-items: center; font-family: var(--px); font-size: .6rem; color: #fff; }
.album .anav button, .album .x { width: 48px; height: 40px; font-family: var(--px); font-size: .8rem; padding: 0; }
.album .x { position: absolute; right: max(14px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 14px); }
@media (prefers-reduced-motion: reduce) { .flash.go, .snapTxt.go, .instant.eject { animation-duration: .01s; } .instant img, .instant canvas { transition: none; } }

.pin-label { position: absolute; left: 0; top: 0; pointer-events: auto; white-space: nowrap; padding: 3px 8px; font-family: var(--kr); font-size: .95rem; }
.pin-label small { font-family: var(--px); font-size: .45rem; margin-left: 6px; color: var(--ui-soft); }
.pin-label.far { visibility: hidden; }
@media (max-width: 640px) {
  .brand { font-size: 1.2rem; }
  .card { max-width: none; padding: 10px 12px; }
  .act { min-width: 0; flex: 1 1 28%; padding: 8px 6px; font-size: .92rem; }
}
</style>

/* ---------- small pixel postcards for examples ---------- */
function postcard(kind, h, size = 48) {
  const c = document.createElement("canvas"); c.width = c.height = size; const g = c.getContext("2d"), S = size, dark = kind === "aurora";

  const hill = (base, amp, col, f) => { g.fillStyle = col; for (let x = 0; x < S; x++) { const y = Math.round(base + Math.sin(x / f) * amp); g.fillRect(x, y, 1, S - y); } };

/* ---------- earth texture: dots stay the same size on screen, so zooming in reveals finer dots ---------- */
let LAND = null, SEA = null;           // {q, rings:[[x*q, y*q, ...]]}; SEA = finer coasts for Southeast Asia
function ringsPath(src, W, H, path) {
  const q = src.q;
  for (const r of src.rings) {
    const xs = [r[0] / q];
    for (let i = 2; i < r.length; i += 2) { let l = r[i] / q; const p = xs[xs.length - 1]; while (l - p > 180) l -= 360; while (l - p < -180) l += 360; xs.push(l); }
    const polar = Math.abs(xs[xs.length - 1] - xs[0]) > 180;
    for (const o of polar ? [0] : [-360, 0, 360]) {
      if (!polar && (Math.max(...xs) + o < -180 || Math.min(...xs) + o > 180)) continue;

const CARDS = {
  sport: { name: "운동복", front: "cards/sport_front.png", back: "cards/sport_back.png" },
  hike:  { name: "하이킹", front: "cards/hike_front.png",  back: "cards/hike_back.png" }

function makeCardDoll(outfitId) {
