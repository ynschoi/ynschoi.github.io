<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Moti</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<style>
  /* 게임보이 3단: 정보창 / 방 / 주사위 패드 — 한 화면 고정 */
  :root{
    --night:#0b0820; --panel:#15102e; --edge:#4a3f8a; --gold:#ffd400; --red:#d92d20; --violet:#8d86c9; --cyan:#4cc3ff; --ink:#ddd8ff;
    --px:'Galmuri11','Galmuri9',ui-monospace,monospace; --font:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  html,body{height:100%;background:#1a1440;overflow:hidden;overscroll-behavior:none;touch-action:none}
  body{font-family:var(--px);color:#fff;-webkit-tap-highlight-color:transparent}
  button{all:unset;cursor:pointer;touch-action:manipulation}
  button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .app{max-width:440px;margin:0 auto;display:grid;grid-template-rows:auto 252px auto;grid-template-columns:minmax(0,1fr);width:100%;background:var(--night);transform-origin:50% 0}

  /* ═══ 위: 정보창 ═══ */
  .info{padding:10px 12px 8px;display:flex;flex-direction:column;gap:8px}
  .bar1{display:flex;align-items:center;gap:8px}
  .face{width:46px;height:46px;border:2px solid var(--gold);background:#2a2050 url(face.webp) center/cover;flex:none}
  .prs{flex:1;display:grid;gap:3px;min-width:0}
  .pr{display:flex;align-items:center;gap:6px;font-size:10px;height:13px}
  .pr .lb{width:52px;color:var(--gold);white-space:nowrap}
  .pr .tr{flex:1;height:7px;border:1.5px solid #fff;background:#3a1020;position:relative;overflow:hidden}
  .pr .fl{position:absolute;inset:0 auto 0 0;transition:width .6s}
  .pr .kg{width:44px;text-align:right;font-variant-numeric:tabular-nums}
  .pr.sn .fl{background:linear-gradient(#ff8a7a,#d92d20)}
  .pr.cj .fl{background:linear-gradient(#ffe066,#f5a623)}
  .pr.sq .fl{background:linear-gradient(#7ee0a0,#16a34a)}
  .pr.up .kg{color:var(--gold);animation:blink .3s steps(1) 6}
  .total{text-align:right;font-size:9px;color:var(--violet);line-height:1.3;flex:none}
  .total b{display:block;font-size:17px;color:var(--gold);font-weight:400;font-variant-numeric:tabular-nums}
  .win{height:108px;border:3px solid #fff;box-shadow:0 0 0 3px var(--night),0 0 0 5px var(--edge);background:linear-gradient(#1d1650,#120d33);padding:12px 14px;overflow:hidden;position:relative;display:flex;flex-direction:column;justify-content:center}
  .win .ttl{font-size:11px;color:var(--gold);margin-bottom:5px;display:flex;justify-content:space-between}
  .win .ttl span:last-child{color:var(--violet)}
  .win h2{font:700 17px var(--px);margin-bottom:3px}
  .win p{font:14px/1.5 var(--font);color:var(--ink);white-space:pre-line}
  .win.flash{animation:flash .5s}
  @keyframes flash{0%{box-shadow:0 0 0 3px var(--night),0 0 0 5px var(--gold),0 0 30px var(--gold)}}
  .caret{display:inline-block;width:7px;height:12px;background:#fff;margin-left:2px;vertical-align:-1px;animation:blink .8s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .bag{display:flex;gap:5px;align-items:center}
  .bag .lb{font-size:9px;color:var(--violet);margin-right:2px;width:24px;line-height:1.2}
  .pot{flex:1;height:42px;position:relative;border:2px solid #2d2560;background:#120d33;display:flex;align-items:center;gap:6px;padding:0 8px;font-size:10px;color:#5a5090}
  .pot{flex-direction:row;align-items:center;gap:7px;padding:0 7px;min-width:0;height:42px}
  .pot .tx{display:flex;flex-direction:column;gap:3px;min-width:0}
  .pot .t{display:flex;align-items:baseline;gap:5px;white-space:nowrap;font-size:11px}
  .pot canvas{width:19px;height:27px;image-rendering:pixelated;opacity:.55;flex:none;filter:grayscale(.6)}
  .pot.has canvas{opacity:1;filter:drop-shadow(0 0 5px var(--pc))}
  .pot .n{color:#8d86c9;font-size:15px}.pot .n::before{content:'×';font-size:11px;margin-right:1px}
  .pot.has .n{color:var(--gold)}
  .win.tall{height:126px}
  .pot{cursor:pointer;touch-action:manipulation}.pot.has:active{transform:translateY(2px)}
  .pot.drink{animation:drink .35s ease-out}
  @keyframes drink{40%{transform:scale(1.08);box-shadow:0 0 18px var(--pc)}}
  .pot.has{border-color:var(--pc);color:#fff;box-shadow:inset 0 0 12px color-mix(in srgb,var(--pc) 35%,transparent)}.pot.has .ic{opacity:1}
  .pot b{font-weight:400;display:block;font-size:9px;color:var(--violet)}
  .pot.got{animation:got .4s steps(2) 5}
  @keyframes got{50%{border-color:var(--gold);box-shadow:0 0 12px var(--gold)}}

  /* ═══ 가운데: 방 ═══ */
  .game{position:relative;overflow:hidden;background:#222;border-top:3px solid #fff;border-bottom:3px solid #fff}
  #room{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
  .night{position:absolute;inset:0;background:#05031a;opacity:0;transition:opacity 1s;pointer-events:none;z-index:8}
  .night.on{opacity:.7}
  /* 방 배경 그림 (낮/밤 크로스페이드) */
  .rbg{position:absolute;inset:0;background:center/cover no-repeat;transition:opacity 1.1s;pointer-events:none}
  .rbg.day{background-image:url(room_day.webp)}.rbg.nt{background-image:url(room_night.webp);opacity:0}
  .game.isnight .rbg.nt{opacity:1}
  .game.hasbg #room,.game.hasbg .tfront{visibility:hidden}.game.hasbg .night.on{opacity:.18}
  .hud{position:absolute;left:8px;top:8px;z-index:9;font-size:10px;background:#0b0820b0;padding:4px 7px}
  .hud b{color:var(--gold);font-weight:400}
  .tb{position:absolute;top:8px;z-index:9;font:700 10px var(--px);color:#fff;background:#0b0820cc;border:2px solid var(--gold);padding:3px 6px}
  #snd{right:8px}#hlp{right:56px}
  .hero{position:absolute;bottom:7%;left:0;width:var(--hh,130px);height:var(--hh,130px);margin-left:calc(var(--hh,130px)/-2);z-index:6;pointer-events:none}
  .hero .flip{position:absolute;inset:0;transform-origin:50% 98%}
  .hero.left .flip{transform:scaleX(-1)}
  .hero .spr{position:absolute;inset:0;background:url(hero.webp) 0 0/800% 100% no-repeat;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
  .hero .sh{position:absolute;left:30%;right:30%;bottom:-3px;height:8px;border-radius:50%;background:rgba(0,0,0,.35);filter:blur(2px)}
  .hero.strain .spr{animation:strain .09s steps(2) infinite}
  @keyframes strain{50%{transform:translateX(1.5%)}}
  .hero.red .spr{filter:sepia(.4) saturate(1.8) hue-rotate(-20deg)}
  .hero.walk .flip{animation:hop .22s ease-in-out infinite}
  @keyframes hop{50%{translate:0 -3%}}
  .hero.chew .spr{animation:chew .28s ease-in-out infinite}
  @keyframes chew{50%{transform:scaleY(.97)}}
  .hero.lie{transition:transform .5s}
  .bubble{position:absolute;bottom:100%;left:50%;transform:translate(-50%,-4px) scale(.6);opacity:0;transition:.16s;z-index:9;font-size:12px;white-space:nowrap;background:#fff;color:#111;padding:6px 9px;box-shadow:0 0 0 2px #111,3px 3px 0 2px #111}
  .bubble.on{opacity:1;transform:translate(-50%,-6px) scale(1)}
  .bb{position:absolute;height:2.4%;background:linear-gradient(#e9e9f2,#8a8aa0);box-shadow:0 0 0 1px #111;display:none;z-index:2;left:20%;right:24%;top:52.5%}
  .bb.on{display:block}
  .bb i{position:absolute;top:50%;width:5%;transform:translateY(-50%);border:1px solid #6b6b7a}
  .tfront{position:absolute;z-index:7;display:none;image-rendering:pixelated;pointer-events:none}
  .tfront.on{display:block}
  .pop{position:absolute;z-index:10;pointer-events:none;font-size:22px;font-weight:700;color:var(--gold);-webkit-text-stroke:2px #111;text-shadow:3px 3px 0 var(--red);animation:pop .9s ease-out forwards;white-space:nowrap}
  @keyframes pop{0%{transform:translate(-50%,0) scale(.3)}35%{transform:translate(-50%,0) scale(1.2)}100%{transform:translate(-50%,-36px);opacity:0}}
  .fly{position:absolute;z-index:9;pointer-events:none;font-size:20px;image-rendering:pixelated}
  .zz{position:absolute;z-index:9;pointer-events:none;font:700 16px var(--px);color:#bfe8ff;text-shadow:2px 2px 0 #111;animation:zz 2s ease-out forwards}
  @keyframes zz{0%{opacity:0;transform:none}20%{opacity:1}100%{opacity:0;transform:translate(26px,-50px) scale(1.3)}}
  .shake{animation:shk .25s}
  @keyframes shk{25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,1px)}}
  .banner{position:absolute;left:0;right:0;top:24%;z-index:15;text-align:center;font-size:32px;font-weight:700;color:var(--gold);-webkit-text-stroke:2px #111;text-shadow:4px 4px 0 var(--red);opacity:0;transform:scale(.5);transition:.2s;pointer-events:none}
  .banner.on{opacity:1;transform:scale(1)}

  /* 미니게임 화면 */
  .mg{position:absolute;inset:0;z-index:12;background:#0b0820;display:none;align-items:center;justify-content:center;touch-action:none}
  .mg.on{display:flex}
  .mg canvas{width:100%;max-height:100%;aspect-ratio:320/170;image-rendering:pixelated;display:block}
  .mgov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:#0b0820c8;text-align:center;padding:0 16px}
  .mgov[hidden]{display:none}
  .mgov .t{font-size:13px;color:var(--violet)}
  .mgov .g{font-size:28px;font-weight:700;color:var(--gold);-webkit-text-stroke:1.5px #111;text-shadow:3px 3px 0 var(--red)}
  .mgov .g.miss{color:#a0a0b8;text-shadow:3px 3px 0 #333}
  .mgov .s{font-size:12px;color:#fff;line-height:1.5}
  .mgov .row{display:flex;gap:8px;margin-top:4px}
  .mgov .row button{font:700 12px var(--px);padding:8px 12px;border:2px solid var(--gold);background:#0b0820;box-shadow:0 3px 0 #000}
  .mgov .row button.y{background:var(--gold);color:#111}
  .mgov .row button:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
  .mgov .row button[disabled]{opacity:.35;pointer-events:none}
  .mgov .eff{font:12px/1.5 var(--font);color:var(--ink)}
  .mgov .eff b{color:var(--gold);font-weight:700}
  .mgov .kg{font-size:18px;color:#fff}

  .cover{position:absolute;inset:0;z-index:20;background:#0b0820d8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;cursor:pointer}
  .cover .to{font-size:11px;color:var(--violet)}
  .cover .lg{font-size:40px;font-weight:700;color:var(--gold);text-shadow:4px 4px 0 var(--red);line-height:1;letter-spacing:4px}
  .cover .tag{font-size:16px;color:#fff;text-shadow:2px 2px 0 #000}
  .cover .note{font-size:9px;color:var(--violet)}
  .warn{margin:2px 16px;border:2px solid var(--gold);background:#0b0820;padding:8px 10px;font:12px/1.5 var(--font);color:#fff;max-width:330px;cursor:default}
  .warn b{color:var(--gold)}
  .cover.warned{gap:5px}.cover.warned .to,.cover.warned .sub,.cover.warned .note,.cover.warned .ins{display:none}.cover.warned .lg{font-size:26px}.cover.warned .tag{font-size:12px}.cover.warned .warn{padding:6px 9px;font-size:11px}
  .warn .row{display:flex;gap:6px;justify-content:center;margin-top:6px;flex-wrap:wrap}
  .warn .row button,.warn .row a{font:700 11px var(--px);padding:5px 9px;border:2px solid var(--gold);color:#fff;text-decoration:none;background:#15102e}
  .warn .row .y{background:var(--gold);color:#111}
  .cover .sub{font-size:10px;color:var(--ink);letter-spacing:1px}
  .cover .ins{font-size:14px;animation:blink 1s steps(1) infinite;margin-top:4px}
  .cover[hidden]{display:none}

  /* ═══ 아래: 주사위 패드 ═══ */
  .pad{background:linear-gradient(#2a2060,#1a1440);padding:14px 12px 16px;row-gap:12px;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:14px}
  .diebtn{width:118px;height:118px;display:grid;place-items:center;position:relative}
  .die{width:88px;height:88px;background:#fff;border-radius:14px;box-shadow:inset -6px -7px 0 #c9c4e8,0 0 0 3px #111,0 6px 0 3px #000;position:relative;transition:transform .15s}
  .die i{position:absolute;width:16px;height:16px;border-radius:50%;background:#111;transform:translate(-50%,-50%)}
  .die.red i{background:var(--red)}
  .diebtn.roll .die{animation:roll .12s linear infinite}
  @keyframes roll{25%{transform:rotate(14deg) translateY(-6px)}75%{transform:rotate(-14deg) translateY(-2px)}}
  .diebtn.land .die{animation:land .35s cubic-bezier(.2,1.8,.4,1)}
  @keyframes land{from{transform:scale(1.25) rotate(-10deg)}}
  .diebtn small{position:absolute;bottom:-4px;left:0;right:0;text-align:center;font-size:10px;color:var(--gold)}
  .diebtn.ready .die{animation:breathe 1.2s ease-in-out infinite}
  @keyframes breathe{50%{transform:translateY(-4px)}}
  .diebtn:active .die{transform:translateY(3px)}
  .legend{display:grid;grid-template-columns:1fr 1fr;gap:6px;min-width:0}
  .lg2{display:flex;align-items:center;gap:6px;border:2px solid #2d2560;background:#120d33;padding:5px 6px;font-size:10px;color:var(--ink);white-space:nowrap;overflow:hidden}
  .lg2 em{font-style:normal;width:16px;height:16px;display:grid;place-items:center;background:#fff;color:#111;border-radius:3px;font-size:10px;flex:none}
  .lg2.lift em{background:var(--gold)}
  .lg2.hit{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold);color:#fff}

  /* 필살기 */
  .hero .skl{position:absolute;left:-20%;top:-20%;width:140%;height:140%;background:0 0/800% 100% no-repeat;display:none;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
  .hero.skill .spr{visibility:hidden}.hero.skill .skl{display:block}
  /* 부드럽게: 두 장을 겹쳐 컷 사이를 크로스페이드, 전체는 숨 쉬듯 살짝 움직임 */
  .hero .sklw{position:absolute;inset:0;transform-origin:50% 95%;transition:transform .22s cubic-bezier(.3,1.6,.5,1)}
  .hero.skill .sklw{animation:breathe2 1.1s ease-in-out infinite}
  @keyframes breathe2{50%{translate:0 -1.2%}}
  .hero .skl{transition:opacity var(--xf,160ms) ease-in-out}
  .hero .skl.off{opacity:0}
  /* 동작 시트 (걷기·밥·똥·포션·주사위) */
  .hero .act{position:absolute;background-repeat:no-repeat;background-size:800% 100%;display:none;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
  .hero.acting .spr{visibility:hidden}.hero.acting .act{display:block}
  .hero.gone{opacity:0}
  .scn{position:absolute;z-index:6;background-repeat:no-repeat;background-size:800% 100%;display:none;pointer-events:none;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
  .scn.on{display:block}
  .choose{position:absolute;inset:0;z-index:13;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:#0b0820b0}
  .choose[hidden]{display:none}
  .choose .t{font-size:14px;color:#fff;text-shadow:2px 2px 0 #000}
  .choose .row{display:flex;gap:10px}
  .choose button{display:flex;flex-direction:column;align-items:center;gap:4px;width:138px;padding:10px 6px;border:3px solid var(--gold);background:#15102e;box-shadow:0 4px 0 #000;font:700 13px var(--px);color:#fff}
  .choose button small{font:11px var(--font);color:var(--ink);font-weight:400}
  .choose button img{height:38px;width:auto;image-rendering:pixelated}
  .choose button:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
  /* 지곡 잔상: 직전 포즈를 통째로 복사해 파랗게 물들인 층 (본체 뒤) */
  .hero .gh{position:absolute;left:-20%;top:-20%;width:140%;height:140%;background-repeat:no-repeat;opacity:0;pointer-events:none;
    transition:transform .18s cubic-bezier(.2,.8,.3,1),opacity .18s;filter:brightness(1.35) sepia(1) saturate(4) hue-rotate(170deg)}
  .wflash{position:absolute;inset:0;z-index:11;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
  .wflash.on{opacity:.8;transition:none}
  .skills{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
  .skills button{display:flex;align-items:center;justify-content:center;gap:3px;height:34px;border:2px solid var(--gold);background:linear-gradient(#3a2f7a,#241c55);font:700 11px var(--px);color:#fff;box-shadow:0 3px 0 #000;white-space:nowrap}
  .skills button:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
  .skills button i{font-style:normal;font-size:14px}
  .skills .lb{grid-column:1/-1;font-size:9px;color:var(--violet);margin-bottom:-2px}
  /* 성공 컷: 요쓰! */
  .cutin{position:absolute;left:0;right:0;top:14%;height:58%;z-index:14;pointer-events:none;display:none;
    clip-path:polygon(0 18%,100% 0,100% 82%,0 100%);background:#0b0820;overflow:hidden}
  .cutin.on{display:block;animation:cutin .9s cubic-bezier(.2,.9,.2,1) forwards}
  @keyframes cutin{0%{transform:translateX(-105%)}16%{transform:translateX(0)}84%{transform:translateX(0)}100%{transform:translateX(105%)}}
  .cutin::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(100deg,transparent 0 14px,#ffffff22 14px 16px,transparent 16px 34px);animation:cslide .25s linear infinite}
  @keyframes cslide{to{background-position:-60px 0}}
  .cutin::after{content:"";position:absolute;inset:0;box-shadow:inset 0 5px 0 var(--gold),inset 0 -5px 0 var(--gold)}
  .cutin .cf{position:absolute;left:4%;bottom:-6%;background-repeat:no-repeat;filter:drop-shadow(4px 4px 0 #000)}
  .cutin b{position:absolute;right:7%;top:50%;transform:translateY(-50%) rotate(-6deg);font:700 54px var(--px);color:#fff;-webkit-text-stroke:3px #111;text-shadow:5px 5px 0 var(--red);white-space:nowrap}
  .cutin.on b{animation:yos .9s steps(1) forwards}
  @keyframes yos{0%,15%{opacity:0}16%{opacity:1;transform:translateY(-50%) rotate(-6deg) scale(1.5)}24%{transform:translateY(-50%) rotate(-6deg) scale(1)}}
  .help{position:absolute;inset:0;z-index:30;background:#0b0820ee;display:flex;align-items:center;justify-content:center;padding:16px}
  .help[hidden]{display:none}
  .help div{border:3px solid #fff;padding:14px 16px;background:#15102e;max-width:340px;font:13px/1.6 var(--font);color:var(--ink)}
  .help h3{font:700 15px var(--px);color:var(--gold);margin-bottom:6px}
  .help b{color:#fff}
  .help small{display:block;margin-top:10px;font:10px var(--px);color:var(--violet);text-align:center}
  .help .rs{display:inline-block;margin-top:8px;font:10px var(--px);color:#ff9a9a;border:1px solid #ff9a9a;padding:3px 7px}
  .letter{font:14px/1.65 var(--font)!important;color:#fff!important}
  @media (prefers-reduced-motion:reduce){.diebtn.ready .die,.cover .ins{animation:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <section class="info">
    <div class="bar1">
      <div class="face"></div>
      <div class="prs">
        <div class="pr sn" id="prSn"><span class="lb">스내치</span><span class="tr"><span class="fl" id="flSn"></span></span><span class="kg" id="kgSn"></span></div>
        <div class="pr cj" id="prCj"><span class="lb">클린저크</span><span class="tr"><span class="fl" id="flCj"></span></span><span class="kg" id="kgCj"></span></div>
        <div class="pr sq" id="prSq"><span class="lb">백스쿼트</span><span class="tr"><span class="fl" id="flSq"></span></span><span class="kg" id="kgSq"></span></div>
      </div>
      <div class="total">합계<b id="tot">0</b></div>
    </div>
    <div class="win" id="win"></div>
    <div class="bag"><span class="lb">포션<br>가방</span>
      <div class="pot" id="potP" style="--pc:#ff5a4a"><canvas width="10" height="14"></canvas><div class="tx"><div class="t">파워<span class="n">0</span></div></div></div>
      <div class="pot" id="potR" style="--pc:#5ad1ff"><canvas width="10" height="14"></canvas><div class="tx"><div class="t">회복<span class="n">0</span></div></div></div>
      <div class="pot" id="potM" style="--pc:#c77dff"><canvas width="10" height="14"></canvas><div class="tx"><div class="t">근육<span class="n">0</span></div></div></div>
    </div>
  </section>

  if(!S.pot[p]){msg('POTION',`🧪 ${POTN[p]} 없음`,`${{P:'밥',R:'잠',M:'똥'}[p]} 칸이 나오면 생겨요.\n지금 ${name} Lv${S.lv[k]} · ${easeText(k,S.lv[k]).replace(/<[^>]+>/g,'')}`);return;}
  S.pot[p]--;S.lv[k]++;save();paint();SFX.potion();
  const el=$({P:'potP',R:'potR',M:'potM'}[p]);el.classList.remove('drink');void el.offsetWidth;el.classList.add('drink');
  const h=head();pop(`${name} Lv${S.lv[k]}`,h.x,h.y-30,15);say(pick(['꿀꺽','캬~','힘이 솟는다']),900);
  msg('POTION',`🧪 ${POTN[p]} 꿀꺽!`,`${name} Lv${S.lv[k]} (계속 쌓여요)\n${easeText(k,S.lv[k]).replace(/<[^>]+>/g,'')}`);
  busy=true;$('dice').classList.remove('ready');
  await playAct('mv_potion',[[0,180],[1,240],[2,260],[3,320],[4,320],[5,300],[6,550],[7,450]],f=>{if(f===3)SFX.gulp();if(f===6)SFX.charge&&tone(660,.3,'triangle',.05,600);});
  actEnd('mv_potion');busy=false;$('dice').classList.add('ready');}
[['P','potP'],['R','potR'],['M','potM']].forEach(([p,id])=>$(id).addEventListener('click',()=>{ac();drinkNow(p);}));

function gotPot(p,n=1){S.pot[p]+=n;save();paint();const el=$({P:'potP',R:'potR',M:'potM'}[p]);el.classList.remove('got');void el.offsetWidth;el.classList.add('got');SFX.potion();
  const h=head(),f=document.createElement('img');f.className='fly';f.src=potionURL(p);f.style.cssText+=`;left:${h.x}px;top:${h.y}px;width:20px;height:28px`;game.appendChild(f);
  f.animate([{transform:'translateY(0) scale(.5)'},{transform:'translateY(-40px) scale(1.3)',opacity:1},{transform:'translateY(-70px) scale(.6)',opacity:0}],{duration:1000});setTimeout(()=>f.remove(),1000);}
let typeT=null;
function msg(tag,title,body,cls=''){const w=$('win');w.classList.remove('flash');void w.offsetWidth;w.classList.add('flash');
  w.classList.toggle('tall',cls==='letter');w.innerHTML=`<h2>${title}</h2><p class="${cls}" id="msgP"></p>`;
  const el=$('msgP');clearInterval(typeT);let i=0;typeT=setInterval(()=>{i++;el.innerHTML=body.slice(0,i).replace(/\n/g,'<br>')+'<span class="caret"></span>';if(i>=body.length)clearInterval(typeT);},26);}
function renderLegend(hit){$('legend').innerHTML=FACES.map((f,i)=>`<div class="lg2${f.lift?' lift':''}${hit===i?' hit':''}"><em>${i+1}</em>${f.n}</div>`).join('');}
function showDie(n){$('die').className='die'+(n==1?' red':'');$('die').innerHTML=PIPS[n].map(([x,y])=>`<i style="left:${x}%;top:${y}%"></i>`).join('');}

/* ═════════ 주사위 ═════════ */
async function roll(){ac();if(!started){start();return;}if(busy)return;busy=true;
  const d=$('dice');d.classList.remove('ready','land');d.classList.add('roll');renderLegend(-1);
  const n=window.__force||1+Math.floor(Math.random()*6);let k=0;
  const thr=(async()=>{actSet('mv_dice');for(const [f,ms] of [[0,80],[1,170],[2,230],[3,160]]){actF(f);await sleep(ms);}})();
  while(k<8){showDie(1+Math.floor(Math.random()*6));SFX.tick();await sleep(35+k*7);k++;}
  await thr;
  showDie(n);d.classList.remove('roll');void d.offsetWidth;d.classList.add('land');SFX.land();renderLegend(n-1);
  S.rolls++;save();paint();const f=FACES[n-1];banner(f.n+'!',800);actF(f.lift?5:4);await sleep(420);actEnd('mv_dice');
  try{if(f.k==='eat')await doEat();else if(f.k==='zzz')await doSleep();else if(f.k==='poo')await doPoo();else await doLift(f.k);}catch(e){console.error(e);}
  busy=false;d.classList.add('ready');}

  const kh=(await chooseFood())==='k',name=kh?'mv_khach':'mv_eat';
  say(kh?'하차푸리다!!! 🧀':pick(['밥이다','탄수화물 충전','오늘은 밥 세 공기']),1200);
  await playAct(name,kh?[[0,500],[1,420],[2,420],[3,600],[4,520],[5,420],[6,420],[7,650]]:[[0,380],[1,360],[2,420],[3,380],[4,380],[5,520],[6,480],[7,700]],f=>{
    const h=head();
    if(kh){if(f===1||f===5)SFX.chew();if(f===3){tone(300,.5,'sawtooth',.03,300);pop('쭈~욱',h.x+20,h.y-10,16);}if(f===6)SFX.gulp();}
    else{if(f===2||f===3||f===4){SFX.chew();pop(pick(['냠','쩝','우걱']),h.x,h.y-10,15);}if(f===5)SFX.gulp();if(f===7)say('든든하다 👍',900);}});
  actEnd(name);
  if(!kh){gotPot('P',1);msg('EAT','🍚 밥 먹음','밥 한 그릇 뚝딱.\n파워포션 1개! 마시면 스내치 추가 느려져요.');await sleep(300);return;}
  // 하차푸리 랜덤 이벤트: 포션 0~3개
  const q=Math.random(),n=window.__kn??(q<.4?0:q<.7?1:q<.9?2:3),b=$('bubble');
  for(let i=0;i<10;i++){b.textContent=`포션… ${i%4}개?`;b.classList.add('on');SFX.tick();await sleep(70+i*12);}
  if(n){gotPot('P',n);say(['','1개!','2개!!','3개!!! 대박'][n],1300);banner(n===3?'잭팟!!':'+'+n,1000);if(n===3)SFX.win();}
  else{say('배만 부르다…',1300);SFX.fail();}
  msg('EAT','🧀 하차푸리',n?`치즈 가득 하차푸리.\n파워포션 ${n}개! 마시면 스내치 추가 느려져요.`:'치즈 가득 하차푸리.\n이번엔 포션이 안 나왔다… 다음엔 3개?');
  await sleep(300);}

async function doSleep(){
  const m=MV.mv_sleep,A=bgPt(.033,.80),B=bgPt(.228,.80),k=(B.x-A.x)/200,sc=$('scn');   // 그림 속 침대 시트(200px)를 배경 침대 폭에 맞춤

  await walkTo((left+m.ax*k)/GW()*240);say(pick(['하암~','잘 자, 내 근육','오늘도 수고했다']),900);
  sc.style.cssText=`left:${left}px;top:${top}px;width:${m.cw*k}px;height:${m.ch*k}px;background-image:url(${m.img});background-position:0 0`;
  hero.classList.add('gone');sc.classList.add('on');
  const zz=()=>{const z=document.createElement('div');z.className='zz';z.textContent=Math.random()<.5?'Z':'z';z.style.left=(left+(m.ax-200)*k)+'px';z.style.top=(top+m.ch*k*.35)+'px';game.appendChild(z);setTimeout(()=>z.remove(),2000);};
  for(const [f,ms] of [[0,700],[1,700],[2,750],[3,900],[4,900],[5,800],[6,600],[7,850]]){sc.style.backgroundPosition=(f/7*100)+'% 0';

  hx=(left+(m.ax+m.end)*k)/GW()*240;face=1;place();setF(F.smile);sc.classList.remove('on');hero.classList.remove('gone');gotPot('R');

async function doLift(k){await walkTo(SPOT.gym-4);setF(F.squat);say(pick(['간다...!','집중','후우...']),900);await sleep(600);
  const name=FACES.find(f=>f.k===k).n;
  await prep(k);
  const r=await mini(k,S.lv[k]);
  closeMG();
  const before=S[k],isPR=r.kg>before;
  if(r.kg>0){await yoss();SFX.thud();SFX.clang();shake();}
  if(isPR){S[k]=r.kg;save();paint(k);SFX.win();banner('NEW PR!',1100);
    await playAct('mv_yoss',[[1,180],[2,260],[3,320],[4,420],[5,480],[6,420],[7,300]],f=>{if(f===4){say('요쓰!!',1000);SFX.thud();}});actEnd('mv_yoss');setF(F.smile);
    say(pick(['가볍네','이게 사는 맛이지','근육아 고마워']),1200);
    msg('LIFT',`🏋️ ${name} 신기록!`,`${r.kg}kg 성공 (${r.grade})\n${before?`이전 기록 ${before}kg → `:''}PR ${r.kg}kg · 합계 ${total()}kg`);
  }else if(r.kg>0){setF(F.smile);say(pick(['아깝다','조금만 더','다음엔 넘는다']),1200);
    msg('LIFT',`🏋️ ${name} ${r.kg}kg`,`${r.grade}! 하지만 PR ${before}kg은 못 넘었다.\n${POTN[POTK[k]]}을 마시면 조금 쉬워져요.`);
  }else{SFX.fail();setF(F.bend);shake();say(pick(['으아아...','오늘은 컨디션이...','바벨이 무거운 게 아니라...']),1300);
    msg('LIFT',`🏋️ ${name} 실패`,`바벨을 놓쳤다. PR ${before?before+'kg':'없음'} 그대로.\n${POTN[POTK[k]]}을 마시면 조금 쉬워져요.`);}
  await sleep(900);setF(F.stand);paint();
}

function openMG(){mg.classList.add('on');}

function overlay(html){mgov.innerHTML=html;mgov.hidden=false;}
function drawStatic(){bg(mx);drawHero(mx,F.squat,80,118);}
function prep(k){openMG();drawStatic();const p=POTK[k],name=FACES.find(f=>f.k===k).n;return new Promise(res=>{
  const draw=()=>{const L=S.lv[k],c=S.pot[p];overlay(`<div class="t">${name} · PR ${S[k]?S[k]+'kg':'없음'}</div><div class="g" style="font-size:20px">Lv${L}</div>
    <div class="eff">지금 ${easeText(k,L)}${c?`<br>마시면 → ${easeText(k,L+1)}`:''}</div>
    <div class="row"><button id="drink" type="button"${c?'':' disabled'}>🧪 ${POTN[p]} 마시기 (${c})</button><button class="y" id="go" type="button">▶ 시작</button></div>`);
    $('drink').onclick=()=>{if(!S.pot[p])return;S.pot[p]--;S.lv[k]++;save();paint();SFX.potion();draw();};
    $('go').onclick=()=>{mgov.hidden=true;res();};};
  draw();});}

const STAGE=new Image();STAGE.src='stage.webp';
function bg(c){if(STAGE.complete&&STAGE.naturalWidth){c.imageSmoothingEnabled=true;c.drawImage(STAGE,0,0,W,H);c.imageSmoothingEnabled=false;return;}
c.fillStyle='#3b2f72';c.fillRect(0,0,W,FLOOR);c.fillStyle='#433680';for(let x=0;x<W;x+=16)c.fillRect(x,0,1,FLOOR);
  c.fillStyle='#6b4a33';c.fillRect(0,FLOOR,W,H-FLOOR);c.fillStyle='#5a3d2a';for(let y=FLOOR+6;y<H;y+=7)c.fillRect(0,y,W,1);
  c.fillStyle='#222';c.fillRect(20,FLOOR-2,110,5);c.fillStyle='#ffd400';c.fillRect(24,FLOOR,102,1);}
/* 정면 역도 시트 */
const LIFTS={"mv_cj": {"cw": 251, "ch": 320, "ax": 126, "fy": 296, "img": "mv_cj.webp"}, "mv_sn": {"cw": 277, "ch": 304, "ax": 138, "fy": 295, "img": "mv_sn.webp"}, "mv_sq": {"cw": 265, "ch": 298, "ax": 133, "fy": 291, "img": "mv_sq.webp"}};
for(const m of Object.values(LIFTS)){m.im=new Image();m.im.src=m.img;}
/* 성공·실패 동작 순서 [컷, ms] */
const LSEQ={sn:{ok:[[2,140],[3,140],[4,160],[5,260],[6,520],[7,600]],no:[[2,200],[1,700]]},
            cj:{ok:[[1,150],[2,230],[3,230],[4,150],[5,300],[6,500],[7,600]],no:[[1,220],[0,700]]},
            sq:{ok:[[4,220],[5,380],[7,700]],no:[[6,1000]]}};
const LX=88,LSZ=100;   // 미니게임 캔버스 안 위치·크기 (히어로 상자 기준)
function liftF(s,idle){if(s.anim){let t=performance.now()-s.anim.t0;for(const [f,ms] of s.anim.seq){if(t<ms)return f;t-=ms;}return s.anim.seq[s.anim.seq.length-1][0];}return idle;}
function drawLift(c,k,f,sh=0){const m=LIFTS['mv_'+k];if(!m||!m.im.complete||!m.im.naturalWidth)return false;const z=LSZ/300;
  c.imageSmoothingEnabled=true;c.drawImage(m.im,f*m.cw,0,m.cw,m.ch,LX-m.ax*z+(sh?rnd(-sh,sh):0),FLOOR+2-m.fy*z,m.cw*z,m.ch*z);c.imageSmoothingEnabled=false;return true;}
function drawHero(c,f,x=75,size=118,dy=0,sh=0){if(!IMG.complete)return;c.drawImage(IMG,f*400,0,400,400,x-size/2+(sh?rnd(-sh,sh):0),FLOOR+4-size-dy,size,size);}
function plates(c,x,y,dir){['#1b1b22','#1b1b22','#1b1b22'].forEach((col,i)=>{const h=[30,26,22][i];c.fillStyle='#6b6b7a';c.fillRect(x+dir*i*5-1,y-h/2-1,6,h+2);c.fillStyle=col;c.fillRect(x+dir*i*5,y-h/2,4,h);c.fillStyle='#3a3a46';c.fillRect(x+dir*i*5+1,y-h/2+2,1,h-4);});}
function bar(c,x1,x2,y){c.fillStyle='#111';c.fillRect(x1-1,y-2,x2-x1+2,5);c.fillStyle='#d8d8e4';c.fillRect(x1,y-1,x2-x1,3);plates(c,x1,y,1);plates(c,x2-4,y,-1);}
function txt(c,t,x,y,size=12,col='#fff'){c.font=`bold ${size}px Galmuri11, monospace`;c.textAlign='center';c.lineWidth=3;c.strokeStyle='#111';c.strokeText(t,x,y);c.fillStyle=col;c.fillText(t,x,y);}
function gauge(c,x,y,w,h,p,col){c.fillStyle='#111';c.fillRect(x-2,y-2,w+4,h+4);c.fillStyle='#3a1020';c.fillRect(x,y,w,h);c.fillStyle=col;c.fillRect(x,y,w*clamp(p,0,1),h);}

const GAMES={
 /* 1 추 타이밍 → 스내치: 가운데에 가까울수록 무거움 (40~110kg) */
 sn:{init(s,L){s.t=0;s.sp=rnd(2.6,3.2)*EASE.sn(L);s.tg=rnd(-35,35);s.a=0;},

  draw(c,s){bg(c);const ok=s.hit!=null&&s.grade!=='MISS';if(!drawLift(c,'sn',liftF(s,1)))drawHero(c,ok?F.knee:F.bend,70,110,ok?14:0);
   const cx=225,cy=128,R=88,r=d=>Math.PI*1.5+d*Math.PI/180;c.lineWidth=12;c.strokeStyle='#111';c.beginPath();c.arc(cx,cy,R,r(-63),r(63));c.stroke();
   c.lineWidth=8;c.strokeStyle='#4a3f8a';c.beginPath();c.arc(cx,cy,R,r(-60),r(60));c.stroke();
   [[25,'#14532d'],[7,'#16a34a'],[2.5,'#ffd400']].forEach(([w,col])=>{c.strokeStyle=col;c.beginPath();c.arc(cx,cy,R,r(Math.max(-60,s.tg-w)),r(Math.min(60,s.tg+w)));c.stroke();});
   const a=r(s.a);c.strokeStyle='#fff';c.lineWidth=3;c.beginPath();c.moveTo(cx,cy);c.lineTo(cx+Math.cos(a)*(R+6),cy+Math.sin(a)*(R+6));c.stroke();
   c.fillStyle='#d92d20';c.beginPath();c.arc(cx+Math.cos(a)*(R-4),cy+Math.sin(a)*(R-4),7,0,7);c.fill();c.fillStyle='#fff';c.fillRect(cx-4,cy-4,8,8);
   txt(c,'노란 곳에 가까울수록 무거움',cx,cy+20,10,'#ffd400');txt(c,`PR ${S.sn||'-'}`,40,18,10,'#fff');},
  down(s,end){if(s.hit!=null)return;s.hit=s.a;const d=Math.abs(s.a-s.tg);SFX.tap();
   if(d>=25)return end('MISS',0,500);end(d<2.5?'PERFECT':d<7?'GREAT':'GOOD',r05(40+70*(1-d/25)),500);}},
 /* 4 꾹 눌렀다 놓기 → 클린앤저크: 사다리 방식. 노란 줄에 가까울수록 지금 PR 위에 조금씩 더해짐 → 정밀하면 계속 PR 갱신 */
 cj:{init(s,L){s.wait=0;s.p=0;s.on=0;s.z=rnd(.55,.72);s.cs=1;s.mul=1;s.bands=cjBands(L);s.ct=0;},
  update(s,dt){if(s.done)return;if(!s.on){s.wait+=dt;if(s.wait>4)s.end('MISS',0);return;}s.p+=dt*(.35+s.p*.9)*s.cs;s.ct+=dt;if(s.ct>.06){s.ct=0;SFX.charge(s.p);}if(s.p>=1){s.p=1;s.end('MISS',0,300);}},
  draw(c,s){bg(c);const ok=s.done&&s.grade!=='MISS';if(!drawLift(c,'cj',liftF(s,0),s.on&&!s.done?s.p*2.5:0)){drawHero(c,ok?F.squat:(s.on?F.bend:F.stand),80,116,0,s.on?s.p*3:0);bar(c,25,140,ok?FLOOR-64:FLOOR-14);}
   // 게이지 하나: 초록 → 노랑 → 흰 줄(한가운데)
   const gx=190,gy=20,gh=126,Y=v=>gy+gh*(1-v),band=(w,col)=>{const t=Math.min(1,s.z+w),b=Math.max(0,s.z-w);c.fillStyle=col;c.fillRect(gx,Y(t),34,Y(b)-Y(t));};
   c.fillStyle='#111';c.fillRect(gx-3,gy-3,40,gh+6);c.fillStyle='#3a1020';c.fillRect(gx,gy,34,gh);
   s.bands.forEach(b=>band(b.w,b.c));c.fillStyle='#fff';c.fillRect(gx,Y(s.z)-.5,34,1);
   c.fillStyle=s.p>.92?'#d92d20':'#ffffffaa';c.fillRect(gx+10,Y(s.p),14,gh*s.p);c.fillStyle='#d92d20';c.fillRect(gx-7,Y(s.p)-1,48,3);
   txt(c,'꾹 누르고',276,70,11,'#ffd400');txt(c,'가운데 칸에서 떼!',276,88,10,'#fff');txt(c,s.bands.length<4?'포션 마시면 칸 추가':'빨강 = +5kg',276,106,9,'#ddd8ff');
   txt(c,`PR ${S.cj||'-'}`,40,18,10,'#fff');},
  down(s){if(!s.done)s.on=1;},
  up(s,end){if(s.done||!s.on)return;s.on=0;const d=Math.abs(s.p-s.z),base=Math.max(60,S.cj||0);
   if(d>=.25)return end('MISS',0,300);
   let hit=null;s.bands.forEach(b=>{if(d<b.w)hit=b;});   // 가장 안쪽 칸
   if(hit)return end(hit.g,r05(base+hit.add),300);
   end('GOOD',Math.max(40,r05(base-(d-.07)/.18*30)),300);}},
 /* 2 다다다 연타 → 백스쿼트: 제한 시간 안에 많이 칠수록 무거움 (40kg + 1회당 5kg) */
 sq:{init(s,L){s.t=0;s.lim=EASE.sq(L);s.taps=0;s.need=S.sq?Math.floor((S.sq-40)/5)+1:0;},
  update(s,dt){if(s.done)return;s.t+=dt;if(s.t>=s.lim){s.t=s.lim;const n=s.taps,rate=n/s.lim;if(n<3)return s.end('MISS',0,300);s.end(rate>=8?'PERFECT':rate>=6?'GREAT':'GOOD',40+n*5,300);}},
  draw(c,s){bg(c);const kg=40+s.taps*5,ok=s.done&&s.grade!=='MISS';if(!drawLift(c,'sq',liftF(s,s.taps?3:2),s.done?0:1.5)){drawHero(c,ok?F.stand:F.squat,90,118,0,s.done?0:1.5);bar(c,40,140,ok?98:86-Math.min(1,s.taps/20)*6);}
   gauge(c,200,34,100,10,1-s.t/s.lim,'#ffd400');txt(c,(s.lim-s.t).toFixed(1)+'초',250,62,13,'#fff');
   txt(c,`${kg}kg`,250,96,20,'#ffd400');txt(c,`${s.taps}회`+(s.need?` · PR까지 ${Math.max(0,s.need-s.taps)}회`:''),250,118,10,'#fff');},
  down(s){if(s.done)return;s.taps++;SFX.tap();}},
};
let cur=null;
function mini(k,L){openMG();const g=GAMES[k];return new Promise(async res=>{ // 결과 {grade,kg}
  const s={};g.init(s,L);
  const name=FACES.find(f=>f.k===k).n,how={sn:'추가 노란 곳에 올 때 탭!',cj:'꾹 누르고 가운데 칸에서 떼기!',sq:`${EASE.sq(L).toFixed(1)}초 동안 다다다 연타!`}[k];
  g.draw(mx,s);overlay(`<div class="t">${name} · Lv${L}</div><div class="g" style="font-size:22px">READY</div><div class="s">${how}</div>`);await sleep(1000);
  overlay(`<div class="g">GO!</div>`);await sleep(350);mgov.hidden=true;
  s.end=(grade,kg=0,delay=0)=>{if(s.done)return;s.done=1;s.grade=grade;s.kg=kg;const pr=S[k];
    if(LIFTS['mv_'+k]){const q=LSEQ[k][grade==='MISS'?'no':'ok'];s.anim={seq:q,t0:performance.now()};delay=Math.max(delay,q.reduce((a,b)=>a+b[1],0)-200);}
    setTimeout(()=>{
    overlay(`<div class="g${grade==='MISS'?' miss':''}">${grade}</div><div class="kg">${grade==='MISS'?'바벨을 놓쳤다…':kg+'kg'}</div><div class="s">${kg>pr?'NEW PR!':`PR ${pr?pr+'kg':'-'}`}</div>`);
    setTimeout(()=>{cur=null;res({grade,kg,raw:s.raw});},1300);},delay);};
  cur={g,s};let last=performance.now();
  (function loop(t){if(!cur||cur.s!==s)return;const dt=Math.min(.05,(t-last)/1000);last=t;g.update(s,dt);g.draw(mx,s);requestAnimationFrame(loop);})(last);
});}
const mpos=e=>{const r=mgc.getBoundingClientRect();return (e.clientX-r.left)/r.width*W;};
mg.addEventListener('pointerdown',e=>{if(!cur||cur.s.done||!mgov.hidden)return;e.preventDefault();try{mg.setPointerCapture(e.pointerId);}catch(_){}cur.g.down&&cur.g.down(cur.s,cur.s.end,mpos(e));});
['pointerup','pointercancel'].forEach(ev=>mg.addEventListener(ev,()=>{if(cur&&cur.g.up)cur.g.up(cur.s,cur.s.end);}));

  {k:'aura',ic:'✊',n:'잔켄',img:'sk_aura.webp',

  {k:'card',ic:'🃏',n:'번지껌',img:'sk_card.webp',
   seq:[[0,250],[1,550],[2,450],[3,500],[4,450],[5,450],[6,450],[7,300]],
   say:{1:'♦',3:'고무와 껌의 성질 ♦',6:'♠ 후훗'},hit:4,word:'번지껌!'},
  {k:'guardian',ic:'🙏',n:'백식관음',img:'sk_guardian.webp',
   seq:[[0,300],[1,450],[2,650],[3,650],[4,350],[5,800],[6,450],[7,350]],

  {k:'killua',ic:'⚡',n:'지곡',img:'sk_killua.webp',nf:16,
   seq:[[0,300],[1,160],[2,160],[3,150],[4,140],[5,140],[6,140],[7,140],[8,140],[9,150],[10,170],[11,420],[12,380],[13,220],[14,200],[15,300]],
   say:{1:'…',4:'지곡(肢曲)',11:'잡았다'},hit:11,word:'지곡!',
   gpx:.1467,   // 원본 1px → 칸 너비 %
   ghost:{4:[[-40,.25]],5:[[-35,.4],[-75,.2]],6:[[-45,.2],[45,.2]],7:[[35,.35],[75,.2],[-45,.2]],8:[[35,.4],[75,.2],[-45,.2]],
          9:[[-40,.3],[40,.3],[-85,.15],[85,.15]],10:[[-55,.3],[55,.3],[-110,.15],[110,.15]],11:[[-25,.25],[25,.25]],
          12:[[-55,.4],[-110,.25],[-165,.15]],13:[[-50,.3],[-100,.15]]}},
];
SKILLS.forEach(sk=>{const i=new Image();i.src=sk.img;});
$('skills').insertAdjacentHTML('beforeend',SKILLS.map((sk,i)=>`<button type="button" data-i="${i}"><i>${sk.ic}</i>${sk.n}</button>`).join(''));
$('skills').addEventListener('click',e=>{const b=e.target.closest('button');if(b)useSkill(SKILLS[+b.dataset.i]);});
const SFXS={
  aura:f=>f===5?(SFX.thud(),SFX.clang()):f>=2&&f<=4?SFX.charge(f/5):0,
  killua:f=>f>=3&&f<=10?tone(220+f*25,.05,'triangle',.025):f===11?(noise(.25,.1,4000),tone(1200,.15,'square',.05,-900)):0,
  card:f=>f===2?tone(1200,.12,'triangle',.06,-600):f===4?tone(300,.4,'sawtooth',.04,500):f===5?tone(700,.3,'sine',.06,-500):0,
  guardian:f=>f===2?[523,784].forEach((x,i)=>tone(x,.4,'triangle',.04,0,i*.1)):f===3?noise(.6,.05,600):f===5?(SFX.thud(),noise(.4,.12,3000)):0,
};
async function useSkill(sk){ac();if(!started)start();if(busy)return;busy=true;$('dice').classList.remove('ready');
  await walkTo(120);face=1;place();
  const L=[$('skl'),$('skl2')],wrap=$('sklw');let top=0;
  const nf=sk.nf||8;L.forEach(el=>{el.style.backgroundImage=`url(${sk.img})`;el.style.backgroundSize=`${nf*100}% 100%`;el.style.backgroundPosition='0 0';});L[1].classList.add('off');L[0].classList.remove('off');
  hero.classList.add('skill');
  const G=[];if(sk.ghost){for(let i=0;i<4;i++){const g=document.createElement('div');g.className='gh';g.style.backgroundImage=`url(${sk.img})`;g.style.backgroundSize=`${nf*100}% 100%`;wrap.insertBefore(g,wrap.firstChild);G.push(g);}}
  for(const [f,ms] of sk.seq){
    if(G.length){const plan=sk.ghost[f+1]||[],pf=Math.max(0,f-1);
      G.forEach((g,i)=>{const c=plan[i];if(c){g.style.backgroundPosition=(pf/(nf-1)*100)+'% 0';g.style.transform=`translateX(${c[0]*sk.gpx}%)`;g.style.opacity=Math.min(.85,c[1]*2.1);}else g.style.opacity=0;});}
    // 다음 컷을 아래 장에 깔고 서서히 드러냄 (컷 길이에 맞춰 페이드 시간 조절)
    const nxt=L[1-top],xf=Math.min(220,Math.max(110,ms*.4));
    L.forEach(el=>el.style.setProperty('--xf',xf+'ms'));
    nxt.style.backgroundPosition=(f/(nf-1)*100)+'% 0';nxt.classList.remove('off');L[top].classList.add('off');top=1-top;
    SFXS[sk.k](f);
    if(sk.say[f])say(sk.say[f],Math.max(900,ms+300));
    if(f===sk.hit){banner(sk.word,1200);shake();const w=$('wflash');w.classList.add('on');setTimeout(()=>w.classList.remove('on'),60);
      wrap.style.transform='scale(1.06)';setTimeout(()=>wrap.style.transform='',180);}
    await sleep(ms);}
  await sleep(120);G.forEach(g=>g.remove());
  hero.classList.remove('skill');setF(F.stand);
  msg('SKILL',`${sk.ic} ${sk.n}`,{aura:'최초는 주먹, 잔! 켄! 바위!\n오라를 모은 주먹이 바벨을 향한다.',card:'카드 한 장에 분홍 오라.\n늘어나고 줄어드는 근육의 성질.',guardian:'감사의 합장.\n금빛 거인이 Moti 뒤에 섰다.',killua:'리듬 있게 걷는 발걸음.\n잔상이 여러 개로 갈라진다.'}[sk.k]);
  busy=false;$('dice').classList.add('ready');}

addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();if(cur&&!cur.s.done&&mgov.hidden){if(!e.repeat)cur.g.down&&cur.g.down(cur.s,cur.s.end,0);}else if(!busy)roll();}});

<b>1 스내치</b> 추 타이밍 · <b>2 클린앤저크</b> 꾹 눌렀다 놓기 (포션 마실수록 진초록·노랑·빨강 칸이 생겨요) · <b>3 백스쿼트</b> 1초 연타<br>

function inApp(){const u=navigator.userAgent||'';return /KAKAOTALK|Instagram|FBAN|FBAV|FB_IAB|Line\/|NAVER\(|DaumApps|everytimeApp|Whale\/.*inapp|; wv\)/i.test(u);}
function setupWarn(){const kakao=/KAKAOTALK/i.test(navigator.userAgent||'');if(STORE_OK&&!inApp())return;const w=$('warn');w.hidden=false;$('cover').classList.add('warned');
  w.innerHTML=(STORE_OK?'⚠️ <b>앱 안 브라우저</b>에서는 기록이 사라질 수 있어요.':'⚠️ 이 화면에서는 <b>기록이 저장되지 않아요.</b>')+
   `<br>오른쪽 위(또는 아래) <b>⋮ · …</b> 메뉴 → <b>다른 브라우저로 열기</b>로 Safari나 Chrome에서 열어 주세요.
   <div class="row">${kakao?`<a class="y" href="kakaotalk://web/openExternal?url=${encodeURIComponent(SHARE_URL)}" target="_top">바깥 브라우저로 열기</a>`:''}<button type="button" id="cp">링크 복사</button><button type="button" id="skip">그냥 할래</button></div>`;

  $('skip').onclick=()=>start();}
function start(){if(started)return;started=true;ac();$('cover').hidden=true;SFX.morning();banner('DAY '+S.day,1000);
  msg('START',S.rolls?`다시 왔구나, ${TO}`:`안녕, ${TO}`,S.rolls?`역도 합계 ${total()}kg. 오늘은 기록 깰 수 있을까?\n아래 주사위를 눌러요.`:`${TO}의 인생은 주사위에 달렸다.\n밥 · 똥 · 잠 · 그리고 역도. 아래 주사위를 눌러요.`);say('역도 하고 싶다',1400);}

function fitApp(){const app=$('app'),vh=(window.visualViewport&&visualViewport.height)||innerHeight;if(!vh)return;
  const cs=getComputedStyle(document.documentElement),pad=(parseFloat(cs.paddingTop)||0)+(parseFloat(cs.paddingBottom)||0);
  app.style.transform='';const avail=vh-pad-4,s=Math.min(1,avail/app.scrollHeight);app.style.transform=s<1?`scale(${s})`:'';
  document.body.style.height=avail+'px';}
setTimeout(fitApp,300);if(window.visualViewport)visualViewport.addEventListener('resize',fitApp);
