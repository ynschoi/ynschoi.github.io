<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>먹고 싸고 자고 들고</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<style>
  /* 게임보이 3단: 정보창 / 방 / 주사위 패드 — 한 화면 고정 */
  :root{
    --night:#0b0820; --panel:#15102e; --edge:#4a3f8a; --gold:#ffd400; --red:#d92d20; --violet:#8d86c9; --cyan:#4cc3ff; --ink:#ddd8ff;
    --px:'Galmuri11','Galmuri9',ui-monospace,monospace; --font:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  html,body{height:100%;background:#1a1440;overflow:hidden;overscroll-behavior:none;touch-action:none}
  body{font-family:var(--px);color:#fff;-webkit-tap-highlight-color:transparent}
  button{all:unset;cursor:pointer;touch-action:manipulation}
  button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .app{max-width:440px;margin:0 auto;display:grid;grid-template-rows:auto 252px auto;grid-template-columns:minmax(0,1fr);width:100%;background:var(--night);transform-origin:50% 0}

  /* ═══ 위: 정보창 ═══ */
  .info{padding:10px 12px 8px;display:flex;flex-direction:column;gap:8px}
  .bar1{display:flex;align-items:center;gap:8px}
  .face{width:46px;height:46px;border:2px solid var(--gold);background:#2a2050 url(face.webp) center/cover;flex:none}
  .prs{flex:1;display:grid;gap:3px;min-width:0}
  .pr{display:flex;align-items:center;gap:6px;font-size:10px;height:13px}
  .pr .lb{width:52px;color:var(--gold);white-space:nowrap}
  .pr .tr{flex:1;height:7px;border:1.5px solid #fff;background:#3a1020;position:relative;overflow:hidden}
  .pr .fl{position:absolute;inset:0 auto 0 0;transition:width .6s}
  .pr .kg{width:44px;text-align:right;font-variant-numeric:tabular-nums}
  .pr.sn .fl{background:linear-gradient(#ff8a7a,#d92d20)}
  .pr.cj .fl{background:linear-gradient(#ffe066,#f5a623)}
  .pr.sq .fl{background:linear-gradient(#7ee0a0,#16a34a)}
  .pr.up .kg{color:var(--gold);animation:blink .3s steps(1) 6}
  .total{text-align:right;font-size:9px;color:var(--violet);line-height:1.3;flex:none}
  .total b{display:block;font-size:17px;color:var(--gold);font-weight:400;font-variant-numeric:tabular-nums}
  .win{height:150px;border:3px solid #fff;box-shadow:0 0 0 3px var(--night),0 0 0 5px var(--edge);background:linear-gradient(#1d1650,#120d33);padding:9px 12px;overflow:hidden;position:relative}
  .win .ttl{font-size:11px;color:var(--gold);margin-bottom:5px;display:flex;justify-content:space-between}
  .win .ttl span:last-child{color:var(--violet)}
  .win h2{font:700 17px var(--px);margin-bottom:3px}
  .win p{font:14px/1.5 var(--font);color:var(--ink);white-space:pre-line}
  .win.flash{animation:flash .5s}
  @keyframes flash{0%{box-shadow:0 0 0 3px var(--night),0 0 0 5px var(--gold),0 0 30px var(--gold)}}
  .caret{display:inline-block;width:7px;height:12px;background:#fff;margin-left:2px;vertical-align:-1px;animation:blink .8s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .bag{display:flex;gap:5px;align-items:center}
  .bag .lb{font-size:9px;color:var(--violet);margin-right:2px;width:24px;line-height:1.2}
  .pot{flex:1;height:42px;position:relative;border:2px solid #2d2560;background:#120d33;display:flex;align-items:center;gap:6px;padding:0 8px;font-size:10px;color:#5a5090}
  .pot canvas{width:18px;height:24px;image-rendering:pixelated;opacity:.35;flex:none}
  .pot.has{border-color:#fff;color:#fff}.pot.has canvas{opacity:1}
  .pot b{font-weight:400;display:block;font-size:9px;color:var(--violet)}
  .pot .n{margin-left:auto;font-size:14px;color:var(--gold)}
  .pot.got{animation:got .4s steps(2) 5}
  @keyframes got{50%{border-color:var(--gold);box-shadow:0 0 12px var(--gold)}}

  /* ═══ 가운데: 방 ═══ */
  .game{position:relative;overflow:hidden;background:#222;border-top:3px solid #fff;border-bottom:3px solid #fff}
  #room{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
  .night{position:absolute;inset:0;background:#05031a;opacity:0;transition:opacity 1s;pointer-events:none;z-index:8}
  .night.on{opacity:.7}
  .hud{position:absolute;left:8px;top:8px;z-index:9;font-size:10px;background:#0b0820b0;padding:4px 7px}
  .hud b{color:var(--gold);font-weight:400}
  .tb{position:absolute;top:8px;z-index:9;font:700 10px var(--px);color:#fff;background:#0b0820cc;border:2px solid var(--gold);padding:3px 6px}
  #snd{right:8px}#hlp{right:56px}
  .hero{position:absolute;bottom:7%;left:0;width:var(--hh,130px);height:var(--hh,130px);margin-left:calc(var(--hh,130px)/-2);z-index:6;pointer-events:none}
  .hero .flip{position:absolute;inset:0;transform-origin:50% 98%}
  .hero.left .flip{transform:scaleX(-1)}
  .hero .spr{position:absolute;inset:0;background:url(hero.webp) 0 0/800% 100% no-repeat;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
  .hero .sh{position:absolute;left:30%;right:30%;bottom:-3px;height:8px;border-radius:50%;background:rgba(0,0,0,.35);filter:blur(2px)}
  .hero.strain .spr{animation:strain .09s steps(2) infinite}
  @keyframes strain{50%{transform:translateX(1.5%)}}
  .hero.red .spr{filter:sepia(.4) saturate(1.8) hue-rotate(-20deg)}
  .hero.walk .flip{animation:hop .22s ease-in-out infinite}
  @keyframes hop{50%{translate:0 -3%}}
  .hero.chew .spr{animation:chew .28s ease-in-out infinite}
  @keyframes chew{50%{transform:scaleY(.97)}}
  .hero.lie{transition:transform .5s}
  .bubble{position:absolute;bottom:100%;left:50%;transform:translate(-50%,-4px) scale(.6);opacity:0;transition:.16s;z-index:9;font-size:12px;white-space:nowrap;background:#fff;color:#111;padding:6px 9px;box-shadow:0 0 0 2px #111,3px 3px 0 2px #111}
  .bubble.on{opacity:1;transform:translate(-50%,-6px) scale(1)}
  .bb{position:absolute;height:2.4%;background:linear-gradient(#e9e9f2,#8a8aa0);box-shadow:0 0 0 1px #111;display:none;z-index:2;left:20%;right:24%;top:52.5%}
  .bb.on{display:block}
  .bb i{position:absolute;top:50%;width:5%;transform:translateY(-50%);border:1px solid #111}
  .tfront{position:absolute;z-index:7;display:none;image-rendering:pixelated;pointer-events:none}
  .tfront.on{display:block}
  .pop{position:absolute;z-index:10;pointer-events:none;font-size:22px;font-weight:700;color:var(--gold);-webkit-text-stroke:2px #111;text-shadow:3px 3px 0 var(--red);animation:pop .9s ease-out forwards;white-space:nowrap}
  @keyframes pop{0%{transform:translate(-50%,0) scale(.3)}35%{transform:translate(-50%,0) scale(1.2)}100%{transform:translate(-50%,-36px);opacity:0}}
  .fly{position:absolute;z-index:9;pointer-events:none;font-size:20px;image-rendering:pixelated}
  .zz{position:absolute;z-index:9;pointer-events:none;font:700 16px var(--px);color:#bfe8ff;text-shadow:2px 2px 0 #111;animation:zz 2s ease-out forwards}
  @keyframes zz{0%{opacity:0;transform:none}20%{opacity:1}100%{opacity:0;transform:translate(26px,-50px) scale(1.3)}}
  .shake{animation:shk .25s}
  @keyframes shk{25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,1px)}}
  .banner{position:absolute;left:0;right:0;top:24%;z-index:15;text-align:center;font-size:32px;font-weight:700;color:var(--gold);-webkit-text-stroke:2px #111;text-shadow:4px 4px 0 var(--red);opacity:0;transform:scale(.5);transition:.2s;pointer-events:none}
  .banner.on{opacity:1;transform:scale(1)}

  /* 미니게임 화면 */
  .mg{position:absolute;inset:0;z-index:12;background:#0b0820;display:none;align-items:center;justify-content:center;touch-action:none}
  .mg.on{display:flex}
  .mg canvas{width:100%;max-height:100%;aspect-ratio:320/170;image-rendering:pixelated;display:block}
  .mgov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:#0b0820c8;text-align:center;padding:0 16px}
  .mgov[hidden]{display:none}
  .mgov .t{font-size:13px;color:var(--violet)}
  .mgov .g{font-size:28px;font-weight:700;color:var(--gold);-webkit-text-stroke:1.5px #111;text-shadow:3px 3px 0 var(--red)}
  .mgov .g.miss{color:#a0a0b8;text-shadow:3px 3px 0 #333}
  .mgov .s{font-size:12px;color:#fff;line-height:1.5}
  .mgov .row{display:flex;gap:8px;margin-top:4px}
  .mgov .row button{font:700 12px var(--px);padding:8px 12px;border:2px solid var(--gold);background:#0b0820;box-shadow:0 3px 0 #000}
  .mgov .row button.y{background:var(--gold);color:#111}
  .mgov .row button:active{transform:translateY(2px);box-shadow:0 1px 0 #000}

  .cover{position:absolute;inset:0;z-index:20;background:#0b0820d8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;cursor:pointer}
  .cover .to{font-size:11px;color:var(--violet)}
  .cover .lg{font-size:26px;font-weight:700;color:var(--gold);text-shadow:3px 3px 0 var(--red);line-height:1.15}
  .cover .sub{font-size:10px;color:var(--ink);letter-spacing:1px}
  .cover .ins{font-size:14px;animation:blink 1s steps(1) infinite;margin-top:4px}
  .cover[hidden]{display:none}

  /* ═══ 아래: 주사위 패드 ═══ */
  .pad{background:linear-gradient(#2a2060,#1a1440);padding:14px 12px 18px;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:14px}
  .diebtn{width:118px;height:118px;display:grid;place-items:center;position:relative}
  .die{width:88px;height:88px;background:#fff;border-radius:14px;box-shadow:inset -6px -7px 0 #c9c4e8,0 0 0 3px #111,0 6px 0 3px #000;position:relative;transition:transform .15s}
  .die i{position:absolute;width:16px;height:16px;border-radius:50%;background:#111;transform:translate(-50%,-50%)}
  .die.red i{background:var(--red)}
  .diebtn.roll .die{animation:roll .12s linear infinite}
  @keyframes roll{25%{transform:rotate(14deg) translateY(-6px)}75%{transform:rotate(-14deg) translateY(-2px)}}
  .diebtn.land .die{animation:land .35s cubic-bezier(.2,1.8,.4,1)}
  @keyframes land{from{transform:scale(1.25) rotate(-10deg)}}
  .diebtn small{position:absolute;bottom:-4px;left:0;right:0;text-align:center;font-size:10px;color:var(--gold)}
  .diebtn.ready .die{animation:breathe 1.2s ease-in-out infinite}
  @keyframes breathe{50%{transform:translateY(-4px)}}
  .diebtn:active .die{transform:translateY(3px)}
  .legend{display:grid;grid-template-columns:1fr 1fr;gap:6px;min-width:0}
  .lg2{display:flex;align-items:center;gap:6px;border:2px solid #2d2560;background:#120d33;padding:5px 6px;font-size:10px;color:var(--ink);white-space:nowrap;overflow:hidden}
  .lg2 em{font-style:normal;width:16px;height:16px;display:grid;place-items:center;background:#fff;color:#111;border-radius:3px;font-size:10px;flex:none}
  .lg2.lift em{background:var(--gold)}
  .lg2.hit{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold);color:#fff}

  .help{position:absolute;inset:0;z-index:30;background:#0b0820ee;display:flex;align-items:center;justify-content:center;padding:16px}
  .help[hidden]{display:none}
  .help div{border:3px solid #fff;padding:14px 16px;background:#15102e;max-width:340px;font:13px/1.6 var(--font);color:var(--ink)}
  .help h3{font:700 15px var(--px);color:var(--gold);margin-bottom:6px}
  .help b{color:#fff}
  .help small{display:block;margin-top:10px;font:10px var(--px);color:var(--violet);text-align:center}
  .help .rs{display:inline-block;margin-top:8px;font:10px var(--px);color:#ff9a9a;border:1px solid #ff9a9a;padding:3px 7px}
  .letter{font:14px/1.65 var(--font)!important;color:#fff!important}
  @media (prefers-reduced-motion:reduce){.diebtn.ready .die,.cover .ins{animation:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <section class="info">
    <div class="bar1">
      <div class="face"></div>
      <div class="prs">
        <div class="pr sn" id="prSn"><span class="lb">스내치</span><span class="tr"><span class="fl" id="flSn"></span></span><span class="kg" id="kgSn"></span></div>
        <div class="pr cj" id="prCj"><span class="lb">클린저크</span><span class="tr"><span class="fl" id="flCj"></span></span><span class="kg" id="kgCj"></span></div>
        <div class="pr sq" id="prSq"><span class="lb">백스쿼트</span><span class="tr"><span class="fl" id="flSq"></span></span><span class="kg" id="kgSq"></span></div>
      </div>
      <div class="total">합계<b id="tot">0</b></div>
    </div>
    <div class="win" id="win"></div>
    <div class="bag"><span class="lb">포션<br>가방</span>
      <div class="pot" id="potP"><canvas width="10" height="14"></canvas><div>파워<b>스내치</b></div><span class="n">0</span></div>
      <div class="pot" id="potR"><canvas width="10" height="14"></canvas><div>회복<b>클린저크</b></div><span class="n">0</span></div>
      <div class="pot" id="potM"><canvas width="10" height="14"></canvas><div>근육<b>스쿼트</b></div><span class="n">0</span></div>
    </div>
  </section>

  <section class="game" id="game">
    <canvas id="room" width="240" height="138"></canvas>
    <div class="hero" id="hero">
      <div class="bubble" id="bubble"></div>
      <div class="flip"><div class="spr" id="spr"></div><div class="bb" id="bb"></div></div>
      <div class="sh"></div>
    </div>
    <canvas class="tfront" id="tfront" width="30" height="22"></canvas>
    <div class="night" id="night"></div>
    <div class="hud" id="hud"></div>
    <button class="tb" id="hlp" type="button">?</button>
    <button class="tb" id="snd" type="button">♪ ON</button>
    <div class="banner" id="banner"></div>
    <div class="mg" id="mg">
      <canvas id="mgc" width="640" height="340"></canvas>
      <div class="mgov" id="mgov"></div>
    </div>
    <div class="cover" id="cover">
      <div class="to" id="coverTo"></div>
      <div class="lg">먹고 싸고<br>자고 들고</div>
      <div class="sub">ROLL · EAT · POOP · SLEEP · LIFT</div>
      <div class="ins">TAP TO START</div>
    </div>
  </section>

  <section class="pad">
    <button class="diebtn ready" id="dice" type="button" aria-label="주사위 굴리기"><div class="die" id="die"></div><small>TAP!</small></button>
    <div class="legend" id="legend"></div>
  </section>

  <div class="help" id="help" hidden><div id="helpBody"></div></div>
</div>

<script>
/* ═════════ 선물 설정: 이름은 여기서 바꿔요 ═════════ */
const TO='친구', FROM='영수';
const josa=(w,a,b)=>{const c=w.charCodeAt(w.length-1);return (c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28)?a:b;};
const TOya=TO+josa(TO,'아','야');
const LETTER_AT=300;   // 합계가 이 kg을 넘으면 편지

/* ═════════ 주사위 6면 ═════════ */
const FACES=[
  {k:'sn',n:'스내치',lift:1},{k:'cj',n:'클린앤저크',lift:1},{k:'sq',n:'백스쿼트',lift:1},
  {k:'eat',n:'밥'},{k:'zzz',n:'잠'},{k:'poo',n:'똥'}];
const PIPS={1:[[50,50]],2:[[28,28],[72,72]],3:[[26,26],[50,50],[74,74]],4:[[28,28],[72,28],[28,72],[72,72]],5:[[26,26],[74,26],[50,50],[26,74],[74,74]],6:[[30,24],[70,24],[30,50],[70,50],[30,76],[70,76]]};
const KG={PERFECT:10,GREAT:5,GOOD:2,MISS:0};
const START={sn:60,cj:80,sq:100};

/* ═════════ 상태 ═════════ */
const KEY='liftlife.dice.v1';
const S={sn:START.sn,cj:START.cj,sq:START.sq,pot:{P:0,R:0,M:0},day:1,rolls:0,letter:false};
try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(v){Object.assign(S,v);S.pot=Object.assign({P:0,R:0,M:0},v.pot);}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};

const $=id=>document.getElementById(id);
const game=$('game'),hero=$('hero'),spr=$('spr');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const GW=()=>game.clientWidth,GH=()=>game.clientHeight;
let started=false,busy=false,sound=true,hx=120,face=1;

/* ═════════ 소리 ═════════ */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d=.08,type='square',v=.06,slide=0,delay=0){if(!sound)return;const c=ac();if(!c)return;const t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.02);}
function noise(d=.2,v=.08,freq=800,delay=0){if(!sound)return;const c=ac();if(!c)return;const t=c.currentTime+delay,n=c.sampleRate*d,b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);
  for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=freq;g.gain.value=v;s.connect(f).connect(g).connect(c.destination);s.start(t);}
const SFX={
  tick:()=>tone(600+Math.random()*300,.03,'square',.03),
  land:()=>{tone(180,.12,'square',.08,-60);noise(.08,.06,2000);},
  chew:()=>{tone(220,.05,'square',.04);tone(180,.05,'square',.03,0,.07);},
  gulp:()=>tone(500,.12,'sine',.08,-300),
  fart:()=>{if(!sound)return;const c=ac();if(!c)return;const t=c.currentTime,o=c.createOscillator(),l=c.createOscillator(),lg=c.createGain(),g=c.createGain();
    o.type='sawtooth';o.frequency.setValueAtTime(95,t);o.frequency.linearRampToValueAtTime(60,t+.55);l.frequency.value=26;lg.gain.value=30;l.connect(lg).connect(o.frequency);
    g.gain.setValueAtTime(.12,t);g.gain.linearRampToValueAtTime(.0001,t+.6);o.connect(g).connect(c.destination);o.start(t);l.start(t);o.stop(t+.62);l.stop(t+.62);noise(.25,.05,300,.05);},
  plop:()=>{tone(300,.15,'sine',.1,-200);noise(.1,.04,1500,.05);},
  snore:()=>{noise(.7,.05,250);tone(70,.6,'sawtooth',.02,20);},
  tap:()=>tone(330+Math.random()*80,.04,'square',.04),
  charge:p=>tone(200+p*600,.03,'square',.025),
  clang:()=>{tone(1400,.35,'triangle',.08,-200);tone(1900,.25,'square',.03,-500);noise(.15,.08,4000);},
  thud:()=>{tone(90,.25,'sine',.15,-50);noise(.18,.1,500);},
  potion:()=>[660,880,1320].forEach((f,i)=>tone(f,.09,'triangle',.06,0,i*.06)),
  win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.12,'square',.05,0,i*.09)),
  fail:()=>[392,330,262].forEach((f,i)=>tone(f,.16,'square',.05,0,i*.13)),
  morning:()=>[784,988,1175,1568].forEach((f,i)=>tone(f,.1,'triangle',.06,0,i*.08)),
};

/* ═════════ 픽셀 소품: 포션 · 하차푸리 ═════════ */
const POT={P:['#ff5a4a','#b81d12'],R:['#5ad1ff','#1f7fd1'],M:['#c77dff','#7b2cbf']};
function drawPotion(cv,[a,b]){const c=cv.getContext('2d');const P=(x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(x,y,w,h);};c.clearRect(0,0,10,14);

const F={stand:0,run:1,bend:2,knee:3,kick:4,tuck:5,squat:6,smile:7};
const toPx=x=>x/240*GW();

function place(){hero.style.setProperty('--hh',heroH()+'px');hero.style.left=toPx(hx)+'px';hero.classList.toggle('left',face<0);}
let walkT=null;
function walkTo(x){return new Promise(res=>{if(Math.abs(x-hx)<1){res();return;}face=x>hx?1:-1;place();hero.classList.add('walk');let k=0;setF(F.run);
  clearInterval(walkT);walkT=setInterval(()=>setF(++k%2?F.stand:F.run),140);let last=performance.now();
  (function step(t){const dt=(t-last)/1000;last=t;const d=x-hx;hx+=Math.sign(d)*Math.min(Math.abs(d),90*dt);place();
    if(Math.abs(x-hx)<.5){hx=x;face=1;place();clearInterval(walkT);hero.classList.remove('walk');setF(F.stand);res();return;}requestAnimationFrame(step);})(last);});}
function say(t,ms=1300){const b=$('bubble');b.textContent=t;b.classList.add('on');clearTimeout(say.t);say.t=setTimeout(()=>b.classList.remove('on'),ms);}

async function roll(){ac();if(!started){start();return;}if(busy)return;busy=true;
  const d=$('dice');d.classList.remove('ready','land');d.classList.add('roll');renderLegend(-1);
  const n=window.__force||1+Math.floor(Math.random()*6);let k=0;
  while(k<12){showDie(1+Math.floor(Math.random()*6));SFX.tick();await sleep(50+k*9);k++;}
  showDie(n);d.classList.remove('roll');void d.offsetWidth;d.classList.add('land');SFX.land();renderLegend(n-1);
  S.rolls++;save();paint();const f=FACES[n-1];banner(f.n+'!',900);await sleep(700);
  try{if(f.k==='eat')await doEat();else if(f.k==='zzz')await doSleep();else if(f.k==='poo')await doPoo();else await doLift(f.k);}catch(e){console.error(e);}
  busy=false;d.classList.add('ready');}

async function doEat(){await walkTo(SPOT.table-14);
  const jackpot=Math.random()<.2;setF(F.smile);hero.classList.add('chew');
  say(jackpot?'하차푸리다!!! 🧀':pick(['밥이다','탄수화물 충전','오늘은 밥 세 공기']),1200);
  for(let i=0;i<4;i++){const h=head(),tx=toPx(SPOT.table),ty=GH()*.52;let f;
    if(jackpot){f=document.createElement('img');f.src=IMG_K;f.style.cssText='width:34px;height:20px;image-rendering:pixelated';}else{f=document.createElement('div');f.textContent=pick(['🍚','🍚','🍗','🥚']);}
    f.classList.add('fly');f.style.left=tx+'px';f.style.top=ty+'px';game.appendChild(f);
    f.animate([{transform:'none'},{transform:`translate(${(h.x-tx)/2}px,${h.y-ty-30}px) scale(1.1)`,offset:.5},{transform:`translate(${h.x-tx}px,${h.y-ty+8}px) scale(.3)`,opacity:.2}],{duration:420,easing:'ease-in'});
    setTimeout(()=>f.remove(),400);await sleep(380);SFX.chew();pop(jackpot?pick(['치즈~','쭈욱','고소해']):pick(['냠','쩝','우걱']),h.x,h.y-10,15);await sleep(140);}
  hero.classList.remove('chew');SFX.gulp();gotPot('P',jackpot?2:1);
  msg('EAT',jackpot?'🧀 하차푸리 잭팟!':'🍚 밥 먹음',jackpot?'치즈 가득 하차푸리를 먹었다.\n파워포션 2개 획득! (스내치에 사용)':'밥 한 그릇 뚝딱.\n파워포션 1개 획득! (스내치에 사용)');
  await sleep(500);setF(F.stand);}

async function doSleep(){await walkTo(SPOT.bed+4);say(pick(['잘 자, 내 근육','오늘도 수고했다']),900);await sleep(800);
  hero.classList.add('lie');hero.style.transform=`translate(${heroH()*.02}px,${-GH()*.13}px) rotate(-90deg) scale(.78)`;hero.style.zIndex=4;await sleep(500);

/* ═════════ 역도 3종 ═════════ */
const LIFT={sn:{pot:'P',pn:'파워포션',eff:'추가 느려지고 타겟이 넓어져요'},cj:{pot:'R',pn:'회복포션',eff:'실패해도 한 번 더 할 수 있어요'},sq:{pot:'M',pn:'근육포션',eff:'한 번 탭이 2배 힘이 돼요'}};
async function doLift(k){await walkTo(SPOT.gym-4);setF(F.squat);say(pick(['간다...!','집중','후우...']),900);await sleep(600);
  const L=LIFT[k],name=FACES.find(f=>f.k===k).n;let use=false;
  if(S.pot[L.pot]>0)use=await ask(`${name} · 지금 ${S[k]}kg`,`🧪 ${L.pn} 쓸까요? (${S.pot[L.pot]}개)`,L.eff);
  if(use){S.pot[L.pot]--;save();paint();SFX.potion();}
  let grade=await mini(k,use);
  if(grade==='MISS'&&k==='cj'&&use){await note('회복포션 발동!','한 번 더 해요');grade=await mini(k,false);}
  closeMG();
  const add=KG[grade];
  if(add){const before=S[k];S[k]+=add;save();setF(F.stand);setBar(true);$('bb').style.top='56%';SFX.thud();await sleep(500);setBar(false);$('bb').style.top='';SFX.clang();shake();
    paint(k);if(grade==='PERFECT'){SFX.win();banner('PERFECT!',1100);setF(F.kick);await sleep(500);setF(F.knee);await sleep(300);}else banner('NEW PR!',1000);
    setF(F.smile);say(pick(['가볍네','하나 더?','이게 사는 맛이지']),1200);
    msg('LIFT',`🏋️ ${name} ${grade}`,`${before}kg → ${S[k]}kg (+${add}kg)\n역도 합계 ${total()}kg`);
  }else{SFX.fail();setF(F.bend);shake();say(pick(['으아아...','오늘은 컨디션이...','바벨이 무거운 게 아니라...']),1300);
    msg('LIFT',`🏋️ ${name} 실패`,`${S[k]}kg 그대로.\n밥·잠·똥으로 포션을 모아서 다시 도전!`);}
  await sleep(900);setF(F.stand);paint();
  if(total()>=LETTER_AT&&!S.letter){S.letter=true;save();await sleep(1800);showLetter();}}

function showLetter(){SFX.win();banner('💌',1000);msg('LETTER',`💌 ${TO}에게`,`${TOya}, 너는 진짜 밥 먹고 똥 싸고 잠 자고 역도만 하더라.\n근데 그게 제일 멋있어. 오늘도 PR 갱신하자 💪\nFrom. ${FROM}`,'letter');}

const mg=$('mg'),mgc=$('mgc'),mx=mgc.getContext('2d'),mgov=$('mgov');mx.scale(2,2);mx.imageSmoothingEnabled=false;
const IMG=new Image();IMG.src='hero.webp';
const W=320,H=170,FLOOR=150;
function openMG(){mg.classList.add('on');}
function closeMG(){mg.classList.remove('on');mgov.hidden=true;}
function overlay(html){mgov.innerHTML=html;mgov.hidden=false;}
function ask(t,q,eff){openMG();drawStatic();return new Promise(res=>{overlay(`<div class="t">${t}</div><div class="s">${q}<br><span style="color:var(--violet)">${eff}</span></div><div class="row"><button class="y" id="aY" type="button">쓴다</button><button id="aN" type="button">아껴둔다</button></div>`);
  $('aY').onclick=()=>{mgov.hidden=true;res(true);};$('aN').onclick=()=>{mgov.hidden=true;res(false);};});}
function note(g,s){openMG();overlay(`<div class="g">${g}</div><div class="s">${s}</div>`);return sleep(1100).then(()=>{mgov.hidden=true;});}
function drawStatic(){bg(mx);drawHero(mx,F.squat,80,118);}

function bg(c){c.fillStyle='#3b2f72';c.fillRect(0,0,W,FLOOR);c.fillStyle='#433680';for(let x=0;x<W;x+=16)c.fillRect(x,0,1,FLOOR);
  c.fillStyle='#6b4a33';c.fillRect(0,FLOOR,W,H-FLOOR);c.fillStyle='#5a3d2a';for(let y=FLOOR+6;y<H;y+=7)c.fillRect(0,y,W,1);
  c.fillStyle='#222';c.fillRect(20,FLOOR-2,110,5);c.fillStyle='#ffd400';c.fillRect(24,FLOOR,102,1);}
function drawHero(c,f,x=75,size=118,dy=0,sh=0){if(!IMG.complete)return;c.drawImage(IMG,f*400,0,400,400,x-size/2+(sh?rnd(-sh,sh):0),FLOOR+4-size-dy,size,size);}
function plates(c,x,y,dir){['#d92d20','#2563eb','#ffd400'].forEach((col,i)=>{const h=[30,26,22][i];c.fillStyle='#111';c.fillRect(x+dir*i*5-1,y-h/2-1,6,h+2);c.fillStyle=col;c.fillRect(x+dir*i*5,y-h/2,4,h);});}
function bar(c,x1,x2,y){c.fillStyle='#111';c.fillRect(x1-1,y-2,x2-x1+2,5);c.fillStyle='#d8d8e4';c.fillRect(x1,y-1,x2-x1,3);plates(c,x1,y,1);plates(c,x2-4,y,-1);}
function txt(c,t,x,y,size=12,col='#fff'){c.font=`bold ${size}px Galmuri11, monospace`;c.textAlign='center';c.lineWidth=3;c.strokeStyle='#111';c.strokeText(t,x,y);c.fillStyle=col;c.fillText(t,x,y);}
function gauge(c,x,y,w,h,p,col){c.fillStyle='#111';c.fillRect(x-2,y-2,w+4,h+4);c.fillStyle='#3a1020';c.fillRect(x,y,w,h);c.fillStyle=col;c.fillRect(x,y,w*clamp(p,0,1),h);}

const GAMES={
 /* 1 추 타이밍 → 스내치 */
 sn:{init(s,pot){s.t=0;s.sp=rnd(2.6,3.2)*(pot?.6:1);s.tg=rnd(-40,40);s.tw=pot?11:7;s.a=0;},
  update(s,dt){if(s.hit==null){s.t+=dt;s.a=Math.sin(s.t*s.sp)*60;}},
  draw(c,s){bg(c);const ok=s.hit!=null&&s.grade!=='MISS';drawHero(c,ok?F.knee:F.bend,70,110,ok?14:0);
   const cx=225,cy=128,R=88,r=d=>Math.PI*1.5+d*Math.PI/180;c.lineWidth=12;c.strokeStyle='#111';c.beginPath();c.arc(cx,cy,R,r(-63),r(63));c.stroke();
   c.lineWidth=8;c.strokeStyle='#4a3f8a';c.beginPath();c.arc(cx,cy,R,r(-60),r(60));c.stroke();
   c.strokeStyle='#16a34a';c.beginPath();c.arc(cx,cy,R,r(s.tg-s.tw*2.2),r(s.tg+s.tw*2.2));c.stroke();c.strokeStyle='#ffd400';c.beginPath();c.arc(cx,cy,R,r(s.tg-s.tw),r(s.tg+s.tw));c.stroke();
   const a=r(s.a);c.strokeStyle='#fff';c.lineWidth=3;c.beginPath();c.moveTo(cx,cy);c.lineTo(cx+Math.cos(a)*(R+6),cy+Math.sin(a)*(R+6));c.stroke();
   c.fillStyle='#d92d20';c.beginPath();c.arc(cx+Math.cos(a)*(R-4),cy+Math.sin(a)*(R-4),7,0,7);c.fill();c.fillStyle='#fff';c.fillRect(cx-4,cy-4,8,8);txt(c,'노란 곳에서 TAP!',cx,cy+20,11,'#ffd400');},
  down(s,end){if(s.hit!=null)return;s.hit=s.a;const d=Math.abs(s.a-s.tg);SFX.tap();end(d<s.tw*.45?'PERFECT':d<s.tw?'GREAT':d<s.tw*2.2?'GOOD':'MISS',500);}},
 /* 4 꾹 눌렀다 놓기 → 클린앤저크 */
 cj:{init(s){s.wait=0;s.p=0;s.on=0;s.z=rnd(.62,.78);s.zw=.12;s.ct=0;},
  update(s,dt){if(s.done)return;if(!s.on){s.wait+=dt;if(s.wait>4)s.end('MISS',0);return;}s.p+=dt*(.35+s.p*.9);s.ct+=dt;if(s.ct>.06){s.ct=0;SFX.charge(s.p);}if(s.p>=1){s.p=1;s.end('MISS',300);}},
  draw(c,s){bg(c);const ok=s.done&&s.grade!=='MISS';drawHero(c,ok?F.squat:(s.on?F.bend:F.stand),80,116,0,s.on?s.p*3:0);bar(c,25,140,ok?FLOOR-64:FLOOR-14);
   const gx=210,gy=24,gh=116;c.fillStyle='#111';c.fillRect(gx-3,gy-3,36,gh+6);c.fillStyle='#3a1020';c.fillRect(gx,gy,30,gh);
   c.fillStyle='#16a34a';c.fillRect(gx,gy+gh*(1-s.z-s.zw/2),30,gh*s.zw);c.fillStyle='#ffd400';c.fillRect(gx,gy+gh*(1-s.z-s.zw/6),30,gh*s.zw/3);
   c.fillStyle=s.p>.9?'#d92d20':'#fff';c.fillRect(gx,gy+gh*(1-s.p),30,gh*s.p);c.fillStyle='#ffd400';c.fillRect(gx-8,gy+gh*(1-s.p)-1,46,3);
   txt(c,s.on?'모으는 중…':'꾹 누르고',275,82,12,'#ffd400');txt(c,s.on?'초록에서 떼!':'초록에서 떼기',275,100,11,'#fff');},
  down(s){if(!s.done)s.on=1;},
  up(s,end){if(s.done||!s.on)return;s.on=0;const d=Math.abs(s.p-s.z);end(d<s.zw/6?'PERFECT':d<s.zw/2?'GREAT':d<s.zw*.9?'GOOD':'MISS',300);}},
 /* 2 다다다 연타 (2초) → 백스쿼트 */
 sq:{init(s,pot){s.p=0;s.t=0;s.lim=2;s.need=14;s.taps=0;s.mul=pot?2:1;},
  update(s,dt){if(s.done)return;s.t+=dt;s.p=Math.max(0,s.p-dt*.15);if(s.t>=s.lim)s.end('MISS',300);},
  draw(c,s){bg(c);const ok=s.done&&s.grade!=='MISS';drawHero(c,ok?F.stand:F.squat,90,118,0,s.done?0:1.5);bar(c,40,140,ok?98:86-s.p*6);
   gauge(c,200,34,100,14,s.p,'#4ade80');gauge(c,200,56,100,5,1-s.t/s.lim,'#ffd400');txt(c,'다다다다!',250,96,16,'#ffd400');txt(c,`${s.taps}회`,250,118,12);},
  down(s,end){if(s.done)return;s.taps++;SFX.tap();s.p+=s.mul/s.need;if(s.p>=1){s.p=1;const r=s.t;end(r<1.2?'PERFECT':r<1.6?'GREAT':'GOOD',400);}}},
};
let cur=null;
function mini(k,pot){openMG();const g=GAMES[k];return new Promise(async res=>{
  const s={};g.init(s,pot);
  const name=FACES.find(f=>f.k===k).n,how={sn:'추가 노란 곳에 올 때 탭!',cj:'꾹 누르고 초록에서 떼기!',sq:'2초 동안 다다다 연타!'}[k];
  g.draw(mx,s);overlay(`<div class="t">${name}${pot?' · 🧪 포션 ON':''}</div><div class="g" style="font-size:22px">READY</div><div class="s">${how}</div>`);await sleep(1000);
  overlay(`<div class="g">GO!</div>`);await sleep(350);mgov.hidden=true;
  s.end=(grade,delay=0)=>{if(s.done)return;s.done=1;s.grade=grade;setTimeout(()=>{overlay(`<div class="g${grade==='MISS'?' miss':''}">${grade}</div><div class="s">${grade==='MISS'?'바벨을 놓쳤다…':'PR +'+KG[grade]+'kg'}</div>`);
    setTimeout(()=>{cur=null;res(grade);},1100);},delay);};
  cur={g,s};let last=performance.now();
  (function loop(t){if(!cur||cur.s!==s)return;const dt=Math.min(.05,(t-last)/1000);last=t;g.update(s,dt);g.draw(mx,s);requestAnimationFrame(loop);})(last);
});}
const mpos=e=>{const r=mgc.getBoundingClientRect();return (e.clientX-r.left)/r.width*W;};
mg.addEventListener('pointerdown',e=>{if(!cur||cur.s.done||!mgov.hidden)return;e.preventDefault();try{mg.setPointerCapture(e.pointerId);}catch(_){}cur.g.down&&cur.g.down(cur.s,cur.s.end,mpos(e));});
['pointerup','pointercancel'].forEach(ev=>mg.addEventListener(ev,()=>{if(cur&&cur.g.up)cur.g.up(cur.s,cur.s.end);}));

$('cover').addEventListener('click',start);
$('snd').addEventListener('click',()=>{sound=!sound;$('snd').textContent=sound?'♪ ON':'♪ OFF';});
$('hlp').addEventListener('click',()=>{$('help').hidden=false;});
$('help').addEventListener('click',e=>{if(e.target.id==='rs'){e.stopPropagation();if(e.target.dataset.ok){try{localStorage.removeItem(KEY);}catch(_){}location.reload();}else{e.target.dataset.ok=1;e.target.textContent='한 번 더 누르면 지워져요';}return;}$('help').hidden=true;});
addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();if(cur&&!cur.s.done&&mgov.hidden){if(!e.repeat)cur.g.down&&cur.g.down(cur.s,cur.s.end,0);}else if(!busy)roll();}});
addEventListener('keyup',e=>{if((e.key===' '||e.key==='Enter')&&cur&&cur.g.up)cur.g.up(cur.s,cur.s.end);});
$('helpBody').innerHTML=`<h3>🎲 하는 법</h3>주사위를 굴리면 나온 칸을 ${TO}가 해요.<br>
<b>1 스내치</b> 추 타이밍 · <b>2 클린앤저크</b> 꾹 눌렀다 놓기 · <b>3 백스쿼트</b> 2초 연타<br>
<b>4 밥</b> 파워포션 (하차푸리 나오면 2개)<br><b>5 잠</b> 회복포션 · <b>6 똥</b> 근육포션<br>
판정 PERFECT +10 · GREAT +5 · GOOD +2kg<br>역도 합계 ${LETTER_AT}kg을 넘기면 선물이 있어요.<br><button class="rs" id="rs" type="button">기록 지우고 처음부터</button><small>made by ${FROM} · 아무 곳이나 눌러 닫기</small>`;

function start(){if(started)return;started=true;ac();$('cover').hidden=true;SFX.morning();banner('DAY '+S.day,1000);
  msg('START',S.rolls?`다시 왔구나, ${TO}`:`안녕, ${TO}`,S.rolls?`역도 합계 ${total()}kg. 오늘도 굴려 보자.\n아래 주사위를 눌러요.`:`${TO}의 인생은 주사위에 달렸다.\n밥 · 똥 · 잠 · 그리고 역도. 아래 주사위를 눌러요.`);say('역도 하고 싶다',1400);}

function fitApp(){const app=$('app'),vh=(window.visualViewport&&visualViewport.height)||innerHeight;if(!vh)return;app.style.transform='';const s=Math.min(1,vh/app.scrollHeight);app.style.transform=s<1?`scale(${s})`:'';}

drawRoom();setF(F.stand);place();paint();renderLegend(-1);showDie(6);fitApp();
